      SPONSORED | Boston, Massachusetts slowcore band Horse Jumper of Love have announced their return to the UK and Ireland, celebrating the 10th anniversary of their self-titled debut album. The band will perform the record in full across a series of shows, marking a decade since its initial release on Bandcamp and tape.


      Strange Brew, BS1 3DB


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=4fdfc51629


