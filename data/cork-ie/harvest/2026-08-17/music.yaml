    notes: "The hint is exact: /gigs is a static table of date, act, doors time and price with no pagination, and it carries the whole forward diary — 86 rows from 17 Aug 2026 to 19 Jun 2027. Nothing is truncated: all 86 are recorded here, except that the six weekly \"115 Jazz Jam Sessions\" rows are folded into one recurring event, giving 81 events.

      Three things a curator should see. (1) Every row on this page is labelled \"Cyprus Avenue\" — the room is NOT named per entry as the hint expects, so Winthrop Avenue and Old Oak are invisible here. corkgigs files eight of these same gigs under a room called **Wavelength** (Lizberries 4 Sep, Chris Boldt 11 Sep, Sell Everything 13 Sep, Tyra-Lee Spry 16 Sep, Katherine Priddy 17 Sep, Briars 25 Sep, Paddy McDonnell 21 Oct, Nerina Pallot 8 Nov), all linking back to cyprusavenue.ie/gigs URLs. Wavelength looks like the renamed upstairs room the hint calls Winthrop Avenue; worth a hint update. I have not duplicated those eight under corkgigs. (2) The \"115 Jazz Jam Sessions\" are almost certainly not in this building: Pure Cork lists the same 20 Aug session at \"115 Café and Wine Bar, Oliver Plunkett Street\", so I have set venue.name on that event and left the ticket link pointing here. (3) The box office also sells comedy and the Seed Talks lecture series; those are tagged rather than dropped.

      Two data faults on the page: the 12 Oct Seed Talks price rendered as \"€16-2\" (truncated), so price is omitted on that row; and 26 Oct is billed \"Margaret Glasby\" where the promoter (Singular Artists) and the low trees guide both spell it Margaret Glaspy — recorded as the venue printed it, with the correction noted here.

      corkgigs also lists two Cyprus Avenue gigs this page did not show at all (Thumper 6 Sep, Sixpence None The Richer 24 Sep); they are recorded under music/corkgigs with venue.sourceId pointing here. Prices were read from the page's price column and are written back in euro form; every date carries a printed weekday and all 2027 inferences were weekday-verified."
