    notes: "One thing on this weekend — \"Bike maintenance intensive course - day 1\" on Saturday 29 August, 10:30. It is not on the project's own site at all: as the hint predicted, every dated course lives in the external Bookwhen calendar at bookwhen.com/bristolbikeproject, which I also read (200). That is worth adding to the catalogue as a `booking` route, because /maintenance/courses/ describes the courses in prose and carries no dates whatsoever. Bookwhen renders prices and per-event booking links in JavaScript, so neither is in the HTML — I have left `price` and `url` off the four course rows rather than construct them, and the day/date/time that are in the HTML are recorded. The Bike Kitchen drop-in is from the catalogued page and has its full price ladder. No bank holiday notice anywhere; the Bike Kitchen is a Thursday session so Monday 31 August does not affect it either way. The page still gives the address as 198-200 Stapleton Road BS5 0NY against the catalogued area of Stokes Croft — the same discrepancy the catalogue already records as needing a decision."
