      for you: "Permanent Exhibition" (Ireland in Space, Alien Worlds) is
      `ongoing`, visiting exhibitions are a `run`, and the Star Show and castle
      tour are scheduled slots through the day — `recurring`, no booking
      required, 10.00-18.00 daily with last entry 17.00.
      Also a family and science-centre venue, so its school-holiday programme
      may be worth cross-listing; do not duplicate the entry.
      Cork Astronomy Club exhibits here (see museums/cork-astronomy-club) — set
      `venue.sourceId` to this source when an event turns up on their site.
