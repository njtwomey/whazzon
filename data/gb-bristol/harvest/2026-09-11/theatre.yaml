    notes: "All five index pages read (49 cards, 11 Sep 2026 to 11 Apr 2027) — nothing truncated; page 5 holds one card and links no further. The index prints title, dates and a cover image only, but every card's first date carries a machine-readable <time datetime> with the year and start time, so single-date rows take their startTime from that and no year was inferred by eye: `confidence: high` throughout. Run end-dates without a printed year take the start's year (or the next, where the end month precedes the start month). No times are printed for the later nights of a run, so no timesText. Three newsletters were on file (a box-office account notice, a welcome mail and the 4 Sep OffScript edition); none listed an event that is not on the site, so nothing here comes from the mailbox. The OffScript edition did supply two access details, folded into the Juliet & Romeo summary: BSL on Wed 23 Sep and audio description on Fri 25 Sep. Young SixSix's Macbeth (3-5 Sep) has finished and is no longer on the index. Badgers (8-12 Sep) and Pieces of My Life-style short runs already under way are recorded with their full printed range."
