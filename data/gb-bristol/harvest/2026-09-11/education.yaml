        raw: "**Introducing Public Art at Temple Quarter Enterprise Campus** @ Temple Quarter Enterprise Campus — Tue, 6 Oct @ 6:00pm


          Lecture/Talk


          Join us for an evening of celebration as we unveil three new public artworks by John Wood and Paul Harrison, Ellie Shipman, and Room 13 Hareclive. The new commissions include two permanent installations on the ground floor of the Sloane Robinson Building, alongside a newly commissioned short film.\n"
        summary: "Unveiling of three new public artworks at the Temple Quarter campus — by John Wood and Paul Harrison, Ellie Shipman and Room 13 Hareclive — with a drinks reception, a screening of Room 13's short film and a panel with the artists chaired by Beth Williamson. Opens the Autumn Art Lecture Series; book via Eventbrite."
        description: "Join us for an evening of celebration as we unveil three new public artworks by John Wood and Paul Harrison, Ellie Shipman, and Room 13 Hareclive. The new commissions include two permanent installations on the ground floor of the Sloane Robinson Building, alongside a newly commissioned short film.


          [Click here to book your place via Eventbrite.](https://www.eventbrite.co.uk/e/introducing-public-art-at-temple-quarter-enterprise-campus-tickets-1997967803484)


          The evening will include an opportunity to experience the artworks, followed by a panel discussion exploring the ideas, collaborations, and creative processes behind the commissions.


          - 6 pm - 7 pm - View the Artworks and Enjoy a Drinks Reception

          - 7 pm - 8:15 pm - Screening and Panel Discussion


          Professor Beth Williamson will be in conversation with artists John Wood and Paul Harrison, Shani Ali of Room 13 Hareclive, and Ellie Shipman, alongside Megan O'Shea, Contemporary Art Society Consultancy.


          This talk forms part of the [Autumn Art Lecture Series](https://www.bristol.ac.uk/arts-law-social-sciences/research/autumn-art-lectures/), which explores the public art programme for the Temple Quarter Enterprise Campus.


          Watch Rivers - A Race Against Time, a newly commissioned short film by Room 13 Hareclive: [Wild Spaces – Public art at the University of Bristol](https://public-art.bristol.ac.uk/public-art-at-temple-quarter/wild-spaces/rivers-a-race-against-time/).


          Wood and Harrison Image Credit: Martin Parr.


          Organiser: Faculty of Arts, Law & Social Sciences.\n"
