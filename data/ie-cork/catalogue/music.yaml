      anywhere. There are no weekday-and-month strings, no long-form dates and
      no event links in the HTML — the only clue to what is on is the image
      filename ("3-AUGUST-live-@-freds"). Read the programme from corkgigs
      instead, and treat this URL as identity rather than data.
      "Tom Keating Presents" is the in-house promoter strand and lives at
      /tom-keating-presents/, which is posters only for the same reason.
    notes: |
      Verified 2026-08-17: fredzeppelins.com is titled "Fred Zeppelins – Cork's
      Best Rock Bar Since 1997" and /upcoming-shows/ is a real page linked from
      the venue's own nav. /gigs/, /events/ and /whats-on/ are all 404s. The
      corkgigs profile confirms Parliament Street and points at this domain, but
      itself showed no upcoming events. Address is from corkgigs, not from the
      venue's own page.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/dali
    name: Dali
    category: music
    kind: venue
    status: provisional
    url: https://www.eventbrite.ie/o/dali-cork-18153752920
    area: City Centre
    address:
      street: 8 Lavitts Quay
      city: Cork
      postcode: T12 K20P
    tags: [ independent, club, electronic, nightlife ]
    cadence: weekly
    hints: |
      Cork's venue for electronic and alternative music, upstairs over Nudes on
      Lavitts Quay. Open Thursday to Saturday and occasionally Tuesday, so most
      listings fall at the end of the week.
      It has no website: dalibar.ie and dali.ie do not resolve at all, and the
      venue programmes through Eventbrite, Instagram and Facebook. The
      Eventbrite organiser page confirms the identity but renders its event list
      client-side, so cross-check corkgigs and Resident Advisor for lineups.
    notes: |
      Verified 2026-08-17: the Eventbrite page is titled "dali Cork" and
      describes it as "Corks only venue dedicated to" electronic and alternative
      music, but exposed no dates to a fetcher. dalibar.ie, www.dalibar.ie and
      dali.ie all have no A record. One correction worth recording: this venue
      is on Lavitts Quay in the city centre, not in Blackpool — the corkgigs
      profile gives "8 Lavitts Quay, Cork, T12 K20P". It occupies the former
      Pavilion building's scene but The Pavilion itself trades separately and is
      catalogued below.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

