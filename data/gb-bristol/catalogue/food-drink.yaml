      one `recurring` event, not a weekly series. Gift vouchers and the beer club
      membership are not events, and private group tours are arranged by email
      with no published dates.
    notes: >-
      Verified 2026-08-17: /collections/tours-tastings is Bristol Beer Factory's own Shopify store (tours contact tours@bristolbeerfactory.co.uk). The catalogued homepage carries no listings. The collection held the £25 Saturday brewery tour, a gift tour and the £65 beer club membership. No address is printed on this page, so the catalogued area is unconfirmed here.
    addedAt: "2026-08-16"
    address:
      lat: 51.442651
      lon: -2.615263

  - id: food-drink/bristol-whisky-festival
    name: Bristol Whisky Festival
    category: food-drink
    kind: festival
    status: provisional
    url: https://www.bristolwhisky.co.uk/
    tags: [ festival, whisky, tastings, ticketed ]
    cadence: quarterly
    hints: |
      Annual whisky festival with a programme of tastings and masterclasses.
      Tickets go on sale months ahead and masterclasses sell out early, so use
      a long forward horizon and capture individual sessions, not just the
      festival dates.
    notes: >-
      URL unfixed as of 2026-08-17, and left as it was because nothing verified replaces it. bristolwhisky.co.uk has no DNS record at all (apex and www both empty from dig), so the catalogued site is gone. The festival itself is not gone: it is run by The Whisky Lounge and the 2025 edition was at Bristol Beacon, which answers the question the original note asked — it sits inside the organiser's site, so kind: organiser is the better model. But thewhiskylounge.com cannot be read by any fetcher: every route, including / and /events, 302s to /age-verification, and that page 302s back to /, so it is an infinite loop unless a form is submitted. Separately there is a differently-named Bristol whisky festival — Exploring Whisky Bristol, run by Spirited with the Discover Whisky team, second edition at Paintworks on 7 February 2026, readable at https://spiritedbristol.com/pages/exploring-whisky-bristol. It is a different event, so it is not a fix for this source; deciding whether the catalogue wants it as well is a human call.
    addedAt: "2026-08-16"

  - id: food-drink/bristol-food-connections
    name: Bristol Food Connections
    category: food-drink
    kind: festival
    status: closed
    url: https://bristolfoodconnections.com/
    tags: [ festival, food, community ]
    cadence: quarterly
    notes: >-
      Closed 2026-08-17 — a lapsed domain with no successor site. bristolfoodconnections.com still resolves but 301s straight to https://kavarnadecatur.com/, an unrelated US business, so the 200 that check-urls sees is somebody else's page. Bristol Food Network files the festival under past projects and states "Bristol Food Network ran the Bristol Food Connections festival in 2014, 15 & 16. In 2017 a new independent organisation was set up to run the festival, Food Connections CIC", giving no website for that CIC; no later edition is traceable. URL left pointing at the dead domain deliberately: check-urls skips closed sources, so it records what was catalogued without being re-flagged. Bristol Food Fest (Canons Marsh, 6-7 June 2026) is a separate free street-food festival, not this one, and would be a new source rather than a rename.
    addedAt: "2026-08-16"
