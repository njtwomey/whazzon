      WHAT’S ON - FRI 11 - THU 17 SEPT


      https://us.list-manage.com/JDtyFa0SZrE?c2id=944927b628e367996f6a53da7340e920&m=2c0sF9Ymx8a0P22YXoYBf9vEvUjftoN_Orch9PMf_DRMQtfj1ES93QULMApk


      IT WAS ACCEPTABLE IN THE 80S...


      Just An Illusion opens Fri 11 Sept


      Hi everyone,


      This week we’re travelling from Parisian suburbs to Patagonia, with a little murder, music and marital misery thrown in for good measure.


      New in the cinema this Friday is Just An Illusion <https://us.list-manage.com/GyOYdnCL688?c2id=944927b628e367996f6a53da7340e920&m=-O6prTWddlVa7OTFVfnIjBJqZKezr9MmeAmMlsYVdGmhfzKd-NXbR4QDFW94>, a funny and tender coming-of-age story set in 1985 Paris, following almost-13-year-old Vincent as he navigates first crushes, family arguments, friendship and his North African Jewish identity.


      Also new is Everybody Digs Bill Evans <https://us.list-manage.com/48c3KWJhsnH?c2id=944927b628e367996f6a53da7340e920&m=7RUtdoXxygvZ1LTKeIJ3LOs-BUdSAuXem6fBbzq3cUhD33FZRLgwT71QvHFW>, the acclaimed biographical drama about the legendary jazz pianist, played by Anders Danielsen Lie. And following its sold-out Q&A last month, The Republic <https://us.list-manage.com/eKTUhHzWi1h?c2id=944927b628e367996f6a53da7340e920&m=mZGFAChRgCHL4mfs7zzxmYqt7x_HklBVD-ZgSguu9oQclOgkXeQ3h2Al7pBD> returns for more screenings, telling the story of Stokes Croft, its fiercely independent community and the ongoing fight to retain a sense of place in the face of development and globalisation.


      On Friday night, there’s a one-off chance to catch the gloriously out there Survive Style 5+ <https://us.list-manage.com/EQoFZYGlDZK?c2id=944927b628e367996f6a53da7340e920&m=X06zgH8gkxCesNerWkB20cWqZjU84FZ7hsM8Jl8ny8v1HNpbJx3QLpH0vmi9>, a 4K restoration of the Japanese cult classic. And on Tuesday, Bristol Surf Cinema brings The Road to Patagonia <https://us.list-manage.com/EmKXK9AKVlw?c2id=944927b628e367996f6a53da7340e920&m=-SeKx5NwtMXCX4PETVu2V-MyNGbNhCdl_cVSUVWYPjv-Si23utpPL9mwcAsm> to the big screen, following one man’s 50,000km surfing odyssey from Alaska to Patagonia.


      Then on Wednesday, the BFI National Archive takes us back to the 1950s and 60s with Living for Kicks <https://us.list-manage.com/b2kDQzApb3a?c2id=944927b628e367996f6a53da7340e920&m=0hxwkkE3ZZbzRjCULQN3CffwrvDwS7USB1sft47QMLXBk1OSr4Sx8Vqe9z0B>, a vibrant collection of television footage charting the rise of the teenager, Teddy Boys, coffee bars and pop music.


      Our Claude Chabrol: Elements of Crime <https://us.list-manage.com/V5ozJBoMg_u?c2id=944927b628e367996f6a53da7340e920&m=-swJlTe8WcxAFfgziyvxV1imiD-YvRvtVnuCexT44N7pHItdPdQRmM5aZNj0> season also continues this week with La Femme infidèle <https://us.list-manage.com/1Acds1gckY5?c2id=944927b628e367996f6a53da7340e920&m=GYcL8AUG3kpvj8T9pEnOUNgd3EDXXFXWLkyjq2VJXNOKx_6VFfqCMgljxED2>. While on Sunday, the next instalment of our Sleepover Season <https://us.list-manage.com/QA61KpobdTS?c2id=944927b628e367996f6a53da7340e920&m=fI29rcCxSOWKnnQcSjj7b7PNcJgqZn_ojXQR77l3ycxBDc_e_epGQ35NOavH> sees Bend It Like Beckham <https://us.list-manage.com/L_f6e4lBCgZ?c2id=944927b628e367996f6a53da7340e920&m=TKbbEv6di85NreQ13IkgC5ZAoKl6XJutF1JfVaTr1SBBMZIkPb5IW1I49-Dx> take over the big screen. Bring your mates and your finest football fits for this much-loved classic, introduced by guest curator Ella McDonald and filmmaker Somina ‘Mena’ Fombo, and preceded by Mena’s short No Rucks Given!.


      Read on for everything else coming up this week, including a Lunchtime Talk <https://us.list-manage.com/1CufTs4uyVP?c2id=944927b628e367996f6a53da7340e920&m=R1hJYk2mnJyypxIzbkVT74WW57W7qA-K9uDUMGgS88bg-Zb2b7qJnHDvV5Fv> exploring what responsible, appropriately scaled AI might look like within planetary boundaries – plus your last chance to experience SENTIENTS <https://us.list-manage.com/o0LtucelkeO?c2id=944927b628e367996f6a53da7340e920&m=_THmFtPrql6yHYtOvnt95ertZlye0wxIj9fmDl8w7njccNXMHFKyKi_4qu3g>, the immersive exhibition in Undershed <https://us.list-manage.com/fgl0Fk0by6L?c2id=944927b628e367996f6a53da7340e920&m=VfB8u7LTFcyb0u5EclpgkS7KWT8zOnU4QAbUfKj-blpnGVOVDZwiGMkIR4Ry>, before it closes this Sunday.


      With love,

      Team Watershed x


      JUST AN ILLUSION 12A (S)


      Dir: Eric Toledano, Olivier Nakache, France, French, 2026, 1hr 56mins

      Fri 11 Sept for at least one week


      It's 1985. Vincent, almost 13, fumbles through life's big questions: identity, friendship, family, first crushes... and why adults don’t seem to have things figured out either.


