    notes: "The catalogue's routing decision is vindicated: **liveatstlukes.com was not touched**, per the note that its authoritative A record is 127.0.0.1, and the corkgigs `listings` route was used instead. It works, is headed \"Live At St. Lukes\", and lists four forthcoming shows — 27 Aug, and then 13, 19 and 20 Nov. All four are recorded. Times and prices are from the corkgigs main diary, which carries the same four rows with Eventbrite links.

      The venue is emphatically live: the profile carries a long block of the venue's own current visitor copy — church pews so bring a cushion, doors normally 7:30pm with shows 30 minutes later, BYOB with a three-can maximum and no glass, wheelchair access and reserved seating on request via liveatstlukes@gmail.com, and a plea about parking and noise in a residential area. That copy is more use to a reader than anything on the listings and is summarised into the events where relevant.

      The `booking` route (The Good Room's Eventbrite) was **not** fetched: the catalogue's own note on music/savoy-theatre records that the Good Room Eventbrite was deliberately removed from that source to avoid paying twice for one URL, and the four shows here already carry per-event Eventbrite deep links from corkgigs, so a fifth fetch of the organiser page would add nothing. Worth knowing that the same promoter page covers the Savoy, so neither venue's diary here should be assumed complete.

      One disagreement to flag: the low trees Cork Gig Guide lists \"Pebbledash Live at St. Lukes\" on Sat 31 Oct, and corkgigs puts Pebbledash at the Savoy that night. This profile does not list it at all, so it is recorded under music/savoy-theatre with the conflict noted rather than here."
