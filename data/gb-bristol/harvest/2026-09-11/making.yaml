        raw: "**FISH TANK**


          If you've ever wanted a space to just try your work outside the confines of your mind and to share it with an open and welcoming audience, this is your chance.


          Fish Tank is a monthly open mic night for the unpolished, newly crafted and the experimental. Launching in September, every first Wednesday of the month, The Island Gallery will make space for Bristol's creatives.


          Open to spoken word, song, poetry, experimental sounds, and anything new.


          This is a trial run for this series, and if successful or a community forms, we can continue holding space for it!


          Drop in, no fee.


          The first Wednesday of every month, 7 - 10pm


          [The Island Gallery](https://us.list-manage.com/1C_gripcdBl?c2id=5d93719d43fa326bdad19fdd9203ff9a), Bridewell Street, Bristol. BS1 2QD\n"
        summary: "A monthly open mic in The Island Gallery for spoken word, song, poetry and experimental sound — unpolished and new work welcome. First Wednesday of the month, drop in, free; the venue calls it a trial run."
