        raw: "**TERM TIME MESSY PLAY RETURNS**


          Our term time Messy Play sessions where under 5s can explore different sensory activities are returning from the 15th of September.


          Tuesdays are taste safe and have no small parts, while Wednesdays are maximum mess with paint, glue, scissors & some small parts.


          Older siblings always welcome at messy play!


          You can find out more on our website [linked here](https://us.list-manage.com/15EgRQxEUAO?c2id=189f808a56f9b99c0adb21d5d841853d).


          All profits made from our paid events directly go back into our charity and allow us to continue our mission of diverting reusable materials away from waste and towards play, art and educational opportunities.\n"
