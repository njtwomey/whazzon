    notes: "The catalogued URL (www.redgravetheatre.com/whats-on/) redirects to https://redgravetheatre.com/whats-on, recorded as fetched. Ninety-eight distinct listings on one page, reaching to October 2027; 97 are recorded and nothing later is truncated this run. The one omission is Ginger Johnson: Show Pony 2026, still on the page but dated 10 Sep 2026, which has passed. The index prints title, a date or date range with an explicit year, an availability flag (\"Last Few\", \"Sold Out\") and a card image; no times, prices or blurbs, so those fields are absent and many summaries can only restate the title. The year never has to be inferred, so rows are `high`. \"Last Few\" is availability rather than a modelled status and stays in `raw`; \"Sold Out\" becomes `status: sold-out`. Some rows print a start date with an empty second date; those are recorded as singles. Ocean Film Festival prints 01-28 Oct 2026 as a range without saying which nights, so it is a `run` as printed."
