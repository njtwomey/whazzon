        raw: "**Emerson's Green** — 11.10.2026, 2:00 pm. Leader: David Hawkins. Category: Botany.


          \"An exciting chance to make some significant records in an extremely under-recorded

          part of town. The monad (1km OS map grid square) that we will target currently has

          just a single record to its name in the Botanical Society of Britain and Ireland's

          database: Fine-leaved Sandwort *Sabulina tenuifolia*. And what's more, that record

          was made in 1898 by none other than the great J. W. White, author of the seminal

          The Bristol Flora.\"


          \"Meet on Emerson's Green Common just off Emerson's Green Lane at ST668768

          ///events.ears.brave. Postcode BS16 7HB.\"\n"
        summary: "Recording botany in a Bristol kilometre square that has exactly one record against it — made in 1898 by J. W. White, who wrote The Bristol Flora. David Hawkins is fairly sure the sandwort he found has gone, and equally sure the afternoon will turn up something. The one meeting on the programme actually inside the city."
        description: "Leader: David Hawkins. Category: Botany. Date: 11th October 2026, 2:00 pm.


          An exciting chance to make some significant records in an extremely under-recorded

          part of town. The monad (1km OS map grid square) that we will target currently has

          just a single record to its name in the Botanical Society of Britain and Ireland's

          database: Fine-leaved Sandwort *Sabulina tenuifolia*. And what's more, that record

          was made in 1898 by none other than the great J. W. White, author of the seminal

          The Bristol Flora. Who knows what we might find?! But two things are for sure:


