      Dates for your diary


      September 12: <https://us.list-manage.com/9Gh8w3nFyKc?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=5mfmaI6cYFjomjzkPOmQQ6hOwPHKUuTTKcY2Jsq8lfnm8Cassms9OXxrLR1b>Bristol <https://us.list-manage.com/jfpXbk1NixY?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=WiyGVKTfBy82q4LodddukRRPtYe6ND0s5UVnHLZouDhniw0shJChg0McRVMN> Coffee Festival <https://us.list-manage.com/18zxv_4MFPE?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=SrTaz5IN_FzQcKZkdCobK_UhV5eebrlVDcHCC1VHM7Ol-CbCEaCyOU-jn76t>, B <https://us.list-manage.com/G4tczNIVVBf?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=a5FJ3FDWqqn8i24jwpfmmYc_6iSVVwmrANoDBtHSx0tLTP-v0iQdMvc0-Lkw>ristol Beacon <https://us.list-manage.com/2bzFGhrZgus?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=QSJwd2jUBY8l7YLlHslVyOy9Gs3P_WncuSW2RHjeBesE_KkOYrbMd4CkGZPU>

      Unlimited cups of coffee are just one reason. There is a list of amazing conversations, exhibitors, and more awaiting you at this one-day festival.


      September 21: The Veysil Oil Supper Club, The Granary <https://us.list-manage.com/jHqzDhDSqTe?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=TpCIHu1FYg1VhBf5Pvj_iE643GchwOga-lphBR8v4SPk7tNcrhvDpqf2J7Wv>

      A four-course meal celebrating olive oil, curated by the teams at Veysil and pop-up kitchen Holt's, served in the picturesque setting of a Grade-II listed building.


