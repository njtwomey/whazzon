    notes: "Both filters were read, as the catalogue advises: /whats-on/categories/theatre-comedy across all five pages (194 rows, 73 distinct title-and-venue combinations) and /whats-on/categories/performance (20 rows, one page, 5 distinct). **Heavily and deliberately truncated: 7 events recorded out of 78 distinct listings across the two filters, and the reasons matter.** First, this source lists **one row per performance**, which is precisely the trap this category has to avoid — Judy at The Everyman is 10 consecutive rows, The Sound of Music 6, Craic! 5, Circus Extreme 13, Circus Vegas 18. Everything taken here is folded into a single `run` or `recurring` event with the per-performance detail in timesText. Second, 93 of the 194 rows are shows at Cork Opera House (55), Cork Arts Theatre (23) and The Everyman (15), all of which are catalogued sources harvested directly today; recording them again here would put a second card on the site for every show. Third, the largest remaining block is pub and club comedy — The Roundy (21), Coughlan's (20), City Limits (5), Fred Zeppelins (1), Cyprus Avenue (7) — and Cork has a `comedy` category that catalogues those venues, so they belong there and not here. Fourth, rows outside the location radius were skipped and are listed for the record: Briery Gap in Macroom (8 rows, including Lee Side Drama Group's The Dowry on 15–16 Oct, the only amateur-drama listing in the feed), Ballymaloe Grainstore in Shanagarry and Midleton (3, including Hunters Moon Theatre's The Field), The Mariner in Bantry (1) and Whitechurch/Waterloo near Blarney (1). What is left, and recorded, is what no venue site in this category publishes: two touring big tops, a psychic night in a hotel, two weekly series from the performance filter, a swing workshop at Triskel and a Mexican folk dance show at The Pavilion. The performance filter's fifth row, Cork City Ballet's Nutcracker, is at Cork Opera House and is recorded there. The feed was also the cross-check 