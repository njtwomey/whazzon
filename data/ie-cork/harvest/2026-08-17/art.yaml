    notes: "The building is shut, as the catalogue says: the page carries \"Crawford Art Gallery is now closed for redevelopment\". Every one of the seven items is somewhere else, so `venue` is set per listing and none of them is at Emmet Place — Triskel Arts Centre (2), Cork City Library (3), Civic Trust House on Pope's Quay (1) and Zoom (1). The /whats-on/ index prints no venue at all for Culture Night and Adventure in Europe and carries no images or descriptions, so all seven event pages were opened; that is where the Civic Trust House and 61 Grand Parade addresses came from. Two Eircodes are printed for the same library across two Crawford pages — \"T12 NT99\" on /adventure-in-europe/ and \"T12V0AA\" on /harvest-traditions-…/ — so the fully-printed \"Cork City Library, 61 Grand Parade, Cork, T12 NT99\" is used throughout and the conflicting one is not, rather than guessing which is right. **Caveat for whoever reads this:** compile resolves an event address as `venue.sourceId`'s address, then `venue.address`, then the *source's* address, so any Crawford event without an explicit `venue.address` lands at the closed Emmet Place building. The Zoom item is the one row here that cannot avoid that, because \"online\" has no address to give it. Artists Film International and In Conversation are also listed by art/triskel-gallery and art/visual-artists-ireland-cork; recorded from all three because each page genuinely lists them, and flagged rather than dropped. Nothing was truncated — all seven listed items are here."
