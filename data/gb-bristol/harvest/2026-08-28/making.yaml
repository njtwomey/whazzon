        raw: "**Foundations for the Future Exhibition** — an exhibition celebrating

          KWMC past and present. Everyone is welcome to pop in anytime Mon-Fri,

          9:30am-5pm, in the Main Studio. KWMC, Leinster Avenue, South Bristol,

          BS4 1NL.\n"
        summary: "A free weekday-hours exhibition charting nearly thirty years of Knowle West Media Centre, with an open invitation to add your own stories to it. Call ahead — the Main Studio is also used for workshops."
        description: "An exhibition celebrating KWMC past and present...


          This exhibition charts almost thirty years of KWMC, exploring how ideas

          have grown and the differences we have made together. At a pivotal

          moment for KWMC, as our founder Carolyn Hassan retires, we look

          backwards to go forwards.


          We remember the social, political, environmental and economic backdrops

          that shaped our work, reflect on the challenges faced and the insights

          acquired. We see our history as 'usable past', providing rich

          foundations for KWMC's growth into the future.


          The exhibition is clustered around ideas of practice. In each cluster

          you will find key activities and insights that help demonstrate these

          ideas.


          **What now?** Throughout 2025-26 there will be a series of events,

          including reunions, in-conversations and workshops.


          Fancy seeing the exhibition for yourself? Everyone is welcome to pop in

          anytime Mon-Fri, 9:30am-5pm. The exhibition is set up in our Main

          Studio space, which we also use for workshops or events. Give us a

          quick call or email first if you'd like to check if the space is

          available before arriving (enquiries@kwmc.org.uk / 0117 903 0444). Our

          address is: KWMC, Leinster Avenue, South Bristol, BS4 1NL.\n"
        confidence: "high"
    notes: "Nothing on 29-31 August, and no bank holiday statement of any kind. The index is exactly the thin case §3 describes — nine tiles carrying a title and an image and no date at all — with a programme small enough to walk, so I opened all nine of the linked pages (well inside the dozen cap) and every `description` here is that page's own text. That is what produced the dates: without opening them this source would have come back as nine undated rows. What it turns up is the autumn programme, which is the other thing this run was looking for: Design & Make resumes 17 September, the after-school Creative Hub is advertised as beginning \"back on week of 21st September\", Creative Cuppa lists its autumn Wednesdays, the Community x Arts x Tech meetup returns on 3 September after its August break, and October half-term's Radical Creators is dated and open. The 30th birthday party is genuinely undated — the page says only \"Lots more info coming soon\" — so it is recorded that way rather than guessed at. Note the two URL shapes: sessions live at /whats-on/sessions/<slug>/ and the one actual event at /whats-on/events/<slug>/."
