    notes: "Catalogued URL is correct and served the news feed first time (200). The hint is confirmed in full: there is no What's On, Events, Markets or Diary page anywhere on the site — navigation and footer are EAT DRINK SHOP / PLAN YOUR VISIT / LATEST NEWS / COMMUNITY / CONTACT / LIVE / WORK — and I checked the homepage as well as the news feed (3 fetches for this source). Nothing upcoming is listed. Of the 20 posts on the feed, all but two are trader-opening announcements rather than events, and both event posts have passed. The newest post on the whole feed is dated Jun 17, and it is the event one: \"Wapping Wharf to host 10 year anniversary celebration this July\", a free, family-friendly one-day party on \"Friday 3rd July\" from \"5pm into the evening\" with Batala Bristol and The Ambling Band, a silent disco, face painting and walkabout entertainers. I opened that post to check it, and it is firmly in the past: the feed prints a year only on posts older than the current year, so Jun 17 is 2026, \"this July\" is July 2026, 3 July 2026 really is a Friday, and Wapping Wharf opened in 2016, so three independent checks agree. The other event post, \"You're invited to Wapping Wharf's End of Summer Party!\" (\"Friday 6th September\"), is dated Jul 29 2024 and 6 September 2026 is a Sunday while 6 September 2024 was a Friday, so it is a stale 2024 post as yesterday's run also found. Posts are never retired once they have happened. This departs from the brief's expectation of `undated` rows here: the one real event on the site carries a weekday-confirmed date, so `undated` would be a worse record, not a safer one — an undated event has no date to pass, so the fold could never mark it finished and a party from last month would sit on the site as an apparently-current listing. Recorded as a successful fetch with nothing on instead. For stage 1: this source only ever yields events in the weeks after a party is announced, so a weekly cadence is spending fetches on an unchanged news feed; monthly would fit what the site actually does."
