        raw: "**Exhibition On Screen: James McNeill Whistler** (PG) — 1h 34m — Tuesday 15 September 18:30; Thursday 17 September 13:00.


          \"In an era of great change and great beauty emerged the character of James McNeill Whistler. Considered by some to be one of the great innovators of 19th century art, he was a contemporary of the Impressionists, much admired by Van Gogh and Manet. Boldly experimental and famously witty, Whistler disrupted the strict conventions of Victorian society in pursuit of a new cult of beauty, creating \"art for art's sake\" and earning himself a place in the history of great art. [...] Tate Britain is now holding the first major retrospective of Whistler in three decades. This blockbuster exhibition promises to reawaken the world to just how important Whistler is to art history, uniting world-famous masterpieces with rarely seen works. Exhibition on Screen will bring these stunning works and the incredible story behind them to cinemas around the world while the exhibition is still running.\"\n"
        summary: "Exhibition on Screen's film of Tate Britain's Whistler retrospective, the first in three decades, on two dates."
