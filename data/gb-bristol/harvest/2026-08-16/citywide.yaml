    notes: "Filtered hard, as the hints ask. The first page carried fifteen items across its \"After 8pm\", \"Popular in Bristol\" and \"This Weekend\" rails; nine are recorded. Dropped were a professional SEND roadshow, a charity AGM, a commercial paint-and-sip evening at a restaurant, a paid singles mixer, and two permanently-running commercial tourist experiences (an augmented-reality detective walk and a puzzle treasure hunt) that carry no real date. Eventbrite has thousands of Bristol listings; only the first page was read. Most cards print \"Check ticket price on event\" instead of a price, so price is mostly absent. Several dates are given as relative labels — \"Today at 14:00\", \"Thursday at 20:00\" — and the absolute dates printed on the others omit the year; every one was checked against the 2026 calendar and the weekdays match, but they are recorded at medium confidence for that reason."
