    notes: "The hint holds: the Headfirst venue page is the shop's programme served as HTML. Twenty-one dated events from Tue 1 Sep to Wed 11 Nov 2026, all recorded. Nothing on 29-31 August — Bookhaus's autumn season starts on the Tuesday after the bank holiday, and its Aug listings have already rolled off. Nothing was truncated. This index is unusually thin: it prints a title, a venue line and genre tags and nothing else — no date, no time, no price, with the date only encoded in the URL slug. So per §3 the twelve soonest event pages were opened, which is the cap. Those twelve carry `description`, a confirmed start time and a price; the remaining nine (9 Oct onwards) carry the slug date and the index line only, no `description`, no `price`, and are marked `confidence: medium` because their times are unverified. For stage 1: every Headfirst event page embeds a JSON-LD `Event` block with startDate, endDate, doorTime, eventStatus, an offers array and the venue address — prices in pence, so 700 is £7.00, confirmed against the page's own \"Tickets cost £7\". That is a much cheaper route than parsing the HTML, and a `feed`-style route for this source is worth considering; the venue index page itself carries no such block. Two further items appear in the page's \"recent recommendations\" panel with no date and no link — \"Ecstatic launch with Emily Woof\" and \"The Good, the Black and the Boujee ... launch with Symeon Brown\". They look like past events, so they were not recorded rather than given an invented date."
