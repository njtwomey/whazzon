      Mon 25 Jan 2027


      Lantern Hall


      Sheherazaad brings her cinematic blend of dystopic folk-noir and experimental pop to Bristol Beacon.


      Drawing on Hindustani, Turkish, Arabic and Carnatic traditions, her richly poetic music blends traditional instruments with atmospheric recordings and intimate vocals.


