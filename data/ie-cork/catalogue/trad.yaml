  - id: trad/cork-pipers-club
    name: Cork Pipers' Club
    category: trad
    kind: organiser
    status: provisional
    url: https://www.corkpipersclub.com/news/
    homepage: https://www.corkpipersclub.com/
    tags: [trad, classes, community, historic]
    cadence: monthly
    hints: |
      Cumann na bPíobairí Corcaigh, founded 1898 and one of the oldest pipers'
      clubs anywhere — uilleann piping specifically, which nothing else in this
      file covers. What it programmes is club meetings, recitals, an annual tionól
      and classes rather than a weekly session, so expect a handful of events a
      year and long quiet stretches.
      WordPress, and everything dated arrives as a news post, so read the posts
      and their dates. Classes are held in the SMA Hall in Wilton and run in terms
      from January and September; the /classes/ page describes them but does not
      date them.
      The club has been rebuilding since covid — the recent posts are about
      meetings to reinvigorate it — so treat the programme as thin rather than
      absent, and do not infer closure from a quiet month.
    notes: |
      Verified 2026-08-17: the site is titled "Cork Pipers Club — Cumann na
      bPíobairí Corcaigh" and its three newest posts are dated November 2025,
      January 2026 and March 2026, so it is live and maintained. No street
      address is published, so none is recorded. /feed/ exists but 302s off-host
      to feedburner.com, so it is not offered as a route.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: trad/douglas-comhaltas
    name: Douglas Comhaltas
    category: trad
    kind: organiser
    status: provisional
    url: https://www.douglascomhaltas.com/
    area: Douglas
    tags: [trad, classes, community, family]
    cadence: monthly
    hints: |
      Craobh na Dúglaise, the largest Comhaltas branch in the city — over three
      hundred members aged five to eighty-five, classes every Wednesday from
      17:00 to 21:00 in Gaelscoil na Dúglaise in Douglas village, across every
      traditional instrument plus song and dance.
      What this yields is a weekly recurring class rather than events, and the
      class term is the thing that changes, not the schedule. Branch concerts,
      céilís and fleadh entries are announced on Facebook and Instagram
      (@comhaltasdouglas) rather than on the site, so expect the site to be
      almost static and do not read that as dormancy. The Fógraí/Notices page is
      the only part that ever carries anything dated.
    notes: |
      Verified 2026-08-17: bilingual site titled "Douglas Comhaltas", states the
      Wednesday class pattern, the venue and the membership figures quoted above.
      Cork City Council's own site links to the branch, which corroborates it.
      No postal address is published for the branch itself — the class venue is
      recorded in hints rather than as an address, since it is not the
      organisation's own premises.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: trad/cork-singers-club
    name: Cork Singers' Club
    category: trad
    kind: organiser
    status: provisional
    url: https://motherjonescork.com/tag/cork-singers-club/
    area: City Centre
    tags: [trad, singing, free, community]
    cadence: quarterly
    hints: |
      Founded 1993. Unaccompanied traditional singing — no instruments allowed —
      upstairs at An Spailpín Fánach on South Main Street on Sunday nights from
      about 21:30, October to June, dark in July and August, with Jim Walsh as
      fear an tí. That weekly session is the club's real activity and it is
