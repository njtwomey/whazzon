  - id: music/swx
    name: SWX
    category: music
    kind: venue
    status: provisional
    url: https://electricbristol.com/events/
    homepage: https://electricbristol.com/
    area: Broadmead
    tags: [mid-size, club, commercial]
    cadence: weekly
    hints: |
      Rebranded from SWX to Electric Bristol in 2025 under the Electric Group,
      in the same Nelson Street building — the swxbristol.com domain is dead and
      some ticket agents still index it under the SWX slug. Listings are
      paginated: /events/ showed 12 per page with more behind the pager.
    notes: |
      Verified 2026-08-17: swxbristol.com is an NXDOMAIN. The venue now trades as Electric Bristol at
      electricbristol.com, whose /contact/ page gives Nelson Street, BS1 2JY — the same building — and every page
      still carries the string "SWX". /events/ lists dated gigs from 21 Aug 2026 (Phoebe Bridgers, Current Joys, Ellie
      Goulding). The `name` field still reads SWX and needs an owner's decision, so it has been left alone.
    addedAt: "2026-08-16"

  - id: music/rough-trade
    name: Rough Trade Bristol
    category: music
    kind: venue
    status: provisional
    url: https://www.roughtrade.com/en-gb/events/bristol
    homepage: https://www.roughtrade.com/en-gb
    area: Broadmead
    tags: [record-shop, in-store, free]
    cadence: weekly
    hints: |
      Record shop with in-store performances and signings, many free. This path
      is already scoped to the Bristol store, so no cross-store filtering is
      needed. A browser user-agent is required — the host 403s the default
      fetcher. Content is a Next.js app: nothing is in the served HTML as
      markup, and the listings arrive in the streamed self.__next_f payload, so
      a headless browser is the reliable route.
    notes: |
      Verified 2026-08-17: /en-gb/events 403s to a plain fetch but returns 200 to a browser user-agent. The
      Bristol-scoped path is real — the served payload carries the route parameter ["uid","bristol"] and the nav
      labels it "Rough Trade Bristol". No dates were extractable from the HTML because the page renders client-side.
    addedAt: "2026-08-16"

  - id: music/crofters-rights
    name: Crofters Rights
    category: music
    kind: venue
    status: provisional
    url: https://www.headfirstbristol.co.uk/whats-on/the-croft
    area: Stokes Croft
    tags: [independent, grassroots, free, pub]
    cadence: weekly
    hints: |
      Same venue as The Croft, which is the name it currently trades under —
      Headfirst files it under the-croft, not crofters-rights. The URL points at
      Headfirst rather than the venue's own site because croftersrights.co.uk
      has lapsed and no replacement venue domain was found; no `homepage` is set
      for that reason.
    notes: |
      Verified 2026-08-17: croftersrights.co.uk is now a casino affiliate headed "Top Non GamStop Casinos for UK Players
      in 2026" — a 200, but not the venue. The Headfirst page confirms the identity in its own words: "A Stokes Croft
      icon (formerly The Croft, then Crofters Rights) returns thanks to Music Venue Properties' Save Our Venues
      Campaign", at 117-119 Stokes Croft, BS1 3RW, which matches area Stokes Croft. Dated gigs from 1 Sep 2026. So The
      Croft and Crofters Rights are the same venue and the proposed fix stands; `name` may want to become The Croft, but
      that is an owner's call.
    addedAt: "2026-08-16"

