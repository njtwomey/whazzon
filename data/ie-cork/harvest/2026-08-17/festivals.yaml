        raw: "**The Spirit of Mother Jones Festival 2026 — Thursday 23rd to Saturday

          25th July 2026, Shandon Historic Quarter.**


          \"The festival will be held in and around the Shandon Historic Quarter

          from Thursday, July 23rd, until Saturday, July 25th, 2026, inclusive. It

          will be organised by the Cork Mother Jones Committee 2026, an

          independent, voluntary, community-based committee. The festival is

          dedicated to the memory of Mary Harris/Mother Jones and to inspirational

          people everywhere who fight for social justice, workers' rights, and

          human rights.\"


          \"The festival and summer school will consist of talks, discussions,

          songs, music, films and documentaries.\"


          \"The venues are the Maldron Hotel, Shandon and the Dance Cork Firkin

          Crane and both venues are very close to each other on John Redmond

          Street.\"


          Programme: [Spirit of Mother Jones Programme

          2026](https://motherjonescork.com/wp-content/uploads/2026/06/Spirit-of-Mother-Jones-Programme-2026-4.pdf)

          (PDF).\n"
        summary: "Three free days in Shandon of talks, music, film and a summer school marking Mary Harris — Mother Jones — born on the North Side in 1837, with an annual award for social justice. Community-run, unbookable and in its fifteenth year."
        description: "The festival will be held in and around the Shandon Historic Quarter

          from Thursday, July 23rd, until Saturday, July 25th, 2026, inclusive. It

          will be organised by the Cork Mother Jones Committee 2026, an

          independent, voluntary, community-based committee. The festival is

          dedicated to the memory of Mary Harris/Mother Jones and to inspirational

          people everywhere who fight for social justice, workers' rights, and

          human rights. This festival celebrates her spirit.


          The festival and summer school will consist of talks, discussions,

          songs, music, films and documentaries. We hope to make them interesting,

          challenging and relevant.


          The venues are the Maldron Hotel, Shandon and the Dance Cork Firkin

          Crane and both venues are very close to each other on John Redmond

          Street, which is itself about 5 minutes walk from the Cork Opera House

          and Christy Ring Bridge. When on John Redmond Street why not visit the

          Mother Jones plaque erected by this committee on 1st August 2012. As we

          approach the 100th Anniversary of the passing of Mother Jones in 2030,

          we hope with the support of everyone to erect a statue to Mary

          Harris/Mother Jones who once walked these streets.


          All are welcome to attend the 2026 Spirit of Mother Jones Festival and

          Summer School. The events are informal and free, thanks to the support of

          the Trade Union movement, the Cork City Council, Cathedral Credit Union

          and local businesses. Attendance at each event is on a first-come,

          first-seated basis, so booking is unnecessary.


          According to James Nolan, spokesperson for the festival, \"We are happy to

          confirm that our 15th Annual Spirit of Mother Jones Festival will once

          again take place in the Shandon Historic Quarter in 2026. This inspiring

          festival is dedicated to trade union leader and social justice advocate

          Mother Jones, who was born Mary Harris in Shandon in 1837 and who has

          become an international symbol for human rights across the world. This

          festival celebrates her life and achievements and supports the causes she

          fought for as the 100th Anniversary of her death in 1930 approaches.

          Organised by a voluntary committee, it remains open and free to all and

          attracts large numbers of visitors to our community annually.\"\n"
        confidence: "high"
    notes: "Three fetches, one of them wasted, and that produces a **catalogue correction: the hint's /festival-<year>/ pattern does not hold for 2026.** /festival-2026/ returns 404; the 2026 hub is at /the-spirit-of-mother-jones-festival-2026/ and is linked from the homepage nav as \"Festival 2026\". The older editions do use both patterns — /festival-2025/ and /festivals/the-spirit-of-mother-jones-festival-2024/ and earlier — which is presumably where the guess came from, so the hint should say to follow the nav item and nothing else. The hub confirms everything: the 15th annual festival ran \"from Thursday, July 23rd, until Saturday, July 25th, 2026, inclusive\" in the Shandon Historic Quarter, at the Maldron Hotel Shandon and the Dance Cork Firkin Crane on John Redmond Street, free with no booking and \"first-come, first-seated\". Both weekdays check out and the edition is finished; the homepage has already turned over entirely to write-ups of it (the Vita Cortex workers' Summer School panel, the 2026 award). **The programme exists as a PDF only** — Spirit-of-Mother-Jones-Programme-2026-4.pdf plus a poster PDF — so the individual talks, films, discussions and concerts cannot be recorded; the announcement posts name Tadhg Hickey, Grace O'Sullivan, Des Geraghty, a documentary on Gaza and the Cummins sisters of Cork among them, and Bernie Sanders visited Shandon in May. Dance Cork Firkin Crane is catalogued elsewhere, so a live edition would carry `venue.sourceId`. No 2027 dates yet; the 2026 dates were announced in a news post on 12 November 2025, so late autumn is when to look."
