    notes: "The catalogued root 302s to /site/index.asp as the hint says, and that page is the full listing — 49 dated shows from 3 September 2026 to 25 February 2027, taken whole with no truncation. /site/301.asp (\"All Listings\") is byte-for-byte the same document, so following it would have been a wasted fetch.

      **Nothing at all over the bank holiday weekend.** The word \"August\" does not appear anywhere on the listing; the club's diary restarts on Thursday 3 September. Neither does \"bank holiday\". The Comedy Box appears to be between seasons — it promotes into Edinburgh over August — so an empty 29–31 August is the honest answer here rather than a coverage gap.

      Every row prints a weekday, and all 49 check out against the inferred year (2026 to 19 December, then 2027 from 15 January), so all are `confidence: high` on date.

      The club is an organiser, not a venue, so `venue.sourceId` is set on every row: comedy/hen-and-chicken for the Hen & Chicken Studio shows and theatre/redgrave-theatre for Neil Delamere at the Redgrave on 30 October. No show in this diary is at Lakota, the Tobacco Factory, the Old Vic or the 1532 — those nav sections are all commented out in the page source.

      One signal deliberately **not** turned into a status: rows whose button reads \"SEE MORE\" rather than \"SEE MORE / BOOK ONLINE\" also carry no ticket price, and at least two of them (Zachary Ruane on 7 September, Jamie Hutchinson on 9 September) are described as sold out on the Hen & Chicken's own site. The correlation looks real but the Comedy Box never prints the words, so every row here stays `scheduled` and the missing price is simply recorded as an absent `price`. Worth a hint for stage 1 to confirm.

      The page is served as ISO-8859-1 and its curly apostrophes and dashes come through as replacement characters in the body copy; they have been restored where the intended character was unambiguous."
