  - id: sport/great-bristol-run
    name: Great Bristol Run (half marathon & 10K)
    category: sport
    kind: festival
    status: provisional
    url: https://www.greatrun.org/events/great-bristol-run/
    tags: [running, mass-participation, annual, road-closures, half-marathon, 10k]
    cadence: quarterly
    hints: |
      The city's main mass-participation road race, successor to the Bristol
      Half Marathon. Runs several distances on the same day — a half marathon
      and a 10K, sometimes a shorter family distance. Record each distance as
      its own event: they have separate start times, entry fees and sell-out
      dates, and a runner cares which one they are entering. Entries open the
      previous autumn, so use a long forward horizon.
    addedAt: "2026-08-16"

