    notes: "Took the RSS route, which worked as the hint says: 10 items with titles, links and full blurbs, no JavaScript needed. **Between editions, and every row is in the past.** lastBuildDate is 5 May 2026; the 2026 programme has run and 2027 is not announced. Recorded with real past dates so the pipeline retires them, rather than as `undated`, which would leave a four-month-old fringe show looking current for ever.


      Date correction for the catalogue: the 2026 edition ran **7–10 May**, not 8–10 May. Johnny FIRE played Thursday 7 May, confirmed on its own event page, and 7 May 2026 is a Thursday.


      Deliberate truncation, with numbers: the feed carries 10 items and **3** event pages were opened — johnny-fire, the-history-of-art-a-clown-show and this-is-my-act — chosen because their blurbs read as comedy. Those three turned out to be `Genre: Comedy` and produced the 5 rows below (two of them played twice). The other **7** items (fXILE, The Weight of a Body, The Pigeon Factory, The Girls Room, THE FRIDGE-ING, SWEAT and the \"What is Fringe?\" panel) read as theatre, dance or visual art from their blurbs and their genre was **not** checked, so one or two of them could also be filed as Comedy by the festival. Worth a fuller pass in March–May when the 2027 programme lands.


      Route note: the RSS feed's `pubDate` is the WordPress post date, not the performance date — the dates here all come from the event pages. The `&genre=17` comedy filter mentioned in the hint was not tried, since the list renders client-side. This source's real value is its venues: The Fireman's Rest is in no other Cork source in this category."
