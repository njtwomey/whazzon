    body: "Hungry? Dig into the latest food and drink news from Bristol24/7 🍴


      View this email in your browser <https://mailchi.mp/bristol247.com/new-venue-by-best-friends>


      https://us.list-manage.com/WwavEUGSDG1?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=K1kYkmlNTFVQyyHOPK6irfzjpOA48cG0yf6pw7_G7mKtLsQcJ-YwknY8LstS


      THURSDAY, SEPTEMBER 3 2026


      This newsletter is brought to you for free by Bristol24/7. Become a member to support our independent journalism and social impact projects.


      If you scroll through this newsletter, you'll find the sad news of another popular restaurant closing soon. A fact that's well-known is that hospitality businesses in Bristol and beyond are suffering, and all we can do is make conscious choices to support our local businesses when eating out. Our brilliant reporter Molly Pipe reports on this in our next magazine, which should be available across Bristol in the next few weeks for you to pick up.


      https://us.list-manage.com/B9EpEpwmhZK?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=j-pLbRHmsoMbbl_7iApazC9pjMbjE_hAIzf9tJEvELpJnAClBUDoUmR8sFwS


      Best friends to open new 'music sharing' venue <https://us.list-manage.com/O34frrQ6Hy8?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=6WDIGzTZbYjucDzbn-10adOVZVEKmE3xKH6PRGi4zWKe_jFKtDDlvIoG4Zv1>

      If you, like me, were intrigued by the rather elusive logo on the exterior of the former Social on Cheltenham Road, this story is for you. Best friends Sophie & Ben have set out to create a space that welcomes music lovers of all kinds, while offering an array of services under one roof.


      Read full story <https://us.list-manage.com/YFHHgRdCdiM?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=vC4UIoz4k71utlqc6rfiWKLwcAJABR0DidjzVbZknWV_S-lJ5RAiJim0C225>


      https://us.list-manage.com/15XHQ7yWnHz?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=K7MkCSXpHh2hZCrrkX6nRiTKt6d6IfrZ6HXKEnJGunaQ0PS4WL0la78bBhmR


      Restaurant to close after almost ten years <https://us.list-manage.com/1QpOKU834k3?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=mP0x54sO04nJ5LQM2NWhvJbgOaKoQtGI2E4An8jbd-RKK6khJtD3zSyIVQGt>

      The restaurant in Wapping Wharf is one of many that have announced their closure in recent years for various reasons. You have until early October to visit them and say a proper goodbye.


      Read full story <https://us.list-manage.com/Ogr9J1H12T3?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=xuDx1uopBvsE2SAFlC0pm1Ibv8v39uVz1yNM0pkX7FD2IdGrDtf13JQpLUYI>


      https://us.list-manage.com/u_6TY9hsGNH?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=8l6bHyU3_sH_yMpUs0PmV2V0ZfomiJbr3Q_7VUcW_gfrFD7Q2G4lHOzoxcg9


      St Nick's is...flavour <https://us.list-manage.com/s7VxYX_oVSk?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=4zcf0C8j-4qDQ4YI3ItawbphZPw9NPqj0vyinPEHphzKftcA8bbb6wWokj37>

      SPONSORED |  From global street food to fresh local produce, it's a food lover's paradise all under one roof. Eat in, take away, or try something completely new.

      Come hungry - you'll be spoilt for choice.


      https://us.list-manage.com/DFRentUWRmk?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=OeV_0VywpSTSWF5kRltxR7XI4nLfxQGRAQKv6_NEFJ5-uNQ1oIH8y9I--n3_


      EatDrink24/7 special guest: Andy Clarke <https://us.list-manage.com/12I6ew9Ki1x?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=Yvn68yzI-S2Q4hCoIe7bSec1SgMutdX-uaxxfClI9KuS1gRzHSBfK2xsxkpF>

      Broadcaster and a through-and-through food and drink lover, Andy Clarke has kindly shared his favourite venues in the city for our latest EatDrink24/7 guide.


      Read full story <https://us.list-manage.com/mNjU6P2lw7F?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=tPOOr0W92tpx5KEPqmJJ27RNes-aukakG_gP2soj9PirisDhyML-OsjHzsHj>


      Dates for your diary


      September 5: Party, The Boot Factory <https://us.list-manage.com/REV28w_iIiV?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=SqGu_aHkVKqUpxrcmyPYiiSxfwh780FhxVbFO-A8Q8v9z6Q4Zk0bgvh1m9AA>

      The Bigger Boat and Artist Residence are collaborating for a special party this Saturday, with music from Noods Radio and drinks by Wiper & True.


      September 17: At The Table, Mazi Community Kitchen <https://us.list-manage.com/y6ALPCt7iN0?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=csxPfo0CWy3ujIf2afJeiZz3qz_k4lo_Bsfu1z4O3wjoH8PxkkQTTUdhKuim>

      Food charity The Mazi Project's supper series returns with an exciting collaboration with Nutmeg Street Kitchen. Expert Indian flavours, spice and an unforgettable evening.


      If there's any food and drink news you'd like us to serve up, we'd love to hear from you. We are on Instagram <https://us.list-manage.com/iI3qr46kRdD?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=NPye9tjbeMbofQmXqq4k-lz_eBvkuD889MRZn3PEpOSdCvgu9N4RO5HXdxlD>, or you can always email the editorial team via ed-team@bristol247.com.


      Bon appétit from Karen, EatDrink24/7 Editor


