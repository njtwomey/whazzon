    notes: "Index prints title, dates and a cover image only — no times, no prices, no description — so most rows here carry a `raw` of exactly that and no `description`. Pages 1-3 read (28 Aug to 4 Nov); a page 4 exists and was not read, so the diary beyond early November is truncated. Under the bank-holiday rule one event page was opened, Old City Sounds (29 Aug), which confirmed \"Saturday, 29 August 2026\", midday start, free entry and the Foyer as the space. Nothing at all is listed for Sun 30 or Mon 31 Aug — the house looks dark over the rest of the long weekend, though the page nowhere says so. Dates on the index omit the year and print no weekday, so every inferred row is `confidence: medium` per §2."
