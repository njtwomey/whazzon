schema: whazzon.catalogue/1
category: sport
label: Sport
description: >-
  Professional clubs and their grounds. Fixtures are published a season at a
  time and then move for TV, so the value here is in re-checking dates rather
  than discovering new events.
sources:
  - id: sport/bristol-city
    name: Bristol City FC
    category: sport
