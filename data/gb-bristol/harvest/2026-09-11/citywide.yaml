    notes: "The hint holds: a Chrome user-agent gets 200 where WebFetch is walled. Four curl fetches: /guides/ for the index, then the three roundups it carries that touch today or later — \"19 things to do in Bristol this week, September 14-20 2026\" (published today, the fetch.url above), \"16 things to do in Bristol this week, September 7-13 2026\" and \"50 things to do in Bristol in September 2026\". Everything dated 11 September onward from all three is recorded; the 7-13 piece's Monday-Thursday items have passed and are not. The web articles carry each event's real link (venue page, Headfirst, See Tickets), which is why they were read rather than relying on the newsletter's tracked mailchimp links. MAIL: the category mail file holds 19 Bristol24/7 messages; three are What's On campaigns (the 31 Aug-6 Sep weekly, the September monthly and the 7-13 Sep weekly) and the rest are daily news and food digests. The web articles are supersets of the What's On campaigns, so 4 events here are from the mailbox only and are marked as such in their raw text: The Veysil Oil Supper Club (10 Sep food digest), The Lost Paintings \"final weeks\" line (11 Sep daily), and Horse Jumper of Love and Liz Lawrence (the 31 Aug weekly's coming-soon tail). Bristol Coffee Festival is in both the food digest and the 7-13 web piece. Left out from mail: a Wild Oats shop-anniversary bakery stall (a retail promotion), and the dailies' news stories. Because the article is not the venue, every event carries `venue` — sourceId where the catalogue has the place, name where it does not (The Gaffe, The Croft, The Prospect Building, Grain Barge, Clock Factory, Lost & Grounded, Bristol Palestine Museum, The Harbour, The Mazi Project, Mr Wolfs, Seven Stars, The Granary, The Station, The Pump House, The Robin Hood, Bristol Dockyards, Tobacco Factory Cafe Bar). Several monthly-article hrefs are printed without a scheme (\"www.bristol-cathedral.co.uk/...\"); those are recorded with https:// prefixed, which is resolution not invention, and one (Intarsia, \"hwww.bristolbeacon.org\") is a typo and is left without a url. Items marked SPONSORED in the article are recorded like any other; the marker is kept in raw. No event pages opened. Two events the article dates loosely: Badgers \"Tuesday-Sunday\" (Visit Bristol says it closes Saturday 12th) and Death Cab For Cutie whose monthly-article link points at a London Troxy date — the weekly's See Tickets link is used instead."
