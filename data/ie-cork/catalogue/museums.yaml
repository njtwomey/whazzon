    hints: |
      The only year-round listing that covers Irish museums as a sector, and the
      safety net for a Cork museum talk that never reaches the venue's own site.
      Filter hard: most of what it lists is professional — IMA Forums, workshops,
      job shadowing, the annual conference — and does not belong on a what's-on
      site. Keep the public-facing rows: talks, exhibitions and museum visits
      that name a Cork venue.
      Each row prints time, day and month and the host venue on its own line
      ("12:30-13:30 | 18 August | Crawford Art Gallery, Cork"), with no year.
      Set `venue` from that line, and `venue.sourceId` when the venue is
      catalogued here.
      /events-landing/upcoming-events/ 301s to this URL. The year tabs on the
      page reach back to 2016 — stay on the current one.
