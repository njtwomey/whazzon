    notes: "The best-behaved source in the category. The feed route is one fetch for the entire season: 10 items, one per screening, each carrying the film's whole page in content:encoded — synopsis, credits, run time, certificate, press quotes and booking terms — so every event here has a `description` without a single extra fetch. lastBuildDate Fri 14 Aug 2026. I also read the homepage (for the card images, which the feed omits) and the Powertik organiser page, which prints \"Cork College of FET, Douglas Street Campus [formerly St. John's Central College], Cork\" against all ten and independently confirms every date. Three fetches total. All ten dates verified as Thursdays, so every row is confidence: high. Season runs Thu 24 Sep to Thu 3 Dec with one gap, Thu 29 Oct — October bank holiday week — which is why ten screenings span eleven weeks. Titles: each card is headed \"TITLE [Country], Thursday 24 September, 7:30pm\". The date and time are fields, so only the film part is the `title`, which also matches the shorter names Powertik prints. The season's placeholder is recorded exactly as listed, \"Film to be confirmed\", with its real date, rather than guessed at. Prices confirm the catalogue: €8.50 / €7 concession, online booking closes 18:30 on the night, pay at the door by card or cash if not sold out. Nothing is bookable yet — the homepage says tickets go on sale Sunday 13 September. One footnote for the catalogue: the President's Cake page calls this \"the start of our 30th season\" while the site elsewhere says \"Since 2010\". Both are the club's own words; taken together they imply two seasons a year, but the site never says so, so it is noted rather than asserted."
