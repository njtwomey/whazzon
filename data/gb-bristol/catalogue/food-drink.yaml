    url: https://bristolbeerfactory.co.uk/collections/tours-tastings
    homepage: https://bristolbeerfactory.co.uk/
    area: Bedminster
    tags: [ brewery, taproom, independent, beer ]
    cadence: monthly
    hints: |
      A Shopify collection of tour and tasting products rather than a diary. The
