    notes: "Fails exactly as the catalogue predicted, and the prediction is worth keeping. The whole response body is 168 bytes: an empty favicon link and <meta http-equiv=\"refresh\" content=\"0;/.well-known/sgcaptcha/?r=%2F&y=ipr:...\">. A browser user-agent makes no difference; this needs a real browser, not a header. Not a dead organisation and not something to reclassify: Cork Cine Club's pages still credit Access Cinema as a supporter and carry its logo alongside the Arts Council's. Nothing to change in the catalogue — the entry is correct as written, root URL rather than a guessed listings path, and rightly has no verifiedAt."
