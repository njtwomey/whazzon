    notes: "Hint confirmed: a plain fetch returns the empty state, and headless Chrome renders today's remaining showings only, with film titles as images. Harvested in a real browser instead, reading the page's own showings JSON from within the page — /api/microservice/showings/showingDates?cinemaId=10018 (which answers curl too) and /api/microservice/showings/cinemas/10018/films?showingDate=<date> (401 to anything outside the page) — for every one of the 68 dates with showings, 11 Sept 2026 to 8 June 2027. That is a discovery for stage 1 to weigh as an api route with a note that it only answers from the page; nothing was written to the catalogue. **The multiplex rule applied:** 76 films are on sale and 31 of them have nothing but routine showings; none of those is recorded, and neither are the routine showings of films that also have a special one. What is here is every session carrying a strand the venue itself labels — Big Screen Music/Theatre/Musicals/Opera/Dance, Movie Milestones, Back on the Big Screen, Mighty Mornings, Big Shorts, Autism Friendly, Open Captioned — plus the non-English-language releases (Hindi, Tamil, Malayalam, Punjabi, Cantonese), which the site marks by language and which are not tagged subtitled because the site does not say. Where one film has two different special showings (Spider-Man: autism friendly on Sunday, open captioned on Wednesday) they are two rows titled by strand so they do not collide on id. One row per title across its dates, with the exact days and times in timesText; prices are the site's per-session 'from' price, given as a range where EPIC-screen or premiere showings cost more. Nothing truncated; the horizon is the site's own. Titles are as the site prints them (its Met Opera Macbeth sits at an rbo-cinema-season URL, recorded verbatim)."
