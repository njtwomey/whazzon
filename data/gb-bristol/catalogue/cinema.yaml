  - id: cinema/20th-century-flicks
    name: 20th Century Flicks
    category: cinema
    kind: venue
    status: provisional
    url: https://20thcenturyflicks.co.uk/
    area: Christmas Steps
    address:
      street: 19 Christmas Steps
      city: Bristol
      postcode: BS1 5BS
      lat: 51.456144
      lon: -2.596725
    tags: [ independent, video-shop, micro-cinema, private-hire ]
    cadence: monthly
    hints: |
      A video rental shop with two tiny private screening rooms, mostly booked
      rather than programmed. Public events are occasional — monthly is enough.
      403s to a plain fetcher; a browser user-agent returns 200. There is no
      listings path at all (/whats-on, /events and /news all 404) — what public
      events there are appear as a "News" block on the homepage, so crawl the
      root. Most of the page is the rental catalogue and the two bookable
      screening rooms, neither of which is an event.
    notes: >-
      Verified 2026-08-17 with a browser user-agent: page reads "20th Century Flicks", "the longest running video shop in this world", footer address "19 Christmas Steps, Bristol, BS1 5BS" matches exactly. Only dated item was a Cinema Rediscovered '26 note in News. www. 301s to the apex domain.
    addedAt: "2026-08-16"

  - id: cinema/everyman-bristol
    name: Everyman Bristol
    category: cinema
    kind: venue
    status: provisional
    url: https://www.everymancinema.com/bristol/
    homepage: https://www.everymancinema.com/
    area: Whiteladies Road
    tags: [ commercial, boutique, mainstream ]
    cadence: daily
    hints: |
      Showtimes are loaded client-side and are not in the HTML, so expect no
      dated events from a plain fetch. The chain-wide /film-listing/ page is no
      use either — it says "Please select your venue first in order to see
      showtimes" and the selection is client-side. What the venue page does give
      is a JSON-LD `MovieTheater` block with the address and the facilities
      (35mm, Live Q&A, Silver Screen, Baby Club), and new films and events are
      published every Tuesday morning.
    notes: >-
      Verified 2026-08-17: /bristol/ 302s to /venues-list/x0x3q-everyman-bristol/ and the page reads "Everyman Bristol", "the Whiteladies Picture House and first opened in 1921", "Whiteladies Road, Bristol, BS8 2NH", agreeing with area Whiteladies Road. The catalogued /venues-list/bristol/ is a 404. The short /bristol/ vanity path is recorded in preference to the opaque x0x3q slug, which is likely to churn.
    addedAt: "2026-08-16"
    address:
      lat: 51.462986
      lon: -2.609596

  - id: cinema/showcase-cabot-circus
    name: Showcase Cinema de Lux — Cabot Circus
    category: cinema
