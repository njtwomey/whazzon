        raw: "**Song Of The Crow** — Sun 30th Aug - Tue 1st Sept 2026, 7.30pm (7pm on Sunday). £14. \"An enchanting tale of ritual magic and misfortune set by the sea in 1917\"\n"
        summary: "Riddlestick Theatre's new folk-theatre piece, set among a company of wartime runaways hiding in the Cornish cliffs, with live music and a 75-minute running time."
        description: "An enchanting tale of ritual magic and misfortune set by the sea in 1917 – a brand-new show from acclaimed folk theatre company Riddlestick Theatre (*Barleycorn*, *The Cabinet of Madame Fanny Du Thé*)


          Lizard Point, 1917. While the war grinds on in France, the mysterious Crow and his company of runaways spend their days in a fever of conjured dreams. In their refuge amongst the cliffs, hidden away from the prying eyes of the police, the troupe rejoice in strange rituals and tales of long-lost loves.


          But the tides are turning. Crow has taken to watching the sea. The voices of the dead are getting louder. And when a soldier from the front line washes up on the rocks nearby, the truth about Crow, and Lizard Point, threatens to drown them all.


          A brand-new show from acclaimed folk theatre company Riddlestick Theatre, conjuring a darkly comic blend of occult intrigue and enchanting live music.


          **Performances:** Sun 30th August at 7:00 pm, Mon 31st August at 7:30 pm, Tue 1st September at 7:30 pm. Tickets £14. Running time 75 mins (no interval). Suitable for ages 12+.\n"
        confidence: "high"
