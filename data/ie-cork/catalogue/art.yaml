    name: Crawford Art Gallery
    category: art
    kind: venue
    status: provisional
    url: https://crawfordartgallery.ie/whats-on/
    homepage: https://crawfordartgallery.ie/
    area: City Centre
    address:
      street: Emmet Place
      city: Cork
      lat: 51.899855
      lon: -8.47329
    tags: [ major, free, civic, gallery ]
    cadence: monthly
    hints: |
      **The building is shut.** "Crawford Art Gallery is now closed for
      redevelopment" — closed to the public since 22 September 2024, reopening
      expected 2028. It still programmes, but off-site, so almost everything on
      /whats-on/ happens at *another* venue (Cork City Library, Triskel Arts
