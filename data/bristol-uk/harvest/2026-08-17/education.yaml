    notes: "Read the catalogued URL directly and it is the listings page — twelve rows, server-rendered, with \"Bristol and the Brain\" printed twice (once as the featured item at the top, once in the list), so eleven distinct events. Four are outside Bristol and are not recorded: Welcome to Mumbai Enterprise Campus (10 Sep, Mumbai), Alumni Meet-up in Accra, Ghana (18 Sep), Law 1979 / 80 / 81 Reunion (29 Sep, Leathersellers' Hall, London) and 150th Celebration: Bristol Alumni Lunch in Melbourne (4 Oct). Recorded 7 of the 11.


      The index gives only title, start/end datetime and an address line, so §3's thin-index rule applies and all seven Bristol event pages were opened for `description` — seven fetches for a programme of seven. Every row prints a full date with the year, so no year had to be inferred, and each detail page names the weekday (\"Saturday 22 August 2026\", \"Saturday 3 October 2026\"), which agrees. No images anywhere on the page or the detail pages beyond the University logo and a fallback SVG, so `image` is omitted throughout.


      The hints read this as \"largely lectures, panels and campus openings that anyone can attend, with the genuinely members-only reunions a minority\". That is the wrong way round for what is on today: four of the seven Bristol rows are class reunions organised by alumni volunteers and carrying the disclaimer \"independent of the University of Bristol\", two of them bookable only by emailing an individual. The genuinely public-facing rows are Bristol and the Brain (free, Eventbrite, open to alumni and supporters), the Film and Television networking afternoon (free, booking form) and the Widening Participation celebration — and the last of those states it is \"exclusively for alumni that completed either Access to Bristol or Bristol Scholars\". Worth correcting in the hints so a later run does not over-promise how public this source is.


      Two things for stage 1. First, the listings template leaves a static paragraph, \"There are currently no events scheduled. We will list new events here when they're confirmed\", visible immediately below the twelve populated rows; it is a template artefact rather than a claim that nothing is on, and a future extractor could easily read it as one. Second, the page's sidebar promotes a public programme for Saturday 10 October 2026 — the 150th anniversary and the opening of Temple Quarter Enterprise Campus — and links to https://www.bristol.ac.uk/university/150-years/events/. That URL returns 200 but its body is empty: navigation and footer only, no content and not even a Timely embed. Nothing is recorded from it, because the only thing that would describe what is on that day carries no text; it is a candidate source once it renders. /alumni/events/feed/ was not retried, the hints already having it as a 404."
