  - id: family/cork-city-libraries-children
    name: Cork City Libraries — Children & Young People
    category: family
    kind: listing
    status: provisional
    url: https://www.corkcitylibraries.ie/en/what-s-on/children-and-young-people/
    homepage: https://www.corkcitylibraries.ie/
    tags: [ free, civic, community ]
    cadence: weekly
    hints: |
      The largest source of free family events in the city, spread across the
      branches — Lego Time, Toddler Music Time, Storytime, Happy Talk, teen book
      clubs — most of them weekly or fortnightly recurring rather than one-offs.

      Individual events live at /en/events/<slug>-ddmm/ and the title carries the
      day and month with no year ("Lego Time 08/07"), so the year has to come
      from context; do not assume the list is forward-only. The branch is the
      venue and is usually only in the event page, not the title. The event tree
      shown on this page is the whole library programme, adult items included,
      so filter to the children's and teen strands rather than taking everything.

      Annual set pieces to expect: Summer Reading Challenge, Spring into
      Storytime, the Children's Book Festival every October, and Teen Day inside
      Cork World Book Fest in April.
    notes: >-
      Verified 2026-08-17: this page returns 200, is Cork City Libraries' own children's and young people's programme page, and links hundreds of dated /en/events/ items. Catalogued here rather than left to literature because the children's programme has its own page and would otherwise be invisible as family; literature will very likely also hold the general /en/events/ listing, which is a different URL — check the two are not harvesting the same events twice.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: family/ucc-science-week
    name: UCC Science Week
    category: family
    kind: listing
