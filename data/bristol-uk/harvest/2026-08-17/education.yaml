    notes: "The catalogued filtered URL works and the location filter is load-bearing exactly as the hints say — kept percent-encoded and untouched. It returns \"Displaying 1 - 6 of 6\" with no pagination, so this is the complete Bristol result set and all six are recorded. Nothing had to be dropped for the ten-mile radius being wider than this location: every row is in Bristol.


      **One hint is wrong.** All six courses run at \"WEA York Court (Bristol)\", 7 York Court, Wilder Street, Bristol BS2 8QH — the WEA does have a building here, rather than only borrowed halls, libraries and church rooms. `venue` is still set on every event, because the source is a national organiser and §6 wants the venue whenever it differs from the source, but it is set to the WEA's own centre. Worth correcting so a later run does not go hunting for community-hall names that are not there.


      **What is actually on.** The whole Bristol programme is one qualification: the Award in ESOL Skills for Life (Speaking and Listening), across six cohorts of four levels — Entry 1 twice, Entry 2 twice, Entry 3 once, Level 1 once — at different times of day. There is no arts, crafts or humanities provision in Bristol this term. That is a real result and not a truncation.


      Each is a term course of 38 or 39 sessions between early September and mid-December, so each is one `recurring` event carrying the source's own date range and session count, never one row per class. Both Entry 2 cohorts start on 2026-09-08 under an identical printed title and would collide on id, so the WEA's printed course code is appended to those two titles only.


      `status` follows the page rather than inference: the two cohorts showing \"0 places remaining\" and \"Status: Waiting list\" are recorded `sold-out`, the other four `scheduled`. Fee is printed only as \"Funding available - £780.00\", kept verbatim in `price.text` with `free: false` and no min or max, since what a learner pays turns on funding the page does not resolve. Every card also carries \"This course is funded by the West of England Combined Authority and is only available to residents living within the West of England Combined Authority area\" — an eligibility restriction rather than a location one, kept in `raw`.


