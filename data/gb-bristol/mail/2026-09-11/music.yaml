      Raise a glass to our new Brewing Partner


      Today we’re delighted to announce a new partnership with Bristol Beer Factory, who are now our official Brewing Partner.


      You’ve been asking us for more local drinks products on our bars, and we’ve heard you loud and clear.


      From this week, you’ll find a selection of Bristol Beer Factory beers across our bars and in the Colonnade restaurant – including Laser Juice Session IPA, Gravity Pils Lager and North Street Cider, alongside a range of cans including Clear Head 0.5% alcohol-free IPA.


      But there’s another reason we’re particularly pleased to be working with Bristol Beer Factory.


      Through their Brewed to Give programme, Bristol Beer Factory donates 2% of its turnover to local charities, community organisations and CICs. So when you enjoy a Bristol Beer Factory beer at Bristol Beacon, you’re also helping good things to happen in the city.


      It’s a partnership that as a not-for-profit organisation ourselves, we feel very proud of - two independent organisations, rooted in Bristol, working to bring people together and make a positive contribution to the communities around us.


      So next time you’re here for a gig, concert or event, raise a glass to great local beer – and to doing a little bit of good at the same time.


      Cheers, Bristol! 🍻


