    notes: "A browser user-agent is still required as the hint says: a Chrome UA gets 200. Harvested from the HTML rows, which this run print a price (\"From £12\", \"£24\", \"Early Bird £20\") recorded as `price.text`, with the embedded JSON-LD `Event` blocks supplying the excerpt and the room. No per-event fetches and no API call.


      Two pages taken, 24 events, 12 September to 7 November. **Truncated deliberately beyond that.** The category's own iCal feed, linked from the page's \"Subscribe to calendar\" menu at https://www.henandchicken.com/?post_type=tribe_events&tribe_events_cat=comedy&ical=1&eventDisplay=list, was fetched once to size the diary: it returns 30 events (probably its cap) to 21 November, and every one after 7 November is a Comedy Box show already taken whole to February 2027 in this run, so a third HTML page would have bought duplicates. The feed carries title, timestamps and link but no price or image, so the HTML remains the better route for cards; stage 1 may still want it as an `ics` route for sizing.


      Only two rows are not on the Comedy Box diary: Con Acento, a Spanish-language open mic on Fri 25 September, and Wednesday Night Improv on 14 October. Both are in the Chicken Shed, a second room in the same building, so that is noted in `timesText` and no `venue` is set. Con Acento is priced \"€2\" in both the row and the JSON-LD (`priceCurrency: EUR`), so it is recorded in EUR as printed; the \"Spanish Language Comedy:\" genre prefix went to `subcategory`. The plain \"Comedy:\" prefix was stripped from every other title per the hint.


      The JSON-LD `priceCurrency` is still `USD` on every sterling row; the page prints £, so `currency` is GBP. \"From £12\" and \"Early Bird £20\" are recorded as a minimum with no maximum. Dan Tiernan on 22 October prints no price on this page (the Comedy Box has £19.50) and gets no `price`. Greipur Hjaltason on 20 October prints one show, 8:00–10:00 pm, \"From £30\", where the Comedy Box now lists 6.30pm and 8.45pm shows; recorded as this page printed it and flagged in `summary`.


      No row on either page describes itself as sold out this run, and no `status` other than `scheduled` was written. Catalogue correction, repeated from 28 August: the hint says to ignore the `<title>` as a stale plugin artefact; it now tracks the view (\"Events from September 12 – October 10 › Comedy\") and the hint can be retired. Image alt text on the Stand Up For The Weekend rows names the guest act and compere, which is where those names in `summary` come from."
