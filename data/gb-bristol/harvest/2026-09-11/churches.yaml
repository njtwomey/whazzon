    notes: "Second harvest. /whats-on/ answers 200 and is still the real listing, but it paginates twelve rows at a time with five daily services per day, so the forward diary was read through the site's Tribe REST API instead: /wp-json/tribe/events/v1/categories (eight categories, counts included), then /wp-json/tribe/events/v1/events?per_page=50&start_date=2026-09-11&end_date=2027-09-30&categories=music (32 rows, one page, full body text and image URLs) and the same with categories=community,family-activities,guided-tours,special-services,talks-workshops (9 rows). Both answered 200 to a browser user-agent. That pair is the whole non-service diary through May 2027 in two fetches and is worth an `api` route in the catalogue, with the hint that `categories=` filters by slug and that leaving `services` out is what makes it usable. The .ics export noted last run was also read (30-event cap, 12–18 Sep only) along with /worship/lunchtime-recitals/ and /worship/daily-services/. Eight fetches in all, over budget; the two large ones were the catalogued page and the ics, the rest were small JSON or short pages.


      Choral Evensong is carried again as one `recurring` row with the pattern in the exact words of /worship/daily-services/, re-read today and unchanged since 28 August, so the row keeps its id. This week's diary matches it: Choral Evensong 17:15 on Fri 11, Mon 14, Tue 15, Wed 16 Sep; 15:30 on Sun 13; Evening Prayer on Sat 12 and Thu 17. No other daily service is recorded, per the catalogue hint. The one-off Special Services category is recorded (All Souls' Requiem, Remembrance Sunday, Advent Procession, Advent Quiet Day, Pride Carol Service, Trinity Sunday) because each is a dated public event billed with music, not a regular said service; a human may want to settle whether Remembrance Sunday and Trinity Sunday belong.


      Price: the API's cost field is empty for every concert and recital and says \"Free\" only for All God's Children, Remembrance Sunday, the Advent Procession and Trinity Sunday, so `price` is set only on those and on WOOFYT, whose text says it. Nothing on /worship/lunchtime-recitals/ or any recital row states a price, so the twelve Tuesday recitals carry no `price` — the previous run's summaries called them free without a source for it, and that is not repeated. Thirteen of the 40 events are external promotions \"hosted at Bristol Cathedral\" with tickets sold by the organiser; the cathedral prints no ticket link for them, so `url` is the cathedral's own event page in every case.


      Since 28 August: Michał Szostak (8 Sep) has passed; the Tower Tour is no longer in the forward diary (only a 22 Oct Highlights Tour is); new are An Evening of Kate Bush, The Sanctus Project, Paul Gunn Cello Trio, A Night at the Opera, The Music of Adele, Arnos Vocale, in the dark: HUSH, The Four Seasons & The Lark Ascending, Springsteen, G4, Fleetwood Mac, Lucie Tenet & Anna Harris, Day Sessions, Vivaldi at Christmas, Mabelle Young-Eun Park, Bublé, both Carols by Candlelight nights, Christmas Classics, Viennese Christmas, Chorister for the Day, the six special services and the Highlights Tour. Carols by Candlelight is two rows because it is two nights; Christmas Classics is one row with both performances in `timesText`. Pride Carol Service sets `venue` because it is in the Lord Mayor's Chapel, not the cathedral. The Grenfell panel is in its last three days. Crafty Cathedral is listed only for 20 and 27 August, both past, and is not recorded.


      Oddities kept as printed: the Vivaldi concert's URL slug is /rhapsody-in-blue-at-christmas/; the Fleetwood Mac blurb contains a stray \"citeturn5view2\" token, which is the cathedral's copy, not ours; the recital rows' currency_code carries a \"\\t\\t\\t\\t\\t\\t\\tclass=\" suffix, a template bug on their side. The ten organ-recital and concert rows that repeat the same four-paragraph series blurb carry only the first of it in `raw`. No `description` is set anywhere: the index text is the event page text on this site, so there was nothing more to open.


      Mail: four messages from info@bristol-cathedral.co.uk were in the mail file (two subscription welcomes on 3 Sep, \"News & Notes\" on 4 and 11 Sep). None lists an event: the weekly News & Notes is two tracked list-manage links to a PDF notice sheet and the Sunday order of service, which were not followed. Nothing here came from the mailbox. The seasonal \"Bristol Cathedral Newsletter\" that the second welcome describes is the one that will carry a programme when it arrives."
