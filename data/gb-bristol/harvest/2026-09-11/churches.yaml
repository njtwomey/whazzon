        raw: "**The Sanctus Project** — This Week's Recital. Tue 15 Sep | 13:15 – 14:00. Tuesday Lunchtime Recital series.


          Sanctus was the brainchild of saxophonist and session musician, Ian Close. Ian transcribed the vocal lines from early sacred music of the 12th and 13th centuries and then Dominic Beeton accompanied these sublime instrumental lines with harmonium, shruti box, and synthesisers. The result is a profoundly spiritual experience which is ideally suited for cathedrals, churches, abbeys and sacred spaces.


          Take a break in the middle of your week and enjoy an inspiring hour of live music in the magnificent surroundings of Bristol Cathedral's 19th-century Nave. Our popular Tuesday Lunchtime Recital series showcases a diverse programme of performances from world-class musicians, rising stars, and acclaimed ensembles.\n"
        summary: "Twelfth- and thirteenth-century sacred vocal lines transcribed for saxophone and set against harmonium, shruti box and synthesisers — the Tuesday lunchtime recital, in the Nave for three quarters of an hour.\n"
