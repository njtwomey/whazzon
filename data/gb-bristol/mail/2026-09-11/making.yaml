      VOCAL PRACTICE WORKSHOP


      Our 2026 artist residency support continues with a workshop from Chez Dunford.


      Join Jenna Brown, Chez Dunford and Eleanor Hooper for an explorative Voice for performance workshop.


      \"We started experimenting with creating voice from the body together as part of our residency at The Island. We are now offering you the opportunity to join our creative lab, sharing hands on self care techniques, playful sound making, questioning and creating safe space for improvisation starting from the body.\"


      This is a free event taking place in The Island Gallery as part of an Artspace Lifespace residency.


      Drop in, no need to book.

      2nd September, 10 - 1pm

      The Island Gallery <https://us.list-manage.com/LQBzu4vVPYq?c2id=5d93719d43fa326bdad19fdd9203ff9a>, Bridewell Street, Bristol. BS1 2QD


      https://us.list-manage.com/x3N0W_GHoIq?c2id=5d93719d43fa326bdad19fdd9203ff9a


      THE LIBERTIES EXHIBITION


      The Liberties, is a deeply personal reflection by artist Gearoid Simms on growing up in Dublin’s historic Liberties area.


      Simms possesses a unique ability to recount memories with striking clarity, and has channelled this gift into a body of work that captures both the vibrancy and the complexity of his hometown.


      \"The Liberties was, and still is, a great place to grow up. Its streets were full of life, both commercial and domestic. The people were talkative and witty. Yet many of its children suffered through heroin, and today the area is no longer a market and trading hub but one defined by digital and technology culture.\"


      Simms invites the public to look deeply into these paintings and, through them, to reflect on their own past.


      Free and open to the public 17th - 20th September, 12 - 6pm.

      The Island Gallery <https://us.list-manage.com/QgfUm5r2nG1?c2id=5d93719d43fa326bdad19fdd9203ff9a>, Bridewell Street, Bristol. BS1 2QD


      https://us.list-manage.com/_A14Vekxxgn?c2id=5d93719d43fa326bdad19fdd9203ff9a


      AERIAL LOOP STRAPS CLASS


      Led  by experienced aerialist Molly Whitehouse this new Aerial Circus class for adults uses the apparatus Loop Straps. It’s a fun and exciting way to build strength, fitness and flexibility.


      Cost is £16, book via bookaby <https://us.list-manage.com/7pTK5zeB59l?c2id=5d93719d43fa326bdad19fdd9203ff9a>

      Wednesdays 6.30-7.30pm

      The Island Circus Training Space <https://us.list-manage.com/m5mRfhScPdi?c2id=5d93719d43fa326bdad19fdd9203ff9a>, Nelson Street, BS1 2LE.


      https://us.list-manage.com/rtowNwL3XL9?c2id=5d93719d43fa326bdad19fdd9203ff9a


      FISH TANK


      If you’ve ever wanted a space to just try your work outside the confines of your mind and to share it with an open and welcoming audience, this is your chance.


      Fish Tank is a monthly open mic night for the unpolished, newly crafted and the experimental. Launching in September, every first Wednesday of the month, The Island Gallery will make space for Bristol’s creatives.


      Open to spoken word, song, poetry, experimental sounds, and anything new.


      This is a trial run for this series, and if successful or a community forms, we can continue holding space for it!


      Drop in, no fee.

      The first Wednesday of every month, 7 - 10pm

      The Island Gallery <https://us.list-manage.com/1C_gripcdBl?c2id=5d93719d43fa326bdad19fdd9203ff9a>, Bridewell Street, Bristol. BS1 2QD


      https://us.list-manage.com/SbJFGqtr9r3?c2id=5d93719d43fa326bdad19fdd9203ff9a


      KINSHIP


      Kinship brings together the work of seven Photographic artists, whose work seeks to understand the world around us. Through varied perspectives and approaches, the works shown explore connections between people, place, objects and lived experience.


      Opening night, 22nd September 6-9pm

      Free and open to the public 23-27th September, 9am-4pm

      The Island Gallery <https://us.list-manage.com/KQE67yIVQTo?c2id=5d93719d43fa326bdad19fdd9203ff9a>, Bridewell Street, Bristol. BS1 2QD


      https://us.list-manage.com/qB1oeT3QHbw?c2id=5d93719d43fa326bdad19fdd9203ff9a


      THE ISLAND OPEN STUDIOS - SAVE THE DATE


      Your annual chance to see all the hidden areas of The Island is just around the corner.

      Join in a taster dance class, see the creative spaces of musicians and artists and marvel at the skills of our Circus Space members, take a tour of the building culminating in the impressive Island Studio Holders' art exhibition.


      Artists' Exhibition, 16th October, 12-5pm

      Open Studios, 17th 12-5pm & 18th 12-4pm

      The Island, <https://us.list-manage.com/ci2n83K6P0Q?c2id=5d93719d43fa326bdad19fdd9203ff9a> Nelson Street, Bristol. BS1 2LE


      https://us.list-manage.com/RlO8DmIg8lC?c2id=5d93719d43fa326bdad19fdd9203ff9a


      SHARED LIVES, SHARED FUTURES


      Sparks Bristol has been chosen to host a photography exhibition celebrating The United Nations 80th anniversary.


      'Shared Lives, Shared Futures' brings together over 200 inspiring stories from around the world, showcasing how the UN shapes our daily lives—from peace and security to humanitarian action and sustainable development. Bristol will be showcasing 35 curated panels.


      Ground floor exhibition area, 2nd September - 11th October

      Sparks Bristol <https://us.list-manage.com/8n8MRwr6Rqh?c2id=5d93719d43fa326bdad19fdd9203ff9a>, 78 Broadmead, Bristol. BS1 3JA


      https://us.list-manage.com/1CCdES4PJsP?c2id=5d93719d43fa326bdad19fdd9203ff9a


