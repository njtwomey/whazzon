      WHAT IS AUDIO DESCRIPTION?


      Audio Description (AD) is a service for partially sighted or blind people. The film's main soundtrack plays through the cinema speakers in the usual manner. But AD users listen to a specially recorded narrator through a set of headphones. The recording details what's happening on the screen. The service is like listening to a football or cricket match on the radio.


      The AD headphones are available to collect from Box Office. You can pick up your headphones when you pick up your tickets before the film screening.


      Please check our calendar for our latest AD screenings <https://us.list-manage.com/1AZk2fxkzBK?c2id=944927b628e367996f6a53da7340e920&m=EYBrVZ5KlgVIECmCn706tI8khUyi6WIwMdNC9DtsUct5v8xvoJvBhuD8rUES>


      WHAT IS DESCRIPTIVE SUBTITLING?


      Descriptive Subtitling (DS) is a service for our Deaf and hard of hearing customers. It displays extra auditory information on the screen.


      As well as showing the dialogue, DS provides information about other significant sounds. For example: when something is being sung; when a phone rings; or when a door slams. This allows customers using the subtitles to access the film more fully.


      Please check our calendar for our latest DS screenings <https://us.list-manage.com/jWSZtto4ngF?c2id=944927b628e367996f6a53da7340e920&m=CMUgX4JJ2wBX-oBkNyCwmS-sErv7Uo6lJseeFn4ZBaY9Fm6VtbyD7-MHyotu>


      WHAT IS A RELAXED SCREENING?


      We have designed Relaxed Screenings (RV) to benefit our customers with extra needs. They could be for those living with dementia, autism, or other neurodivergent people. It is also for their personal assistants, friends and family. Anyone who wants to enjoy a film in a more relaxed environment is welcome.


      Here's what you can expect at a Relaxed Screening:


      \ * The capacity for the cinema will be set at 60% to ensure there's enough room between audience members.

      \ * The cinema doors will open 20 minutes before the screening start time.

      \ * We won't show any trailers or adverts and the film will start at its advertised start time.

      \ * The lights will be up a little.

      \ * The sound will be down a little.

      \ * You are welcome to move around the cinema, to talk and make noise, and to exit and enter the cinema as you please.

      \ * There will be lots of space in the cinema so you can spread out or lie down if you choose. It is very informal and yoga mats and beanbags will be available.

      \ * We will screen films with Descriptive Subtitles whenever they are available.

      \ * We will provide a separate quiet space where you can chill out if you need to.

      \ * Our staff will be around to help with whatever you need.


      Please check our calendar for our latest Relaxed Visits and Screenings <https://us.list-manage.com/1CJxFoTOzYr?c2id=944927b628e367996f6a53da7340e920&m=kNivr5fgNz-Khvbb8oRADiwLLDebgitPYUy-Wu_Hch5VHjWBSaNURYgC1iAi>


      WHAT IS HORIZONTAL CINEMA?


      Many people need to rest in public if they are to be part of our community. We have worked with disabled artist Raquel Meseguer Zafe to create Horizontal Cinema. This means you can request a bean bag or a yoga mat and cushion to watch any screening of any film.


      Here’s how:


      \ * Call the Box Office on 0117 927 5100 <tel:01179275100>.

      \ * Ask to do Horizontal Cinema and specify whether you’d like a yoga mat or a bean bag.


      WHAT ARE MASKED AND SOCIALLY DISTANCED SCREENINGS?


      We designed Masked and Socially-Distanced (MSD) Screenings for our most vulnerable audience members.


      In the cinemas, we sell MSD Screenings at 25% capacity and they have every other row of seats blocked off. If you attend one of these screenings wearing a mask is mandatory. Our Box Office and Front of House staff will also be wearing mask at these screenings.


      HOW DO I BOOK TICKETS?


