      Mahler Symphony No. 2 ‘Resurrection’ Anniversary Gala Concert


      Sat 24 Apr 2027


      Beacon Hall


      Bristol Sinfonia celebrates its 30th anniversary in Beacon Hall alongside City of Bristol Choir and Cardiff Polyphonic Choir.


      The programme brings together two powerful works: Poulenc’s vibrant Gloria, with its rich orchestration and lyrical soprano solos, and Mahler’s monumental Symphony No. 2 (Resurrection), exploring life, death and rebirth before a triumphant choral finale.


