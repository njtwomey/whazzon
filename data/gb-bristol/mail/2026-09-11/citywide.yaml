      The Coconut Tree have opened a new premises, now under new ownership. Their site on Gloucester Road also remains open and functional as usual.


      https://us.list-manage.com/17L_BHrzxpc?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=-59-mF5JVImEFTG6gifhPMflzcgSsmasv63SiUYlej08yImd3e0B2Z1vT4_t


      Landlord given award for 'saving' pub <https://us.list-manage.com/16ZqThsMW84?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=pvOvIBt1jrFUUFhyxfurb2QITCOCVZURGckKS9CN_aWGRLHrqDmI0QYx5s-9>

      In some very well-deserved award news, Sam Gregory - the custodian of  some of Bristol's best pubs - was given an accolade for breathing new life into a pub. Read the full story to know more.


      https://us.list-manage.com/N4BvuyWv0pC?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=_yn2Napb1H6Qswke7WLvbtva1M_19RVVTJtw-F9rvBN5uS6sq5L_rdWQQg_R


      Bristol Beer Factory becomes Bristol Beacon's brewing partner <https://us.list-manage.com/ho6MWibplHC?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=TmzzBGLKr-dSmvhWL0UqLb25KizcSdkQ7oOdXLe45hSpyKDnz5ytIERNW_Df>

      The next time you're at the Beacon for a show, there will be a curated selection of Bristol Beer Factory drinks awaiting you at the bar. What would you pick - a beer, cider or their non-alcoholic version Clear Head?


      A little obsessed with this fire-throwing dragon on my cup of coffee, made by the talented baristas at Burra on North Street.


