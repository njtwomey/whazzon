    notes: "The hints are right on both counts: waterstones.com still 403s WebFetch, and the same URL returns full HTML to curl with a browser user-agent, which is how everything here was read. The shop filter is correct — the applied-filter label reads \"Bristol - Galleries\" and every event links to /bristol-galleries. Yesterday's run recorded this source as a total fetch failure, so these 13 events are the first Waterstones data in the log. The default page is paginated: 12 events on page one and \"of 2\", so /page/2 was followed and yielded the thirteenth (Meet Cody Dahler, 9 Nov). No month filter was needed. Twelve event pages were opened for description, soonest first, which is the cap in §3; only Meet Cody Dahler is left with raw alone. Those pages are also where the prices come from — the index shows none — and where two age notes came from. Every listing prints its weekday and every detail page prints the year outright, so all 13 are unambiguously 2026. One event is not at the shop: Intelligence Squared's Anthony Scaramucci on 19 Sep is at St George's Bristol, which the listing states in place of the shop name, so venue points at music/st-georges-bristol. Three rows carry no price because none is printed on either the index or the detail page (Summer Fun, Rainbow Bookclub, Raising Readers) plus Meet Cody Dahler, whose page was not opened — price is left off rather than assumed free. Two are date ranges rather than single sittings and are recorded as runs with the single printed time in timesText. Clifton and Cribbs Causeway were not touched: they are separate shop filters and separate sources."
