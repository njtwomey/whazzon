    notes: "Re-pointed URL is good: https://www.childrensscrapstore.co.uk/free-events fetched first time, 200, and it is the dated calendar the hint promised. The hint's second half is also right and mattered — /events is a separate page holding the paid weekly sessions, and it lists only two items with no times, prices or dates at all, so I followed the hint and opened both session pages (/messy-play and /friday-craft-session). **Two event pages opened for `description`, both on this source**; nothing else was opened, so the six free events carry only `raw`. Four fetches plus one to the Squarespace collection JSON (/free-events?format=json) which is what supplied the image URLs and confirmed the dates — the rendered page carries no image URLs. Worth a hint: that endpoint gives startDate/endDate/assetUrl/fullUrl/excerpt for the whole collection in one request, and it separates \"upcoming\" from \"past\" for you. Its timestamps are UTC epoch, so they read an hour early in BST; the times above are the local wall-clock times the rendered page prints, which I cross-checked against the JSON. Deliberate truncation: /free-events is an archive as well as a calendar — 38 listings, of which only 8 are upcoming. I have recorded the 8 upcoming ones and left the 30 past listings (back to June 2025) unrecorded rather than filling the log with finished events. Two collapses, per §4: the \"Super Sustainable Arts Weekend\" is listed as four separate bookable sessions — Saturday morning, Saturday afternoon, Sunday morning, Sunday afternoon — and is recorded as two events, one per day, with both that day's times in `timesText`. Note also that the source itself frames Super Saturday as \"the 1st Saturday of every month\" but publishes each month as its own dated listing, so those are recorded as singles as listed rather than folded into one recurring event. No price is recorded for Messy Play or Friday Craft: the pages say only that a booking includes one-day warehouse membership and that scrap collection is \"a donation of £7 (less if the basket isn't full)\" — the session fee itself is never printed, and it sits behind the booking system, so `price` is omitted rather than guessed at or wrongly marked free. Listing links in the HTML resolve to the bare domain; since the catalogue records that the bare domain redirects to www, the www host is used throughout above. Picnic in the Park is the one off-site event here, and the page names only \"Picnic in the Park in St Werburghs\" without naming the park, so `venue.name` carries that wording verbatim rather than a park I would have had to guess at."
  - sourceId: "family/puppet-place"
    fetch:
      ok: true
      url: "https://puppetplace.org/whats-on/"
      status: 200
    events: []
    notes: "Re-pointed URL is good — /whats-on/ fetched first time, 200, and it is Puppet Place's own page. But it is not a diary: it is a retrospective archive, written almost entirely in the past tense (\"Open Doors took place on Saturday 18 July\", \"Helena Houghton facilitated this two-day workshop\", \"Participants delved a bit deeper\"). It carries 28 items running back to January 2023, and **every one of them is dated in the past**. The two most recent are Open Doors for Bristol Harbour Festival, Sat 18 - Sun 19 July 2026, and \"Introduction to stop motion puppet making\", Sat 1 - Sun 2 August 2026 — both already gone, and both already recorded in the catalogue's verification note. Nothing upcoming is listed. So this is `ok: true` with no events: a real result, not a failure and not a fetch problem. I spent a second fetch on the homepage to check the finding, since an active organiser listing nothing forward is suspicious; it confirms it — the homepage previews no events either, its only dated content being a 2025 panel discussion now released as a podcast, a past BCFM interview, and a memorial notice for Di Steeds \"who died on 18 July 2026\". Nothing recorded rather than logging two-week-old workshops or guessing that an annual pattern repeats. The hint is now half-true and worth revising for stage 1: it says the listing \"mixes passed events in with upcoming ones (2025 entries sit beside 2026)\", but today there are no upcoming ones at all — the page is ordered newest-first and is wholly historic, so the real instruction is to read the year and the tense on every item and expect the page to be an archive between programmes. Three further things for stage 1. The catalogued `area` is wrong, as the verification note already spotted: the page footer gives Unit 18 Albion Dockside Estate, Hanover Place, Bristol BS1 6UT, which is Spike Island / Harbourside, not Bedminster. Several items carry no date at all — the Experimental Cabaret, marked SOLD OUT, \"Directing Puppetry with Emma Williams\", \"Stop-Motion Taster Day\", \"Introduction to Shadow Puppets\", the Magpie Rummage Sale — and all are written in the past tense, so they are archive entries rather than `undated` listings. And the annual rhythm is legible even though nothing is booked: Open Doors lands on the Bristol Harbour Festival weekend every July (2023, 2024, 2025, 2026) and there is a Scratch Cabaret fundraiser most autumns, which argues for a quarterly rather than monthly cadence on this source, plus a look in early summer. The off-site links this page carries are worth knowing about too: bristolexperimentalpuppetfestival.com and puppetplace48.co.uk (the 48h Puppet Film Challenge), either of which may be where forthcoming programming actually appears."
