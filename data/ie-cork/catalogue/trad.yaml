  - id: trad/the-oliver-plunkett
    name: The Oliver Plunkett
    category: trad
    kind: venue
    status: provisional
    url: https://theoliverplunkett.com/live-entertainment/
    homepage: https://theoliverplunkett.com/
    area: City Centre
    address:
      street: 116 Oliver Plunkett Street
      city: Cork
      postcode: T12 P957
    tags: [trad, pub, free, session]
    cadence: monthly
    hints: |
      Big, busy, tourist-facing, and named by the Lee Sessions as one of its core
      venues — the trad sessions run upstairs in the Frisky Whiskey Bar, with
      live music of some kind seven nights.
      The trap here is that the venue publishes nothing usable. This page says
      "please see our weekly schedule" and then does not contain one; /whats-on/
      and /live-music/ are hard 404s; and /event-tickets/ is a page with the
      heading "BOOK YOUR EVENT TICKETS" and an empty JavaScript widget under it,
      no dates in the HTML. Expect zero extractable events from the venue's own
      site and take the sessions from the Lee Sessions guide instead. That is the
      correct outcome here, not a mis-crawl.
    notes: |
      Verified 2026-08-17: /live-entertainment/ is the venue's real music page —
      titled "Live Entertainment ... at The Oliver Plunkett, Cork" — and its
      footer gives 116 Oliver Plunkett Street, Cork, T12 P957, which is the
      source of the address above. WordPress site, no events plugin exposed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: trad/clancys
    name: Clancy's
    category: trad
    kind: venue
    status: provisional
    url: https://www.clancyscork.ie/
    area: City Centre
    address:
      street: 15-16 Princes Street
      city: Cork
      postcode: T12 V6FH
    tags: [trad, pub, free, session]
    cadence: monthly
    hints: |
      In the Lee Sessions guide three nights a week — Monday, Tuesday and
      Wednesday at 20:00 — filed there as "Clancy's, Marlborough St.", which is
      the far side of the same corner building.
      The site itself is a four-venue food and drink presentation (Arthur's Bar,
      Saints & Sinners, the Cocktail Lab, the rooftop Sky Bar) with a
      reservations flow and no listings page at all. Nothing dated will come off
      it; the sessions come from the Lee Sessions guide.
    notes: |
      Verified 2026-08-17: titled "Clancy's Cork | Explore & Experience" and
      gives 15-16 Princes Street, Cork, T12 V6FH in its footer. The address
      disagrees with the Lee Sessions guide's "Marlborough St." — the premises
      occupies the corner and both streets are plausible frontages, but a curator
      should confirm the two records are the same pub before this entry is
      promoted.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: trad/the-long-valley
    name: The Long Valley Bar
    category: trad
    kind: venue
    status: provisional
    url: https://www.thelongvalleybar.ie/events/
    homepage: https://www.thelongvalleybar.ie/
    area: City Centre
    address:
      street: 7 Winthrop Street
      city: Cork
    tags: [trad, pub, free, historic]
    cadence: monthly
    hints: |
      The weakest trad entry in this file, and included because the Lee Sessions
      names it as one of its venues and the Cork Folk Festival has programmed a
      21:00 trad session here. Its own /events/ page is a WordPress news feed
      whose newest post was October 2025 when checked, and none of the three
      visible posts is a trad session — a jazz festival lineup, Halloween, and
      the Ó Bhéal weekly poetry night upstairs in the Hayloft. The current Lee
      Sessions guide does not list it.
      So: expect nothing most of the year, and expect it to appear during the
      folk festival in early October. A run that finds no trad here is right.
      Do not follow longvalleybar.com — that domain is parked and for sale.
    notes: |
      Verified 2026-08-17: /events/ is the pub's real events page, titled "Events
      | Long Valley Bar, Wintrop Street, Cork City" (the typo is theirs). Pure
      Cork gives 7 Winthrop St. for the pub, which is the source of the street
      above. Whether this is still a session pub at all is a curation question
      rather than a URL one — the evidence for the session is the Lee Sessions
      prose and a 2019 festival listing, not anything current.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

