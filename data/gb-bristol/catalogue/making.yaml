  - id: making/bristol-wood-recycling
    name: Bristol Wood Recycling Project
    category: making
    kind: venue
    status: provisional
    url: https://www.bwrp.org.uk/what-to-expect
    homepage: https://www.bwrp.org.uk/
    area: St Philips
    tags: [ woodwork, workshops, social-enterprise, volunteering, reuse ]
    cadence: monthly
    hints: |
      Social enterprise reclaiming timber, running woodworking workshops and
      volunteer sessions. Distinguish public workshops from volunteer shifts.

      There is no events page anywhere on the site and no public course
      programme — the only thing with a schedule is the volunteer day, 08:50 to
      16:30 Monday to Friday with half-day options, so expect one recurring
      entry and not much else. Volunteering is waitlisted but yard tours are
      still offered. "Workshop" in the navigation means their joinery service
      (bespoke items, cutting, machining), not a class; do not record it as an
      event. A "Shedzone" button sits on the homepage with no page behind it.
    notes: >-
      Verified 2026-08-17: catalogued bristolwoodrecycling.org.uk no longer resolves (DNS ENOTFOUND, with and without www). The project now trades at bwrp.org.uk — page titled "Reclaimed Wood | Bristol Wood Recycling Project" giving Unit 4, William Street, St Philips BS2 0RG, which matches the catalogued area.
    addedAt: "2026-08-16"
    address:
      lat: 51.454454
      lon: -2.57392

  - id: making/bristol-bike-project
    name: The Bristol Bike Project
    category: making
    kind: venue
    status: provisional
    url: https://thebristolbikeproject.org/maintenance/bike-kitchen/
    homepage: https://thebristolbikeproject.org/
    area: Stokes Croft
    tags: [ bikes, diy, workshops, community, repair, volunteering ]
    cadence: monthly
    hints: |
      DIY bike maintenance sessions and earn-a-bike programmes. Mostly
      recurring weekly sessions rather than one-off events.

      The Bike Kitchen is the one session with a stated pattern: drop-in
      Thursdays 18:00–21:00, £7 for an hour up to £15 for three, no booking.
      Record it as recurring. Dated maintenance courses (Bicycle Basics, the
      two-day intensives) are not on the site at all — they live in an external
      Bookwhen calendar at bookwhen.com/bristolbikeproject. The /about/calendar
      page is misleadingly named: it explains the session types and carries no
      dates.
    notes: >-
      Verified 2026-08-17: page is The Bristol Bike Project CIC, Bike Kitchen section, with the Thursday evening drop-in and prices. Address on the page is 198–200 Stapleton Road BS5 0NY, which contradicts the catalogued area: Stokes Croft — needs a curator's decision, left unchanged.
    addedAt: "2026-08-16"
    address:
      lat: 51.464286
      lon: -2.570405

