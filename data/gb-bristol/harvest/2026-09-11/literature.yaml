        description: "‘Sleep thief is what the interrogator called me. I’ll never forget that. I would steal a few seconds of sleep so I could remain steadfast before them. The name stuck; I even dreamt about it, the same dream, night after night. I woke up not knowing what to do and drenched in sweat.’


