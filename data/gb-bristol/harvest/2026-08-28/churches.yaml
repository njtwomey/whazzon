        raw: "**Choral Evensong** — 5.15pm | Mon – Fri, except Thursdays (term-time only).

          3.30pm | Sun.


          Choral Evensong is usually sung by the Cathedral choir and consists of the

          singing of texts taken from the bible interspersed with prayers and

          readings. This service offers a chance to reflect and immerse yourself in

          the presence of God at the end of the day, through outstanding choral music.


          The service is held in the Nave and lasts around 40 minutes. Please check

          the Music List (there is a link at the bottom of this and every page) for

          upcoming details of upcoming services, music, and who is singing.


          The events diary also lists Choral Evensong at 17:15 on Sat 29 Aug, which

          the stated pattern does not cover.\n"
