  - id: art/martin-parr-foundation
    name: Martin Parr Foundation
    category: art
    kind: venue
    status: provisional
    url: https://www.martinparrfoundation.org/events/
    homepage: https://www.martinparrfoundation.org/
    area: Paintworks
    tags: [photography, free, exhibitions]
    cadence: monthly
    hints: |
      403s to a plain fetcher — a browser user-agent is required and returns
      200. `/events/` is the dated listing; `/exhibitions/` 302s to whichever
      show is currently up, so treat that one as a single `run` rather than a
      list. There is no `/programme/` (404) despite the nav wording.
    notes: >-
      Verified 2026-08-17 with a browser user-agent: /events/ lists 13+ dated
      items (Dark Tales exhibition party 17.09.2026, BOP 26 Photobook Festival
      and artist talks 17–18.10.2026). /visit/ confirms Paintworks, Bristol
      BS4 3AR and "Free entry", matching area and tags.
    addedAt: "2026-08-16"

  - id: art/centrespace
    name: Centrespace Gallery
    category: art
    kind: venue
