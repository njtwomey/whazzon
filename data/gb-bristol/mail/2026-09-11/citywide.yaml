       Wild Oats celebrates 45 years this Friday with Bristol bakery collaboration <https://us.list-manage.com/bLPw01ELlkA?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=M3wrrmAapV0lydX9Rq4PedEupvmJvSg2m0PH6sZQNQyw6vgz8hMr0Lo3Ad44>

      SPONSORED |  One of Bristol's longest running  independent health and wellbeing stores will host a special bakery stall outside its Lower Redland Road shop, bringing together vegan bakes from Everest Bread and gluten-free cakes, bakes and savouries from The Great Cake Company. The first 45 customers to spend £10 at the bakery stall will receive a free Wild Oats organic tote bag and free coffee, while stocks last.


      Read more <https://us.list-manage.com/bLwm33fPKBa?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=ZHLkMXHHulY1MIpLoeRQ7fNx0ktxbJXaC2JyS0vXVJgndIRq0l_p5ZaqcWla>


