    notes: "The hint is right on both counts. `/event/` serves an AJAX grid with no dates in the HTML, so the **feed route was used** — and it is a real events RSS feed with 99 items, each carrying a title, a permalink and the event page's full body copy. But the hint's warning is the important one: **no item carries an event date.** Every `pubDate` is the same publication timestamp (Mon 03 Aug 2026 17:02), and the 99 items collapse to 51 distinct titles, most of them resident acts and DJs repeated with `-NN` slug suffixes (Joe Mac appears 5 times, Jazz Improv 5, Ilbuko DJ 5).

      So this feed is a **roster, not a diary**. Four of the 51 state a weekly pattern in their own words, and those four are recorded here as recurring events with the feed's body text as `description` — which is the one thing the feed gives that nothing else does.

      **The other 47 items are deliberately not recorded.** They are act profiles, not dated listings, and minting 47 `undated` cards for resident cover bands would put rows on the site that can never retire. Their actual dated appearances are captured under music/cork-heritage-pubs, whose /whats-on/ page carries 30 Crane Lane rows with dates and times — that is the working route for this venue's diary, exactly as the hint says.

