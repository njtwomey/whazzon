schema: whazzon.catalogue/1
category: gardens
label: Gardens & Horticulture
description: >-
  Botanic gardens, nurseries, growing projects and open-garden schemes. Sharply
  seasonal: plant fairs and open days cluster in spring and early summer, and
  most of this category has nothing on at all in January.
sources:
  - id: gardens/university-botanic-garden
    name: University of Bristol Botanic Garden
    category: gardens
    kind: venue
    status: provisional
    url: https://botanic-garden.bristol.ac.uk/whats-on/
    homepage: https://botanic-garden.bristol.ac.uk/
    area: Stoke Bishop
    tags: [botanic, university, ticketed, plants, tours]
    cadence: monthly
    hints: |
      The city's main botanic garden. Runs guided tours, plant sales and
      seasonal open days alongside a permanent collection — the collection is
      `occurrence.kind: ongoing`, the events are dated.
    addedAt: "2026-08-16"

  - id: gardens/national-garden-scheme
    name: National Garden Scheme — Bristol area
    category: gardens
    kind: aggregator
    status: provisional
    url: https://ngs.org.uk/gardens/in/bristol/
    homepage: https://ngs.org.uk/
    tags: [open-gardens, charity, seasonal, private-gardens]
    cadence: monthly
    hints: |
      Private gardens opening to the public for charity, usually for a single
      afternoon. High-value and genuinely hard to find elsewhere, and already
      scoped to Bristol by this URL, so no radius filtering is needed.

      Openings are published for the whole year in spring, so capture a long
      forward horizon — a garden may open on only two days in the entire year,
      and missing the announcement means missing it altogether. Each opening is
      its own `single` event; set `venue.name` from the garden's name, since
      these are private addresses and not catalogued sources.
    addedAt: "2026-08-16"

