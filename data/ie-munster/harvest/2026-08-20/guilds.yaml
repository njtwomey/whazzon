    notes: "**The best source in this catalogue, and it is the homepage rather than /learn/ or /events/** — the catalogue has been corrected. \"Upcoming Events 2026\" is a block of prose on the front page, not a diary, so dates come with no times and often no venue detail. Two Munster events were listed and both have just passed, which is the cost of catalogueing this a week late rather than a fault in the source. Also listed, and deliberately not recorded: the Midlands Fibre Festival in Athlone on 11 October, which is the nearest large fibre event but is outside the province; a tapestry exhibition at Brú na Bóinne; and a Belfast textile exhibition. Worth knowing that this source reaches well beyond Munster. Refuses WebFetch with a 403 and answers a browser user-agent."
