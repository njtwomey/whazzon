  - id: sport/parkrun-cork
    name: parkrun — Cork area
    category: sport
    kind: aggregator
    status: provisional
    url:
      - role: listings
        url: https://www.parkrun.ie/events/events/
      - role: api
        url: https://images.parkrun.com/events.json
        note: single GeoJSON of every parkrun worldwide with coordinates; no user-agent trick needed
    tags: [ running, free, weekly, 5k, community, all-abilities, family ]
    cadence: monthly
    hints: |
      Free timed runs every Saturday morning at several sites around the city,
      plus junior 2K runs on Sundays. **Irish parkruns start at 9:30am, not
      9:00** like the UK ones.

      Model each location as one `occurrence.kind: recurring` event with the
      pattern stated ("every Saturday, 9:30"), never as a new event each week —
      otherwise this single source floods the whole site. Cadence is monthly
      because what changes is the set of locations, not the schedule.

      The human events page is a JavaScript map and carries no event names. The
      api route is the GeoJSON behind it: about 2,960 events worldwide, each
      with eventname, EventLongName, EventLocation, countrycode (42 = Ireland,
      www.parkrun.ie) and point coordinates. Filter on the coordinates to the
      configured radius; seriesid 1 is the Saturday 5K and 2 the Sunday junior
      2K. For a start time and course description fetch
      https://www.parkrun.ie/<eventname>/, which is server-rendered.

      Inside 12km of the centre at time of checking, with distances:
      tramorevalley (2.7km, Tramore Valley Park, South Link Road), glenriver
      (2.1km, Glen River Park, The Glen), ballincollig (8.9km, The Regional
      Park), and four juniors — stmaryscampus-juniors (1.9km),
      nurserydrive-juniors (2.3km, Ballinlough), clashduv-juniors (2.5km),
      ballincolligregional-juniors (9.6km). Just outside and to be excluded:
      haulbowlineisland-juniors (13.9km), cobh-juniors (14.0km),
      midletongreenway (20.8km).
    notes: >-
      Verified 2026-08-17: images.parkrun.com/events.json returns 200 and 906KB of GeoJSON with no user-agent trick, and the seven events above are in it. https://www.parkrun.ie/glenriver/ confirms "Every Saturday at 9:30am" at "Glen River Park, Glen Avenue, The Glen, Cork"; tramorevalley confirms the same time at "Tramore Valley Park, South Link Road, Cork". Two leads discarded: there is **no Blarney and no Doneraile parkrun** anywhere in the feed, and no event of either name within 25km.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

