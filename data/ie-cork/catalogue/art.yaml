  - id: art/visual-artists-ireland-cork
    name: Visual Artists Ireland — Munster/Cork listings
    category: art
    kind: aggregator
    status: provisional
    url:
      - role: listings
        url: https://visualartists.ie/event-category/munster-cork/
      - role: feed
        url: https://visualartists.ie/event-category/munster-cork/feed/
        note: only the three most recently added items, not the whole list
    homepage: https://visualartists.ie/events/
    tags: [ exhibitions, contemporary ]
    cadence: weekly
    hints: |
      The safety net for this category, and the way round two problems: it
      carries dates for galleries whose own sites are bot-walled (Lavit) or
      lagging (MTU's No.46). Listings put the venue in the title — "Summer 2026
      | Group Exhibition at Lavit Gallery" — so parse it out and set
      `venue.sourceId` where it matches a catalogued source.
      **It is a county-wide taxonomy, not a city one.** Uillinn in Skibbereen
      (67 km) and Working Artist Studios in Ballydehob both appear on it, so
      check the venue against the radius before accepting an event.
      Use the taxonomy path only: the unfiltered /events/ page is national and
      mostly Dublin, and the `?category=36` query parameter looks like a filter
      but does not filter — it returns the national list.
    notes: >-
      Verified 2026-08-17: /event-category/munster-cork/ is titled "Munster – Cork – Visual Artists Ireland" and listed eleven dated Cork items with times, spanning Cork Public Museum, Triskel Sample Project Space, Sample-Studios, Lavit Gallery, No.46 Gallery, Studio 12 and Crawford Art Gallery. The feed at the same path returned three items against the page's eleven, which is why it is a supplement rather than the primary route. Visual Artists Ireland is the national representative body (head office Dublin); no address applies to this source.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: art/cork-zine-fest
    name: Cork Zine Fest
    category: art
    kind: festival
    status: provisional
    url: https://www.corkzinefest.ie/events
    homepage: https://www.corkzinefest.ie/
    area: City Centre
    tags: [ print, independent, community ]
    cadence: quarterly
    hints: |
      Squarespace site, and **its own events page lags a year behind** — on
