    url: https://ballincollig.thereelpicture.com/whatson
    homepage: https://ballincollig.thereelpicture.com/
    area: Ballincollig
    address:
      street: Time Square
      locality: Ballincollig
      city: Cork
      postcode: P31 AE20
      lat: 51.887245
      lon: -8.588348
    tags: [ multiplex, commercial, mainstream, out-of-town ]
    cadence: daily
    hints: |
      The western suburban multiplex, IMC-owned like its Blackpool sibling and
      on the same platform: listings at /whatson, server-rendered with times,
      with /whatson/pure, /whatson/kidskorner, /whatson/autismfriendly and
      /whatson/hardofhearing as filtered views. Unknown paths serve the homepage
      rather than 404. Programme is mainstream first-run; the accessible and
      Kids Korner screenings are the distinctive part.
    notes: >-
