    verifiedAt: "2026-08-17"

  - id: making/cork-lifelong-learning-festival
    name: Cork Lifelong Learning Festival
    category: making
    kind: festival
    status: provisional
    url:
      - role: listings
        url: https://corklearningfestival.ie/
      - role: api
        url: https://opensheet.elk.sh/1wGUIb31cV57ntwrcLr9EL0OUSUQJy3wqv4yOMtD0GMQ/CLLF-DataClean-V1
        note: the Google Sheet the page renders from — 414 rows with title, address, day, time, organisation and category
    tags: [ free, community, civic, workshops, courses ]
    cadence: quarterly
    hints: |
      A week in late April, everything free, several hundred events from
      hundreds of organisations across the city — libraries, community centres,
      colleges, neighbourhood projects. Its Craft, Creative and Workshop
      categories are the largest single source of turn-up-and-make events in
      Cork's year, and much of it appears nowhere else.

      The page is a Vue app that renders nothing server-side ("Please wait:
      Loading Events..."), so fetch the JSON route instead. Fields are
      `event_by_title`, `event_address`, `day_ofweek`, `declare_day`,
      `event_time`, `event_organisation`, `categorysearch`. Two traps: the first
      row is a header-ish row whose title is every event name concatenated —
      skip it — and `date` is d/m/yyyy with inconsistent zero-padding and some
      rows blank, so prefer `declare_day` plus the festival's own week.

      Events are all over the city and county (Blarney, Glanmire, Ballincollig,
      Carrigtwohill, Togher, Hollyhill), so set `venue` from `event_address`
      rather than letting anything inherit a festival address.
    notes: >-
      Verified 2026-08-17: corklearningfestival.ie is the programme site and its banner announces 22–29 April 2026. The JSON endpoint is the one the live page actually reads (four earlier sheet URLs are commented out in the page source; this is the uncommented one) and returned 414 rows.

      Caveat for a curator: those rows are the **April 2024** programme — the sheet had not been republished when checked, four months after the 2026 festival. Expect it to be stale outside the spring, and re-check in April. corklearningfestival.ie is the right site; corklearningcity.ie/lifelong-learning-festival/ is the parent Cork Learning City page, and the plausible-looking corklifelonglearningfestival.com is a parked domain serving nothing but its own name.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/crni-reuse-events
    name: Community Resources Network Ireland — reuse & repair events
    category: making
    kind: aggregator
    status: provisional
    url:
      - role: listings
        url: https://crni.ie/events/
      - role: api
        url: https://crni.ie/wp-json/tribe/events/v1/events?per_page=50
        note: 471 events over 10 pages; venue name and city on each, so filter to Cork
      - role: ics
        url: https://crni.ie/events/?ical=1
    homepage: https://crni.ie/
    tags: [ repair, reuse, community, diy ]
    cadence: weekly
    hints: |
      National network for reuse, repair and circular-economy organisations, and
      the only aggregator found that reliably carries Cork's repair sessions —
      Cork Community Bikes' Saturday Fix Your Bike appears in it week by week.

      Use the API route: the listings page hides its filters behind JavaScript
      and defaults to a "12 events found" window. The API gives venue and city
      per event, which is what makes the Cork filter possible; be aware the
      `city` field is often blank even when the venue name is a Cork one, so
      match on venue as well.

      It is national, so most of what comes back is Limerick and Dublin
      (Tait House sewing classes, Tog Hackerspace maker nights) — discard those.
      Nearly everything in it is a weekly recurring session expanded into one
      event per week, so fold it back into a recurring pattern rather than
      recording fifty rows.
    notes: >-
      Verified 2026-08-17: The Events Calendar site, API and iCal routes both answer, and the first page of events contained two Cork Community Bikes sessions dated 22 and 29 August 2026.

      Checked and rejected as alternatives: repairmystuff.ie is a directory of repair *businesses* with no events at all, and menssheds.ie — which was the productive route in Bristol — renders its shed finder entirely client-side with no Cork string in the HTML, has no wpgmza JSON endpoint, and its /events/ page says "No Events" with no Cork location in the filter list.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/eventbrite-cork-crafts
    name: Eventbrite — Cork crafts
    category: making
    kind: aggregator
    status: provisional
    url: https://www.eventbrite.ie/d/ireland--cork/crafts/
    homepage: https://www.eventbrite.ie/
    tags: [ craft, workshops ]
    cadence: weekly
    hints: |
      The safety net for this category. Small Cork makers who sell a one-off
      workshop and never list it anywhere else put it on Eventbrite, and it is
      where several Cork Craft Month sessions surfaced that were not in the Cork
      Craft & Design collection.

      Most listings name the neighbourhood rather than a venue ("Blackpool ·
      Arts at Civic Trust House"), and near-term dates render as "Saturday at
      2:00 PM" with no calendar date, so resolve those against the fetch date.
      Titles frequently carry the promoting festival in brackets — "(August
      Craft Month)" — which is worth keeping as a tag, not stripping.

      /d/ireland--cork/craft-workshop/ is a second, differently-populated slice
      of the same index and worth a look when /crafts/ is thin.
    notes: >-
      Verified 2026-08-17: the Cork crafts index returned real dated Cork events — "Make your own puppet (August Craft Month) @ the Civic Trust House" and "Puppet Café" on 29 August 2026, both in Blackpool. Kept in `making` because it is the craft slice specifically; if a citywide category catalogues Eventbrite as a whole, this stays as the narrower query rather than being merged.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
