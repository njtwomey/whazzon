    notes: "The GeoJSON feed from the hints is public and needs no user-agent trick: 2,963 events

      worldwide. Filtered on the point coordinates against the 12km radius in

      configs/bristol-uk.yaml, and all seven Bristol-area events named in the hints are still

      present under the same slugs.


      Then opened all seven event pages on www.parkrun.org.uk (which does need a browser

      user-agent) — seven extra fetches, taken deliberately. The GeoJSON carries no start time at

      all, so without them there would be no time on any of these cards, and seven pages is well

      inside the dozen §3 allows for a small programme. Those pages are also where `description`

      comes from; the text is parkrun's own standard Q&A, trimmed of navigation and the volunteer

      roll-call.


      Each location is one `recurring` event with the pattern in parkrun's own words, never one

      row per Saturday. Every event carries `venue` because this source is an aggregator rather

      than a place — the parks are catalogued nowhere else, so `venue.name` plus the address and

      the feed's own coordinates are used.


      One thing for stage 1: Chipping Sodbury is 16.6km from the configured centre, outside the

      12km radius, so it is arguably not a Bristol event at all. It is recorded because the hints

      name it explicitly. The others are all comfortably inside — Eastville 3.3km, Ashton Court

      3.8km, Blaise Castle 6.5km, Pomphrey Hill 8.1km, Little Stoke 8.6km.


      Also worth a hint: the junior pages differ in wording from the Saturday ones (\"It is held

      every Sunday\", \"every week on a Sunday\") and littlestoke-juniors has a mangled <title>

      reading \"Littlestoke-juniors parkrun\"; the feed's EventLongName, \"Little Stoke junior

      parkrun\", is the name used here."
