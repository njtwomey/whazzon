    notes: "First harvest of this source, and the catalogue hint holds up: /whats-on/ answers 200 and is the real listing. Four fetches in all — /whats-on/, the .ics export the page itself links, /whats-on/the-grand-organ-festival/ and /worship/daily-services/.


      The site runs The Events Calendar (Tribe). The what's-on page prints a \"Subscribe to calendar / Export .ics file\" link to https://bristol-cathedral.co.uk/cathedral-events/list/?shortcode=b5e78f03&ical=1 which returns the forward diary with full body text and image URLs in one fetch. It is capped at 30 VEVENTs, which in practice is only eight days (17 Aug – 4 Sep), so it is a cheap route to the near horizon but not to the whole year. A stage 1 `feed` route plus a hint about the 30-event cap would pay for itself here. There is also a webcal:// form of the same URL.


      The diary is dominated by expanded daily-service instances: across 29 Aug – 4 Sep the feed carries roughly twenty rows of Morning Prayer, Lunchtime Eucharist, Evening Prayer, Holy Communion (BCP), Cathedral Eucharist and the Lord Mayor's Chapel Sunday service. Per the run brief I have deliberately not recorded those as events. The one service kept is Choral Evensong, as a single `recurring` row, because it is billed and attended as a musical event and the catalogue hint asks for exactly that. A human may want to settle whether even that belongs.


      Note a genuine conflict the cathedral has with itself: /worship/daily-services/ states Choral Evensong is \"5.15pm | Mon – Fri, except Thursdays (term-time only)\" with Evening Prayer on Saturdays, but the diary lists Choral Evensong at 17:15 on Sat 29 Aug. The recurring row carries the stated pattern in the cathedral's own words and is marked `confidence: medium` for that reason.


      Bank holiday weekend: nothing here is billed as a bank holiday event, so no `bank-holiday` tag is used. What the diary does print — recorded, not inferred — is that the cathedral keeps All God's Children open 10:00–16:00 on Mon 31 August, that the Tower Tour runs on Sat 29 August only and not on the Sunday or the Monday, and that there is no 10:00–16:00 exhibition row at all on Sun 30 August. Monday 31 August has Evening Prayer at 17:15 rather than Choral Evensong, but Thursday 3 September does too, so that is the choir's ordinary week rather than a bank holiday alteration. No altered opening hours are printed anywhere.


      Crafty Cathedral, the free drop-in family craft morning, is listed only on Thu 20 and Thu 27 August, both now past, so it is not recorded. The WOOFYT listing says Crafty Cathedral will run alongside it on 28 October; no intervening dates are printed.


      Truncation: the ten Grand Organ Festival rows each repeat the same five-paragraph series blurb verbatim. `raw` carries each row's own lines plus the opening paragraph; the remaining four identical paragraphs are not duplicated into ten events. No individual event pages were opened, so no `description` is set. The far horizon beyond Tue 15 Dec was not pursued."
