        raw: "**Artists Film International 2026** — Triskel Arts Centre, Tobin St. Every Tuesday @ 10:00 am. FREE. Event page dates: \"Tues 11, Wed 12, Thurs 13 / Tues 18, Wed 19, Thurs 20 / Tues 25, Wed 26, Thurs 27\", 10:00 - 15:30 each day.\n"
        summary: "Crawford Art Gallery's strand of Artists Film International runs on a loop at Triskel three days a week through August — free, drop in, films change weekly."
        description: "Crawford Art Gallery in partnership with Triskel Arts Centre presents Artists Film International 2026 (AFI) under the theme A Kind of Power.


          Bringing together artists and partner organisations from across the globe, this year's edition explores how systems of power shape the act of looking and the conditions under which we are seen.


          This year Crawford Art Gallery has selected artist Thaís Muniz to present her short film The Kite Ballet. All films will be presented on a loop throughout the day in Triskel Arts Centre. The AFI programme will be presented on a loop (approx. 45 minutes) between 10:00 - 15:30 each day, with films changing weekly.


          Drop in. No booking required.


          A public talk with artist Thaís Muniz and Dr Eve Olney will take place on Thursday 27 August at 13:00 - 13:50 at Triskel Arts Centre.


          Dates: Throughout the month of August: Tues 11, Wed 12, Thurs 13; Tues 18, Wed 19, Thurs 20; Tues 25, Wed 26, Thurs 27. 10:00 - 15:30 each day. Free screenings. Drop in. No booking required.\n"
        confidence: "high"
