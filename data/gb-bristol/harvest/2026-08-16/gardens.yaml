    notes: "No events recorded, and the reason matters for this source. The Bristol page lists 12 gardens (1 Sunnyside BS9, 30 Kingsholm Road BS10, 4 Haytor Park BS9, 81 Coombe Lane BS9, 87 Hallen Road BS10, 9 Codrington Road BS7, Algars Mill BS37, Camers BS37, Charlton Road Allotments BS10, Doynton House BS30, Greystones BS9, Japanese Garden Bristol BS4) but prints no opening dates, times or admission on the listing page — only a caveat that \"some may have completed their openings for the year\". Dates live on each garden's own page, one fetch each. Three further routes were tried and none carried dates either: /find-a-garden/?search=Bristol returns \"no results\" (it is a form), /gardens-open-this-week-south-west/ is a county hub with no listings, and findagarden.ngs.org.uk is a JavaScript shell that renders nothing server-side. /gardens/near/bristol/ says there is now just \"1 Private Garden to visit in Bristol\" — Dormers, Stowey Bottom, Bishop Sutton BS39 5TL — and that garden's own page states \"This garden has now completed its National Garden Scheme openings for this year.\" Read together, the Bristol NGS season is over for 2026 and next year's dates are not yet published; the hint's \"openings published for the whole year in spring\" means this source is worth re-harvesting from roughly February 2027, when a single fetch should again yield a year of dated openings."
