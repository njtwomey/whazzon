    notes: "The Headfirst venue page is the only listing, as the hint says, and it is server-rendered: 17 dated events from 22 Aug to 31 Oct 2026, all recorded. No `venue` is set on any event — these all happen in the arches, and the arches are this source, so the catalogue supplies name, area and address at compile time. The programme is promoter-led and confirms the hint: club nights sit next to improv, cabaret and a folk fair, so the tags do the classifying rather than the category. Two gaps in the index, neither guessed at: it prints no start times and no prices, so `startTime` and `price` are omitted throughout. Three rows form one weekend, Apoctoberfest on 16-17 Oct — the weekend pass is recorded as the festival `run` and the two individual shows inside it as their own dates, because the page lists all three separately. That pass and Apocalypse Players are marked SOLD OUT in the listing. The programme is 17 rows, past the dozen threshold, so no event pages were opened for `description` even though the index is thin. One listing, CLUB LOVE MEMBERS PARTY, has a broken link on the page — its anchor points at the promotional image rather than the event — so `url` is omitted rather than reconstructed."
