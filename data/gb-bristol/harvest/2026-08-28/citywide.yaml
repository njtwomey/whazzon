    notes: "The note from 2026-08-17 still holds: /events is the right page and the catalogued /whats-on path is

      gone. It is server-rendered, sorted ascending by date, twenty per page, with title, date range,

      venue, thumbnail, a one-clause teaser and a deep link on every row.


      Page 1 runs 25 August to 30 November 2026, so this weekend is inside it and nothing in the window

      was truncated. Page 2 was not fetched: it begins after 30 November and is far future, which the run

      brief permits dropping. All twenty rows from page 1 are recorded.


      This source is thin on the bank holiday — it lists only three events touching 29-31 August (BLOC's

      We Will Rock You finishing Saturday, Forwards, and a Hippodrome theatre tour) and nothing at all on

      the Monday. It is a Hippodrome-and-arena-shows aggregator more than a citywide diary; nineteen of

      twenty rows are at eight large venues.


      Two event pages were opened, both this weekend's per the brief's instruction to spend those fetches

      on 29-31 August first: the Hippodrome tour (gives the 10am start, the two-hour length, the £26 price

      and the stair-access warning, none of which the index carried) and Forwards (gives the full

      day-by-day lineup). Their text is in `description`. No other event pages were opened, so no other

      row has one.


      No bank-holiday roundup exists here. /news was checked and is announcements and reviews of

      individual shows, not a things-to-do guide.


      Catalogue handover: the Mull Historical Society row's own link is

      /event/https-thewardrobetheatre-com-whats-on-events-page-1-search-order-asc-order-by — 365 Bristol

      has slugified a pasted URL into their permalink. It is recorded verbatim per the prompt, since

      guessing a corrected slug would be worse, but it is worth knowing it looks broken.


      Electric Bristol (formerly SWX) and Prospect Bristol are both used repeatedly here and neither is in

      the catalogue under those names; music/swx exists but the site says SWX has been renamed. That is a

      stage 1 decision, not one for this run.\n"
