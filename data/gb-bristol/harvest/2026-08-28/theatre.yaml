    notes: "Twenty-one events, 3 Sep to 31 Oct, taken whole — nothing truncated. **Nothing is listed on 29, 30 or 31 August**: the arches are dark across the whole bank holiday weekend, and the page's earliest row is Thu 3 Sep. Confirmed by re-fetching the page with curl and searching it directly; the word \"bank holiday\" does not appear anywhere on it. As the catalogue notes, this is a promoter-led venue page rather than a house programme, so the mix runs from post-apocalyptic improv to hardcore techno and each row is tagged on its own terms. Headfirst prints no times and no prices on the venue page, only a \"Tickets\" or \"Sold out\" flag, and it does not print dates in the card text either — the date is in the row's href, which encodes a weekday, and all twenty-one check out against 2026. Card titles carry SEO suffixes (\"... tickets\", \"... in Bristol\") which are stripped here; the genre words under each title are the site's own and are the source of most tags."
