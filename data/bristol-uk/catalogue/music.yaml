  - id: music/the-black-swan
    name: The Black Swan
    category: music
    kind: venue
    status: provisional
    url: https://www.headfirstbristol.co.uk/whats-on/the-black-swan
    area: Easton
    tags: [club, dub, drum-and-bass, independent]
    cadence: weekly
    hints: |
      Underground dance music — dub, drum and bass — in a large pub with two club
      rooms. The URL points at Headfirst because the venue has no website of its
      own: theblackswanbristol.com does not resolve and it programmes via
      Instagram, Facebook and ticket agents. No `homepage` is set for that reason.
      Headfirst files this one under club listings rather than gigs, and it was
      empty when checked, so cross-check Skiddle if a run finds nothing.
    notes: |
      Verified 2026-08-17: theblackswanbristol.com is an NXDOMAIN, and the near-miss domains are other businesses —
      theblackswan.co.uk is a pub in Rixton near Warrington, blackswan.club is a parking lander. The Headfirst page is
      the right venue: "The Black Swan", 438 Stapleton Rd, BS5 6NR, which matches area Easton. It listed no dates on the
      day, so identity is confirmed but the programme was not observable.
    addedAt: "2026-08-16"

  - id: music/propyard
    name: Propyard
    category: music
    kind: venue
    status: closed
    url: https://www.headfirstbristol.co.uk/whats-on/propyard
    area: St Philips
    tags: [warehouse, club, events-space]
    cadence: weekly
    hints: |
      Closed — do not harvest. The URL is moved off the lapsed propyard.co.uk
      domain only so that nothing in the catalogue points at the squatter; the
      Headfirst page is a correct but inert record of the venue.
    notes: |
      Marked closed 2026-08-17. propyard.co.uk has lapsed and now 301s to mdcdatum.org.uk, headed "Non GamStop Casinos
      2026" — the same casino-affiliate network that took croftersrights.co.uk, and another 200 that check-urls would
      pass. Propyard itself shut in 2024 after allegations it had not paid staff, suppliers and artists. The building
      was taken over by promoter AMAAD and reopened as The Prospect Building, theprospectbuilding.com, at 45 Feeder Rd,
      BS2 0SE — the same site as the Headfirst address 39-46 Feeder Rd — with a live programme (AFI 27 Aug, Jack
      White 28 Aug 2026). That successor is a different organisation, so it wants a new source, not a rename here.
    addedAt: "2026-08-16"

