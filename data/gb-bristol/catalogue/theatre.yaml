  - id: theatre/wardrobe-theatre
    name: The Wardrobe Theatre
    category: theatre
    kind: venue
    status: provisional
    url: https://thewardrobetheatre.com/
    area: Old Market
    tags: [ independent, fringe, comedy, new-work ]
    cadence: weekly
    hints: |
      Small independent venue above a pub. Heavy crossover with comedy and
      cabaret — tag accordingly rather than assuming everything is theatre.
      Famous for irreverent alternative Christmas shows.

      Counter-intuitively the homepage is the listings page: it server-renders
      the current shows with dates. /whats-on/ returns 200 but is an empty shell
      — 94KB of chrome with no show links and no dates in it — so do not follow
      the nav there. Individual shows live at /shows/<slug>/.
    notes: >-
      Verified 2026-08-17: header reads "The Wardrobe Theatre", address given as The Old Market Assembly, 25 West Street, Old Market, BS2 0DF, which agrees with area: Old Market. Five dated shows server-rendered on the homepage, e.g. Action Hero: A Song & Dance, Weds 9th – Sat 12th Sept 2026.
    addedAt: "2026-08-16"
    address:
      lat: 51.45708
      lon: -2.579296

