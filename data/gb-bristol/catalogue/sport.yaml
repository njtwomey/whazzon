  - id: sport/bristol-grand-prix
    name: Bristol Grand Prix
    category: sport
    kind: festival
    status: closed
    url: https://www.bristolgrandprix.co.uk/
    area: City Centre
    tags: [cycling, racing, free, spectator, road-closures, annual]
    cadence: quarterly
    notes: >-
      Closed 2026-08-17. City-centre criterium racing organised by Le Sportif Ltd; ran 2015–2018. The site
