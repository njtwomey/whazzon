    notes: "Squarespace events page, no pagination — 33 event blocks in total, of which the site itself marks 30 as past and 3 as upcoming. All three upcoming shows are recorded here.

      Nothing at all is on over the bank holiday weekend. The gallery's week-long hires run back to back, and the sequence has a gap exactly across it: Yokai closed on Wednesday 26 August and the next hire, Searching for the Future, opens on Tuesday 1 September. So 27–31 August is genuinely dark, not a coverage failure. The site prints no bank holiday notice of any kind.

      Each listing carries its own opening hours and private view time, and these do not always agree with the block's structured dates: Crossing is stamped 11–16 September but its own copy says \"Exhibition Dates: Saturday 12th September - Wednesday 16th September, PV: Friday 11th September\", and Connections Through Wood is stamped 18–30 September against copy reading \"Saturday 19th September - Wednesday 30th September, PV: Friday 18th September\". The structured dates are recorded as the run (they include the private view evening) and the venue's own wording is kept verbatim in `timesText` and `raw`.

      The index carries a full excerpt per show, so no event pages were opened. Every date prints a weekday and all of them check out for 2026."
