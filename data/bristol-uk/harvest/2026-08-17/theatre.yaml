    notes: "Harvested with a browser user-agent, as the hint says — Ticket Tailor 403s a plain fetcher but serves the full box office to a Chrome UA. Server-rendered and complete: 53 listings from 19 Aug 2026 to 7 Nov 2027, all recorded, none truncated. No gift vouchers appeared in the listings themselves (the shop link is a nav item), so nothing was skipped on that ground. Two things the index does not carry: prices (no figure is printed on any row, so `price` is omitted throughout rather than guessed) and per-event descriptions — the programme is far larger than a dozen, so no event pages were opened and no `description` is set. Every row prints a weekday and a year, and all 53 weekdays check out, hence `confidence: high` except where noted. Two rows need a human eye. \"The Golden Tower and Dear Inner Child\" says \"SOLD OUT! Join waiting list\" and is recorded `status: sold-out`; \"Michael Akadiri: Don't Call Me Uncle!\" shows only \"Join waiting list\" without the words sold out, so it is left `scheduled` with the button text in `raw` rather than inferring. Separately, \"Single Use by Verity Mullan\" is the one row with no venue line at all — every other row prints \"Alma Tavern and Theatre, BS82HY\" — so it may be elsewhere; no `venue` is set because the page names none, and confidence is medium. One row prints the venue as \"Alma Tavern and Theatre`\" with a stray backtick, which is a typo on their side, not ours."
