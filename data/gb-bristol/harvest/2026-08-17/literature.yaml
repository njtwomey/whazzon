        description: "**Join us for a fantastic evening with Phil Melanson to discuss his brilliant debut, *Florenzer:* a queer, historical novel that paints a richly imagined portrait of a city that paints over its own decay; where an untested artist, not yet marked by greatness, will dare to follow his most unholy desires.**


