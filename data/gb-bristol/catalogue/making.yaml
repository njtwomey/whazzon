    url: https://www.bristolguild.co.uk/
    area: Park Street
    tags: [ craft, gallery, shop, exhibitions, applied-art ]
    cadence: monthly
    notes: >-
      Craft shop and gallery on Park Street with periodic exhibitions. Closed: the Guild shut on 30 May 2024 after 116 years at 68–70 Park Street, and the company went into liquidation. bristolguild.co.uk now serves a "Launching Soon" placeholder with a contact form and no address, business description or listings — the 200 it returns to check-urls means nothing. Verified 2026-08-17; kept as closed so it is not re-proposed. If the placeholder ever becomes a relaunched Guild, this needs re-checking rather than assuming continuity.
