        raw: "**Opening Hours — Weekly Hours**


          Monday - Saturday : 8.30 a.m. - 6:00 p.m.


          The Market is closed every Sunday and Bank Holidays


          (The subsite's FAQ and Contact Us pages both state 8.00 am instead:

          \"The English Market is open to the public from 8.00 am to 6.00 pm,

          Monday to Saturday. It is closed on Sundays and Bank Holidays. Some

          traders may operate different trading hours within those hours.\")\n"
        summary: "Cork's covered municipal market, trading on the same site since 1788 and

          the thing the city points at when asked what it is: two aisles of

          fishmongers, butchers, cheesemongers, bakers and spice stalls under one

          roof, open six mornings a week, with cafés and food counters upstairs.\n"
        description: "\"Discover a vibrant and diverse marketplace, where an eclectic mix of

          traders come together. Nestled alongside long-standing family-run stalls

          passed down through generations, our market offers the best in local

          produce. From fresh meats and fish to herbs, spices, fruits, vegetables,

          sauces, oils, chocolates, cakes, cheeses, and pastas — there's something

          to suit all taste buds and occasions.\"


          \"The market offers visitors unique finds including crockery, T-shirts,

          novelty items, clothing alterations, and local art. This diverse

          selection creates a lively atmosphere that reflects the market's

          character and charm.\"


          \"Immerse yourself in the sights, sounds, and aromas of the market, then

          relax and savor the flavors at our welcoming cafés, delis, and food

          stalls.\"


          Traders are grouped as: Bakery & Confectionery; Food for Now;

          Delicatessen; Fish & Seafood; Fruit and Veg; Meat, Poultry and Game;

          Spices, Preserves and Condiments; Specialities; Wine.


          **Where it is.** \"The English Market is located in Cork city centre with

          its main entrances on Grand Parade, and on Princes Street, with further

          smaller entrances off Oliver Plunkett Street and Patrick Street.\"


          **Visiting.** \"To ensure that tourists and casual visitors to the English

          Market can get the maximum from their visit, tour groups are encouraged

          to come outside of peak trading hours. In general, the busier trading

          hours of 11.00 am – 4.30 pm daily should be avoided (Friday and Saturday

          can be particularly hectic).\" Tour groups are asked to register in

          advance. Public toilet facilities are limited to one coin-operated toilet

          near the fish aisle.


          **Why the name.** \"The Market was created in 1788 by the Protestant or

          'English' corporation that controlled the city until 1841... When local

          government was reformed in 1840, and the representatives of the city's

          Catholic, 'Irish' majority took over, they established another covered

          food market, St. Peter's (now the Bodega@St Peter's Market) which became

          known as the 'Irish Market'.\"


          **Who runs it.** \"Cork City Council owns the English Market and leases

          the stalls to traders. Cork City Council contracts with Lisney who look

          after the day-to-day running of the market.\"


          Payment: \"Some traders accept credit cards and laser cards, however many

          traders deal on a cash-only basis.\"\n"
        confidence: "medium"
    notes: "No diary anywhere on the subsite, exactly as the catalogue hint says, so this is one recurring event and has not been expanded into trading days. Four pages were opened and all four are the market's own council subsite: /opening-hours/ (recorded above as fetch.url), /information/information/ (FAQs), /contact-us/ and /market-traders/, plus /information/visiting-the-market/ and the subsite root for the hero image — description is assembled from those and nothing in it is invented. The contradiction the catalogue flags is confirmed verbatim today and I have not tried to settle it: /opening-hours/ prints \"Monday - Saturday : 8.30 a.m. - 6:00 p.m.\" while /information/information/ and /contact-us/ both print \"from 8.00 am to 6.00 pm, Monday to Saturday\". The 8.30 above is the page this observation's fetch.url points at; the 8.00 wording is kept in raw. All three agree on the 6pm close, on Monday–Saturday, and on Sunday and bank holiday closure, so confidence is medium only on the opening half-hour. The peak trading window of \"11.00 am – 4.30 pm daily\" is visitor guidance, not an occurrence, and is recorded in description rather than as an event. No image exists on /opening-hours/ (only logos), so the hero from the subsite root is used; it was checked and returns 200. price.free is a deliberate judgement — the market is walk-in and no admission charge is quoted on any page read."
