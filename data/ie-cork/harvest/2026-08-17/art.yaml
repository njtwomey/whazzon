        raw: "**Artists Film International | 2026** — 11-27 August, Triskel Arts

          Centre, Cork.


          Crawford Art Gallery partners with Triskel Arts Centre to present

          Artists Film International 2026 on the theme *A Kind of Power*.\n"
        summary: "Crawford's annual international artists' film programme, shown at Triskel while the gallery itself is closed. This year's theme is \"A Kind of Power\", and the selection rotates weekly across three three-day blocks — free, drop-in, looping through the day."
        description: "Crawford Art Gallery partners with Triskel Arts Centre to present

          Artists Film International 2026, centred on the theme \"A Kind of

          Power\". The curated selection examines \"how systems of power shape the

          act of looking and the conditions under which we are seen\".


          Films rotate weekly across three periods:


          - **11-13 August:** Video News, Alessandra Ferrini, Ira Goryainova,

          \  Malik Irtiza, Marte Hodne Haugen

          - **18-21 August:** Razia Akbari, Ann Oren, Amaal Said, Kiyo Gutiérrez

          - **25-27 August:** Thaís Muniz (*The Kite Ballet*, selected by

          \  Crawford), Mila Turajlić, Aqsa Arif


          A public talk with artist Thaís Muniz and Dr Eve Olney, moderated by

          curator Dawn Williams, takes place Thursday 27 August, 13:00-13:50 at

          Triskel Arts Centre.\n"
        confidence: "high"
