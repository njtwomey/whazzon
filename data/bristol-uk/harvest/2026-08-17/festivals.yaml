    notes: "One fetch. The index prints no dates whatsoever — that is the whole result. It labels two editions \"Upcoming\", Weston Wallz 2026 and Upfest 2026, both of which have in fact already happened, above an archive running back to 2016, so the Upcoming heading is stale rather than informative. **Weston Wallz 2026 is not recorded**: it takes place in Weston-super-Mare, outside this location. The homepage was deliberately not fetched, because the hint says its banner carries whichever edition is next and that is currently Weston Wallz, which is nothing this file may record. /festival/upfest-2026/ was also not opened — the catalogue already records that edition as 15-31 May 2026, which has passed, and re-reading it would not tell us anything about the next Bristol edition. Upfest is biennial, so the next Bristol edition is expected in 2028; the site names no such edition and carries no \"dates to be announced\" wording, which is why this is `undated` rather than a guessed 2028 run."
