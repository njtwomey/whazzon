schema: whazzon.catalogue/1
category: food-drink
label: Food & Drink
description: >-
  Food halls, breweries and taprooms with public event programmes. Only sources that actually programme events belong here — a restaurant with no events is not a source, however good it is.
sources:
  - id: food-drink/wapping-wharf
    name: Wapping Wharf & Cargo
    category: food-drink
    kind: venue
    status: provisional
    url: https://www.wappingwharf.co.uk/latest-news
    homepage: https://www.wappingwharf.co.uk/
    area: Wapping Wharf
    tags: [ food-hall, independent, harbourside, markets ]
    cadence: weekly
    hints: |
      Container-based independent food and retail quarter. Events are markets,
      tastings and seasonal happenings rather than a listed programme.

      There is no What's On page anywhere on the site — the whole navigation is
      Eat Drink Shop / Plan Your Visit / Latest News / Community / Contact /
      Live / Work. Events surface only as news posts, so read the news feed and
      take dates out of the post body. Posts are not retired once they have
      happened and several print a weekday and day with no year, so check the
      weekday against the year before recording anything.
    notes: >-
      Verified 2026-08-17: the catalogued wappingwharf.com is parked and for sale (302s to hugedomains.com). wappingwharf.co.uk is the real development, not another squatter — footer address "Wapping Road, Bristol, BS1 4RW" matches the catalogued area, contact is info@wappingwharfbristol.co.uk, socials are @WappingWharfBS1 and @wappingwharf, and the copy reads "EAT, DRINK, SHOP, LIVE AT WAPPING WHARF". It has no events page, so /latest-news is the closest thing: it is where the 10th anniversary celebration (Friday 3 July) was announced.
    addedAt: "2026-08-16"

  - id: food-drink/left-handed-giant
    name: Left Handed Giant Brewpub
    category: food-drink
    kind: venue
    status: provisional
    url: https://lefthandedgiant.com/collections/brewery-tours-and-events
    homepage: https://lefthandedgiant.com/
    area: Finzels Reach
    tags: [ brewery, taproom, independent, beer ]
    cadence: monthly
    hints: |
      The programme is a Shopify collection of ticketed tour products, not a
      listings page. Product titles carry only the month ("August 2026: LHG
      Brewpub Brewery Tour") and the collection page prints no date or start
      time, so open the product page for the actual date rather than recording
      the tour as undated. Gift cards and vouchers in the collection are not
      events.
    notes: >-
      Verified 2026-08-17: /collections/brewery-tours-and-events is Left Handed Giant's own Shopify store — footer address "St Philips Brewery, Unit 3 Wadehurst Industrial Estate, St Philips Road, Bristol BS2 0JE". The catalogued homepage carries no listings. The collection held two items: the £17.50 brewpub tour and a sold-out gift card.
    addedAt: "2026-08-16"
    address:
      lat: 51.45443
      lon: -2.589391

