    notes: "Catalogued URL is right and served the whole programme: 16 products, no pagination, dated 24/08 to 30/11 2026. The collection page itself is very thin — it prints a title, a \"From £x\" and nothing else: no times, no images, no blurb. Rather than open 16 product pages I read the collection's own Shopify feed, /collections/events/products.json?limit=250, in a single fetch; that is where every description, image, variant price and start time here comes from, so it is the product pages' own copy rather than 16 separate fetches. Worth a hint. Titles carry the date as dd/mm as the hints say; I have moved that into occurrence and dropped the \"Event dd/mm:\" prefix (and one \"[SOLD OUT: Waitlist Only]\" label) from title, keeping the printed string verbatim in raw. Three title/date discrepancies a human should know about. (1) Translated Fiction Book Club \"27/08\": the body text says \"Thursday 28th of August\", but 27 August 2026 is the Thursday and 28 August is a Friday, so the day number in the body looks like the typo and the row is dated 27 August at confidence medium. (2) ACOTAR 6 Release Party is titled 27/10 and its body says \"Tuesday 27th of October\" (which checks out) while its URL handle still reads event-26-10 — dated 27 October. (3) Romance Book Club is titled 30/11 with a body reading \"Monday 30th of November\" (checks out) against a handle of romance-book-club-23-11 — dated 30 November. That release party is also the one event here not at the shop: its body opens \"This event is not at the bookshop, it's at Kask2 on Cheltenham Road\", so venue is set to Kask2, 243 Cheltenham Road BS6 5QP, which is not itself catalogued. The summer reading challenge is the one row without a stated date: it gives no start, and its end is taken from \"collect your reward on Saturday 29th of August\" (29 August 2026 is indeed a Saturday), hence a run with no start at confidence medium. Book clubs are recorded as the single dated sittings the shop lists, not as recurring patterns, because each is sold as its own product with its own book. Separately, and only as an observation for stage 1: every product gives the address as 47 Henleaze Road BS9 4JU, matching the note already on the catalogue entry that the \"Westbury Park\" area looks out of date."
