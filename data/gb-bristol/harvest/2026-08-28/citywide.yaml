    notes: "DISCOVERED ROUTE, for stage 1 to consider rather than for me to write down: the browse page renders no usable event list, but `window.__SERVER_DATA__` in its HTML is a complete JSON payload. On the catalogued URL it holds ten themed buckets of eight (`buckets[].events`); on a filtered browse path it holds `search_data.events.results`, 20 rows per page, each with name, start_date, start_time, primary_venue with a full postal address, image url, summary and canonical url. That is the whole card in one fetch and it is what this observation is extracted from. `search_data.events.pagination` reports the true total, and `?page=` and `?start_date=&end_date=` are both honoured — the date parameters matter because Eventbrite's \"this weekend\" means Friday to Sunday and silently excludes the bank holiday Monday.


      WHAT WAS READ: 14 payloads. The catalogued index; /events--this-weekend/ pages 1-9 (covering 28-30 August); and /events/?start_date=2026-08-31&end_date=2026-08-31 pages 1-4 for the bank holiday Monday. 308 rows in total.


      WHAT WAS DISCARDED, so the coverage claim is honest: 209 of those 308 rows, about two thirds. The large majority of that is geography rather than judgement — 168 rows, 55% of everything read, are simply not in Bristol. Eventbrite's \"Bristol\" search reaches Bath, Cardiff, Newport, Clevedon, Weston-super-Mare, Frome, Glastonbury, Melksham and Tetbury, and rows were kept only where the venue postcode is a Bristol district (BS1-BS16) or the venue is already in our catalogue, which is what keeps Ashton Court Estate (BS41) in. Another 27 were dropped as not cultural events: online webinars and professional or clinical training, conferences, networking, dating and singles commerce, and administrative bookings such as SENDIAS telephone appointments. 8 were online-only and 6 fell outside the 28 August - 31 October window. That leaves 99 rows, 88 after deduplicating the same event listed under both .co.uk and .com.


      One class of discard is a judgement worth recording: the self-guided treasure hunts (\"Discover Bristol!\", \"Bristol Fun Puzzle Treasure Hunt\", \"Bristol Fun Team Building\") are an evergreen product sold for every date. They surfaced on both 28 and 31 August with a 07:00 start that is a booking window rather than a time, and they state no pattern in words that would let them be recorded as `recurring`. A dated row would assert a one-off that does not exist, so they are left out rather than written down wrong.


      WHERE I STOPPED AND WHY. The Monday is finished: the per-page yield of new Bristol keepers ran 9, 1, 0 across pages 2-4, and page 4 returned 20 rows of which every single one was outside Bristol. The weekend was stopped at page 9 of 49 on the same rule rather than a page budget — new keepers per page ran 8, 0, 3, 11, 5, 4, 3 across pages 3-9, and by pages 8 and 9 what was still arriving was weekly wellness classes and pub nights of a kind already represented several times over. 40 weekend pages are unread and that is a real limit: 988 raw rows exist for 28-30 August, so this is not literally every listing in the window. It is the cultural Bristol weekend covered rather than sampled, which is the thing the coverage rule is protecting.


      EIGHT ROWS ARE `recurring` RATHER THAN `single`, and only those whose own title or blurb states the pattern in words: the two Kadampa meditation classes (\"Saturdays\", \"Mondays\"), Sunday Jazz at Spirited (\"Every Sunday\"), Pilates in Canford Park (\"Sundays on the green at 10am\"), the Tobacco Factory Sunday Market, Sims Hill's \"monthly volunteer sunday\", the monthly Stockwood forest therapy and Latin Party \"FRIDAY'S\". Each carries `start` as the date Eventbrite printed for the instance I saw, which is a fact from the page, and no `end`, because none of them say when they stop. Rows in a series that state no pattern — the K-pop dance class, \"Meditate & Feel Good\" — stay `single`.


      NO PRICE ANYWHERE. Not one of the 308 rows carries `ticket_availability` or `is_free`, so no `price` is recorded for any Eventbrite event rather than inferred from the ticket page.


      `summary` is Eventbrite's own one-line blurb where the payload carried one that says more than the title repeated back; otherwise it is my own sentence. No `description` is recorded for any row — no event page was opened.


      Four venues here resolve to catalogue sources that the earlier pages did not reach: Wiper and True (the Old Market brewery tour, BS5 0SP, matching the catalogued Barrel Store), the Tobacco Factory Sunday Market, Grow Wilder, and Ashton Court via its mansion car park. The rest of the new venues are uncatalogued and carry `venue.name` — Spirited on North Street, The Haunted Bookshop, Mivart Studios, Glenside Hospital Museum, the Kadampa Meditation Centre, Totos by the River, Coppa Club Clifton and OMG are the recurring ones, and several look like real gaps for stage 1."
