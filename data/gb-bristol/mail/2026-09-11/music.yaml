      Just announced: Festival & Carnival Lab presents Afro Link-up


      with Da Fuchaman & His Fire Blaze Band and more


      Tue 22 Sep


      Lantern Hall


      Come together for an evening of music, creativity and connection as the Festival & Carnival Lab <https://bristolbeacon-mail.org/c/AQjCkQ4QpdF5GI7W59YBILeDqyQo9fjnFNvkIYevExOWPjJ4O-3ZGlGClrATaQjMRSxUdvetBGql> cohort takes over Lantern Hall.


      After weeks of expert-led sessions, mentoring and practical placements at major festivals including Boomtown, Shambala and Love Saves the Day, the 2026 cohort will showcase what they’ve learnt through live performances and an evening of celebration.


      Featuring cohort members and local artists Naughty Nate, Azumei, Aadvark9 and Mercy’s Cartel, with Da Fuchaman & His Fire Blaze Band headlining.


      On sale now


      Book Tickets <https://bristolbeacon-mail.org/c/AQjCkQ4QpdF5GI7W59YBIPODqyQo9fjnFPG8M0l9zL10YIgc-upOvbGMS_70sJyhow2MeDZyRbbs>


