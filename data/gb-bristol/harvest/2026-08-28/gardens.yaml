    notes: "The only bank holiday content on the site is an announcements slide-in at the foot of /events/: \"The Botanic Garden is open as usual during the Bank Holiday Weekend and the Forwards festival road closures. You will be let through if you are visiting the Garden.\" No special opening, tour or family programme is billed for 29–31 August, so nothing new is recorded for the weekend beyond the standing opening. The same slide-in also says the tropical pool room is currently closed while the other glasshouse rooms remain open, and that the bookable wheelchair has been repaired — venue-level facts rather than events. Two corrections to earlier runs, both found on the index rather than by opening pages: the Friends' Winter Lectures are at The Frank Lecture Theatre, Wills Physics Laboratory, Tyndall Avenue, BS8 1TL, not at the Garden, so they now carry a venue; and the index sidebar does print the opening hours and admission table, so no second fetch was needed. The 08-20 event \"Sketching Bristol's Long-lived Trees\" has dropped off the index, its date having passed. No promotional images are present on the index at all."
