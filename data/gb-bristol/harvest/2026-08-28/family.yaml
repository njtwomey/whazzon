        timesText: "Every evening from 27 November to 23 December; first entrance slot 4.30pm; Wild Lights finishes 1.5 hours after the end of the last time slot"
        url: "https://bristolzooproject.org.uk/events/wild-lights"
        image: "https://a.storyblok.com/f/233702/1831x840/ab5e9df7d8/wild-lights-landing-page-1830x839-new-2026.jpg"
        price:
          free: false
          text: "Ticketed, pre-booking required; no price printed on the page. Society members get 20% off on the first three nights only."
          currency: "GBP"
        tags:
          - "seasonal"
          - "family"
          - "outdoor"
          - "multi-day"
          - "booking-required"
        raw: "**Wild Lights at Bristol Zoo Project** — 27 November to 23 December.


          \"Brand new for 2026, Wild Lights will bring to life the beautiful features of Bristol

          Zoo Project through an awe-inspiring display of light and sound.\"\n"
        summary: "A new after-dark winter lights trail through the zoo grounds, running nightly through Advent. Timed entry from 4.30pm, animals off show, hot drinks and festive food along the route."
        description: "Brand new for 2026, Wild Lights will bring to life the beautiful features of Bristol

          Zoo Project through an awe-inspiring display of light and sound.


          Just 30 minutes from central Bristol, with easy access from the M5, meet friends and

          family for a festive experience you won't forget.


          Every evening from 27 November to 23 December, the zoo will transform into an

          immersive winter lights experience to delight all ages. Follow the trail through

          towering trees and along winding pathways, uncovering new surprises at every turn.

          With bright spectacles, interactive elements and plenty of surprises, Wild Lights

          offers something for everyone.


          As you explore, enjoy warming drinks and festive treats, including black forest hot

          chocolates, burgers and sausage rolls (veggie and vegan options available). Every

          ticket sold supports our vital conservation work in the UK and around the world.


          **Know before you go.** Please pre-book to guarantee entry and arrive no more than 15

          minutes prior to your booked timeslot. We are a natural, outdoor site — some paths

          are uneven and can get muddy in winter. Wild Lights is a winter lights trail rather

          than a normal zoo visit: for animal welfare reasons the animals will be off show and

          away from the lights, so to see them please book a standard day ticket in addition.

          The first Wild Lights entrance slot is at 4.30pm and the trail finishes 1.5 hours

          after the end of the last time slot. The trail is fully accessible, with wheelchairs

          and mobility scooters available to borrow if booked in advance.


          Bristol Zoological Society members are entitled to 20% off tickets on the first three

          nights only. (The page states this twice and disagrees with itself on the weekdays —

          \"Friday 27, Saturday 28, and Sunday 29 November\" in the body, \"Thursday 27, Friday 28,

          and Saturday 29 November\" in the FAQ. 27 November 2026 is a Friday.)\n"
        confidence: "high"
    notes: "The catalogued https://bristolzoo.org.uk/whats-on returns 307 to \"/\" — so does https://bristolzooproject.org.uk/whats-on and https://bristolzooproject.org.uk/events. There is no listings index on this site at all: the whole programme is two cards on the homepage, linking to /events/<slug> pages. bristolzoo.org.uk serves the same Next.js app but every internal link is written to bristolzooproject.org.uk, which looks like the host the catalogue should carry. Programme is tiny (2 events), so §3 applies and I opened both event pages plus /visit — 3 event-page fetches, the bank holiday one first. Opening hours as printed on /visit: \"Open daily 10am - 5pm. Last entry to Bristol Zoo Project and Bear Wood is 4pm.\" No altered hours and no Monday closure printed anywhere for the bank holiday weekend."
