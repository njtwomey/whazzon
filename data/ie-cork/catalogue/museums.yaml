  - id: museums/national-heritage-week
    name: National Heritage Week
    category: museums
    kind: aggregator
    status: provisional
    url: https://www.heritageweek.ie/event-listings?where%5B%5D=cork
    homepage: https://www.heritageweek.ie/
    tags: [ free, heritage, family, community ]
    cadence: monthly
    hints: |
      The catalogued URL is already filtered to Cork City. The county filter is
      a plain GET checkbox — `where[]=cork` narrows 2,634 national events to
      118, and there is a separate "Cork County" box if the radius is ever
      widened. Fetch the filtered URL; the unfiltered one is thirty times the
      volume for the same yield.
      15-23 August in 2026, theme "Heritage at Risk". Listings appear from about
      June and are gone by September, so most of the year this returns nothing —
      that is not a failure.
      Results are rendered client-side below a server-rendered filter form, so
      the raw HTML holds only a handful of featured cards even though the count
      is right. Expect to page or to read the count and go to the individual
      /event-listings/<slug> pages.
      Every event belongs to someone else and most are one-offs by small local
      groups that have no website — which is exactly why this source is here.
      Set `venue`, and `venue.sourceId` where it matches a catalogued source.
      Its own event-type vocabulary (guided tour, exhibition, workshop, talk,
      live performance, OPW event, Heritage Open Doors) maps neatly onto
      occurrence kinds.
    notes: |
      Verified 2026-08-17: title "2026 Events | National Heritage Week 15th -
      23rd August 2026". The filter was tested rather than assumed — the
      unfiltered page reads "Search 2634 Events" and the catalogued URL reads
      "Search 118 Events", and the Cork City checkbox in the form is
      name="where[]" value="cork".
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

