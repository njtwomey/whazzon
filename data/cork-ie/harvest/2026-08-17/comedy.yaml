      Three weekly slots the PROC diary does not carry — Low-Key Funny (Wed), Friday Night Comedy (Fri) and the monthly gong show Off The Stage! — were read from the club's own listings route, https://cococomedy.club/ (200), which states the weekly pattern and prices but prints no dates. `fetch.url` records the PROC route because every dated row came from it.


      Useful finding for stage 1: PROC venue pages DO link every row per event, in single-quoted hrefs (`href='.../eventguide/<slug>-<id>'`) with a per-event image alongside. A first pass looking only for double-quoted hrefs found none and would have thrown away every deep link on the page — worth a hint. The recurring slots get the soonest sitting's own URL, since a weekly night has one page per sitting rather than one page for the night.


      Two title corrections. PROC truncates the O'Kane rows to \"Deirdre O'kane - Work In Progress At The Coco Comedy..\" and lowercases the K; the full title is confirmed by its own slug (`deirdre-okane-work-in-progress-at-the-coco-comedy-club`) and by Eventbrite, so it is recorded untruncated rather than guessed at.


      cococomedy.club sells each weekly night as a separate Eventbrite *collection* rather than an event — /cc/work-in-progress-wednesdays-2817959, /cc/thursday-comedy-showcase-...-1224229, /cc/friday-night-...-1224269, /cc/saturday-early-show-...-2420789, /cc/saturday-primetime-...-1224489 and /cc/special-shows-in-the-coco-3111139. Those are the booking routes for the undated weekly nights and are used as their `url`. They are on eventbrite.com, not .ie.


      The weekly slots are recorded with a `start` but no `end`: the club states an open-ended weekly pattern and the PROC diary simply stops where its publishing horizon stops, so an `end` would be invented."
