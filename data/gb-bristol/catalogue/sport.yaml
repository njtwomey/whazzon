    status: provisional
    url: https://www.bcfc.co.uk/match-centre/teams/bristol-city/fixtures
    area: Ashton Gate
    tags: [football, fixtures, ticketed]
    cadence: weekly
    hints: |
      Full season fixture list published in summer, but individual kick-off
      times move for television at short notice — re-harvest weekly to catch
      the changes rather than to find new fixtures.

      Server-rendered: opponent, kick-off time and ground are all in the visible
      HTML. Only about the next ten fixtures appear, so this is not the whole
      season — the page is a rolling window, not a season list.
    notes: >-
      Verified 2026-08-17: /fixtures/ is gone, the club moved to
      /match-centre/teams/bristol-city/fixtures. Page header reads "Bristol City", and ten dated fixtures are
      server-rendered, starting Birmingham City v Bristol City, Saturday 22 August 2026, 12:30.
    addedAt: "2026-08-16"

