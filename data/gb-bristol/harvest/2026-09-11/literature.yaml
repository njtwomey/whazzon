    notes: "The hint holds: the Headfirst venue page is the shop's programme, server-rendered. Twenty listings from Mon 14 Sep 2026 to Wed 27 Jan 2027, all recorded, nothing truncated; the September rows that led the page on 28 Aug have rolled off and seven have been added since (Black Lodge, Stewart Lee, Left Cultures, Benjamin Moser, both Bring Down the Haus nights, Dave Haslam, Empire Ablaze). One is flagged by the venue: \"In Conversation with Stacey Yu and Freya Bromley\" (14 Sep) carries an **Event Cancelled** banner and is recorded with `status: cancelled`. As before, the index is unusually thin — a title, a venue line and Headfirst's genre labels (kept as `subcategory`), with the date only in the URL slug — so the twelve soonest live events had their pages opened, the cap. Each page embeds a JSON-LD `Event` block with startDate, endDate, offers (in pence) and eventStatus, which is where those twelve rows' times and prices come from; the remaining seven (21 Oct onwards) carry only the slug date and index line, no `price` or `description`, and are `confidence: medium`. The cancelled row was not opened and is recorded from the index. Every slug weekday checks out, including Wed 27 Jan, which is 2027. Prices: 700 = £7, 350 = £3.50, and the JSON-LD `typicalAgeRange: 18+` is Headfirst boilerplate contradicted by each page's own \"Entry requirements: no age restrictions\", so `ageRestriction` is set only where the page states one (Left Cultures: 16+). One discrepancy for a human: the Stewart Lee signing page's structured data says 15:30–16:30 but its body opens with \"*Update* This has been moved forward from 3:30 to 2pm\", so `startTime` is 14:00 with the conflict in `timesText`. The page's \"recent recommendations\" panel names five past launches with no date or link (Jonas Patrick Marvin, Tansy E. Hoskins, Emily Woof, Symeon Brown, the Gaza Tribunal) and they are not recorded. For stage 1, as last run: the per-event JSON-LD is a far cheaper route than the HTML and worth a `feed`-style note; the venue index carries no such block. The seven index-only rows have summaries written from the title and genre labels alone, and say so. No new tags were coined."
