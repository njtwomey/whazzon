    notes: "Route discovery for stage 1: appending `?format=json` to the catalogued /events path returns the whole Squarespace events collection in one fetch — 14 upcoming and 30 past entries with exact start and end instants, the event slug, the promotional image and each event's full body text. That is the URL in fetch.url and every description here is the event's own page copy from it, not something I wrote. It should be added to the catalogue as an `api` route. Two cautions with it: the epoch timestamps render as UTC, so they must be converted to Europe/Dublin (an hour later in August) before use — I did, and the results match the times the rendered /events page prints; and the body fields have Squarespace CSS appended after the copy, which I stripped. The 14 upcoming entries were recorded as 10 events. Two are series that the site publishes as separate dated instances and that I collapsed rather than expanded: \"Everybody Dance w/Stevie G\" appears five times (27 Aug, 24 Sep, 29 Oct, 26 Nov, 17 Dec, all Thursdays) and is one recurring event here, and \"Summer Sessions\" appears twice (22 Aug, 5 Sep) and is likewise one. Each instance has its own slug and its own monthly artwork, so the url and image above are the soonest instance's. The 30 past entries were not recorded. The market's own opening pattern is a separate recurring event, taken from a second fetch of the homepage (https://www.marinamarket.ie/, 200) which prints \"Monday - Sunday 8am - 8pm\" and \"7 days a week\"; it has no image because the homepage's og:image is the market's wordmark logo. One internal contradiction: the calendar puts Cork Card Show at 09:30-16:30 but the event's own body says \"October 10th, 2026 — 10:30 AM\", so its startTime is the calendar's and the other figure is kept in timesText, at medium confidence. Clothes Cycle on 12 September is also carried by Pure Cork in this same category, recorded there against this venue."
