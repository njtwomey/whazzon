    notes: "Everything here that falls on 29-31 August, taken whole — twelve rows, which is all the list view returns between Saturday 29 August and Tuesday 1 September. Two route notes for stage 1. The catalogued /whats-on/ serves the month grid, which is a 1.37 MB page; /whats-on/list/?tribe-bar-date= YYYY-MM-DD is the same calendar as a forward list and is an order of magnitude cheaper to read, and there is an ICS feed at /whats-on/?ical=1. Neither is in the catalogue. Two shape notes. The tenant \"Open\" blocks (Community Pottery, Community Sauna, Cibomatto Canteen, Co-operative Gym) are published as weekly Monday-to-Sunday date ranges, so Pottery and Sauna each appear twice across this weekend — 24-30 August and 31 August-6 September — and both are recorded, because dropping the earlier one would lose Saturday and Sunday. The weekly classes are published as individually dated instances rather than as patterns, so they are recorded as `single` on the date printed; nothing on the page states a recurrence. And the thing this run was watching for is absent: no bank holiday billing, no special opening, no closure notice. The calendar lists Monday 31 August exactly like any other Monday, so no event here carries a `bank-holiday` tag. I did not page past page 1 of the list view."
