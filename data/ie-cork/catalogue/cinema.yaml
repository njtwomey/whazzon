    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/cork-cine-club
    name: Cork Cine Club
    category: cinema
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://corkcineclub.com/
        note: the whole season sits on the homepage, one card per screening with date and time
      - role: feed
        url: https://corkcineclub.com/feed/
        note: WordPress RSS, one item per film; lastBuildDate 14 Aug 2026
      - role: booking
        url: https://ie.powertik.com/organizers/cork-cine-club
        note: every dated screening in the season with its venue printed against it
    area: Douglas Street
    address:
      street: Cork College of FET, Douglas Street Campus
      city: Cork
    tags: [ independent, community, arthouse, volunteer-run ]
    cadence: monthly
    hints: |
      A volunteer-run film society, going since 2010, and the answer to "where
      do I see world cinema in Cork on a Thursday". It has no building: films
      screen in Cork College of FET (formerly St John's Central College) at
      7:30pm on Thursdays, in seasons of ten. The entire season is published at
      once, months ahead, which is why monthly is enough — but it also means one
      harvest can pick up ten dated screenings, so do not stop at the first.
      Expect one placeholder per season ("Film to be confirmed"); record it as
      the listing says rather than guessing a title. Titles are one film per
      country with the country in brackets, and there is a "Classic Film Choice"
      slot late in the run. Supported by Access Cinema — see cinema/access-cinema.
    notes: >-
      Verified 2026-08-17: homepage lists the full autumn season, Thu 24 Sep to Thu 3 Dec 2026, ten screenings with dates and 19:30 times, and reads "Bringing the Best of Independent World Cinema to Cork Audiences Since 2010". Their About page gives the venue as "Cork College of FET [formerly St. John's Central College], Cork City, T12 DW32" while Powertik prints "Cork College of FET, Douglas Street Campus" against each screening, and a third-party directory places them on Sawmill Street — the college has more than one campus, so the eircode is deliberately omitted rather than risk a pin on the wrong building. Tickets €8.50/€7, online sales close 18:30 on the night.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/cork-film-centre
    name: Cork Film Centre
    category: cinema
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://www.corkfilmcentre.ie/latest-news/
        note: the only dated page on the site; workshops, screenings and exhibitions in one stream
      - role: feed
        url: https://www.corkfilmcentre.ie/feed/
        note: WordPress RSS, but lastBuildDate is May 2025 — quiet rather than broken
    homepage: https://www.corkfilmcentre.ie/
    area: Shandon
    address:
      street: Civic Trust House, 50 Pope's Quay
      city: Cork
      postcode: T23 R6XC
      lat: 51.901364
      lon: -8.474271
    tags: [ independent, community, student ]
    cadence: quarterly
    hints: |
      A not-for-profit film resource organisation rather than a cinema — youth
      filmmaking, Cork Young Filmmakers summer workshops, the f.Project
      analogue photography group and darkroom, and occasional exhibitions and
      screenings. It also runs the First Cut! Youth Film Festival, which belongs
      to the festivals catalogue, not here. Nothing on this site is a screening
      most weeks, so read the news stream sceptically: a workshop with an
      enrolment address is not an event, and much of what is dated happens in
      County Cork towns well outside the city.
    notes: >-
      Verified 2026-08-17: homepage and /latest-news/ both live, titled "CFC NEWS - Cork Film Centre", footer reads "CORK FILM CENTRE, Civic Trust House, 50 Pope's Quay, Cork T23 R6XC". Activity has narrowed — the page states equipment hire has ceased after funding cuts and "our main role now is the provision of youth workshops" — and the most recent dated items are from 2025, with the 2026 summer workshops described as "in the planning stage" and sited in Midleton, Mallow, Cobh, Macroom and Bandon, all outside the 12 km radius. A curator may well prefer status: dormant; kept provisional because the organisation plainly still exists and is the only film-development body in the city.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/ucc-film-screen-media
    name: UCC Department of Film and Screen Media
    category: cinema
    kind: listing
    status: provisional
    url: https://www.ucc.ie/en/fmt/film/news/
    homepage: https://www.ucc.ie/en/fmt/film/
    area: Bishopstown
    address:
      street: Kane Building, University College Cork
      city: Cork
    tags: [ university, student, free ]
    cadence: monthly
    hints: |
      The university's film department, and the closest thing Cork has to a
      student film-society listing. It has its own Film and Screen Media
      Auditorium in the Kane Building and puts on public screenings, director
      Q&As, masterclasses and archive events, sometimes in its own auditorium
      and sometimes co-hosted at Triskel — where the venue is Triskel, set
      `venue.sourceId` to cinema/triskel-christchurch. The page is a news
      stream, not a diary, so most items are retrospective ("co-hosted a
      screening ... on Saturday 4th July"); only take the forward-dated ones.
      Term-time only in practice.
    notes: >-
      Verified 2026-08-17: /en/fmt/film/news/ is live and dated, last updated 7 July 2026, carrying a Coup 53 screening at Triskel with a director Q&A (Sat 4 July) and a masterclass with composer Larry Groupé in the Kane Building (Thu 4 June). Recorded in place of the "UCC Film Society" lead, which does not exist: UCC's own society directory lists a Film and Photography Society and a Science-Fiction, Anime, Horror and Fantasy Society that runs weekly screenings, but neither publishes anything beyond an email address and an Instagram handle, so neither is crawlable. Area follows the location config, which places the universities in Bishopstown; the Kane Building is on the main campus off Western Road.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/access-cinema
    name: Access Cinema
    category: cinema
    kind: organiser
    status: provisional
    url: https://www.accesscinema.ie/
    tags: [ independent, arthouse, community ]
    cadence: monthly
    hints: |
      The national resource organisation for regional cultural cinema, and the
      body that puts touring arthouse seasons into small Irish venues. It is
      worth crawling for Cork because it programmes into rooms that publish
      nothing themselves — Cork Cine Club names it as a supporter. Behind a
      SiteGround JavaScript captcha, so a plain fetcher gets a 168-byte "Robot
      Challenge Screen" and a cookie jar does not help; a real browser is
      needed. Filter hard to Cork — most of what it lists is elsewhere in
      Ireland.
    notes: >-
      Unverified, and honestly so. The organisation is real and Cork-relevant: corkcineclub.com/about-us states "Cork Cine Club is supported by Access Cinema, a resource organisation for regional cultural cinema, and by The Arts Council of Ireland". The domain resolves and is served by SiteGround, but every request — root and any path, with or without cookies — returns HTTP 202 and a captcha challenge titled "Robot Challenge Screen", so the content could never be read and no listings path could be confirmed. The root URL is recorded rather than a guessed /whats-on/. Not marked closed: a bot wall is not an absence. No verifiedAt.
    addedAt: "2026-08-17"

  - id: cinema/cinematimes-cork
    name: CinemaTimes — Cork
    category: cinema
    kind: aggregator
    status: provisional
    url: https://cinematimes.com/ie/cork/
    tags: [ aggregator, showtimes ]
    cadence: daily
    hints: |
      The best single safety net in this category: it aggregates showtimes
      across every cinema near Cork on one page, with a date strip covering
      about ten days, distances from the city centre, and — unusually — it
      carries the independents as well as the chains, listing Triskel Arts
      Centre and Cork Cine Club alongside the multiplexes. /ie/cork/cinemas/ is
      the directory, /ie/cork/cinemas/<slug>/ a per-cinema week. Every cinema
      page also embeds a schema.org `MovieTheater` JSON-LD block with street
      address, eircode and coordinates, which is the cheapest way to fill in an
      address a venue does not publish. Two cautions: its naming lags reality
      (it still calls the Midleton and Mallow sites "The Gate"), and it
      double-counts the Blackpool multiplex as both "The Reel Picture Blackpool"
      and "Blackpool Cinema". Treat it as corroboration, not as a source of
      record — set `venue.sourceId` to the catalogued cinema.
    notes: >-
      Verified 2026-08-17: page is titled "Cork Cinema Showtimes Today · Mon 17 Aug" and reads "23 films are showing across 6 cinemas near Cork today", with per-cinema times and distances. cinematimes.ie 301s here, so the .com host is recorded as canonical.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/entertainment-ie-cork
    name: entertainment.ie — Cork cinema listings
    category: cinema
    kind: aggregator
    status: provisional
    url: https://entertainment.ie/cinema/cinema-listings/cork/
    tags: [ aggregator, showtimes ]
    cadence: weekly
    hints: |
      A second, independent read on which cinemas in County Cork are actually
      trading, and useful mostly for that: the index page names each cinema with
      a live film count, so a venue vanishing from it is a real signal. Covers
      the whole county, so most of what it lists — Mallow, Midleton, Bantry,
      Clonakilty — is outside the configured radius and should be ignored.
      Per-cinema listings hang off /cinema/cinema-listings/cork/<slug>/. Needs a
      browser user-agent: a plain fetch gets 403.
    notes: >-
      Verified 2026-08-17 with a browser user-agent: page titled "Cork Cinema Film Times - Cinema Listings for Cork" and lists exactly six trading County Cork cinemas — The Arc Cinema Cork (30 films), Omniplex Cork Mahon Point (18), The Arc Cinema Mallow (18), The Arc Cinema Midleton (16), The Reel Picture Blackpool (11), The Reel Picture Ballincollig (8) — plus Bantry Cinemax and Park Cinema Clonakilty. Notably it lists no cinema in Douglas and no Gate, which is the corroboration behind the two closed entries below.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/kino
    name: The Kino
    category: cinema
    kind: venue
    status: closed
    url: https://www.kinocinema.net/
    area: Washington Street
    address:
      street: Washington Street
      city: Cork
      lat: 51.897561
      lon: -8.479089
    tags: [ independent, arthouse, cultural-cinema ]
    cadence: monthly
    hints: |
      Closed as a cinema — kept so it is not re-proposed. A model asked for
      Cork's arthouse cinema will reach for the Kino; the answer since 2011 is
      cinema/triskel-christchurch, and the building itself is now a bar and live
      venue that belongs in music or nightlife, not here.
    notes: >-
      Verified 2026-08-17: kinocinema.net is live but is an archive, and says so — "Content is from the site's 2008 archived pages". It records the Kino as an independent arthouse cinema in a former pool hall on Washington Street, operating 1996–2009 and closing in debt, with 2007 reviews as its most recent programme. The building was taken over by promoters and reopened from 2019 as a live music venue, theatre space, bar and café, and again in February 2022 as a licensed bar and nightclub under Banger Productions. No cinema listing at this address in any current source. Address kept to the street only; the archive gives no number.
    addedAt: "2026-08-17"

  - id: cinema/cinema-world-douglas
    name: Cinema World Douglas
    category: cinema
    kind: venue
    status: closed
    url: https://www.corkcinemas.com/
    area: Douglas
    tags: [ multiplex, commercial, mainstream, out-of-town ]
    cadence: daily
    hints: |
      Recorded as gone so it is not re-proposed — a Douglas multiplex is exactly
      the sort of entry a model produces from stale knowledge. If a curator finds
      it trading, flip it to provisional rather than re-adding it.
    notes: >-
      Closure inferred rather than announced, and flagged for a human on that basis. What is confirmed as of 2026-08-17: its operator Cork Cinemas, which also ran the Gate sites, no longer exists as a business — both corkcinemas.com and its old /home.php path 301 to arccinema.ie — and Arc lists no Douglas site among its eight cinemas. It appears in none of the three live listings sources checked: entertainment.ie names six trading County Cork cinemas with no Douglas entry, CinemaTimes' Cork directory of 18 cinemas within 80 km has none in Douglas, and IMC's locations page lists only Blackpool and Ballincollig for Cork. Cinema Treasures has no record of a Douglas cinema at all, so that is silence rather than evidence. The only trace is a stale third-party directory giving "Douglas East Street, Cork T12 K8NR" and describing a 1998 multiplex; no address is recorded here because that source also still lists the Gate as current. No usable URL of its own survives, so the former operator's domain is recorded and the redirect is the evidence.
    addedAt: "2026-08-17"
