        summary: "The medical class of 2001 marks twenty-five years since graduation with food, drink and entertainment at the Clifton Observatory. Smart casual, and booked through the organiser rather than a ticket page."
        description: "The University of Bristol Medics class of 2001 are celebrating their 25th anniversary of graduation at the Clifton Observatory on Saturday 3 October 2026.


          The evening event will include food, drinks and entertainment to enjoy whilst catching up with friends and sharing memories. The dress code for this event is smart casual.


          **Tickets**


          To book tickets for this event, please contact Robert Dunning on rjldunning@hotmail.com or via WhatsApp on +61 450 924004. There is a groupchat on WhatsApp which Robert can add you to and share further details as they are confirmed.


