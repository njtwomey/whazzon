      **The catalogue hint is not borne out.** It says the priory \"programmes lunchtime concerts alongside its work as a charity\". Nothing on the site mentions a concert, a recital or any music programme — the pages are the church, its history, its supported housing charity, meeting-room and wedding hire, and the cafe. Either the concerts have stopped, or they are advertised somewhere other than this domain, or the hint was a guess when the source was catalogued blind. Stage 1 should verify it before this source keeps its `classical` tag.


      What the site does publish is a service and opening pattern: \"MASS - EVERY SUNDAY AT 8:00 AM\"; \"The Ordinariate celebrates Mass on Sundays at 9:15am\"; \"Confession 12:30p.m. - Mass 1:05p.m.\"; and \"Eucharistic Adoration is from 10 am – 4 pm Monday – Friday.\" Per the run instruction I have not turned a said Mass into an event: none of it is a public cultural programme, and one recurring row for a Roman Catholic Mass would be filler on a what's-on site. A human may disagree, and the wording is all here to build one from.


      **Bank holiday, and the most useful thing this source said today.** The homepage prints, in bold: \"THE CHURCH IS CLOSED ON GOOD FRIDAY AND BANK HOLIDAY MONDAY\". So Bristol's oldest building is shut on Monday 31 August 2026. That is a venue fact rather than an event, so it lives here per the run brief — but it is exactly the kind of thing a reader planning a bank holiday Monday would want, and it may be worth stage 1 or stage 3 finding a home for. Nothing is printed about the Saturday or the Sunday beyond the standing 8am Sunday Mass."
