  - id: sport/bristol-cycling-campaign
    name: Bristol Cycling Campaign
    category: sport
    kind: organiser
    status: provisional
    url: https://bristolcycling.org.uk/diary/
    tags: [cycling, community, rides, free, campaigning]
    cadence: monthly
    hints: |
      Community rides and campaign events. Good route into smaller organised
      rides that no listings site carries. /rides/ redirects to /diary/rides/,
      which is prose and points back at the diary — the diary is the only
      listing.

      What the diary page renders is a Google Calendar iframe, so a fetcher sees
      the surrounding prose and no dates. Read the calendar's public feed
      instead:
      https://calendar.google.com/calendar/ical/nm7k9n1qbjok56bvlji6fa5dd8%40group.calendar.google.com/public/basic.ics

      Expect a thin diary. Most of it is the two standing monthly meetings
      (committee, and the Space4Cycling infrastructure forum) carried by RRULE —
      record those as `occurrence.kind: recurring`, not one event per month. One-off
      rides are rare, and the page says 2026 social event dates are still TBC.
    notes: >-
      Verified 2026-08-17: page is titled "Diary of meetings – Bristol Cycling Campaign" and names the
      organisation throughout. The ICS feed behind the embedded calendar parses, with 92 recurring meeting
      rules plus one dated one-off ahead (Bristol Kidical Mass Ride, 19 September 2026) — which is why the
      harvest recorded this source as reachable but empty.
    addedAt: "2026-08-16"

  - id: sport/severn-bridge-half
    name: Severn Bridge Half Marathon
    category: sport
    kind: festival
    status: closed
    url: https://sites.google.com/site/severnbridgehalfmarathon/home
    tags: [running, half-marathon, annual, mass-participation]
    cadence: quarterly
    notes: >-
      Closed 2026-08-17. severnbridgehalf.com is NXDOMAIN. The event's surviving official page (url above)
      states the organiser is winding up SBHM Ltd, having lost the bridge closures and infrastructure the race
      depended on, and that "the event is unlikely to happen in its usual 'full bridge closure' format again".
