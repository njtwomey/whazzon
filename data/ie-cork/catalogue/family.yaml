    hints: |
      Programme is built around school holidays — Easter, February midterm and
      summer camps — so a fetch outside a holiday window can look empty when it
      is not. Each event has its own page under /events/<slug>/ with a full
      description; several titles carry the date in the slug and nowhere else
      ("easter-camp-tues-7th-april"), and a few carry no date at all ("How Water
