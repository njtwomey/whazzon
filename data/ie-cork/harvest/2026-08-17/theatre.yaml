    notes: "**Route discovered — for stage 1 to add.** /programme/ renders its listings in JavaScript and returns no events to a fetcher; the page's own scripts call `https://dancecorkfirkincrane.ie/wp-json/firkinevents/v1/post?_embed&per_page=100`, a custom REST route that returns the whole forward programme in one fetch (17 items) with ACF fields for start_date, end_date, time, venue room, price and the Ticketsolve booking link. That is what was read and what fetch.url records. It should be catalogued as an `api` route beside the existing `listings` one. Dates in it are **day-first dd/mm/yyyy**, as the brief warns. 15 of the 17 items are recorded. The programme splits three ways exactly as the catalogue hints: public performances and showings; professional classes and workshops, which here are individually dated one-offs named for the teacher rather than a weekly series, so each is a `single`; and artist residencies, which are studio time. Four residencies state a public showing inside the span and are recorded as that showing alone (Immacolata Fri 21 Aug 18:00, Jason Turk and Stephanie Keane Fri 11 Sep 18:00, Zoë Ashe-Browne Fri 23 Oct 18:00, Kexin Huang Fri 13 Nov 18:00) — never as the span. **Two residencies with no showing are deliberately not recorded**: Siobhán Ní Dhuinnín rehearsing Country OK (8–9 Oct) and Luke Murphy's Attic Projects developing Ingenium (16–27 Nov). Both are rehearsal time an audience cannot attend. The standing \"Classes Held at Dance Cork Firkin Crane\" item spans the calendar year with \"Various times and Dates\" and is recorded as one `recurring`, not expanded. Seven event pages were opened for `description` and curtain times, which the API's `time` field leaves blank for most: Immacolata, Cine Club, RAPT, I Fall Down, An Immigrant's Story and both Crane Visual exhibitions. All four Friday showing dates check out as Fridays."
