  - id: music/cork-city-hall
    name: Cork City Hall
    category: music
    kind: venue
    status: provisional
    url: https://www.corkgigs.com/venue/city-hall-cork
    homepage: https://www.corkcity.ie/en/council-services/public-info/events-hosting-and-licences/use-of-council-facilities/concert-hall-and-millennium-hall/
    area: City Centre
    tags: [ major, civic, concert-hall, classical ]
    cadence: monthly
    hints: |
      The council's own 1,189-seat concert hall on the south channel, used for
      orchestral concerts, choral galas and the larger touring rock and pop
      shows. Monthly is enough: a handful of concerts a year, each announced
      months out, so the list barely moves week to week.
      The council's own page is a venue-hire page, not a programme, and the
      shows themselves are announced by whoever promotes them — The Good Room,
      Aiken, MCD — so the corkgigs venue view is the only page that lists them
      in one place. No address is set because neither page printed one.
    notes: |
      Verified 2026-08-17: the corkgigs profile is headed "Cork City Hall" and
      shows a "Forthcoming gigs at Cork City Hall" section, and the corkgigs
      diary listed Wunderhorse at Cork City Hall on 26 Aug 2026. The council
      page is titled "Concert Hall and Millennium Hall - Cork City Council" and
      describes hire terms rather than events.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

