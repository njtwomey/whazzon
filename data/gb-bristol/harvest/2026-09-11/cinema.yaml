    notes: "Three pages read: the catalogued /whatson/ index (25 listings, all taken), /whatson/week-ahead for the day-by-day showtimes that fill timesText (it covers Sat 12 – Thu 17 only, so films opening Fri 18 have their date range but no daily times), and /whatson/coming-soon, which today holds a single undated teaser (I Love Boosters, October 2026), recorded as undated. The mail file was read first: the 8 Sept \"What's On Fri 11 - Thu 17 Sept\" and 10 Sept \"Accessible Screenings and Events\" newsletters (the 1 and 3 Sept ones are superseded, and the two 29 Aug messages are subscription confirmations with no events). 3 of these rows are from the newsletters and not on the site index: the \"Just Enough\" AI Lunchtime Talk (today 13:00), the My Deaf Artistic Journey Lunchtime Talk (26 Sept) and the How Deep Is Your Love Q&A screening (6 Oct). Their URLs were resolved from the newsletter's list-manage tracking links to the watershed.co.uk event pages (a HEAD request each), with the utm parameters dropped. The newsletters also supplied director/country/runtime lines, the Watershed Recommends quotes and the accessible-screening details (AD, descriptive subtitles, relaxed, masked) folded into raw and timesText. One disagreement: the newsletter puts the Deaf Conversations screening of The Cycle of Love at 18:00 on Mon 21 Sept, the website at 17:40; the website is taken and both are noted. Watershed prints no ticket prices on any of these pages, so price is omitted except for Lunchtime Talks, which the site says are free. Films running across several days are one run each with per-day times in timesText; SENTIENTS' one sold-out session is in timesText rather than status, since the exhibition as a whole is still on sale. Encounters Film Festival is listed on the index with an external URL (2026.encounters.film) and is recorded with that link. Nothing truncated."
