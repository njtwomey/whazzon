      city: Bristol
      postcode: BS2 0NW
      lat: 51.458052
      lon: -2.57602
    tags: [ community, arts-centre, music, independent ]
    cadence: weekly
    hints: |
      Community arts centre in a converted church. Programme is mixed —
      theatre, gigs, club nights, community events — so classify per event.

      The diary is long and books far ahead — mid-2026 listings already run to
      February 2027 — so use a long forward horizon rather than the current
      month. Music dominates it; do not assume a Trinity listing is theatre.
    notes: >-
      Verified 2026-08-17: the catalogued 3ca.org.uk still resolves but 301s to trinitybristol.org.uk, so write the canonical host. Footer confirms Trinity Community Arts, registered charity 1144770, at the catalogued Trinity Road BS2 0NW. Dated events from Bristol Extreme Fest on 29/08/2026 through Tangerine Dream on 06/02/2027.
    addedAt: "2026-08-16"

