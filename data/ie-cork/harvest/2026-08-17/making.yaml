    events: []
    notes: "Reached, well populated, and listing **nothing upcoming** — a real result rather than a failure. Read /events/ and the /feed/ route for full body text. The newest post is \"Aistear take down & gathering\", 20 April 2026; everything else is older. The 2026 programme it describes has run: the Aistear spring exhibition was 2–29 April 2026 at Bishopstown Library, the \"Face the Music\" annual exhibition opened 27 November 2025 at the MTU Cork School of Music, the AGM was 4 October 2025, and the members' skill-share workshops (needle felting with Emily Thompson, foil decoration with Lesley Stothers, Making Textures with Sandra Jansen) are all past.

      Nothing is recorded rather than recording past sessions, and nothing is recorded as `recurring` either: the network's own words are \"one of our monthly skill shares sessions in Bishopstown Library\", which is a cadence but not a stated weekday or date, and those sessions are members-only. The shape to expect when it does publish, for whoever curates this: AGM in early October, annual members' exhibition opening late November at the Cork School of Music, spring exhibition through April at Bishopstown Library, and monthly members' workshops in between. Worth revisiting in late September when the autumn programme should appear."
