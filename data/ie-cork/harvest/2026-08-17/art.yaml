        raw: "**Harvest Traditions: A Lúnasa Craft Workshop** — Saturday 22 August,

          12pm, Cork City Library (T12V0AA). **BOOKED OUT!**


          Free/Booking essential.\n"
        summary: "Artist Seiko Hayase leads a Heritage Week wreath-making workshop that crosses Irish Lúnasa harvest knots with the Japanese Nanohana Musubi knot. Materials provided, free — and already booked out."
        description: "This National Heritage Week event invites participants to \"celebrate

          Lúnasa with artist Seiko Hayase by creating a unique harvest wreath

          inspired by Irish and Japanese traditions\". Attendees learn the

          Nanohana Musubi knot technique — described as \"symbolising strong

          bonds\" — to craft a wreath drawing from Irish Lúnasa harvest knots

          while developing skills for future Mizuhiki wreath-making.


          The workshop is free but \"must be booked in advance\". All materials

          are provided. The listing is marked BOOKED OUT.\n"
