        raw: "**Bedminster Winter Lantern Parade – returning 2027.** \"Celebrating

          creativity, inclusiveness and the magical spirit of BS3.\"


          \"Subject to funding, the parade will go ahead on a Saturday in January

          2027.\"


          \"Donate now and bring the magic back. All donations, big and small, are very

          much appreciated.\"


          [Road closures](https://www.lanternparade.org/road-closures/) · [Become a

          sponsor](https://www.lanternparade.org/home-2-2/become-a-sponsor/) ·

          [Volunteer](https://www.lanternparade.org/volunteer/) ·

          hellobemmylanterns@gmail.com\n"
        summary: "A procession of handmade lanterns through Bedminster, preceded by community lantern-making workshops each autumn and run by a volunteer steering group with 200 helpers on the night. Organisers expect a Saturday in January 2027 if the funding lands, but no date is fixed."
        description: "Bedminster Winter Lantern Parade is the biggest creative community event in

          South Bristol bringing thousands of local residents together to celebrate

          BS3's creativity.


          Each Autumn, we hold lantern-making workshops for schools, community groups

          and the public, with the illuminated parade taking place in January –

          bringing thousands of spectators to Bedminster.


          The event is organised by a small volunteer Steering Group who work

          tirelessly each year to secure the funding and plan the Parade, supported by

          200 wonderful volunteers who provide logistical support on the day.


          Subject to funding, the parade will go ahead on a Saturday in January 2027.


          Looking to sponsor the Bedminster Winter Lantern Parade? Email us at

          hellobemmylanterns@gmail.com for more info.


          If you'd like to join the organising team and have events, health and

          safety, or community outreach experience, we'd love to hear from you.


          And we'd also love to hear from community and street groups in BS3 who want

          to take part in the next Lantern Parade.\n"
        confidence: "high"
    notes: "One fetch, and the re-pointed URL is correct: lanternparade.org served 200. Exactly as the hint predicted, this is an announcement page and not a listing — the parade is \"subject to funding\" and pinned only to \"a Saturday in January 2027\", so `undated` with that wording is the whole honest record and no January date has been guessed. There are no dated items of any kind on the page: the autumn lantern-making workshops are described but not scheduled, which fits the hint's expectation that dated items appear from about October, so this source is worth revisiting then. The page carries no `<img>` at all (artwork is CSS background) and no admission price, so both fields are omitted. Two things for stage 1: the site's own name for the event is \"Bedminster Winter Lantern Parade\", longer than the catalogued \"Bedminster Winter Lanterns\"; and the page invites community and street groups in BS3 to take part, contact hellobemmylanterns@gmail.com."
