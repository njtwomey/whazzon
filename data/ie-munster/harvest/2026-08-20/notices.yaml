    notes: "**Solved, by rendering it.** The listing is a JavaScript application: a plain fetch sees a page shell and the first unfiltered page, which is why the earlier attempt found nothing. Loaded in headless Chrome it renders, and — the part that matters — **it takes a `?q=` search parameter**. So the route into this source is not the county filter at all. It is one search per word of the vocabulary: wool, weaving, knitting, crochet, spinning, felting, dyeing, flax, textile, quilt, lace. Eleven searches returned 33 Munster hits, of which the twenty below are in scope. The false positives are worth knowing about: the search matches the organiser and venue as well as the title, so a storytelling event at Clonmel library comes back under \"wool\" because the library also ran a spinning talk. Read the title, not the hit. Recorded against this source rather than the venues because this is where they were read. Louise Deasy's weaving demonstration also appears under `fibre/duchas-clonakilty`; the duplicate scorer is expected to fold them."
