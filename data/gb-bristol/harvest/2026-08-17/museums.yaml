          Discover how we use light to measure the scale of the cosmos and find alien worlds in our

          revamped show in this hour-long, presenter led evening show.\n"
        summary: "The deeper of the two adult planetarium shows, revamped this autumn — how telescopes read the light from distant objects, and what that tells us about the scale of the universe and the worlds in it."
        description: "How about a trip to the stars on your Thursday night? Planetarium Nights are back this

          Autumn!


          Discover how astronomers capture the light from distant objects with advanced telescopes in

          our revamped science show. Investigate how that light is used to calculate the scale of the

          cosmos and to find alien worlds. Join us in the Planetarium to explore our galaxy… and

          beyond!


          **Highlights:**


          - Where is the best place to go stargazing? And how do astronomers see beyond the haze of

