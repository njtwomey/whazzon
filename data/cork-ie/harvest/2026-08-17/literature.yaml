    notes: "Both catalogued routes read. /events/ is the noticeboard the hint describes: the \"MLC Workshops\" block reads only \"MLC workshops TBA\", so the centre has nothing of its own dated, and the \"Cork Events\" block is a mix of recurring entries stated in words and three image-only banner links. Two of those banners are now stale — events.stfinbarres.ie/event/ill-be-your-mirror-alternative-storytelling/ was 7 August 2026 18:00 and the Eventbrite \"Borrow a poet from The Poets Library\" was 8 August 2026 13:00 (both opened and confirmed past, so neither is recorded); the third points at the Cork City Libraries Eventbrite organiser, which is a listing not an event and belongs to citywide. Of the named recurring entries, Ó Bhéal go Béal is recorded under literature/o-bheal-go-beal rather than duplicated here, Waterstones Cork / UCC School of English / Cork City Libraries are separately catalogued sources, and Lime Square Poets (online, Limerick) and De Barra's Spoken Word (Clonakilty) are out of scope exactly as the catalogue notes say. Only the Frank O'Connor Writers' Group has no source of its own, so it is recorded here. The /feed/ route was also read (10 items, most recent 9 Jul 2026) and is almost entirely competition opens, closes and results, which the hint rightly says are not events; its one workshop, the Shangyang Fang online poetry course, ran 15, 22, 29 June and 6 July 2026 and is past. The single genuinely new fact in the feed is that the \"Louise Hegarty to judge this year's Ó Faoláin Competition\" post dates the Cork International Short Story Festival as \"14 - 17 October 2026\" — recorded against literature/cork-international-short-story-festival, whose own site still shows 2025. Worth stage 1 knowing that events.stfinbarres.ie carries a whole August readings series (\"I'll Be Your Mirror\") that this noticeboard only banners one instance of; the cathedral is catalogued as museums/st-fin-barres-cathedral."
