    notes: "Re-pointed URL is good: the new swcityfarm.co.uk host resolves and /events/ fetched first time, 200, headed \"Events\". The hint is right that it is a calendar of the year rather than a rolling diary — and it is very thin for a city farm, four listings for the whole of 2026, of which two are fairs with no detail yet. The Handlebards show is already past (21 June); the hint's warning about missing years applies to it and the inference is confirmed rather than assumed, because 21 June 2026 really is a Sunday, so `confidence: high`. It is recorded even though finished: the page still lists it today, and the fold will mark it so. The two fairs print their year, so no inference was needed. The drum circle is recorded as one `recurring` event with the page's own words, not twelve rows; it is `confidence: medium` and carries no time or price because the page prints neither and both live on the partner's site (starshineroots.org), which I did not open. No `description` anywhere on this source: two of the four listings have no link of their own at all, and the other two link off-site to partners rather than to the farm's own event pages, so there was nothing of the farm's to read. Two further fetches went on looking for the sessions a farm this size ought to be running, and both are worth recording so the next run does not repeat them. The homepage navigation offers \"Courses & Workshops\", \"Skills & Wellbeing Programme (18+)\" and \"Child & Youth\", and states the farm is \"open 7 DAYS A WEEK from 9AM to 5PM (Summer Hours)\". /courses-workshops/ turned out to hold no dated sessions whatsoever — it is a shop of six self-paced online products (Vegetable Gardening for Beginners £69.99, marked \"Coming Soon\", plus four £25 modules and a £15 recorded workshop), so nothing there is an event and none of it is recorded. That leaves /child-youth/ and /skills-wellbeing-programme-18/ unvisited, which is where any real weekly or termly programme would be; they are the obvious next place to look and a good candidate for a catalogue hint, but they were beyond the fetch budget for one source today. Given how sparse /events/ is, this source's `url` may be better pointed at whichever of those pages actually carries dated sessions — a stage 1 decision, not one for this run."
