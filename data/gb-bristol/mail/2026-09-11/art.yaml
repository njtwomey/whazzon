    body: "50th anniversary Summer Party, new exhibitions launching, events for all the family and more ✨

      Spike Island, September 2026


      View this email in your browser <https://mailchi.mp/spikeisland/september-2026-newsletter>


      https://us.list-manage.com/QTIJBR6iPEV?c2id=a7c541d1d2eca54a095703c2afcca581&m=r419FBTMB1VCPEpc-NC7a7sG-HWSLTk0H4FKIZSoHf2ZsnE7YPRD1Osvq7_z


      EXHIBITIONS


      https://us.list-manage.com/RsV2kMKQqwR?c2id=a7c541d1d2eca54a095703c2afcca581&m=Xnz7V6l1-nDLGIyMWuffbO4AUQ-r5IuItU-mXutX7PA0EXHidspG4SnuZLBl Nancy Lupo, The Repository (2026). 22 ceramic soap dishes and soaps. Installation view, Several Chickens Later, Spike Island, Bristol. Photograph by Rob Harris


      ⭐ LAST CHANCE TO SEE ⭐


      NANCY LUPO

      SEVERAL CHICKENS LATER

      until Sunday 6 September 2026

      Nancy Lupo's largest UK exhibition to date features new sculptures that probe aspirations, ambiguities and material culture. She often describes her work as being scripted or held together through a thin thread of narrative which she explores through writing in her first novel, Meow Meow Real Estate.

      Learn more <https://us.list-manage.com/a9XbQnL21l5?c2id=a7c541d1d2eca54a095703c2afcca581&m=39Amx9w7J0iAh1_kDyrPArpJMe724bDXZa_yVH3umEk4d4_gTDBw5cofv_-G>


      TOHÉ COMMARET

      MIJITAS

      until Sunday 6 September 2026

      Mijitas is the first exhibition in the UK by Franco-Chilean artist Tohé Commaret, featuring two new moving image commissions, Rosa and Can you hear me? (both 2026). Commaret’s enigmatic short films move between documentary and fiction, approaching social realities through magical realism.

      Learn more <https://us.list-manage.com/cPjJiz5EVD_?c2id=a7c541d1d2eca54a095703c2afcca581&m=pDXfHNgWHTwWpLqejOXttpQSNXQ6UF5YlDIZ_ZwgA3YMCeKLxeb64xWWAjra>


      https://us.list-manage.com/svvAWHiHbzY?c2id=a7c541d1d2eca54a095703c2afcca581&m=7Ojf3DRs8zFJVDWq7gf7aUHpyNr5DmKS03DM7fP6GaN-duynwl3W-T3TUuJ7 Beverly Buchanan, photo of Marsh Ruins (1981). © The Estate of Beverly Buchanan / Andrew Edlin Gallery, New York


      UPCOMING EXHIBITION


      BEVERLY BUCHANAN

      WEATHERING

      Saturday 26 September to Sunday 31 January 2026

      Spike Island presents the first European survey exhibition of the work of Beverly Buchanan (b.1940; d.2015), bringing together five decades of sculpture, painting, drawing, earthworks, artists’ books and rarely-seen archival material. Rooted in the landscapes and histories of the American Southeast, Buchanan developed a singular practice shaped by memory, materiality and place, exploring the enduring legacies of slavery through the histories embedded in architecture, landscape and everyday materials.

      Learn more <https://us.list-manage.com/19mzSaN2052?c2id=a7c541d1d2eca54a095703c2afcca581&m=Ofk4H2umnqTZU3bw0cowJnC6hl9WEm36d5j1ZEnrk8H2rDA3zGboWaEGzB54>


      SPIKE ISLAND 50


      https://us.list-manage.com/SUxb4TdsjMd?c2id=a7c541d1d2eca54a095703c2afcca581&m=1GUOpiQYB99X9ZS2DFOKUF2oKX9mnSyn6nm9WSWKZ6o9HRQkLJLf6j3b8lXG Poster by Iodo


      SPIKE ISLAND 50 SUMMER PARTY

      Saturday 5 September 2026, 5pm–3am

      Join us this weekend for the Spike Island 50 Summer Party; a one-night celebration marking 50 years of artist-led creativity, experimentation and community.


      FULL LINEUP


      5–9pm: Live art programme guest-produced by Perpetually Stew

      Eleanor Duffin

      Hats Aston

      Johnny Morgan-Jones

      Samuel Fordham


      7–7.30pm: Birthday Cake and Speeches


      Performances:

      6–6.50pm: Tohé Commaret & Ariane Kiks

      7.40–8.10pm: Mary Hurrell

      8.20–8.50pm: Sarahsson


      DJs:

      9–10pm: Alexis Over-Papatzaneteas

      10–11pm: Jo Lathwood

      11pm–midnight: Al Cameron

      midnight–1am: Casa Delirium

      1–2am: KEM KEM (Olukemi Lijadu)

      2–3am: Ashley Holmes


      Whether you've been part of Spike Island for decades or are discovering us for the first time, this is an invitation to come together, celebrate our past and help shape our future. As a registered charity, every ticket sold supports Spike Island's exhibitions, artist studios, commissions and public programmes, helping to ensure the next 50 years of artist-led experimentation can thrive.


      Tickets from £15, with community and concession tickets available

