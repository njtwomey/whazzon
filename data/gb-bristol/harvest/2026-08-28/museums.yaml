        summary: "Four drop-in sessions with University of Bristol researchers in the Test Lab — AI books, grown furniture, quantum computing and multisensory interfaces. The last of them is today, so the strand is over before the weekend."
        description: "- **Wed 5 Aug: Help write a book!** Get a sneak peak and help edit a book about AI for

