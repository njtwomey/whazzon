    notes: "Two fetches: /categories/festivals as the catalogue directs, then page 2. This source earns its place as the category's safety net, and its value is almost entirely in what it found that the catalogue does not have. Page 1 lists twenty dated entries running from 17 August 2026 to 2 May 2027. Eleven are outside Cork City (Blarney, Bandon, Bantry, Cobh, Cape Clear, Leap, Kinsale, Doneraile, Youghal) and are dropped. **Nine of the city entries duplicate festivals this file already records from the festivals' own sites, and those are deliberately not recorded again** — two cards for one festival is worse than one. The corroboration is worth having, though: Pure Cork's dates for Guinness Cork Jazz (22-26 October 2026), Cork Folk Festival (8-11 October 2026), the Dragon of Shandon (31 October 2026), Blackpool Block Party (23 August 2026) and Cork International Choral Festival (28 April - 2 May 2027) match their own sites exactly. **One does not, and the hint's warning about drift is confirmed: Pure Cork advertises Cork International Film Festival as 5-15 November 2026 where the festival's own site says 12-22 November 2026.** The festival's dates are the ones this file records. What is left, and what is recorded here, is three Cork City festivals that are **not in the catalogue at all**: Priosma – Queer Film Festival, Upstart Festival Cork and the Cork Heritage Pubs City Wide Jazz Festival Club. All three are stage 1 candidates. Every row from this source is `confidence: medium`, because of the documented drift and because the index prints no weekday to check a year against. The index exposes no images and no per-entry descriptions whatsoever, so those fields are absent by necessity. **Pages 2 and 3 are the \"More Festivals\" block and give a month with no day for all 48 of their entries, so nothing from them is recorded** — but seventeen of the 48 are in Cork City and are worth stage 1's attention as catalogue candidates: Pitch'd Circus and Street Arts Festival (August), Updown Circus Festival (September), Family Fun Day (September), Quiet Lights Festival (November), two Cork Zine Fest events (November), Oíche Scoraíochta Le Dick Beamish (January), Ortús Chamber Music Festival (February), Meet The Engineers Family Open Day (March), Féile Fearann Rí (March), Cork Whiskey Fest (March), Cork World Book Festival (April), Cork Mela (May), Cork Fringe Festival (May), and five Culture Night entries. Note two data quality problems in that block for the reviewer: it lists \"Sounds From A Safe Harbour | September | Cork City\" in what that festival's own site confirms is an off year, and page 1 carries an entry literally titled \"Doneraile Samhain Festival 2023\" dated 27-29 October 2026."
