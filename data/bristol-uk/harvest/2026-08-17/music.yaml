  - sourceId: "music/motion"
    fetch:
      ok: true
      url: "https://motion-bristol.com/whats-on/"
      status: 200
    events: []
    notes: "This is the one that needs stage 1's attention. The re-pointed URL resolves and returns 200, and the site is genuinely Motion's (title \"Motion Bristol\", nav for the Bingo Lingo and Momentum brands), but it lists no upcoming events at all — so a re-harvest has not fixed what the URL change was meant to fix. I went past the rendered HTML to establish why. The site runs The Events Calendar, which exposes a JSON API at /wp-json/tribe/events/v1/events. That endpoint answers, so this is not a JavaScript problem as the current hint states: querying it forward from today returns total 0, and querying it from 2020 returns 809 events every one of which falls between 22 May and 17 Nov 2021. The calendar has had nothing added for nearly five years. /wp-json/wp/v2/tribe_events likewise returns an empty list. There is no third-party ticketing embed or iframe in the page to load a programme from either. So motion-bristol.com looks like an abandoned build rather than the venue's live listings, and a `check-urls` pass would keep passing it. Two leads for curation, neither followed here because they are not this source: the site links out to themarblefactory-bristol.com, the sister room named in this source's own title; and the catalogue's existing note records that Motion relocated to Unit 2 Victoria Terrace, BS2 0TD in Oct 2025, so whatever programmes that address is where the events now are. The hint's advice to cross-check Resident Advisor looks like the practical answer for this venue."
