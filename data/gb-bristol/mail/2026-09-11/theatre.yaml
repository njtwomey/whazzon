      BEHIND THE SCENES WITH KIRRIS RIVIERE


      In rehearsal for Pieces of My Life, written and performed by TV and theatre actor Kirris Riviere (Hollyoaks, The Sandman) and produced by award-winning theatre company Ad Infinitum (Last Rites, Beautiful Evil Things).


      Kirris Riviere is a Bristol-born storyteller, performer, writer, and musician bringing truth to the stage, screen, and classroom. From powerful one-man shows to blues-fuelled gigs and scripts rooted in justice, Kirris creates work that challenges, and connects.


      His most recent screen credits include the feature film Bad Apples alongside Saoirse Ronan and the upcoming TV drama Falling starring Keeley Hawes, set for release in 2026.


