    notes: "Whole forward programme taken, nothing truncated. Two pages read: the catalogued /whatson/ for the diary, and /whatson/week-ahead for the day-by-day showtimes, which are what timesText carries — the index itself prints only date ranges. Neither page prints a per-film ticket price, so price is omitted throughout; the only pricing on the site is \"Club Shed members get 15% off tickets\" and \"Club Shed members, young people (24 and under) and concession ticket holders get £6 tickets on all Monday screenings\", which is a standing Monday offer rather than bank holiday pricing. Nothing on the site is billed as a bank holiday event, so no event carries the bank-holiday tag; the only Monday 31 August notice is \"Scheduled maintenance to online ticketing system\" from 01:00 to 04:00. Films running across several days are recorded as one `run` each with the per-day times in timesText, rather than one row per screening. The Aardman titles carry the venue's own season name in subcategory. /whatson/week-ahead and /whatson/calendar are useful routes a future run should know about."
