schema: whazzon.catalogue/1
category: notices
label: Listings & Notices
description: >-
  The nets: national schemes with searchable programmes, the craft agencies, and
  the two West Cork papers that covered the flax revival when nobody else did.

  A one-off run by two people has no website, so this is where it gets written
  down — but nearly everything these sources carry is out of scope. They are
  fetched for the textile strand and nothing else.
sources:
  - id: notices/heritage-week
    name: National Heritage Week — event listings
    category: notices
    kind: listing
    status: provisional
    url: https://www.heritageweek.ie/event-listings
    homepage: https://www.heritageweek.ie/
    tags: [national, heritage, august, free, demonstration]
    cadence: weekly
    hints: |
      **The richest source in this catalogue, and it needs a browser.** The listing
      is a JavaScript application: a plain fetch gets a shell and the unfiltered
      first page, which is why the first attempt at it found nothing. Rendered — in
      headless Chrome, `--dump-dom` with a virtual time budget — it works.
      **Search it, do not browse it.** It takes a `?q=` parameter, so the route is
      one search per word of the vocabulary rather than paging 2,600 events:
      `?q=wool`, `?q=weaving`, `?q=knitting`, `?q=crochet`, `?q=spinning`,
      `?q=felting`, `?q=dyeing`, `?q=flax`, `?q=textile`, `?q=quilt`, `?q=lace`.
      Eleven searches returned 33 Munster hits on 2026-08-20.
      The search matches organiser and venue as well as title, so it returns a
      storytelling event under "wool" when the same library also ran a spinning
      talk. Read the title before recording.
      Weekly, not quarterly: the programme is live through August and events three
      days out are the ones worth having. Outside July–September there is nothing
      to fetch.
    notes: >-
      Verified 2026-08-20: 200, listing 2026 events. Twenty Munster fibre events
      came out of it once it was rendered and searched rather than fetched.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/culture-night
    name: Culture Night / Oíche Chultúir
    category: notices
    kind: listing
    status: provisional
    url: https://culturenight.ie/
    tags: [national, september, free, open-studio, demonstration]
    cadence: quarterly
    hints: |
      One night in September, free, and the night weavers and spinners open their
      studios. The programme goes up a few weeks beforehand and is filterable by
      county — take the six Munster counties.
      Nothing to fetch for most of the year. Answers a browser user-agent but gives
      `check-urls` a 403.
    notes: >-
      Verified 2026-08-20: 200 in a browser.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/design-crafts-council
    name: Design & Crafts Council Ireland — What's On
    category: notices
    kind: listing
    status: provisional
    url: https://www.dcci.ie/whats-on/
    homepage: https://www.dcci.ie/
    tags: [national, craft, course, exhibition]
    cadence: monthly
    hints: |
      The national agency's diary. Overwhelmingly out of scope — ceramics,
      jewellery, furniture — so take the textile entries and leave the rest.
      Worth the fetch because a maker running a weekend of natural dyeing in a
      village hall will sometimes register it here and nowhere else.
    notes: >-
      Verified 2026-08-20: 200.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/cork-craft-and-design
    name: Cork Craft & Design
    category: notices
    kind: organiser
    status: provisional
    url: https://corkcraftanddesign.ie/
    area: Cork
    tags: [craft, workshop, august, cork]
    cadence: monthly
    hints: |
      Runs Cork Craft Month every August, which is a fortnight of workshops across
      the county and reliably includes weaving, felting and natural dyeing among
      the pottery and silversmithing.
      A Shopify site: workshops are sold as products, so a date lives on a product
      page. Take only the textile ones.
      `corkcraftanddesign.com` redirects here; catalogued at the domain that
      serves.
    notes: >-
      Verified 2026-08-20: 200. The page title reads "Visa" because the payment
      icons load before the shop name — it is the real Cork Craft & Design shop,
      not a parked domain.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/southern-star
    name: The Southern Star — Things to See & Do
    category: notices
    kind: aggregator
    status: provisional
    url: https://www.southernstar.ie/things-to-see-and-do
    homepage: https://www.southernstar.ie/
    tags: [newspaper, listings, west-cork]
    cadence: weekly
    hints: |
      West Cork's paper of record, and the only source that has covered the flax
      revival repeatedly and ahead of time. Kept even though this location is now
      province-wide, because nothing else covers that story.
      A section of articles rather than a diary: the date is inside the prose and
      some pieces are subscriber-only. Follow only headlines that name a month or
      a weekend, and record `undated` with a note rather than guessing.
    notes: >-
      Verified 2026-08-20: 200. /whats-on is a 404.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/west-cork-people
    name: West Cork People — Don't Miss
    category: notices
