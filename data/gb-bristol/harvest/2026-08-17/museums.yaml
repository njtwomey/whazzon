        raw: "1 April—31 December 2026


          TOUR: Let us introduce you to our grand historic house and its impressive estate.\n"
        summary: "A guided half-hour of the house and the story of how museum and estate came to be, running three days a week through the Blaise 100 anniversary year."
        description: "Join us for a tour of the stunning Blaise Museum!


          Let us introduce you to our grand historic house, share some stories you won't find

          on the labels, and tell you how Blaise Museum and Blaise Castle Estate came to be.


          You'll be greeted by our knowledgeable tour guide who will introduce you to the

          fascinating history of the house and provide insights into the story of the city

          through the artefacts found there.


          Whether you're a seasoned Bristolian or a curious newcomer, we hope to inspire and

          leave you with a deeper appreciation for the treasures housed within Blaise Museum.


          Tours are approximately 30 minutes long.


          **Tours start:** Fridays 11:30am and 2pm; Saturdays 11:30am and 2pm; Sundays 11:30am

          and 2pm. You can book online up to two days before the event, box office tickets may

          be available to buy on the day (subject to availability).\n"
        confidence: "high"
