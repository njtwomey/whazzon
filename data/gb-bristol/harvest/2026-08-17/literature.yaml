        summary: "The crime club takes Raymond Chandler's The Big Sleep — classic noir, Philip Marlowe, no prior reading required."
        description: "**Whodunnit? Let's find out together! Our Crime and Thriller Book Club is built for readers who love the thrill of a good chase. Whether you're a lifelong fan of golden-age whodunnits or looking to dive into the genre for the first time, our goal is to create a welcoming, lively space to share theories, analyse motives, and celebrate great storytelling. Each month, we'll gather in person to dissect everything from the atmospheric pacing of classic thrillers to the complex puzzles of modern murder mysteries. **


          **In September, we will be discussing *The Big Sleep *by Raymond Chandler: a classic noir that follows a cynical private investigator, Philip Marlowe.**


          **Date:**

          Monday 14th of September


          **Venue:**

          Max Minerva's, 47 Henleaze Road, BS9 4JU


          **Time:**

          Doors at 18:30. Discussion at 18:45. Finish at 19:45.


