    notes: "Reached and read in full; **nothing on it is still to come**, which is a real result rather than a failure. The page interleaves about forty items under category headings (Commissions, Events, Exhibitions, Lectures, Projects, Screenings, Workshops, Interviews) with no forward ordering, and every one prints its year. The three newest are all past: Raku with Karina Killeen \"15th August 2026\" (two days ago), Repousse workshop with Eva Lynch \"20th June 2026\" and the Harcourt Terrace Educate Together NS Percent for Art commission \"20th June 2026\", which is a commission rather than a public event in any case. After those the page drops to 2025 and earlier — Career of an Artist (4 November - 2 December 2025), Factory Fragments by Simon Kidd (19th September 2025), Parallax: Stolen Sealskin (26 Nov 2024 - 26 Nov 2025), SEEN/UNSEEN (11 February - 10 March 2025) — and then to 2023 and back as far as 2009. Nothing recorded, rather than recording forty finished rows. **One catalogue correction:** the hint dates Raku with Karina Killeen to \"19 Jun - 31 Jul 2026\"; the page today prints \"15th August 2026\" for it. Worth reconciling before the next run. /feed/ ignored per the hint, and it is still the WordPress placeholder. Two items carry no date at all — \"Transient-Topographies by Leon Butler\" (a digital commission) and \"The Alibi Of Use\" (an interview) — and are not public dated events, so they are not recorded as `undated` either."
