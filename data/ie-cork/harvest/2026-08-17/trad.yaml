      | Ó Súilleabháin's | 8:00 pm | 12 | Sun Sep 6 |

      | The Gables | 9:30 pm | 19 | Wed Dec 23 |

      | The Gables | 9:00 pm | 19 | Sun Dec 27 |

      | An Spailpín Fánach | 9:30 pm | 1 | Thu Aug 20 |

      | Charlie's | 3:30 pm | 2 | Sun Aug 30 |

      | The Wilton Bar | 7:00 pm | 2 | Sun Aug 30 |


      **No `end` is set on any of them.** The last date a venue appears is that

      venue's data-entry horizon, not the end of its session — Sin É plays seven

      nights a week and stops appearing on 25 August, while The Gables has entered

      dates to 27 December. Copying those into `occurrence.end` would retire live

      weekly sessions off the site in a fortnight. No `start` either: these have been

      running for years and the first printed date is simply today.


      **The guide prints no event titles, no links, no images and no prices.** Titles

      above are composed from the venue and the night or time, because that is all

      the guide gives and four Sin É rows need telling apart. No `url` — there is not

      a single anchor in the gig guide, only day headings, venue names, address lines

      and times, so the site will fall back to this listings page. And **no `price`

      on any row**: the hint says everything here is free and unticketed, and it very

      likely is, but the page itself never uses the word \"free\" or names an

      admission, so asserting `price.free` would be inference rather than

      observation. The Pure Cork and Gables observations below do print FREE and are

      priced accordingly.


      Encoding, confirmed: the page declares `charset=iso-8859-1` and its static

      prose really is Latin-1 (`bodhráns`, `Chorcaí` as single bytes), but the

      database-driven venue names in the guide are UTF-8 bytes served inside it —

      `c3 89`, `c3 93`, `c3 ba`, `c3 a1`, `c3 ad`. Decoded as Latin-1 and repaired,

      the names are `Sin É`, `Ó Súilleabháin's` and `An Spailpín Fánach`, which match

      this catalogue character for character. The stray `'>` prefix on every address

      line is an unclosed `<p style='font-size: 15px;>'` and was stripped as the hint

      instructs.


      Year: the guide prints no year at all. Every one of the 60 day headings carries

      a weekday, and all 60 match a 2026 reading (checked programmatically), so the

      inference is confirmed rather than assumed.


      Three things for stage 1:


      1. **The guide's own prose disagrees with its guide.** The About text names

      \   \"The Corner House (Coburg Street), Sin É (Coburg Street), The Oliver

      \   Plunkett (Oliver Plunkett St) The Long Valley (Winthrop St)\" as its venues,

      \   but the current dated guide contains **no Corner House, no Oliver Plunkett

      \   and no Long Valley rows at all**. The nine venues it actually lists are Sin

      \   É, Clancy's, JJ Walsh's, Old Oak, Ó Súilleabháin's, The Gables, An Spailpín

      \   Fánach, Charlie's and The Wilton Bar. Three catalogue entries lean on this

      \   guide for their \"dated signal\" and will get nothing from it.

      2. **Ó Súilleabháin's Eircode is printed `T12 Hf95`** — the guide's own casing.

      \   The catalogue's `T12 HF95` is the correct form; recorded verbatim in `raw`

      \   only.

      3. **Overlap with venue sources, deliberate and worth a curator's eye.** Eight

      \   of these sixteen sessions are also listed by the venue's own source and so

      \   appear twice in this run, once here with `venue` set and once under the

      \   venue: Ó Súilleabháin's ×2 and JJ Walsh's ×2 (both on Pure Cork), Old Oak ×2

      \   (Pure Cork), and The Gables ×2 (its own gig guide). Sin É, Charlie's and An

      \   Spailpín Fánach are also covered by their own sources but from prose rather

      \   than the same rows. Each observation records what its own source said, which

      \   is the contract, but nothing downstream de-duplicates across sources — so

      \   compile will draw two cards for the same physical session. Flagged rather

      \   than silently suppressed on either side.


      Footer, as warned: `pulsesoftradition.com` is still linked and is now an

      Indonesian gambling site. Not followed. The footer also still reads \"© 2015\".


      **Two tags coined here, and this is the note for both.** Bristol's 144-tag

      vocabulary has `folk` and `open-mic` but nothing for an Irish session, and the

      distinction matters enough in Cork to be filterable:


      - **`trad`** — Irish traditional music specifically, as against `folk`, which in

      \  Bristol's usage covers singer-songwriters and folk-revival gigs. Applied to 46

      \  events in this file. `folk` is kept alongside it only on the two Cork Singers'

      \  Club rows, where the material genuinely is both.

      - **`session`** — the form, not the genre: an open circle of musicians playing

      \  for each other rather than a billed performance to an audience, usually with

      \  no admission and no line-up announced in advance. Applied to 45 events. It is

      \  the single most useful filter in this category, because it separates \"turn up

      \  and there will be tunes\" from \"a named act is playing\". Deliberately also

      \  applied to the Gables' non-trad Thursday session and withheld from the karaoke

      \  and residency rows, which is exactly the line it is meant to draw.


      A third, `karaoke`, is coined once in `trad/old-oak` and justified there.

      Everything else in this file reuses Bristol's vocabulary — twenty existing tags,

      no near-duplicates coined."
