        description: "**Everyone is welcome at our Contemporary Fiction book club, where on the first Wednesday of every month we discuss a recently-published paperback novel. In September, we'll be delving into *The Correspondent *by Virginia Evans, winner of the 2026 Women's Prize of Fiction. **


