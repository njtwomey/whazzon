    notes: >-
      Verified 2026-08-17: /whats-on/ 301s to /guides/, headed "Things to Do in Bristol | Guides | Highlights at Bristol24/7", carrying "15 things to do in Bristol this week, August 17-23 2026" and "45 things to do in Bristol in August 2026". The harvest's 403 was the bot wall, not a dead page.
