    tags: [ civic, free, heritage, family ]
    cadence: monthly
    hints: |
      elizabethfort.ie redirects here; the fort has no site of its own.
      This page is the council's shared event widget — a filter bar (Art &
      Theatre, Family Friendly, Free, ...) above cards printed as "4 Sep / First
      Friday at Elizabeth Fort / #Family Friendly, #Music & Comedy, #Free". The
      day and month are on the card, the year is not — take it from the detail
      page. The same widget is used by Old Cork Waterworks, so the two look
      identical.
      Free to enter. Guided tours and an audio guide run during opening hours
      and are `recurring`, not events; the walls and the star fort are
      `ongoing`. First Friday appears to be a monthly series.
    notes: |
      Verified 2026-08-17: breadcrumb reads Home / Elizabeth Fort / Upcoming
      Events and one dated card is live (First Friday at Elizabeth Fort, 4 Sep).
      Address and Eircode read off the fort's own /visitor-information/ page
      (Elizabeth Fort, Barrack Street, Cork City, T12 C8A0), which also warns
      that wheelchair access to the walls is not possible.
