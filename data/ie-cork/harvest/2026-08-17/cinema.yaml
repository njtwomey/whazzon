    notes: "Richest source in the category, and it needs a third route in the catalogue. Five fetches, one over budget, and the extra one earned its keep by closing off a route: /whatson/gate, /whatson, /whatson/eventcinema, /whatson/specialevent1 and /event/113155. **GATE Screen** gave 23 films across 23 distinct dates, Mon 17 Aug to Tue 29 Sep, 45 performances recorded as 43 rows. The Monday-20:00 / Tuesday-15:00 pairing is a standing world-cinema slot (Blue Heron, The Sacrifice, Love Me Tender, The Summer Book, On The Sea, Ish, Just An Illusion all sit in it). **Truncation, declared:** /whatson/gate prints at most three performances per film and then a \"Show More\" link to /event/<id>. Seven of the 23 films hit that ceiling — All Wishes Come True!, An Irish Atlantic Rainforest, Charlie The Wonderdog, Gealtra, Toy Story 5, Tony and Harry Potter And The Philosopher's Stone — so those seven runs are longer than the rows here show. The obvious fix does not work, and this is the fetch worth recording: /event/113155 (Gealtra) does carry a fourth performance the strand page omits, perfCode 218633, but it prints all four under one visible \"17 August\" heading with the date strip as a client-side filter, and it ships no var_dump at all. So the per-film page has more performances and no way to date them, while the strand page has fewer and dates them exactly. The strand page is the better route and the missing dates are not reachable without a browser. **Route to add:** /whatson/eventcinema is the Arc Live! event cinema strand and it is the single most valuable page on this domain — 15 titles, 26 dated screenings, 3 Sep 2026 out to Sun 30 May 2027, covering NT Live, the Royal Ballet and Royal Opera 2026-27 cinema season, Exhibition on Screen, GIANT - The Play, Girl From The North Country and Andre Rieu's Christmas concert. Nothing else in Cork publishes a diary nine months ahead. The footer advertises further strand paths — /whatson/worldcinema, /whatson/specialevent1 (Anniversary Screenings), /whatson/specialevent3 (linked twice, once as \"BACK TO THE 80s\" and once as \"Cork City FC. Away Games LIVE!\"), /whatson/film-festival (ANIME), /whatson/subtitled, /whatson/sensory, /whatson/silverscreen, /whatson/kidsclub, /whatson/parent-baby. I spent one fetch testing /whatson/specialevent1 and it is precisely the trap the hint warns about: 200, 68 KB, correct <title>, and zero performances — the homepage fallback. Compare byte size, not status. The var_dump wart is still there but it is inside HTML comments, not visible text, so a stripper that drops comments loses it. It is worth keeping: each performance object carries hall, halltype, perftype, soldout, subtitled, hoh, autismfriendly, advancescreening, language, performancetags and a unix time, and the dates and times here were read from that rather than from the rendered strings. Nothing was flagged soldout or subtitled today. **Encoding bug worth a hint:** these pages are Windows-1252 bytes served under <meta charset=\"UTF-8\">, so apostrophes (0x92) and en dashes (0x96) are invalid UTF-8 and a naive read mangles every RBO title. Titles here are decoded as CP1252, which restores \"RBO 2026-27: The Royal Opera – Götterdämmerung\" and \"Andre Rieu's\" (no accent — that is how the page prints it). **Not recorded, per the multiplex rule:** /whatson itself carries five days (Today to Fri 21 Aug) with 242 performances, and it is the routine first-run programme — Spider-Man, Moana, Toy Story 5 and the rest. Everything taken from this source is either the GATE arthouse strand or event cinema. Two things the hint predicts that are **not** in today's listings: CIFF Selects Cine Club, the monthly last-Wednesday programmer-introduced screening, appears nowhere, and neither does any November CIFF title — the GATE page stops at 29 Sep. The 11-13 Sep cluster (RADIANT CUTS, SUMMER'S CAMERA, Go Fish, BEAUTIFUL EVENING BEAUTIFUL DAY, DRAGGING UP THE PAST, REFRACTED LIGHTS, I'M GOING TO MISS YOU) is plainly a festival weekend in the GATE screen, and the footer links a PRIOSMA Film Festival while the film dropdown carries \"PRIOSMA - NEW IRISH SHORTS PROGRAMME 2026\" and \"F*CK DRUGS\" with no dates on the strand page. I have tagged those rows `festival` but named no festival on any of them, because the page never prints one against a screening — that attribution belongs to the festivals catalogue. Finally, the Gate handover is confirmed in the venue's own words: /whatson/gate reads \"we are proud to continue the rich tradition of cinematic excellence established by Cork's Gate Cinema\" and \"Gate Screen, hidden in Screen 6\", and every booking link on the site is still on gatecork.admit-one.eu."
