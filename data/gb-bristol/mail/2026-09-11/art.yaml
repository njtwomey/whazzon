      This September marks the final month to experience our major exhibitions, Polly Braden: Against the Tide <https://us.list-manage.com/11X1ETPl9GJ?c2id=f72c0baeff5443160e506a2cebfddff2> and Jonathan Baldock: Held <https://us.list-manage.com/v_o5Ujr0Na8?c2id=f72c0baeff5443160e506a2cebfddff2>, alongside the continuation of Besides the Sea <https://us.list-manage.com/qO8vLnUuM_M?c2id=f72c0baeff5443160e506a2cebfddff2> in Gallery 5.


      From 8 September, the FVU film programme concludes in the Dark Studio with Mahdy Abo Bahat: The Wretched of the Clouds <https://us.list-manage.com/95Bazc86y_S?c2id=f72c0baeff5443160e506a2cebfddff2>, an evocative film exploring memory, loss and erasure in post-revolution Egypt.


      Alongside our exhibitions and film programme, September brings a rich programme of creative workshops, artist talks and performances, offering plenty of opportunities to make, discover and connect at Arnolfini.


