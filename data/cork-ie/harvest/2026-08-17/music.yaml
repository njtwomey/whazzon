    notes: "The hint's 403 warning is right and still current: /whats-on/ refuses a plain fetcher and returns 200 to a browser user-agent, which is how this was read. The page lists 68 dated rows from 17 Aug 2026 to 20 Feb 2027, each with its own /whats-on/<slug>-<id> link and image.

      The 68 rows break down as 41 live music, 22 Comedy Cavern and 5 Monday trad. All 41 music rows are recorded — nothing truncated — folded to 40 events because the two 25 Oct Mary Coughlan rows are two sittings of one show rather than two shows: corkgigs gives them as 3:30pm and 7:30pm, so they are one `single` with both times in timesText. The five Monday \"Trad Session\" rows (17, 24, 31 Aug and 7, 14 Sep) are folded into one recurring event as the hint instructs. That gives 41 events here.

      **The 22 Comedy Cavern rows are deliberately not recorded**, per the hint that only the live-music strand belongs to this category; they are Coughlan's own comedy programme and the comedy catalogue has comedy/coco-comedy-club and comedy/snatch-comedy-improv covering that ground. For the record they were: Test Tube Babies 18 Aug; Sadhbh McLoughlin 20 Aug; Aidan Kelly 25 Aug; Neil Delamere 30 Aug (sold out); Open Mic with Thomas Lawrance 1 Sep; Snatch Improv 8 Sep; Padraig McAuliffe 22 Sep; Jack Milne 29 Sep; Deirdre O'Kane 1, 2 and 3 Oct (all sold out); Emma Doran 9 Oct; Mark Simmons 13 and 14 Oct; John Meagher 17 Oct; Kim Blythe 4 Nov; William Thompson 7 Nov (two rows, one sold out); Eve Darcy 14 Nov; Sandro Ford 24 Nov; Michael Akadiri 5 Dec; Kiri Pritchard-McLean 20 Feb. The Emma Doran row is the case the hint predicts — Coughlan's promoting into **The Everyman, MacCurtain St** rather than its own room.

      The venue's own page prints no prices and no start times. Prices below are the door prices from the corkgigs diary, with the gigs.ie booking price (fee-inclusive, and often several euro higher) noted in `raw` where the two differ; start times are from corkgigs. Rows with no price on either source carry no `price`. \"SOLD OUT\" is stripped from titles as decoration, per the hint, and carried in `status` instead. The #CLMF26 tag in eleven titles is the Coughlan's Live Music Festival strand, 23–28 September, and is kept in the title as printed.

      One inconsistency for a curator: gigs.ie lists the Kiri Pritchard-McLean date as \"Sat 20 Feb\" but its own URL says 21 Feb; 20 Feb 2027 is the Saturday, so Coughlan's own page is right."
