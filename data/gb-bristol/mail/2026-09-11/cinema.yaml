      LUNCHTIME TALK: \"JUST ENOUGH\" AI


      Fri 11 Sept 13:00


      In this talk, Matt Dowse and Mary Stevens from the Centre for Sociodigital Future (CenSoF) will present the ideas behind their upcoming project Just Enough AI: Developing Demonstrators For Responsible, Appropriate Scale A.I. Within Planetary Boundaries.


      Lunchtime Talks <https://us.list-manage.com/JScbRHsQZ85?c2id=944927b628e367996f6a53da7340e920&m=aGOa_euD_a9avoQHklfJZmob2gtEwG7qnMQGhIQP0mm8yGwHeConlizW3peO> are a series of informal presentations at Watershed’s Pervasive Media Studio <https://us.list-manage.com/YYWWqlD8soH?c2id=944927b628e367996f6a53da7340e920&m=DYHevC3AjpgqKZ_pOWighDJqBYlRURGa_nti8AqGOcxG4ELGmHoF2SDiKEkl>. They take place at 13:00 on a Friday and are free and open to everyone.


      Read more <https://us.list-manage.com/A1OUB1UoJ1x?c2id=944927b628e367996f6a53da7340e920&m=E1JO9bW9Q5l10KxY-skl_RLE5-wAHNJsuLmQHpu-qM1BgamTSv3FIkhierEH>   reserve free tickets <https://us.list-manage.com/11AYK5VcDKd?c2id=944927b628e367996f6a53da7340e920&m=6bwhcL9cnCgDCnrfkVPyhZC4MubF783sWtlFnVyYX4naa-jZrNc7I-AUMREW>


      THE REPUBLIC 15


      Dir: Quincy Andrews, UK, English, 2026, 1hr 21mins

      Fri 11 Sept for at least one week


      The Republic documents the story of Stokes Croft, portraying a diverse community that dares to defy the cold winds of corporate power and globalisation. But their greatest challenge looms as developers target this quarter and ready their wrecking balls.


      Read more <https://us.list-manage.com/Vif0_zIahxF?c2id=944927b628e367996f6a53da7340e920&m=GUpV4ABig8962lPOuaWBZ9w36A3fWxvZvOY4MvBcR_tUaDH0ZC-ejA9T6Kfe>   Buy tickets <https://us.list-manage.com/_z10LXzxzhT?c2id=944927b628e367996f6a53da7340e920&m=DK0Qz6shn7qP-LTpZPxIrqIqNykP7iYcoECRD-pa8wa76D1b1XiyhPLJiJ-B>


      LA FEMME INFIDÈLE 15 (S)


      Dir: Claude Chabrol, France, French, 1969, 1hr 38mins

      Fri 11 - Sun 13 Sept


      Chabrol’s ice cold tale of infidelity, passion and violence – an unmissable Hitchcockian thriller set against a backdrop of bourgeois respectability in late 1960’s Versailles which inspired Andrey Zvyagintsev's Cannes 2026 Grand Prix winner Minotaur.


      Claude Chabrol: Elements of Crime <https://us.list-manage.com/c0aeeEwwAeE?c2id=944927b628e367996f6a53da7340e920&m=WV29PODDYVhVLMWoCHr-_SgH-BAGw8Xr8EwiHg9h0bI_SdRS5yR50h46jjP7> is a selection of newly restored films allowing us to experience again Chabrol’s elegant and thrilling cinema.


