    notes: "Four pages read in one pass: /education/adult-education/ (recorded in `fetch.url`), /education/year-long-course/, /exhibitions/exhibitions-current/ and the /feed/ route. The catalogue hint is exactly right — the education pages carry no dates at all, so both course entries are recorded as recurring with the pattern the page states and no invented start date.

      Two things for stage 1. First, **the dated courses do exist, just not on this site**: Eventbrite carries four Cork Printmakers weekend courses with real dates (Advanced Bookbinding 5–6 Sep, Etching 19–20 Sep, Stone Lithography 3–4 Oct, Photopolymer 31 Oct–1 Nov 2026). They are recorded under making/eventbrite-cork-crafts with `venue.sourceId: making/cork-printmakers`. A `booking` route pointing at the studio's Eventbrite organiser page would be the single highest-value addition to this catalogue entry.

      Second, /exhibitions/exhibitions-current/ is stale: both shows it calls \"Current\" have finished or have no year. \"In the Fold of the Earth\" ran 14 May – 30 July 2026 (year confirmed by \"Opening Reception: 5pm Thursday 14 May 2026\" — 14 May 2026 is a Thursday) and is recorded with its real past dates so the pipeline retires it. \"BIND\" says only \"June – July\" with no year, and its feed item was published 12 August 2026, which is after any June–July it could mean, so it is recorded `undated` rather than guessed either way.

      The feed's three residency posts (Colleen Blackard, Barry O'Keefe, Thomas J. Logan, Viola Chiang) are not recorded — a studio residency is not something a reader can attend."
