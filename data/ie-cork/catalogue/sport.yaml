schema: whazzon.catalogue/1
category: sport
label: Sport
description: >-
  Hurling and Gaelic football first — in Cork these are civic occasions, not a niche — then rugby, League of Ireland football, greyhound and horse racing, athletics, rowing on the Lee, and the free weekly participation events. Most of this is fixture lists: they are published a season at a time and then move, so the value is in re-checking dates rather than discovering new events.
sources:
  # ---------------------------------------------------------------- GAA ------
  - id: sport/cork-gaa
    name: Cork GAA (Cork County Board)
    category: sport
    kind: aggregator
    status: provisional
    url: https://gaacork.ie/fixtures/
    tags: [ gaa, hurling, gaelic-football, camogie, fixtures, major, civic ]
    cadence: weekly
    hints: |
      The backbone of this category. One page carries every county and club
      fixture in Cork across dozens of grounds, so treat it as an aggregator:
      set `venue` on each event from the ground named in the row, and expect
      most of them to be club pitches that are not catalogued sources.

      Server-rendered by the SportLoMo plugin, with each row giving date, time,
      competition, the two teams and the ground ("20/08/2026 … Pairc Ui Rinn …
      Valley Rovers"). Two things to know:

      - The date range is a POST form, defaulting to a rolling window of roughly
        the next two weeks. Query-string overrides are ignored — `?fdate=…&tdate=…`
        returns the same default window — so a plain GET gives you a fortnight
        and no more. Re-harvest weekly rather than trying to widen the horizon.
      - Divisions and competitions are separate POST filters. The unfiltered
        page is the union of them, which is what you want.

      Two grounds carry most of the county fixtures: SuperValu Páirc Uí Chaoimh
      on the Marina (catalogued separately) and Páirc Uí Rinn in Ballinlough,
      which has no site of its own and appears only as a ground name here.

      gaacork.ie/masterfixtureplan/ is the season-long plan and
      gaacork.ie/tickets/ the ticket links; both are prose around the same
      fixture data.
    notes: >-
      Verified 2026-08-17: page titled "Fixtures – Cork GAA", with dated fixtures server-rendered from Thursday 20th August, Co-Op Superstores Premier IHC at Páirc Uí Rinn. Camogie and ladies football fixtures may not all surface here — the competition filter lists only hurling and football grades, while club sites such as Nemo Rangers show Camogie and LGFA championship games. A human should decide whether Cork Camogie and Cork LGFA need their own sources; note that corkcamogie.ie has lapsed and now serves a crypto casino, so there is no separate camogie domain to point at.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/pairc-ui-chaoimh
    name: SuperValu Páirc Uí Chaoimh
    category: sport
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://gaacork.ie/paircuichaoimh/whats-on/
      - role: api
        url: https://gaacork.ie/wp-json/tribe/events/v1/events
        note: The Events Calendar REST API — the stadium's dated diary in one fetch
      - role: ics
        url: https://gaacork.ie/events/?ical=1
    area: The Marina
    address:
      street: The Marina
      locality: Ballintemple
      city: Cork
      postcode: T12 PF30
      country: Ireland
    tags: [ gaa, hurling, gaelic-football, stadium, major, ticketed, civic ]
    cadence: weekly
    hints: |
      Cork's principal stadium, 45,000 capacity, officially the Cork Athletic
      Grounds and trading since February 2024 as **SuperValu Páirc Uí Chaoimh** —
      use the sponsored name, it is what the venue calls itself throughout.

      Two distinct programmes come out of here and they need different routes:

      - **Gaelic games** — county and Munster championship fixtures. These are
        not on the stadium's own pages; they are in the Cork GAA fixtures list
        and the Munster GAA fixtures list, both catalogued separately.
      - **Everything else** — soccer internationals, Munster Rugby's occasional
        Cork outings, stadium concerts. These are the ones on the What's On
        page and in the Events Calendar feed above.

      The stadium's own domain, paircuichaoimh.ie, is dead (see notes) — do not
      fetch it. The whats-on page mixes news items with the calendar; the dated
      block is at the bottom, and the api/ics routes give the same two entries
      cleanly.
    notes: >-
      Verified 2026-08-17: paircuichaoimh.ie is a suspended cPanel account — it redirects to /cgi-sys/suspendedpage.cgi, titled "Account Suspended", and its TLS certificate expired on 6 August 2026. The stadium's live pages have moved under Cork GAA at gaacork.ie/paircuichaoimh/, titled "SuperValu Páirc Uí Chaoimh – Cork GAA", with the address above read off the page footer. The what's-on page and the tribe API both return the same two forthcoming events: Republic of Ireland Women v Kazakhstan, 13 October 2026 19:30, and Munster Rugby v Racing 92, 17 October 2026 20:00. A human should decide whether the dead paircuichaoimh.ie domain is worth watching for a return.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/munster-gaa
    name: Munster GAA
    category: sport
    kind: aggregator
    status: provisional
    url: https://munster.gaa.ie/fixtures/
    tags: [ gaa, hurling, gaelic-football, fixtures, major ]
    cadence: weekly
    hints: |
      The provincial council. Matters here because the Munster senior hurling
      and football championships are the biggest days in Cork's year and are
      played at Páirc Uí Chaoimh — set `venue.sourceId` to
      sport/pairc-ui-chaoimh when the ground matches, and skip fixtures at
      Limerick, Thurles or Killarney.

      Provincial championships run February to July; the page is quiet the rest
      of the year. Separate senior / under-20 / minor sub-pages exist under
      /fixtures/, plus an Events Calendar in the same nav.
    notes: >-
      Verified 2026-08-17: page titled "Fixtures - Munster GAA", with the fixtures nav (senior, under-20, minor, Munster Hurling League, McGrath Cup) present. Same SportLoMo platform as Cork GAA, so expect the same rolling date window rather than a full season.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/gaa-national
    name: GAA fixtures & results (gaa.ie)
    category: sport
    kind: aggregator
    status: provisional
    url: https://www.gaa.ie/fixtures-results
    tags: [ gaa, hurling, gaelic-football, fixtures, major ]
    cadence: weekly
    hints: |
      The national list. Catch-all for Cork's All-Ireland series games and for
      neutral-venue fixtures staged at Páirc Uí Chaoimh that neither the county
      nor the provincial page carries. Almost all of it is outside Cork —
      filter hard on the ground, and drop anything at Croke Park unless a human
      later decides away fixtures are wanted.
    notes: >-
      Verified 2026-08-17: 200 at /fixtures-results (no trailing slash), titled "GAA.ie - GAA Match Video and Highlights, Fixtures and Results, Latest News". Large page; the fixture rows themselves were not visible to a plain fetch, so stage 2 should expect to look for a JSON block or a client-rendered widget.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/nemo-rangers
    name: Nemo Rangers GAA
    category: sport
    kind: organiser
    status: provisional
    url: https://nemorangers.ie/fixtures
    area: Douglas
    tags: [ gaa, gaelic-football, hurling, camogie, fixtures, community ]
    cadence: weekly
    hints: |
      Cork's most decorated football club, at Trabeg off the South Douglas Road.
      Included as the worked example of a city club that publishes its own list:
      /fixtures is server-rendered with date, time, competition, both teams and
      the ground, and — unlike the county board page — it includes Camogie and
      LGFA championship fixtures.

      Filter by ground: many rows are away games at club pitches across the
      county. "At Away" appears where the venue is unknown, which is an
      `occurrence` you can date but not place.
    notes: >-
      Verified 2026-08-17: page titled "Nemo Rangers - Fixtures", listing dated games from Monday 17 August 2026 at 7.00pm, Junior C Football Championship, Whites Cross v Nemo Rangers at Ballinlough. Sister pages /results and /ua_fixtures (underage) exist on the same platform.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/blackrock-hurling
    name: Blackrock National Hurling Club
    category: sport
    kind: organiser
    status: provisional
    url: https://www.blackrockhurlingclub.com/
    area: Blackrock
    tags: [ gaa, hurling, community ]
    cadence: weekly
    hints: |
      One of the city's senior hurling clubs, on Church Road in Blackrock.
      Fixtures are on the Cork GAA county list rather than here, so the value of
      this source is club-level notices — tournaments, juvenile blitzes, club
      events — that the county page never carries.
    notes: >-
      Verified 2026-08-17: the domain answers 200 and is the club's own site. /fixtures 404s, so no separate fixtures path was found; the url above is the homepage, which is the page that lists things. Unverified whether the homepage carries dated items — a human should check before promoting this past provisional.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  # -------------------------------------------------------------- RUGBY ------
  - id: sport/munster-rugby
    name: Munster Rugby
    category: sport
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://www.munsterrugby.ie/munster-rugby-fixtures-results/
      - role: ics
        url: https://cdn.soticservers.net/tools/wordpress/ical/calendar.php?TeamId=22&CompId=4585&source=sfms&project=celtic,erc,munster
        note: club's own iCal; CompId is season-specific and currently serves the completed 2025 URC season
    area: Ballyphehane
    tags: [ rugby, fixtures, ticketed, major ]
    cadence: weekly
    hints: |
      Munster split their home games between Thomond Park in Limerick and
      Virgin Media Park in Cork, so **every fixture must be filtered on the
      ground** — roughly one Cork game in four. Set `venue.sourceId` to
      sport/virgin-media-park where it matches, and drop Limerick outright.
      A handful of the biggest games move to Páirc Uí Chaoimh instead.

      The human fixtures page is client-rendered: a fetcher sees the season
      dropdown, "All kick-off times are listed in your local time" and no
      fixture rows at all. So the ICS route is the one that carries data — but
      read `X-WR-CALNAME` before trusting it, because the club has not
      repointed the link and it currently returns "2025 United Rugby
      Championship", 18 completed fixtures. When the 2026-27 CompId appears at
      /fixtures-results/downloadable-fixture-list/, that is where to find it.

      LOCATION lines in the ICS use the sponsored ground names verbatim
      ("Virgin Media Park", "Thomond Park"), which is the cheapest way to
      filter.
    notes: >-
      Verified 2026-08-17: /fixtures/ and /fixtures-and-results/ both 404. /fixtures-results/ 301s to /munster-rugby-fixtures-results/, titled "Munster Rugby | Men's Fixtures & Results". The ICS above is linked from the club's own downloadable-fixture-list page and parses to 18 VEVENTs with real Munster fixtures, two of them at Virgin Media Park — but all in the past. ?rest_route=/tribe/events/v1/events 404s; /feed/ answers but is news, not fixtures.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/virgin-media-park
    name: Virgin Media Park (Musgrave Park)
    category: sport
    kind: venue
    status: provisional
    url: https://www.munsterrugby.ie/the-club/stadia/virgin-media-park/
    area: Ballyphehane
    address:
      locality: Ballyphehane
      city: Cork
      country: Ireland
    tags: [ rugby, stadium, ticketed, major ]
    cadence: monthly
    hints: |
      **Record the sponsored name.** Musgrave Park has traded as Virgin Media
      Park since a five-year naming-rights deal in January 2024; the venue's own
      pages use only the new name, so a listing that says "Musgrave Park" is
      matching on a name the ground no longer uses.

      8,008 capacity, and shared: Munster Rugby's Cork home plus two All-Ireland
      League clubs, Dolphin RFC and Sundays Well RFC, all catalogued separately.
      This page is a stadium-information page rather than a diary — cadence is
      monthly because what changes here is the venue description, not a
      programme. Fixtures come from the three tenants.
    notes: >-
      Verified 2026-08-17: page titled "Munster Rugby | Virgin Media Park" and states "Virgin Media Park, formerly Musgrave Park, is the Cork home of Munster Rugby and is also home to two of the All Ireland League Senior Club sides, Dolphin RFC and Sundays Well RFC" and "situated between Tramore Road and Pearse Road in Ballyphehane". No postcode is printed on the page, so the address is deliberately partial rather than guessed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/cork-constitution
    name: Cork Constitution FC
    category: sport
    kind: organiser
    status: provisional
    url: https://www.corkcon.ie/fixtures
    area: Ballintemple
    tags: [ rugby, fixtures, ticketed ]
    cadence: weekly
    hints: |
      Energia All-Ireland League, playing at Temple Hill. Fixtures are a plain
      server-rendered table of date, kick-off, opponent and venue, with home
      games marked "(H)" and Temple Hill named — so home/away separation is
      trivial. AIL season runs late September to April; nothing between May and
      August.
    notes: >-
      Verified 2026-08-17: page titled "FIXTURES | Cork Constitution", table server-rendered. But the table is the **2025-2026** season (27/09/2025 to 04/04/2026, all played) — the 2026-27 list is not up yet, and one row carries a typo, "04/04/206". Stage 2 should read the season heading and record an empty harvest rather than ingesting last season as forthcoming.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/highfield-rfc
    name: Highfield RFC
    category: sport
    kind: organiser
    status: provisional
    url: https://www.highfieldrfc.ie/FixtureS.php
    area: Bishopstown
    tags: [ rugby, fixtures ]
    cadence: weekly
    hints: |
      Energia AIL Division 1B, at Woodleigh Park off the Model Farm Road. The
      best-maintained club fixture list of the Cork rugby sources — the only one
      with the current season up in August.

      Capital S in `FixtureS.php` is not a typo: /FixtureS.php is the senior
      list and /FixtureY.php the youth one. Both are hand-built PHP pages,
      server-rendered, with competition, date, time, both teams and the ground.
      Filter on "Woodleigh Park" for home games.
    notes: >-
      Verified 2026-08-17: page titled "Results and Fixtures - Senior", heading "Fixtures ( 2026 - 2027 )", with dated fixtures from Bruff v Highfield, 29/08/2026 2.30pm at Kilballyowen Park and the first home game Highfield v Nenagh Ormond, 26/09/2026 at Woodleigh Park.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/dolphin-rfc
    name: Dolphin RFC
    category: sport
    kind: organiser
    status: provisional
    url: https://dolphinrfc.com/fixtures-results/
    area: Ballyphehane
    tags: [ rugby, fixtures ]
    cadence: weekly
    hints: |
      Founded 1902 and based at Virgin Media Park, so home games are at
      sport/virgin-media-park rather than at a ground of their own; the club's
      postal address is a PO box in Togher. Separate lists exist for the AIL
      side (/ail-repres-fixtures/) and the women's side
      (/womens-senior-fixtures/).

      The page is not UTF-8 clean — decode as latin-1 if a strict parser chokes.
    notes: >-
      Verified 2026-08-17: page titled "Weekend Fixtures / Results - Dolphin RFC" and names the club throughout, but the fixture table is headers only — Day, Date, Team, Competition, Opponents, Venue, K/O Time — with no rows, and the footer still reads "Copyright 2019". Reachable but empty in mid-August; a human should check once the AIL season starts whether it fills in, and mark it dormant if not.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/sundays-well-rfc
    name: Sundays Well RFC
    category: sport
    kind: organiser
    status: provisional
    url: https://sundayswellrfc.com/calendar/calendar/
    area: Ballyphehane
    tags: [ rugby, fixtures, community ]
    cadence: weekly
    hints: |
      The third tenant at Virgin Media Park. WordPress, with individual
      /event/<slug>/ pages per fixture ("senior-xv-v-bandon-rfc") linked from
      the homepage — those carry more than the calendar does, so follow them
      from the homepage if the calendar month is empty.

      `area` is where they play rather than where the name points: home games
      are at Virgin Media Park in Ballyphehane, not in Sunday's Well.
    notes: >-
      Verified 2026-08-17: page titled "Senior XV – The Official Site of Sundays Well RFC" and the site is genuinely the club's. The August 2026 calendar grid is empty and its back-link reads "« May", so the calendar is only populated in season; the homepage did carry /event/ links (Clonakilty, Thurles, Bandon, Kanturk fixtures).
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/munster-club-rugby
    name: Munster domestic rugby fixtures
    category: sport
    kind: aggregator
    status: provisional
    url: https://www.munsterrugby.ie/domestic/domestic-fixtures-results/
    tags: [ rugby, fixtures, community ]
    cadence: weekly
    hints: |
      The province-wide club list — Energia Men's and Women's AIL, All-Ireland
      Cup, junior leagues. The safety net for Cork's club rugby: it catches
      Cork Con, Highfield, Dolphin, Sundays Well, UCC and the junior clubs in
      one place, including the ones with no usable site of their own (UCC RFC
      has no reachable domain).

      Almost everything on it is outside Cork, so filter on the ground and set
      `venue.sourceId` where it matches a catalogued one.
    notes: >-
      Verified 2026-08-17: page titled "Munster Domestic Rugby | Domestic Fixtures & Results" with the full competition nav present. Like the senior fixtures page it is client-rendered — the fetch returned the nav and no fixture rows — so stage 2 should expect to chase the per-competition sub-pages.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  # ------------------------------------------------------------ FOOTBALL -----
  - id: sport/cork-city-fc
    name: Cork City FC
    category: sport
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://www.corkcityfc.ie/pages/cork-city-fc-mens-first-team-fixtures-and-results
      - role: api
        url: https://api-fai.analyticom.de/api/live/competition/42532027/matches/paginated/future/1/56418?page=1&pageSize=36&teamIdFilter=10614
        note: FAI Connect feed behind the page; 403 without an API_KEY header — key is in hints
    area: Turner's Cross
    tags: [ football, fixtures, ticketed, major ]
    cadence: weekly
    hints: |
      Home games at Munster FA Turner's Cross Stadium — set `venue.sourceId` to
      sport/turners-cross. The club is in the **SSE Airtricity Men's First
      Division** in 2026, not the Premier Division, so competition names on
      harvested events should not be assumed.

      The site is a Shopify store and the fixtures page renders four empty tab
      containers — League Fixtures, League Results, FAI Cup Fixtures, FAI Cup
      Results — filled client-side. Nothing dated is in the HTML.

      The api route is the feed that page calls. It needs a request header:

        API_KEY: 8f03d750e912f7ff66d3b5eb1ca39f66d762785059470f85723d7513a71ae097106e5b8d3a548b85e60d49ec9fec2471e2086e9cc95f2f22f741f1962d3db004

      That key is published in the shop theme asset
      /cdn/shop/t/8/assets/mens-first-team-fixture-results.js, which is also
      where to look if it rotates. The payload is richer than the page: per
      match it gives dateTimeUTC, liveStatus, round, competition.name and a
      `facility` object with name, full address and a real latitude/longitude —
      use that for the venue rather than anything from the page. Swap
      `future` for `past` in the path for results, and compFai=42432166 for the
      FAI Cup.

      Link harvested events to the human page, not to the endpoint.
    notes: >-
      Verified 2026-08-17: /fixtures/ 301s to the /pages/… path above, titled "Cork City FC Men's First Team - Fixtures and Results". The api route returns 403 unkeyed and 200 with the header, giving nine forthcoming First Division fixtures including Cork City v Wexford at "Munster FA Turner's Cross Stadium", Curragh Road, T12 DY8P. A human should decide whether a hard-coded third-party API key belongs in the catalogue, since check-urls will see the 403.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/cork-city-fc-women
    name: Cork City FC Women
    category: sport
    kind: organiser
    status: provisional
    url: https://www.corkcityfc.ie/pages/cork-city-fc-womens-first-team-fixtures-and-results
    area: Turner's Cross
    tags: [ football, fixtures, ticketed ]
    cadence: weekly
    hints: |
      Same club and same Shopify platform as the men's team, but a separate
      fixture list and a separate league, so it wants its own events rather than
      a footnote on the men's. Expect the same client-rendered tabs and the same
      FAI Connect feed pattern with different competition and team ids — read
      them out of the page's own theme JS rather than guessing.
    notes: >-
      Verified 2026-08-17: 200, distinct page from the men's list. Its own API ids were not extracted, so no api route is proposed here.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/turners-cross
    name: Munster FA Turner's Cross Stadium
    category: sport
    kind: venue
    status: provisional
    url: https://munsterfootball.ie/fixtures/
    homepage: https://munsterfootball.ie/
    area: Turner's Cross
    address:
      street: Curragh Road
      locality: Turner's Cross
      city: Cork
      postcode: T12 DY8P
      country: Ireland
      lat: 51.8852451
      lon: -8.4666676
    tags: [ football, stadium, ticketed, major ]
    cadence: weekly
    hints: |
      Cork's football ground, owned by the Munster Football Association, whose
      headquarters is at the stadium. Two programmes: Cork City FC's League of
      Ireland home games, which come from the club's own sources, and the
      Munster FA's own cup competitions — Munster Senior Cup, Junior Cup, Youth
      Cup, women's and girls' cups — whose finals are played here. The url is
      the association's fixtures page, i.e. the second of those.

      SportLoMo again, so the same date-form behaviour as the GAA pages.

      **munsterfa.com is not the Munster FA** — see notes. Only munsterfootball.ie.
    notes: >-
      Verified 2026-08-17: munsterfootball.ie is the real association site, titled "Munster FA", with the footer "Munster FA Turners Cross Stadium" and a full competition nav; /fixtures/ is titled "fixtures – Munster FA" but the fixture table rendered with no rows in mid-August. Two lookalikes to avoid: munsterfa.com redirects to baytelet.com, an unrelated site, and munsterfa.ie serves "TOTAP Shop – The Other Three Amigos", an e-commerce store. The address and geocode are the FAI's own facility record for this ground, taken from the Cork City FC feed, not guessed from the postcode.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  # ------------------------------------------------------------- RACING ------
  - id: sport/curraheen-park
    name: Curraheen Park Greyhound Stadium
    category: sport
    kind: venue
    status: provisional
    url: https://www.grireland.ie/go-greyhound-racing/our-stadiums/curraheen-park-greyhound-stadium/
    homepage: https://www.grireland.ie/racing/upcoming-race-cards/
    area: Bishopstown
    address:
      street: Bishopstown Road
      locality: Curraheen
      city: Cork
      postcode: T12 HNP4
      country: Ireland
      lat: 51.879776
      lon: -8.520899
    tags: [ greyhound-racing, weekly, ticketed, family ]
    cadence: weekly
    hints: |
      Racing every Friday and Saturday night: gates 6:30pm, first race about
      7:35pm. That is a `recurring` occurrence, not two events a week — model
      it as the pattern and let the race cards supply the exceptions, or this
      one source produces a hundred near-identical events a year.

      The stadium page carries the schedule and the address but no dated
      meetings. Dated cards are on the national list at
      /racing/upcoming-race-cards/, server-rendered as "17-Aug-26 - Youghal"
      links with the track in the query string — **Cork is track code CRK**.
      Cards are only published midweek for the coming weekend, so a Monday
      fetch will legitimately show no Cork meeting; that is a gap in
      publication, not a dark stadium.

      Beware two other Cork-county tracks in the same national list, Youghal
      (YGL) and Kilcohan Park — both well outside the radius.
    notes: >-
      Verified 2026-08-17: the guessed paths /curraheen-park/, /stadiums/… and /tracks/… all land on grireland.ie's 404 handler; the real path is under /go-greyhound-racing/our-stadiums/. The page names "Curraheen Park Greyhound Stadium", prints "Bishopstown Road, Curraheen, Co. Cork T12 HNP4", states "Racing every Friday & Saturday night" with "1st Race/1ú Rás 7:35pm approx.", and directs to "Check Upcoming Racecards to view exact race times - available midweek for each weekend". The race-cards page is server-rendered and dated; it showed no Cork meeting on a Monday, as expected.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: sport/cork-racecourse
    name: Cork Racecourse Mallow
    category: sport
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://www.corkracecourse.ie/events/
      - role: api
        url: https://www.corkracecourse.ie/wp-json/tribe/events/v1/events
        note: The Events Calendar REST API — the whole meeting list in one fetch
    tags: [ horse-racing, ticketed, family, major ]
    cadence: monthly
    hints: |
      **Read the event title, not the start date.** The calendar entries are
      mis-dated at source: "Sunday 30th August 2026 – Flat Racing" carries
      start_date 2026-09-09, the same date as the following meeting. The title
      is the meeting's real date; the date field is data entry. Record what the
      title says and put the discrepancy in the event note.

      Mixed flat and jumps, roughly a dozen fixtures a year, set a year ahead —
      monthly is plenty. The 2026 fixture list page publishes the year as an
      **image**, so it is useless to a fetcher; the api route is the only clean
      dated source. Meetings are typically evening or Sunday afternoon cards
      with a music act after racing.
    notes: >-
      Verified 2026-08-17: site titled "Cork Racecourse Mallow | Horse Racing Cork Ireland", live and trading. The tribe endpoint returns two forthcoming meetings at venue "Cork Racecourse". **Outside the configured 12km radius** — Mallow is about 35km north of the city, on the Killarney Road — but included deliberately: it is the only horse racing anywhere near Cork, it is named for the city, and a Cork "what's on" that omitted it would be wrong. A human should decide whether to keep it or drop it on distance.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

