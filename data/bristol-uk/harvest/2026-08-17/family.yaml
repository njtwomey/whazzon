    notes: "The hint was exactly right and is what made this source work at all. The catalogued /apps/bookthatapp/calendar page serves a FullCalendar shell whose dates arrive client-side, which is why yesterday's run read a farm running a hundred sessions as an empty page. Two useful specifics to add to the hint, both read out of the calendar page's own JavaScript: the shop is windmill-hill-city-farm-bristol.myshopify.com, and the feed is per-shop rather than the generic host — **https://windmill-hill-city-farm-bristol.bookthatapp.com/availability/schedule.json?start=<ISO>&end=<ISO>&calendar=true**, which returns every bookable occurrence with title, handle, start and end as [Y,M,D,h,m] arrays, image, the shop's own tags, capacity and a `bookedOut` flag. The sibling endpoint the hint names, /calendar/events.json, is the *announcements* layer and returns `{\"events\":[],\"first_occurrence\":null}` — empty today, so it is not where the programme lives. Three fetches total for this source: the calendar page (to find the endpoints), schedule.json for 2026-08-17 to 2027-06-30, and /products.json?limit=250 for prices and copy. **Collapsed, per §4: schedule.json returned 966 occurrences, which are 35 distinct courses and events.** Every weekly session is therefore one `recurring` row and not fifty-two — Team Brave Football alone was 90 rows, Migrateful 91, and eleven others were 45 or 46. Where the product copy states the pattern in the farm's own words it is quoted verbatim (\"every Tuesday evening\", \"Each Tuesday at the Orchard Sauna\", \"every first Friday of the month from 5.30 PM – 9 PM\"); where it does not, the pattern is read off the feed's own occurrence dates, which were checked for a single repeating weekday and gap before being described that way. A deliberate distinction in `occurrence`: the feed's booking window runs out at the end of June 2027, so for the eighteen open-ended weekly classes I have set no `start` or `end` at all, because \"ends 29 June 2027\