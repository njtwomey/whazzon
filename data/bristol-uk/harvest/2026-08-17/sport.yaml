    notes: "The JSON endpoint from the hints works and needs no user-agent trick. Twelve forthcoming

      matches, grouped by month. Worth knowing for next time: the envelope's `message` field

      reads \"No matches found\" while `data` is fully populated — the field is meaningless, read

      `data`.


      Filtered on `ground_name` as the hints instruct. The Bristol ground appears under its

      sponsored name, \"Seat Unique Stadium, Bristol\", and accounts for four matches, all kept.

      The eight excluded are played elsewhere: 2nd XI matches at Hatherley & Reddings CC

      (Cheltenham), Polo Farm and Thornbury CC, and first-team away matches at the College Ground

      in Cheltenham, Chester-le-Street, Old Trafford, Canterbury and Martley. Thornbury is the

      closest of those and is still outside the city.


      Two deliberate omissions. First, the feed carries a start instant and no end, so the

      multi-day first-class matches are recorded as `single` on their opening day rather than as a

      `run` — an end date would have had to be invented from the match class. Second, the only

      time available is `start_datetime_utc`, never a printed wall-clock time, and the same 09:30Z

      value appears against matches whose real start almost certainly differs; converting it would

      have meant betting on what that field actually holds, so `startTime` is left off and the

      verbatim timestamp kept in `raw`.


      Events link to https://www.gloscricket.co.uk/fixtures rather than to the endpoint, as the

      hints ask. That page is client-rendered and yields nothing to a fetcher, so there was no

      per-match page to open and no `description` anywhere."
