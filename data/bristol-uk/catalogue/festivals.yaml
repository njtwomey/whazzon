schema: whazzon.catalogue/1
category: festivals
label: Festivals
description: >-
  Annual, mostly venue-less events. The largest things that happen in the city
  live here, and almost none of them appear on any venue's website.
  Announcements cluster in winter and spring for a summer that sells out early.
