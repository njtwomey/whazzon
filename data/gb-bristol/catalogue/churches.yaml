schema: whazzon.catalogue/1
category: churches
label: Churches & Cathedrals
description: >-
  Working churches whose public programme is largely not religious: organ recitals, choral evensong open to anyone, lunchtime concerts, festival performances borrowing the acoustics, heritage openings and civic events.

  A category rather than a corner of `music` because these sources do not fit one: the concerts belong to music, the tower tours to museums, the carol services to neither, and the buildings themselves are the reason people come. Bristol's existing church venues had ended up scattered — `music/st-georges-bristol` is a deconsecrated concert hall and belongs where it is — and the point of this file is the ones still in use as churches, which nothing else claimed.
sources:
  - id: churches/bristol-cathedral
    name: Bristol Cathedral
    category: churches
    kind: venue
    status: provisional
    url: https://bristol-cathedral.co.uk/whats-on/
    homepage: https://bristol-cathedral.co.uk/
    area: College Green
    tags: [ major, free, classical, heritage ]
    cadence: weekly
    hints: |
      The strongest source in this category: the what-on page carried twenty
      distinct dates and sixty references to concerts, recitals, organ or choir
      when catalogued.
      Read the year on every row — the page mixes forthcoming events with
      archive items going back to 2023, and some rows print a weekday and a day
      of the month with no year at all.
      Much of the programme is free or donation-only: evensong, organ recitals,
      civic services. Set `price.free` from what the page says rather than
      assuming a cathedral charges, and do not assume it is free either.
      Distinguish three things it publishes: ticketed concerts (`single`),
      regular services (`recurring` — and only worth recording where they are
      billed as a musical event, not for every said Eucharist), and exhibitions
      in the cloisters (`run`).
    notes: >-
      Verified 2026-08-17: /whats-on/ answers 200 and is the real listing.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
    address:
      lat: 51.451684
      lon: -2.600669

