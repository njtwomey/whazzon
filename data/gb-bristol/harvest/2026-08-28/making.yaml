    notes: "Nothing on 29-31 August — Spike runs no bank holiday programming and the page says nothing about opening or closing over the weekend. What it does carry is the whole autumn intake, published and dated: fifteen courses starting 21 September to 3 November, and every single one is already marked Sold Out, which is why they are all recorded with status sold-out. A waiting list is offered (\"Course is full? Join our waiting list\") and reduced-cost places are allocated first come first served. Two July summer schools (Wood Engraving 13-16 July, Colour Mixing 17 July) are still on the page but their dates have passed, so they are not recorded. Two things for a curator. First, the two \"10 Week Beginners Screenprinting\" courses both start 21 September and differ only by tutor and time slot, which would collide on event id, so I have appended the tutor and time to each title — the printed title for both is just \"10 Week Beginners Screenprinting\". Second, the \"1 Year Screenprinting (Portfolio Course)\" row links to /product/another-course-name, which is a placeholder slug left in the page source; I have taken the href verbatim as §7 requires rather than guessing the real one, but it will very likely 404 in front of a reader."
