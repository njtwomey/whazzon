    body: "WHAT'S ON <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyDvpe6vASiOooBDLcVzW6B1yTOLJYycVqncIdC-Fdnqsk4eT27fCovBmpw>      DISCOVER <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyDwpe6vASiOooBDYkJ3tzDCnnAyhsOBYFGU9IWovhhu9GsrJWGLnYS8jHM>      CAFÉ BAR <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyDxpe6vASiOooBDqXe1QdJyXxmL2Y2Ro3v8pR33YsmEO76D83790tclQv8>      YOUR VISIT <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyCDpu6vASiOooBDBSKlqhTHcgus3Y59w2iSYoqS74EUbCUVumUsOn2N9MU>


      https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyDzpe6vASiOooBDmkwSaix5HaH9Ua1kIxon9vQTjZNRyV1TWyJFIEvuxAI


      This week we're delighted to announce two stand-out shows from our upcoming Spring programme!


      With booking open tomorrow, scroll down for more.


      JUST ANNOUNCED...


      https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD0pe6vASiOooBDF1kASqbcv1c4kEHBPyOaBQhNJvGagjmniBGaAZ7zAfE


      BEAT FREQUENCIES II: BALINESE GAMELAN IN BRISTOL


      SAT 20 FEB '27, 7.30PM  |  FROM £10


      Beat Frequencies II takes you on a journey through traditional gamelan music and its cross-pollination into Western percussion, featuring traditional repertoire from the Balinese canon, alongside chamber music for marimba, vibes and gamelan, and contemporary pieces for gamelan (more details soon). This is a wonderfully unique opportunity to take a sonic voyage connecting two contrasting archipelagos: the British Isles and Indonesia.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD1pe6vASiOooBDQLlhYFApNZy0KDZIZrsxUVZ7kwY0QO1NBjGjUY6YRv0>


      https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD2pe6vASiOooBD5AzaxYzYuUkDYrAumYjooMDi-FSymCI_JgD3wgCaeb4


      JONATHAN AGNEW


      MY TEN MOMENTS THAT SHAPED MODERN CRICKET


      TUE 27 APR '27, 7.30PM  |  FROM £31


      Jonathan Agnew has spent his professional life at extremely close quarters to cricket’s tumultuous developments. Now, to mark the publication of his new book, Aggers brings his own countdown to the stage for the first time. He’ll share the biggest moments that redefined the sport from the only man on the planet who was there, in person, for every single one. Expect the stories the scorecards left out—dressing-room confessions, commentary-box secrets, and the “leg over” moment voted the greatest in sporting history—with the chance to put your own questions to the man behind the microphone.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD3pe6vASiOooBD5YrpNan9gKLKhqVh7Y2OeqiFED7p-9mSTApRBUMuTdg>


      COMING SOON...


      Chinese Folk Music Concert: A Panorama of Hunan


      Sun 13 Sep, 7.30pm | From £15


      Audiences will encounter the expressive depth and virtuosity of instruments such as the erhu, pipa and sheng, brought to life by nationally renowned, award-winning soloists.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD4pe6vASiOooBDEQr8i75Tk0BfBzGpHVdvZFAd1LirmaF00HdF0zHChfA>


      Nikesh Shukla: The Good Immigrant


      Tue 15 Sep, 7.30pm | From £25


      To mark the book’s 10th anniversary, editor Nikesh Shukla chairs a live panel bringing together original contributors to The Good Immigrant, to reflect on what’s changed in Britain in the decade since publication, what hasn’t.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD5pe6vASiOooBD9zouGaLIq8fpJg0s42GnCJerOMr6Fny4stj5pnfLEG4>


      Lunchtime Jazz: Jon Lloyd & John Law


      Thu 18 Sep, 1pm | £9.50


      As part of his PPianissimo series pianist John Law explores sound, space and silence in the beautiful acoustic of St George’s with his long-time collaborator, saxophonist Jon Lloyd. Contemporary jazz.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD6pe6vASiOooBDNd1g85BTqf3bu6VYqOMqEcVQfFw-AQfqjA3dbjK3Gs0>


      Philosophical Times with Rebecca Buxton


      Sun 20 Sep, 10.30am | £8


      Join the philosopher Rebecca Buxton as she explores some of the big ideas that connect with and emerge from this week’s news stories.


      Book Now <https://arts-mail.co.uk/c/AQjatwUQ0ci5Bxj81qKkAyD7pe6vASiOooBDvLN19AY8L_4ubS44nyycjzpmdqvxq2_pBKYPZdjjYZ4>


      Robert Harris Live in Conversation


