    notes: "Both catalogued routes read — /galleryatno46/ (12 items) and /events/ (62 items) — and **neither carries anything still to come**, so no events are recorded. This is the source the catalogue warned about, and the warning was right, but the year problem is worse than \"no year printed\": the pages mix years *and* the \"Starts / Ends\" values are not always the event dates. Weekday cross-checks settle the ones that can be settled, and every one lands in the past. On /events/, the two newest items are 2025 — \"Fri 21st Nov 3:00pm - 8:00pm\" for the Notre Dame *Tabula* talk (21 November 2025 was a Friday; in 2026 it is a Saturday) and IDI Graduate Awards 2025 \"Thu 16th Oct\" (16 October 2025 was a Thursday). Everything below those is 2023 or earlier: Culture Night 2023 \"Fri 22nd Sep\" (a Friday in 2023), EMERGE Cork Craft Month 2023 \"Thu 3rd Aug\" (a Thursday in 2023), and on back to 2018. On /galleryatno46/ the five Oct-Dec items are the only ones that could conceivably be upcoming, and two of them are demonstrably old: f.Project \"Starts 27 Oct / Ends 5 Nov\" matches the /events/ entry \"Thu 27th Oct - Sat 5th Nov\", and 27 October 2022 was a Thursday with 5 November a Saturday; Crawford Supported Studios \"Starts 9 Dec / Ends 15 Dec\" prints \"SATURDAY 9 - FRIDAY 15 DECEMBER\" in its own body, which is 2023. Given those two, the remaining three from the same block — ART4knowledge Exhibition (12-20 Oct), DrawBridge Podcast Launch (2-16 Nov) and CONJURE // MA by Research (23-30 Nov) — are almost certainly from the same old academic year: DrawBridge names Ciara Rodgers, who appears on /events/ in OBSERVATORIO INTERIOR dated \"Tue 3rd Jan\", a Tuesday in 2023. They print no weekday and no year, nothing corroborates a 2026 reading, and recording a 2022 show as this October would be far worse than recording nothing, so they are left out and listed here instead of being given a guessed year or an `undated` row that could never retire. The seven /galleryatno46/ items that *do* resolve to 2026 have all finished: Art Therapy Summer School (20-24 June 2026, year printed), Second Hand Smoke Graduate Exhibition 2026 (5-11 June 2026, year printed), Ecologies Art Lab (Tuesday 14 April — a Tuesday in 2026), No Stone Left Unturned (Tuesday 28 April, at Cork Public Museum — a Tuesday in 2026), MA in Arts & Engagement Graduate Exhibition (12-18 June), The Heavenly (In)Visibles (23 June - 1 July) and ENLIVENED (7-17 July). **The gallery is current even though the page is not**, exactly as the catalogue says: Visual Artists Ireland dates EMERGE 2026 at No.46 Gallery to 30 July - 17 August 2026, and that row is recorded under art/visual-artists-ireland-cork with `venue.sourceId: art/mtu-crawford-college`. Two things for stage 1: every row on /galleryatno46/ links to `javascript:;` rather than a URL, so no per-event `url` is obtainable from that page at all, and the \"Starts / Ends\" pair on it looks like a display window rather than the event's dates (the Art Therapy Summer School reads \"Starts 23 Mar\" for an event its own body dates to 20-24 June 2026)."
