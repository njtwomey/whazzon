    notes: "Took the `feed` route, which carries the posts at full length — and the whole value of this source today is inside a single post, \"Celebrate August Craft Month 2026 with the Cork Potters Society!\" (published 18 July 2026). It is a directory of member events rather than one event, so it is recorded as five, each with the venue the post names, exactly as the catalogue hint says to treat this source. The post date is publication only; every event date is read out of the body.

      All five are outside Cork city and beyond the config's `radiusKm: 12`: Whitechurch (~10 km north, just inside), Midleton (~22 km east, twice) and Shanagarry (~35 km east). Flagging that rather than silently dropping them, because they are the society's own programme and a curator may want a radius policy for this category — Cork Craft & Design's workshops have the same problem.

      Stabledoor Pottery's day is recorded `undated`: the post gives a full hour-by-hour schedule, a location and a booking phone number but **no date** at all. That is a listing without a date, not a listing whose date has passed, so `undated` is correct here.

      Two feed items were deliberately not recorded. \"Nacria – Aisling Roche\" ran 30 May – 28 June at the Grilse Gallery and is finished. \"Unleashing Your Creativity – Workshops\" (27 February 2026) advertises Orla Culligan's spring 2026 slipcasting, handbuilding and mould-making workshops in Clonakilty — spring has passed, no dates are given, and Clonakilty is ~50 km from the city."
