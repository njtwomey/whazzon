    notes: "**The catalogued URL still does not reach the listings** (repeating the 28 August handover). https://www.improvtheatre.co.uk/?filter=Events returns 200 after a 301 to the apex host, but it is the homepage: a carousel plus Today / This Week / Shows & Events / Classes / Workplace filter buttons and no diary. The full filtered programme is at https://improvtheatre.co.uk/events/?filter=Events, where the homepage's own buttons point, and that is what was harvested. Catalogue URL needs updating to the /events/ path on the apex host.


      24 dated shows from tonight (Friday 11 September) to Friday 11 December, taken whole; the page has no pagination or load-more. The `?filter=Events` parameter works as the hint says: the \"Shows & Events\" pill is active and no theatre-school course appears.


      Since the 28 August run: The Improv Spotlight on Thu 15 October is no longer listed. Nothing on the site says cancelled; it is simply absent, so it is left to the fold. Five rows are new: Burn The Script (25 Sep), Maraoke (14 Oct), Death at the Flower Show (28 Oct), and two Rock the Tots 11am gigs for toddlers (13 Nov, 11 Dec). Rock the Tots sits under the Shows & Events filter, so it is recorded here and tagged family/kids rather than dropped.


      This source is also catalogued under theatre, deliberately; these rows are the comedy-side reading of the same programme and are expected to collide with theatre/bristol-improv-theatre at compile time.


      No event pages were opened. Each card carries its own synopsis, and although a few are one-liners (Rock the Tots, Death at the Flower Show, This Is Your Musical) the programme is 24 rows, so the rule for enriching a thin, small programme does not apply. The listing prints no prices; only the two Student Showcases state one, in their own copy (\"Free entry with optional supporter tickets\"), so `price` is absent everywhere else. Recurrence chips (\"Once a month\", \"The first Friday of each month\", \"Halloween Special!\") describe the series, not the sitting, so each card is a `single` with the chip kept in `raw`. Every card prints a weekday and all 24 check out for 2026."
