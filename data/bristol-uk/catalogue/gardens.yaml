schema: whazzon.catalogue/1
category: gardens
label: Gardens & Horticulture
description: >-
  Botanic gardens, nurseries, growing projects and open-garden schemes. Sharply
  seasonal: plant fairs and open days cluster in spring and early summer, and
  most of this category has nothing on at all in January.
sources:
  - id: gardens/university-botanic-garden
    name: University of Bristol Botanic Garden
    category: gardens
    kind: venue
    status: provisional
    url: https://botanic-garden.bristol.ac.uk/events/
    homepage: https://botanic-garden.bristol.ac.uk/
    area: Stoke Bishop
    tags: [botanic, university, ticketed, plants, tours]
    cadence: monthly
    hints: |
      The city's main botanic garden. Runs guided tours, plant sales and
      seasonal open days alongside a permanent collection — the collection is
      `occurrence.kind: ongoing`, the events are dated.

      The /events/ index carries the whole forward horizon, including the winter
      lecture series into the following spring, so it does not need walking month
      by month (/events/month/YYYY-MM/ exists if you want to confirm). Lectures
      are announced as placeholders with a date and "to be announced" as the
      title — keep the date, do not invent a subject. No admission price is
      printed on either page.
    notes: >-
      Verified 2026-08-17: the catalogued /whats-on/ 404s and the listings moved to /events/. Page header reads
      "University of Bristol Botanic Garden", address "The Holmes, Stoke Park Road, Stoke Bishop, Bristol" matches the
      catalogued area, and nine dated items were listed running from Wednesday Wanders tours to a lecture on
      18 March 2027.
    addedAt: "2026-08-16"

  - id: gardens/national-garden-scheme
    name: National Garden Scheme — Bristol area
    category: gardens
    kind: aggregator
    status: provisional
    url: https://ngs.org.uk/gardens/in/bristol/
    homepage: https://ngs.org.uk/
    tags: [open-gardens, charity, seasonal, private-gardens]
    cadence: quarterly
    hints: |
      Private gardens opening to the public for charity, usually for a single
      afternoon. High-value and genuinely hard to find elsewhere, and already
      scoped to Bristol by this URL, so no radius filtering is needed.

      Openings are published for the whole year at once, in February, so capture
      a long forward horizon — a garden may open on only two days in the entire
      year, and missing the announcement means missing it altogether. Each
      opening is its own `single` event; set `venue.name` from the garden's name,
      since these are private addresses and not catalogued sources.

      This listing page prints no dates at all, only garden names: the dates live
      on each garden's own page, one fetch each, so budget for roughly a dozen
      fetches when the season is live. /gardens/near/bristol/ is the
      currently-open subset rather than the year, and findagarden.ngs.org.uk is a
      JavaScript shell that renders nothing.
    notes: >-
      Cadence corrected 2026-08-17, from monthly to quarterly. Confirmed the publishing pattern rather than the
      report's wording: the Bristol page lists 13 gardens with no opening dates, times or admission on it, and warns
      that "some may have completed their openings for the year"; /gardens/near/bristol/ is down to one garden for
      2026, whose own page says its openings for the year are finished. The whole year publishes in one go with the
      annual Garden Visitor's Handbook — the 2025 edition was published on 1 February for a season running February to
      October, and ngs.org.uk was still advertising the 2026 handbook in August 2026. So the real cadence is annual and
      the useful window opens in February 2027; monthly re-harvesting between seasons fetches an unchanged page twelve
      times. Quarterly is the coarsest value the Cadence enum offers, so it is the closest honest fit.
    addedAt: "2026-08-16"

  - id: gardens/grow-wilder
    name: Grow Wilder
    category: gardens
    kind: venue
    status: provisional
    url: https://www.avonwildlifetrust.org.uk/events?tags=661
    homepage: https://www.avonwildlifetrust.org.uk/grow-wilder
    area: Frenchay
    tags: [growing, wildlife, volunteering, workshops, community]
    cadence: monthly
    hints: |
      Avon Wildlife Trust growing site running workshops, volunteer days and
      seasonal plant sales.

      `?tags=661` is Grow Wilder's tag id on the Trust's shared events feed; the
      site's own /grow-wilder page is a description with no listings and links
      through to it. The tag is not labelled "Grow Wilder" in the filter UI, so
      check the location on each row before trusting the feed after a site
      change. These same rows also appear in the unfiltered feed harvested as
      gardens/avon-wildlife-trust — record them here and leave them out there.
      No prices are printed on the listing page.
    notes: >-
      Verified 2026-08-17: the tag feed returned nine events, every one of them located at "Grow Wilder, Bristol", from
      a BioBlitz on 19 August 2026 to hedgelaying running into January 2027. Site is Avon Wildlife Trust, registered
      charity 280422. The catalogued /grow-wilder URL is a real page but carries no programme, so it moves to homepage.
    addedAt: "2026-08-16"

