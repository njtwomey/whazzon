    notes: "Fetched fine and the re-pointed .com URL is correct — this is the shop's own events page. It lists nothing upcoming. All six events on it have already happened: A Jingle Jangle Song by Mariana Villa-Gilbert (Thu 5 Feb), Plastic by Matthew Rice (Thu 12 Feb), Tarantula by Eduardo Halfon (Mon 2 Mar), Black Bag by Luke Kennard (Tue 24 Mar), Goatsong by Phoebe Giannisi (Wed 15 Apr) and The Villain's Dance by Fiston Mwanza Mujila (Wed 20 May), all 2026, all at 19:00, all ticketed through Headfirst. As the hints warn, the page is not pruned, so those stay on it; none is recorded as an event because none is on. Nothing announced beyond 20 May — the shop is trading and the homepage still teases a \"2026 Events Programme\" with no dates attached, so this reads as a gap in the programme rather than a dormant venue. Worth a re-crawl once autumn dates go up."
