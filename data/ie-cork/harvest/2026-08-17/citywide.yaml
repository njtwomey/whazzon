    notes: "Server-rendered, no bot wall, and the best civic source in the file — but the hint's shape is wrong in a way that matters.

      CORRECTION: the listing carries 58 dated cards, from 1 August to 31 October, not \"several hundred dated rows\". The several-hundred figure is the side navigation, which links 666 event pages including every past one back to 1 July; the main card grid is forward-looking and much smaller. Nor was filtering out past dates necessary — the earliest card is 1 August and it is a run still open.

      The page carries its own explanation, and it should go in the hint: \"Notice: Calendar Under Development — Please be patient as we continue to add events. Our new library calendar is currently under development, and not all events have been added yet.\"

      Only five of the ten branches appear at all: City Library on Grand Parade, Douglas, Frank O'Connor in Mayfield, Tory Top, and Hollyhill with two cards. Ballincollig, Bishopstown, Blackpool, Blarney and Glanmire have nothing listed. That is the calendar being incomplete, not those branches being dark.

      The DD/MM title suffix was stripped as the hint instructs, and eleven weekly or monthly sessions were folded from 34 dated cards into 11 recurring events — Duplo Club alone was seven cards.

      THE INDEX HAS NO TIME AND NO PRICE AT ALL, so twelve event pages were opened, the soonest first. Those twelve rows have a start time, the full window in timesText, and the page's own copy in description. The other 26 have no time, which is a gap in the source rather than in the extraction.

      On price: the site does not print one per event. Its Events Guide page says only \"Events are usually free of charge. Booking may be required, and will be indicated in the event publicity\", which is not a per-event fact, so price.free is set on exactly one row — Harvest Traditions, whose own page says \"This workshop is free to attend but must be booked in advance\". Everything else is left without a price rather than inferred free.

      TWO DATA ERRORS ON THE SITE. Seed Saving with Wolf Seeds prints \"20th August 12:30 - 17th July 13:30\" — an end date seven weeks before its start. Recorded as a single hour on 20 August, which is what the times and the copy describe, at confidence medium. And the same Mayfield singing session is spelled both \"Can Linn\" and \"Cann Linn\" on the same day, at different branches; both recorded as printed.

      ROUTE CHECKED AND NOT WORTH ADDING: /en/what-s-on/events-guide/ is not a diary. It is a page of downloadable PDF newsletters (National Heritage Week, May-June 2026) plus the sentence about events usually being free. The /en/what-s-on/events-calendar/ redirect to /en/events/ is confirmed."
