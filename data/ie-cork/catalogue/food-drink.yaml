    hints: |
      A family bakery on Oliver Plunkett Street since 1872 that runs a cookery
      school — cooking, baking and cake decorating, "from kids and adults,
      one-day to diploma level".

      The catalogued URL is a third-party directory entry and carries no dates,
      so expect to record no events from it. The useful outcome of a harvest here
      is finding the school's current URL, not finding a diary.
    notes: >-
