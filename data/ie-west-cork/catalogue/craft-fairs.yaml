schema: whazzon.catalogue/1
category: craft-fairs
label: Craft Fairs & Markets
description: >-
  Makers' markets, Christmas craft fairs, and the weekly country markets that
  carry craft stalls alongside the food.

  Strongly seasonal: a handful of dates through the summer, then everything at
  once from late October to Christmas. The weekly markets are `recurring` rather
  than fifty-two events — Skibbereen on Saturday, Bantry on Friday, Clonakilty on
  Friday — and the thing worth catching is the special fair that lands on top of
  one of them.
sources:
  - id: craft-fairs/west-cork-crafts
    name: West Cork Crafts, Skibbereen
    category: craft-fairs
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://www.westcorkcrafts.ie/
      - role: listings
        url: https://www.westcorkcrafts.ie/creative_workshops.html
    area: Skibbereen
    tags: [makers, shop, christmas-fair]
    cadence: monthly
    hints: |
      A co-operative shop on Bridge Street run by around thirty makers from across
      the county — ceramics, textiles, jewellery, woodwork, glass. Mostly a shop
      rather than a diary, so expect little most of the year and a burst of fair
      and open-day notices before Christmas.
      There is no /events/ page; whatever there is will be on the front page or in
      a news post. Do not follow the shop pages into a product catalogue.
      The second route is the Creative Workshops page, which is where any dated
      class would be announced.
    notes: >-
      Verified 2026-08-20: both routes 200. /events/ is a 404 — the workshops page
      was found in the first harvest and added here.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: craft-fairs/clonakilty-chamber
