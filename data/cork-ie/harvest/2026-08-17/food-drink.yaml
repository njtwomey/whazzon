        raw: "**Wine Appreciation Course Spring 2026**


          \"We are now enrolling for our Spring 2026 Wine Fundamentals Course. Running over

          4 Saturdays, starting on Saturday Feb 7th (2.00pm) and finishing on Saturday Feb

          28th.


          We cover the basics of wine tasting; the main grape varieties and wine regions of

          the world; winegrowing and winemaking; finishing up with our ever popular food and

          wine matching class. Our courses always focus on organic, sustainable winemaking.


          These classes are educational, interactive and lots of fun!


          €200 for the full course. Enrolling now!


          Or if you can't make the full course, we will open up some spaces for each class

          that can be attended as a stand alone module. The cost for classes 1, 2 or 3 is

          €55 per class and for class 4, which is the Food and Wine Matching and Sparkling

          Wine Module, is €65.


          Interested? Send an email to info@latitude51.ie\"\n"
        summary: "The bar's four-week wine course over consecutive Saturday afternoons — tasting basics, grape varieties and regions, winegrowing, and a food-and-wine matching class to finish. Individual classes can be taken on their own. Ran in February 2026."
        confidence: "high"
    notes: "Read the `feed` route and /wine-events-cork/ (two fetches). The feed is much the better view, and it carries each post's full body, which is where the `description` on the Meet The Makers row comes from — no extra fetch needed. **The diary is thin and entirely behind us: nothing on this source is in the future.** The newest item anywhere is the April 2026 Meet The Makers, and the listings page still files it under \"Upcoming Events\" four months after it happened. The three dated 2026 items are recorded with their real past dates so the fold retires them; **I drew the line at the current calendar year and did not record the 2025-and-older items** (Wine Fundamentals Course Autumn 2025, Guerrilla Tastings: Spuds & Wine, CineCafe: The Widow Clicquot, two 2025 cheese-and-wine Guerrilla Tastings, a 2023 L'Atitude-at-Home box), because a listing more than a year stale is noise rather than a record. The live, useful row is the standing Guerrilla Tastings pattern, recorded `recurring` from the page's own wording; it has no page of its own, so `url` is omitted and the site will fall back to the listings page. **Price contradiction inside this one site, left unreconciled:** the static Wine Fundamentals block on /wine-events-cork/ says \"The price for the 4-week course is €180\", while the Spring 2026 course post says \"€200 for the full course\". The recorded row uses €200 because that is the figure on the dated post I actually harvested; the €180 is on a block that also still reads \"OUR NEXT WINE FUNDAMENTALS COURSE WILL RUN IN AUTUMN 2022\", so that whole panel is four years stale and the catalogue hint's €180 should be corrected. Also worth noting the post titled \"Wine Appreciation Course Spring 2026\" describes itself in the body as the \"Spring 2026 Wine Fundamentals Course\" — the venue uses the two names interchangeably. **Two listing bugs on the page:** \"Guerrilla Tastings: Meet the Makers\" renders twice, once with a byline and once without, and every Guerrilla Tasting post is filed under both \"Guerrilla Tastings\" and \"Past Events\" — so the category taxonomy cannot be used to tell current from finished. **Not recorded, and why:** Speed Tasting, CineCafe and L'Atitude-at-Home are described on the page as formats the bar runs, with no date, no day and no price. They are not listings of anything a reader could act on, so recording them as `undated` would put three permanently-current cards on the site for no benefit. **Confirmed for stage 1: /wp-json/tribe/events/v1/events 404s** — no events calendar plugin, as the catalogue says. The venue is active off-site even while its own diary is quiet: it hosted the SUPRA dinner in St Peter's and half of the North X South wine tasting during Cork on a Fork, both recorded under that source with `venue.sourceId` pointing here, and Beverley Matthews spoke on the festival's natural wine panel."
