schema: whazzon.catalogue/1
category: cinema
label: Cinema
description: Cork's multiplexes, its arthouse and independent screens, and the film societies and arts-centre cinemas that programme world cinema between festivals.
sources:
  - id: cinema/omniplex-mahon-point
    name: Omniplex Cork — Mahon Point
    category: cinema
    kind: venue
    status: provisional
    url: https://www.omniplex.ie/cinema/showtimes/cork
    homepage: https://www.omniplex.ie/
    area: Mahon
    address:
      street: 1 Mahon Point Shopping Centre
      locality: Mahon
      city: Cork
    tags: [ multiplex, commercial, mainstream ]
    cadence: daily
    hints: |
      Thirteen screens, the largest cinema in the city, and the only Omniplex
      within reach of Cork — the chain has no second Cork site. Showtimes are
      server-rendered, so a plain fetch does return dated screenings, but only
      for today: the seven date buttons across the top are a POST form
      (`filterDate` on `searchFilterForm`), not links, and `?date=YYYY-MM-DD`
      is ignored. Harvest daily rather than trying to reach forward. The
      OmniplexMAXX screen and the chain-wide /cinema/events strand (opera,
      concerts, sport, anime) are the parts worth capturing over the fiftieth
      showing of a blockbuster. Per-film pages are /cinema/movie/cork/<slug>.
    notes: >-
      Verified 2026-08-17: page reads "Omniplex Cinema Cork", "a 13-screen cinema in Cork", and prints "1 Mahon Point Shopping Centre, Mahon, Co Cork" — identity, area and URL all agree. No eircode on the page, so none recorded. Their own map link carries query=-8.3962,51.8859 with lat and lon transposed; the site is at 51.8859, -8.3962 if a curator wants to fill in a geocode. No JSON showtimes endpoint exists — the only API on the page is /api/internalapi/?action=addRating|getEventName|setLatLon, none of which returns a schedule.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/arc-cinema-cork
    name: The Arc Cinema Cork
    category: cinema
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://cork.arccinema.ie/whatson
        note: today's showtimes across all screens; one fetch is one day
      - role: listings
        url: https://cork.arccinema.ie/whatson/gate
        note: the GATE Screen arthouse strand, dated weeks ahead — 23 distinct dates out to late September on a single fetch
    homepage: https://cork.arccinema.ie/
    area: City Centre
    address:
      street: North Main Street
      city: Cork
      postcode: T12 KN88
      lat: 51.900749
      lon: -8.479736
    tags: [ multiplex, commercial, mainstream, arthouse ]
    cadence: daily
    hints: |
      Six screens on North Main Street, and the city centre's only commercial
      cinema. The listings live at /whatson — note the spelling, /whats-on
      silently serves the homepage, as does any unknown path, so a 200 here is
      not evidence a path exists. Compare byte sizes rather than status codes.
      Two things make this source unusually worthwhile. Screen 5/6 trades as the
      **GATE Screen**, the arthouse, festival and world-cinema strand inherited
      from the Gate Cinema, and its page carries dates far further forward than
      the main listing. And Cork International Film Festival runs its monthly
      **CIFF Selects Cine Club** here on the last Wednesday of the month, with a
      programmer's introduction — those screenings, and the festival's own
      November programme, appear in these listings; leave the festival record
      itself to the festivals catalogue and set `venue.sourceId` to this entry.
      Also carries plenty of event cinema: NT Live, Royal Ballet and Opera,
      Exhibition on Screen, and re-release seasons ("Back to the 80s").
      One wart: /whatson/gate leaks a PHP `var_dump` of each performance object
      into the page body after every showtime. It is noise, but it is also the
      cleanest place to read `hall`, `soldout`, `subtitled` and the unix `time`.
    notes: >-
      Verified 2026-08-17: /cinema-info reads "ADDRESS: North Main Street, Centre, Cork, T12 KN88" and the pricing tables list HYPERSENSE and GATE SCREEN tiers, so identity, area and both routes agree. This is the former Gate Cinema under new ownership — see cinema/gate-cinema. No JSON endpoint: the page ships jQuery and a date-picker widget and nothing else, and the basket links to gatecork.admit-one.eu, which 302s straight back to cork.arccinema.ie, so there is no separate booking route to record.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/triskel-christchurch
    name: Triskel Christchurch
    category: cinema
    kind: venue
    status: provisional
    url: https://triskelartscentre.ie/cinema/
    homepage: https://triskelartscentre.ie/
    area: City Centre
    address:
      street: Tobin Street
      city: Cork
      lat: 51.897742
      lon: -8.475668
    tags: [ independent, arthouse, cultural-cinema ]
    cadence: weekly
    hints: |
      Cork's arthouse cinema, and the reason the city has year-round world
      cinema at all: a single screen inside a deconsecrated church, with the
      original pews, at the heart of Triskel Arts Centre. /cinema/ is the
      film-only view and is the right route for this category; /whats-on/ is the
      whole arts-centre programme and is mostly classical, jazz and visual art.
      Programming is curated seasons and one-off screenings rather than runs, so
      capture the individual screening date — do not assume a film showing on
      Saturday is on all week. Named strands recur ("The Fantastical Cinema of
      Tim Burton", anniversary presentations, Artists Film International), and
      Cork International Film Festival and the Cork French Film Festival both
      use this room, so festival titles will appear here; set `venue.sourceId`
      to this entry and leave the festivals themselves to that catalogue.
    notes: >-
      Verified 2026-08-17: /cinema/ lists dated screenings (Edward Scissorhands Sat 22 Aug, Batman Returns Sat 29 Aug, Shoot The People Sun 30 Aug – Wed 2 Sep) and the footer reads "Triskel Arts Centre, Tobin St., Cork City, Phone: 021 427 2022" — page, URL and content agree. WordPress, but there is nothing structured to reach: /feed/ 500s, Tribe Events is not installed (both /wp-json/tribe/... and ?rest_route=... 404), and /wp-json/wp/v2/types exposes only posts and pages, so the events are a private post type. Booking is triskelarts.ticketsolve.com, which is a JavaScript shell — every path, including .json and /api/ variants, returns the same 29 KB "Your browser doesn't support JavaScript" page, so it is deliberately not recorded as a route. No eircode is published on the site.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: cinema/reel-picture-blackpool
    name: The Reel Picture Blackpool
    category: cinema
    kind: venue
    status: provisional
    url: https://blackpool.thereelpicture.com/whatson
    homepage: https://blackpool.thereelpicture.com/
    area: Blackpool
    address:
      street: Blackpool Retail Park
      locality: Blackpool
      city: Cork
      postcode: T23 RYN3
      lat: 51.915535
      lon: -8.47141
    tags: [ multiplex, commercial, mainstream ]
    cadence: daily
    hints: |
      The nearest multiplex to the north side, in Blackpool Retail Park. Owned
      and operated by IMC Cinemas, whose own site calls it "Blackpool Cinema" —
      expect that name in aggregator data. Listings are at /whatson and are
      server-rendered with times; a single fetch reaches roughly a week ahead.
      Sibling views worth knowing: /whatson/pure (the premium PURE screen),
      /whatson/kidskorner, /whatson/autismfriendly and /whatson/hardofhearing —
      the accessible and sensory screenings are the part a listings site adds
      most value on. Unknown paths fall back to the homepage rather than 404, so
      check the page title before trusting a 200. There is no contact or
      cinema-info page on the domain at all.
    notes: >-
      Verified 2026-08-17: /whatson is titled "What's On | The Reel Picture Blackpool" and carries today's times plus dates to Sun 23 Aug, distinct from the Ballincollig site, so this is genuinely a per-cinema subdomain and not wildcard DNS (an invented subdomain does not resolve). Address and eircode come from IMC's own location page at imc.ie/location/blackpool/, "Blackpool Retail Park, Blackpool, Co. Cork T23 RYN3", not from the cinema's own site, which publishes no address; a stale third-party directory gives "123 Commons Road, T23 X8E2" instead, so the eircode is worth one human glance. CinemaTimes lists "The Reel Picture Blackpool" and "Blackpool Cinema" as two separate cinemas 300 m apart — they are the same building, confirmed by IMC's locations page linking Blackpool straight to blackpool.thereelpicture.com.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

