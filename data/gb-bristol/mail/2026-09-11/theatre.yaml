    body: "Plus: Places left on Babbers, and Elevate


      https://us.list-manage.com/F2hlEZ6jY7x?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      Hello and welcome to acta's September 2026 newsletter.


      September has come back around again - and for us this often feels like a new beginning as we start new projects and meet new people. We're really excited to see stories take shape and to present them to you, too.


      You can now book tickets to our ever-popular Christmas show! This year presented by Phoenix Theatre, our Young Adults group, 'The Star Catchers' will be performed in December and we are excited to offer two weekend matinee showings. There is more information below - book now to secure your spot!


      We're also very excited to announce more school holiday drama club activity!


      https://us.list-manage.com/c4rbL5vhHLO?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      Ocean of Dark

      By acta's Young Carers

      Thursday 29th October, 6.30pm


      Legend tells of a beautiful sapphire created eternities ago that gives its wearer total power. It was thought it had been lost to history, but it has resurfaced and sparked a sea-faring power struggle like no other.


      An infamous pirate throws a party onboard her ship and invites all: queens, princesses, mermaids, and vampires alike. But is one of her wicked schemes brewing? Will all our revellers make it to the last dance?


      acta’s Young Carers’ Ocean of Dark is an exciting adventure, exploring the endless search for power and the consequences of it. This unique and thrilling horror will be spooky and dark, with some laughter along the way.


      Book your free place for Ocean of Dark <https://us.list-manage.com/snE5FNQ1hUt?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      https://us.list-manage.com/zOX8a5wR8OB?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      The Star Catchers

      By Phoenix Theatre

      Various dates and times between 5th and 11th December


      Something strange is happening in the night sky…


      The stars are disappearing — and without them, the magic of Christmas is beginning to fade. In a quiet corner of the woods, an unlikely discovery sets a curious adventure in motion, while elsewhere a festive hotel is losing its sparkle and, in fairyland, the fairies are finding their magic mysteriously slipping away.


      Could it all be connected?


      As the worlds collide, a daring quest begins to uncover who — or what — is behind the missing stars.


      Join us for a thrilling festive adventure full of mystery, magic and, of course, stars!


      Book your tickets for The Star Catchers <https://us.list-manage.com/gTTEtEyhL0e?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      https://us.list-manage.com/11CmFyK0n1c?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      September in Elevate: Creative Facilitaiton

      Games, exercises, group dynamics, planning


      Wednesday 16th September sees the very first Elevate session. There is still space for you to book on and join the session.


      what will I do in this workshop?

      • You’ll learn a range of games and exercises

      • You’ll learn how to adapt games to the needs of the groups

      • You will understand when to use a game and how it can benefit you

      • Learn how to plan and structure a workshop

      • Learn the benefits of this work


      This workshop will benefit anybody who facilitates groups as part of their work – not just for creative practitioners.


      Tickets are £20 full price, £10 concessionary. This year we are offering a full term ticket – this will give you entry to every workshop in the series, at a 25% discount.


      Book today <https://us.list-manage.com/asbP9GSuAkV?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      https://us.list-manage.com/132Iydz111r?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      Babbers! - New term starting September

      Mondays, 10am & 11am


      Babbers has just started for another term!


      Ever popular, our 11am slot is very nearly sold out with just one space left! This term runs up to the end of November. You can save £3 a session if you book for the remaining term - although you can book a single drop-in session to try it out.


      Book the full term here <https://us.list-manage.com/R2ViS7GYsOA?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      https://us.list-manage.com/LugHS79U2Pq?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      Become an acta Friend today

      From £5 a month you can help us strengthen our foundation

      Help us to continue creating new plays that platform real people and real stories. We’re a registered charity, and we rely on the generous support of donors to continue our important work year on year.


      Read more information and sign up today <https://us.list-manage.com/MGzglzZ17MP?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      https://us.list-manage.com/Epz8HjdIf6u?c2id=178ee8babe3db6d0c3bd9d9141602d5e


      Just announced: October Half Term Drama Club!

      Monday 26th and Tuesday 27th October, 10am - 3pm

      For ages 8-12


      Come and join us in the October half term holidays for two days of creative theatre play! In just two days you’ll create a never-before-seen play which you can then perform to family and friends. We’ll combine your ideas (weird and wacky ones encouraged!) to create something truly unique.


      Places cost £50.00 per day, and are booked in blocks of two days. We are able to offer three half price places for low-income families – if you would like one of these, please email info@acta-bristol.com


      More information and book a place on Eequ <https://us.list-manage.com/xgWIPSDc6Ip?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      Heritage Open Days

      Led by local residents, supported by local services

      Heritage Open Days is England's largest community led festival of history and culture, involving thousands of local volunteers and organisations. Every year in September it brings people together to celebrate their heritage, community and history. Stories are told, traditions explored, and histories brought to life. It’s your chance to see hidden places and try out new experiences – and it’s all free!

       See the full list of participating organisations here  <https://us.list-manage.com/zx4ALbBuJFt?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      South Bristol Arts Trail

      Annual weekend event celebrating creativity in the communities of Southville, Bedminster & Ashton

      The South Bristol Arts Trail is a free event, open to everyone, and takes place once a year in venues across Southville, Bedminster and Ashton. Each year over 100 local artists exhibit in venues across BS3. Artists open their homes and studio spaces, as well as exhibiting in community venues from schools and shops to cafes and community centres. Wander through South Bristol and discover new artists, favourite local venues and creatives that might just surprise you. Taking place on the 19th and 20th September 2026 <https://us.list-manage.com/RhN3qBnPHIM?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


      QiGong in the Gallery

      A free, guided, movement session at Arnolfini

      This 60-minute QiGong session is suitable for all levels and designed to help restore and reset your body, mind, and soul. This session provides a nurturing space to reconnect with yourself and find balance. Take time to tune into your body through mindful, conscious movement. Friday 11 September, 12 – 1pm. No booking required, first come first serve, bring your own yoga mat. More information on Arnolfini's website <https://us.list-manage.com/154U4MA7Fjd?c2id=178ee8babe3db6d0c3bd9d9141602d5e>


