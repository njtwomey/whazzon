      Online Teacher Training launched around free primary music curriculum


      Wed 24 Sep 2026 - Thu 4 May 2027


      Online


      Created by Bristol Beacon and Cathedral Schools Trust, the free Oak National Academy Primary Music Curriculum launched in 2025, helping bring inclusive, joyful music education to primary schools across the country.


      Now, the team behind it is offering free online training for primary teachers, packed with practical ideas to help make music teaching easier, more engaging and more enjoyable.


      Whether you're looking to build your confidence or simply find fresh ways to bring music into the classroom, the training is designed to fit around busy school life.


