    notes: "Catalogue URL correct; the single programme page carries the whole diary from tonight (Fri 11 Sept) to Fri 4 Dec — 39 listings, all taken, nothing truncated. As the hint warns, only about half are films: live music, storytelling, a repair day, workshops, a magic gala and parties are recorded and tagged by what they are, with the venue's own first label (film, music, performance storytelling, party, training, and so on) carried in subcategory. The Cube's listings put a presenter line above the title and a strapline below it (\"The Cube Presents\" / \"Support from Minor Conflict & Maes Y Circles\"); title carries the title, and raw carries all three. No prices are printed on the programme page, and no event pages were opened (the diary is far past the dozen-event cap), so price and description are omitted throughout; the one-clause index copy stands in raw. Teenage Sex and Death at Camp Miasma is one listing with two dates (Sun 27, Mon 28 Sept), recorded as one run with both times in timesText; its Relaxed Daytime Cinema showing on Wed 30 Sept is the venue's own separate listing and is a separate row, as is the relaxed showing of Sherman's March. The Knights Of Magic is two separate listings on consecutive nights and is two rows. Poster thumbnails are relative on the page and are prefixed with https://www.cubecinema.com. All printed weekdays check against the inferred year."
