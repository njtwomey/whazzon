    notes: "NOTES (rewritten after a second pass — the first pass reported this source as structurally

      capped, and that turned out to be true only of the routes a plain fetcher can reach).


      What a plain fetcher gets, and why it is not enough. The catalogued /whats-on/ page is a

      Simpleview landing page whose events index is a client-rendered widget; the served HTML holds

      only the annual-festivals carousel and the first alphabetical page of today's index.

      /whats-on/search-results/ is the same shell. The RSS feed at /event/rss/ is real and returns

      200, but gives only events live on the day it is fetched, capped at 30 in alphabetical order —

      today it stopped at F — and it ignores ?limit, ?skip and ?startdate/?enddate, all three tried.

      The REST endpoint /includes/rest_v2/plugins_events_events_by_date/find/ answers 403 \"Invalid

      credentials\" without a token the embed script mints client-side.


      THE ROUTE THAT WORKS, and the one stage 1 should record. Rendering the page in headless Chrome

      runs the widget, and the widget reads its filter state from the query string —

      layoutjs names every filter param \"filter_\" + name, so the daterange filter is:


      \  /whats-on/search-results/?filter_daterange[start]=YYYY-MM-DD&filter_daterange[end]=YYYY-MM-DD


      with &skip=N for paging, 15 results per page, and the result count printed as \"1 - 15 of 98\".

      Two things are required or it fails: a real browser user-agent (Chrome's own headless UA gets

      an Akamai \"Access Denied\" edge block, which is what the first pass hit), and enough

      virtual-time budget for the widget to fetch — 25s was ample.


      This run therefore covers 29-31 August in full: 98 events in the window, seven pages, all

      seven read. 25 of the 98 were already recorded from the RSS feed and the carousel and are not

      duplicated; the other 73 are new here, and they are the whole reason for the second pass —

      they include the entire G-Z tail the alphabetical feed cut off, plus everything first listed

      for the weekend alone. The horizon was deliberately not extended: the query was fixed to

      29-31 August, so nothing outside the window was taken beyond what the first pass already had.


      Still truncated, and declared: the annual-festivals carousel also carried seven events dated

      2027 (Slapstick, Bristol Light Festival, Ritual Union, Bristol Walk Fest, Summer Fest At The

      Beach, Feast On, Balloon Fiesta). Far future, already catalogued under festivals/, dropped.


      Images: both the RSS and the rendered widget print each image as a Cloudinary fetch URL

      wrapping the origin file at thumbnail size (150x100 and 305x183 respectively). The origin URL

      is embedded verbatim inside it and is what is recorded, since a thumbnail is not usable on a

      card. Nothing was constructed.


      One row needs a human. \"Spring Bulb Planting Workshop at Badminton Estate\" prints its dates as

      \"23 Oct 2026 - 30 Aug 2026\" — an impossible range that ends before it starts, although the

      backend clearly holds a date inside this weekend since the row came back from a 29-31 August

      query. Rather than guess which end is the typo it is recorded as 'undated' with the printed

      range in the note, at low confidence.


      Region bleed is much more visible at this depth than it was from the feed. Visit Bristol's

      diary reaches across Wiltshire, Somerset and Gloucestershire: Bowood House (Chippenham and

      Calne), Dyrham Park, Westonbirt, Sudeley Castle, Cheddar Gorge, Wookey Hole, Somerset Rural

      Life Museum, Dr Jenner's House, Lacock Abbey, The Bishop's Palace at Wells, Go Ape Forest of

      Dean, Noah's Ark Zoo Farm and The Grand Pier at Weston-super-Mare are all in the window's 98.

      They are kept with venue names and flagged in their summaries rather than dropped, but a

      location filter on addressLocality would be worth a hint for stage 1 — this is the same

      problem the catalogue already records against citywide/skiddle.


      Data quality worth knowing: this source's FORWARDS record still carries the previous edition's

      lineup (\"headlined by Four Tet, Jessie Ware, Loyle Carner, LCD Soundsystem\"), which contradicts

      the 2026 lineup that 365 Bristol and Bristol24/7 both print. The FORWARDS row recorded here

      came from the carousel and is dated correctly; the stale lineup text was not copied into it.


      Still no bank-holiday roundup article on this site — the window query is what replaces it.\n"
