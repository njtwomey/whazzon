        description: "Yoga Foundations Workshop — Breath, Meditation, Posture & Balance


          This Yoga Foundations workshop offers time and space to explore yoga

          from the ground up.


          We'll work with the four core parts of yoga — Breath, Meditation,

          Asana (postures) and basic Philosophy — with a particular focus on

          standing postures and balance, including Warrior I, II, III & IV, and

          a small number of balance poses.


          We'll take our time and work carefully, starting with the basics:


          - where to place your feet

          - how to breathe within the postures

          - how the body organises itself to stand and balance


          Alongside the physical learning, we'll explore the essence of these

          postures — \"what do you stand up for?\" \"What do you show up for?\"


          With 2.5 hours together (10:00–12:30), there is space to explore,

          explain, rest & repeat – so learning has time to settle and

          integrate.


          The workshop finishes with Chinese tea for contemplation and light

          snacks, offering a gentle close to the morning.


          **Make a day of it?** Stay on site for brunch at the excellent

          Cibomatto Italian Canteen, book in advance for the sauna and cold

          plunge, or head out for a walk in the beautiful Nightingale Valley or

          along the river towards Crews Hole.


          **Why St Anne's House?**


          - Free on-site parking (including accessible spaces)

          - Accessible ground-floor Mill Room with step-free access

          - Bristol Community Sauna & Cold Plunge on site for post-class

          \  relaxation

          - A vibrant community hub with creative studios, café, and local

          \  projects


          **What to Bring** — Wear comfortable clothes you can move in. Bring

          your own yoga mat and props if you have them, plus a blanket and

          pillow for relaxation. Mats are available to borrow if needed.\n"
        confidence: "high"
    notes: "Harvested St Anne's House, the building BRICKS runs, exactly as catalogued; the what's-on there is the public programme. Two useful hints for next time: the page is The Events Calendar and its REST endpoint at /wp-json/tribe/events/v1/events serves the whole diary as JSON, which is far cheaper than walking month views — but it 403s to a plain fetch and 200s to a browser user-agent, same as the hackspace. I queried 2026-08-17 to 2026-10-31 and got 192 dated instances across 26 distinct series, and collapsed them to 26 rows per §4 rather than recording every instance. Because the 31 October cut-off was mine and not the venue's, I have left `end` off the open-ended weeklies rather than implying they stop then. Descriptions came back inside the same API response at no extra fetch, so I have recorded them for 13 of the 26 — the dated one-offs, the runs, and the craft-related weeklies — and left them off the rest. Two things for a curator: much of this programme is wellbeing and food (massage, acupuncture, yoga, a sauna, a canteen) rather than making, so the source sits awkwardly in this category; and Art Club's own copy says \"come along fortnightly on Wednesdays\" while the calendar lists it every Wednesday, which is why that row is confidence medium. Talking Tarot, listed monthly, last ran 8 August and has no future date on the calendar."
