    url: https://www.stpaulscarnival.net/
    area: St Pauls
    tags: [free, summer, outdoor, caribbean, community, major]
    cadence: quarterly
    hints: |
      African-Caribbean carnival, usually early July. Has skipped years for
      funding reasons — confirm the edition is happening rather than assuming.
    addedAt: "2026-08-16"

  - id: festivals/bristol-pride
    name: Bristol Pride
    category: festivals
    kind: festival
    status: provisional
    url: https://www.bristolpride.co.uk/events/
    homepage: https://www.bristolpride.co.uk/
    tags: [summer, lgbtq, community, major, citywide]
    cadence: quarterly
    hints: |
      A month-long programme of events across the city culminating in the July
      Pride Day, not a single day — expect many satellite events at other
      venues, and set `venue.sourceId` where they match our catalogue. The events
      page keeps satellite dates outside the festival window too, so it is worth
      crawling year-round rather than only around July.
    notes: >-
      Verified 2026-08-17: /events/ heads "Bristol Pride 2026 | 27 June - 12 July"
      (UK charity 1166817) and lists dated entries — Pride Parade and Pride Day on
      Sat 11 July, the Dragathon on Sun 12 July — plus one still ahead of us, No More
      All Male Lineups on Thu 20 Aug.
    addedAt: "2026-08-16"

