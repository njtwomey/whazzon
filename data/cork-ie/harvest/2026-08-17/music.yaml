    notes: "Reached: 200 on the /en/fmt/ form, so the catalogue's path note is right and the /en/music/ redirect did not need re-testing. But the catalogue's careful wording — \"a confirmed path rather than a confirmed programme\" — turns out to be the whole story. The page is titled \"Events | University College Cork\" and its 296 lines of extracted text are **entirely site navigation**: study routes, doctoral studies, CARPE research clusters, the school's Cork Opera House collaboration links, EDI, People, Film. There is no events list, no dates, and no event links. The only ISO date in the HTML is 2022-07-28, a CMS timestamp.

