    notes: "/events is the right path, as the hint says, and the page is better than a Squarespace events collection: it is a hand-written list where each entry carries a full paragraph of the venue's own copy and, usually, an Eventbrite booking link. That copy goes straight into `description` — no event pages needed to be opened.

      Eight entries are listed and five are recorded here. Two are excluded as not music: Knit Night (2 Sep, €5, facilitated by Katie Ahern) and Drink and Draw with Harry Moore (15 Sep, €20, twelve places, book by emailing the bar). The third exclusion is not an exclusion at all — the two \"Improvers' Trad Session\" Wednesdays are folded into a single recurring event.

      The hint's \"expect low volume and gaps\" is exactly right, and the volume is the finding: five music events over five weeks is the whole programme for one of the only music rooms north of the river. Two of the five are already sold out, which suggests the room is small rather than quiet.

      **One date needs a human.** The Aidan Duffy entry reads \"Tuesday 17 August\" but 17 August 2026 is a Monday, and the entry sits between a \"Saturday 15 August\" row (15 Aug 2026 is a Saturday) and a \"Wednesday 2 September\" row (2 Sep 2026 is a Wednesday), so the year is not in doubt — the venue has printed the wrong weekday, or the wrong date. Recorded as 17 August with `confidence: medium`. Every other weekday on the page checks out.

      The 15 August Blissín date has already passed and is recorded with its real past date so it retires. Prices are the \"contribution on the door for musicians\" the venue asks for, quoted as printed. No per-event images: the page is prose, not a grid."
