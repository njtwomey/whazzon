  - id: museums/cork-city-archaeology
    name: Cork City Council Archaeology
    category: museums
    kind: listing
    status: provisional
    url: https://www.corkcity.ie/en/council-services/services/arts-culture-heritage/archaeology/events-projects/
    tags: [ civic, free, local-history, community ]
    cadence: quarterly
    hints: |
      The City Archaeologist's own public programme, and one of the few places
      Cork's free heritage talks are announced. Two pages, both shallow:
      /events-projects/ carries the next talk in full prose (title, speaker,
      date, time, venue) and /lecture-series-and-talks/ describes the Autumn
      Archaeology Lecture Series and links past audio.
      Talks are almost always at Cork City Library, Grand Parade, not at a
      council building — set `venue` on the event, since the source is not the
      place.
      Concentrated in autumn; there is often nothing to find between January and
      August, which is why the cadence is quarterly.
    notes: |
      Verified 2026-08-17: title "Events & Projects - Cork City Council",
      breadcrumb Home / Council Services / Services / Arts, Culture & Heritage /
      Archaeology / Events & Projects, and one fully dated talk live — "Walls
      that Shaped a City: Excavating Cork's Medieval Defences", City
      Archaeologist Ciara Brett, Tuesday 18th August 2026 at 2:30pm, Cork City
      Library, Grand Parade. No address: this is a council service, not a venue.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/cork-historical-archaeological-society
    name: Cork Historical and Archaeological Society
    category: museums
    kind: organiser
    status: provisional
    url: https://corkhist.ie/calendar/
    homepage: https://corkhist.ie/
    tags: [ community, local-history ]
    cadence: monthly
    hints: |
      /events/ returns 403 to everything while the rest of the site serves 200 —
      the working listings path is /calendar/. Do not read the 403 as a dead
      site.
      Founded 1891 and the busiest heritage programmer in the county: winter
      lectures roughly fortnightly, summer outings, a conference, an annual
      weekend away and a Christmas lunch. The calendar prints a heading ("Events
      in August-November 2026") then full date, time, place and a paragraph of
      description per row, so one fetch is usually enough.
