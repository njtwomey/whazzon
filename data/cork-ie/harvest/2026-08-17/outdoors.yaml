ich is where the other eight days of Cork City's Heritage Week programme live. And the sibling indexes for the same day (42 building tours, 16 talks, 6 family events, 1 workshop) are deliberately untouched here as somebody else's category. Titles are kept exactly as printed, including \"The Shandon Plaque Trial\" for what is plainly meant to be Trail, and \"Tadgh\"/\"Tadhg\" spelled both ways on the same page."
