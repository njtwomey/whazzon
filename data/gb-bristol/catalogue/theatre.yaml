  - id: theatre/wickham-theatre
    name: Wickham Theatre (University of Bristol)
    category: theatre
    kind: venue
    status: provisional
    url: https://www.bristol.ac.uk/theatre/events/
    homepage: https://www.bristol.ac.uk/theatre/
    area: Clifton
    tags: [ university, student, studio ]
    cadence: monthly
    hints: |
      University department theatre with public performances. The department
      diary is term-time only and empty out of term — an empty page here is the
      truth, not a failed crawl, so record the fetch and attach no events rather
      than hunting for another URL. /theatre/performance/ is about the InterAct
      student society, not a programme.
    notes: >-
      Verified 2026-08-17: the catalogued /theatre-film-television/ path is now a 404. /theatre/events/ is titled "Events | Department of Theatre | University of Bristol" and names the venue as "Wickham Theatre, Cantocks Close, off Woodland Road, Bristol". It currently reads "There are currently no events scheduled" — mid-August, out of term — which is why the harvest recorded it as reachable but empty. Left provisional rather than dormant: an empty vacation diary is not evidence of a year's silence.
    addedAt: "2026-08-16"
