    notes: "Harvested the Headfirst venue page as the hints direct: the shop's own site, bookhausbristol.com/events, is a JavaScript Headfirst embed that serves only \"loading events…\". The mirror is server-rendered and is the same programme — 20 events from Fri 21 Aug to Wed 11 Nov 2026, no pagination, all 20 recorded. Every listing prints its weekday and all 20 confirm 2026. Two gaps to flag: the venue index carries no start times and no prices at all (a regex over the fetched HTML found neither a single time nor a single £ figure), so startTime and price are omitted throughout rather than guessed; and it carries no per-event blurb, so raw is title, date and Headfirst's own category labels. No event pages were opened for description — 20 events is over the threshold in §3, and the cost of 20 extra fetches to enrich one card each is the trade that rule exists to refuse. The 21 Oct listing's title is truncated by the source itself, ending \"...South Asian resistance in B\"; recorded as printed. subcategory holds Headfirst's labels verbatim (\"workshops & classes\", \"talks\", \"exhibition\", \"lgbtq+\"); the 30 Sep listing carries no labels."
