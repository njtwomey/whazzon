    kind: aggregator
    status: provisional
    url: https://www.bantry.ie/
    area: Bantry
    tags: [town, market, fair]
    cadence: monthly
    hints: |
      Bantry's town site. The Friday market on the square is one of the biggest in
      the county and carries craft as well as food; record it as `recurring`
      rather than a date at a time.
      Watch for the first-Friday and bank-holiday special markets, which are where
      craft stalls actually cluster.
    notes: >-
