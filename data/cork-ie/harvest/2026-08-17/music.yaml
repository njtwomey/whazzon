    notes: "The hint's advice to use /live-music/ rather than /whats-on/ is right and pays off: the page is a music-only grid of 21 dated concerts from 22 Aug to 18 Dec 2026, each with a date, a start time, an image and — usefully — the named series it belongs to, which goes into `subcategory` verbatim. The cinema, visual-art and special-events strands stay out of this category entirely, which is the point of the narrower path. All 21 are recorded; nothing truncated.

      The hint is also right that much of the programme is stated as named series running over months. Six series are represented: Spotlight Chamber Music Series – Autumn 2026 (four concerts, I to IV), Autumn String Quartet Series 2026 (four), ECM Cork 2026 (four), Triskel Lunchtime Jazz Series 2026 (two), Triskel International Jazz Programme 2026 (two, one shared with ECM Cork), and NSQF Young Artists Summer Concerts 2026 (one). The series pages themselves are listed under the site's Special Events tab, not here, so what this page gives is the individual dated concerts — which is the right grain. The individual concerts are recorded, not the series wrappers.

      Two rows have no series label at all (Anton Jablokov 26 Nov, Iarla Ó Lionáird 18 Dec) and carry no `subcategory`.

      **No prices anywhere on this page.** The one figure I have is from the corkgigs diary, which prices Bill Laurance at €30/€28; that is recorded and attributed. Everything else has no `price` rather than a guessed one.

      Timings are worth noting for a curator: the lunchtime and chamber concerts are almost all 13:00, the ECM and jazz evenings 20:00 or later, and 25 October carries three separate ECM Cork concerts at 14:30, 18:30 and 20:30 — three distinct events on the Jazz Festival Sunday, not one with three times. Gulpd, Triskel's own bar, contributes nothing to this page, which matches the hint that gulpd.com serves an empty page."
