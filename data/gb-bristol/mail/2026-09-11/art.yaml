      BEVERLY BUCHANAN: WEATHERING

      Friday 25 September, 6–11pm

      Join us to launch our autumn season exhibition, Beverly Buchanan: Weathering <https://us.list-manage.com/166ScAViYxt?c2id=a7c541d1d2eca54a095703c2afcca581&m=qFy6u7rThOhC9HJJRqAf9D1jom5wLgo26_cgMzPThySwN-3PAS_EOulB55-8>. Discover the largest European survey exhibition of Beverly Buchanan (b.1940; d.2015), bringing together five decades of sculpture, painting, drawing, earthworks, artists’ books and rarely-seen archival material.

