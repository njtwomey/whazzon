      Two catalogue corrections fall out of that. First, the catalogued URL https://www.nationaltrust.org.uk/visit/bath-bristol/leigh-woods/whats-on now returns a real HTTP 404 (\"404 Page Not Found | National Trust\"), not an interstitial — so the path is genuinely wrong, and the previous run's inability to read it hid that. The `homepage` already recorded in the catalogue, https://www.nationaltrust.org.uk/visit/bath-bristol/leigh-woods, is the one that works and is what was harvested. Second, that place page carries the programme inline under an \"Upcoming events\" heading, so there is no separate what's-on route to point at for this place; the only /whats-on link in the page's navigation is the site-wide https://www.nationaltrust.org.uk/visit/whats-on.

      The result is a real, confident empty: under \"Upcoming events\" the page says, verbatim, \"Sorry, there are no upcoming events at this place.\" This is `ok: true` with no events rather than the failure the hint asks for, because the page was actually read this time.

      Opening times for the bank holiday weekend: the August 2026 calendar marks every day open with no closures, and \"Opening times for 28 August 2026\" gives Leigh Woods as \"Dawn - Dusk\". An important notice adds \"Leigh Woods is open for visitors to access for walks. Camping and lighting fires is not permitted. There is no National Trust parking at Leigh Woods but Forestry England have a pay and display car park at their entrance to Leigh Woods.\""
