    notes: "Seventeen items, all recorded, nothing truncated. **Every date resolves to 2026 with the weekday confirming it**, so the year-less format the catalogue warns about (\"Thu 2 Jul - Sun 30 Aug\") is not a problem here: 2 July, 3 September, 29 October and 3 December are all Thursdays in 2026, 30 August, 25 October and 29 November are all Sundays, 11 August is a Tuesday, 27 August a Thursday, 25 January 2027 a Monday, and all twelve lecture dates are Tuesdays. Every row is `confidence: high` on that basis. Classified per the catalogue hint: five exhibition `run`s, and the two lecture series recorded as twelve `single` dates rather than as runs — six weeks of \"Art History Reframed - Autumn 2026: The Great Cities of Europe\" (15 Sep - 20 Oct) and six of \"Famous Paintings and their Hidden Histories: Autumn 2026\" (3 Nov - 15 Dec, with no session on 17 November, which is the source's own gap). The lecture titles are meaningless on their own — \"Week 1 – Florence\", \"1 – Hawk and Quarry in Winter\" — so they are kept verbatim and the series name is carried in `subcategory` and `summary`. The index prints no prices and no images for anything, so both fields are left off rather than guessed, and no event pages were opened. `address` is not on this catalogue entry; Crawford Art Gallery's In Conversation listing gives \"Triskel Arts Centre, Tobin St, Cork\", which stage 1 could use to fill it in. Expect duplicates: Billy Lingwood, Sarah Long, Cork Zine Fest and Siobhán Collins are Sample-Studios' TRISKEL SAMPLE residencies and appear under art/sample-studios too; Artists Film International is Crawford's and appears under art/crawford-art-gallery and art/visual-artists-ireland-cork; Art History Reframed appears as one recurring row under art/sample-studios and as six singles here. Recorded on both sides deliberately."
