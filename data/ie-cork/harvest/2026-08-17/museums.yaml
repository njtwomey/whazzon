        description: "Step into Cork's past at \"Walls that Shaped a City\", an engaging talk by Cork City

          Archaeologist, Ciara Brett, exploring the hidden story of the city's medieval

          defences. Once encircled by formidable stone walls, Cork was a walled settlement

          whose gates, towers, and fortifications shaped everyday life, trade, and security.

          Today, much of this legacy lies buried beneath streets and buildings – yet its

          impact endures.


          Find out how archaeological digs have revealed fragments of walls, defensive

          ditches, and gateways that once defined the city's boundaries. Whether you are a

          history enthusiast, a local resident, or simply curious about the layers beneath

          your feet, \"Walls that Shaped a City\" offers a unique opportunity to connect with

          Cork's medieval origins and appreciate the foundations upon which the modern city

          stands.


          Part of National Heritage Week 13-23 August 2026.\n"
