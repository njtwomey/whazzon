      WELCOME TO THE SEPTEMBER NEWSLETTER


      It's 'Back to School' season and here at Bristol Old Vic we are jumping into a bunch of new starts of our own! We are delighted to announce our cast for the world premiere of Lanny, based on the book by Max Porter and adapted by Bea Roberts. Get to know the people behind the characters <https://arts-mail.co.uk/c/AQjcvQQQr_y4BxjZ1aKkAyDeut2vASim9vRCbC4pY-qxrrKBz5W8xSUsY-uk8iXAQw-X27njHyy6P08> in our announcement.


      We have already begun to enjoy the first of our September Comedy Season. If you've never been to any of our comedy nights (or even if you have), Troy has all the details for you in his helpful breakdown, 'What i reckon <https://arts-mail.co.uk/c/AQjcvQQQr_y4BxjZ1aKkAyDfut2vASim9vRC-_USbAhYJXPCmcKcah9oMkBAFuCbxOe9py2ajsY1lms>'.


      In The Weston Studio, our Young SixSix company are right in the middle of their production of Macbeth - a new take on the classic play. Read all about them <https://arts-mail.co.uk/c/AQjcvQQQr_y4BxjZ1aKkAyDgut2vASim9vRCb8dd4ZFRKQwhQwjcUUQYmiS031-enhCCwMkMYm9Znuc> and their work in our article. Similarly, we have been chatting to the cast of Juliet & Romeo, which will be coming to our main stage this month. You can read our Q&A with Emily and John <https://arts-mail.co.uk/c/AQjcvQQQr_y4BxjZ1aKkAyC0wd2vASim9vRCq8aunbQSoNaDLABzw4Wmjxyp6CcapAT1dAd2eKFPtsQ> on the blog.


      Finally, we are very pleased to introduce you to our Associate Artists and Companies for 2026-28. We can't wait to work closely with these talented people, you can find out more about them in this announcement. <https://arts-mail.co.uk/c/AQjcvQQQr_y4BxjZ1aKkAyDiut2vASim9vRCU9bPryE99VHKgWHaroju3qROT5hrNbbi-8-d_L_6j9E>


      Wishing you all a wonderful month - whether you are jumping into new things, enjoying some rest, or waiting to see what the season has to offer!


      Best wishes,


