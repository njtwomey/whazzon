  - id: music/the-gallimaufry
    name: The Gallimaufry
    category: music
    kind: venue
    status: provisional
    url: https://www.thegallimaufry.co.uk/whatson
    homepage: https://www.thegallimaufry.co.uk/
    area: Gloucester Road
    tags: [free, jazz, pub, nightly]
    cadence: weekly
    hints: |
      Free nightly music, heavy on jazz and funk. The path is /whatson with no
      hyphen — /whats-on 404s. Most of the programme is stated as weekly
      recurring nights (Monday open mic, Friday DJs, Saturday residencies) rather
      than as dated one-offs, so prefer a recurring occurrence over inventing
      dates. The dated one-offs on the page are not kept current: when checked
      they stopped at April 2026 while the venue was still gigging nightly.
    notes: |
      Verified 2026-08-17: page is The Gallimaufry, 26-28 Gloucester Road, Bishopston, BS7 8AL, matching area Gloucester
      Road, and is a genuine live-music listings page. Its latest dated entry was 30 Apr 2026 with nothing for Aug or
      Sep, but external listings show the venue open and programming nightly, so this is an unmaintained calendar rather
      than a dormant venue — left as provisional, not marked dormant.
    addedAt: "2026-08-16"

