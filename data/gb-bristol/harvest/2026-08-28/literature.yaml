        raw: "**The Body of the Thing : Karishma Jobanputra**


          Tuesday 8th September, Gloucester Road Bookshop at 7.00 pm


          Brilliant debut author in conversation with award-winning Nell Osborne


          [Book tickets](https://hdfst.uk/e159285) (this link will take you to

