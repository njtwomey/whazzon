  - id: festivals/bristol-light-festival
    name: Bristol Light Festival
    category: festivals
    kind: festival
    status: provisional
    url: https://bristollightfestival.org/
    area: City Centre
    tags: [free, winter, outdoor, art, family]
    cadence: quarterly
    hints: |
      Free light art trail across the city centre each February. The host 403s
      automated fetchers; a browser user-agent gets a 200, so fetch it with one. The
      homepage carries the next edition's dates, each edition then gets its own page
      (/bristol-light-festival-2026/, /blf-2025/), and dates are announced first
      under /news/. Installations are only located and dated close to the event.
    notes: >-
      Verified 2026-08-17 with a browser user-agent: homepage reads "We're back for
      2027 from 18-27 February", the seventh edition, Thursday 18 to Saturday 27
      February 2027, founded by Bristol BID. The catalogued URL was right all along —
      this was a bot wall, not a bad URL.
    addedAt: "2026-08-16"

