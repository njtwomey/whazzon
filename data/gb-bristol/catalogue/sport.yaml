  - id: sport/gloucestershire-cricket
    name: Gloucestershire Cricket
    category: sport
    kind: organiser
    status: provisional
    url: https://api.gloscricket.co.uk/api/frontend/getMatchesData?match_status=forthcoming
    homepage: https://www.gloscricket.co.uk/fixtures
    area: Bishopston
    tags: [cricket, fixtures, ticketed, summer]
    cadence: monthly
    hints: |
      Plays at the county ground in Bishopston. Season runs April to September;
      dormant over winter.

      The human fixtures page is a Next.js app that renders nothing without
      JavaScript — the harvest saw only a <title>. The url above is the club's
      own JSON endpoint that page calls, and it returns the fixture list
      directly. Each row carries start_datetime_utc, ground_name, team1_name,
      team2_name, gender, is_2ndxi_match and buy_ticket_url.

      Filter on ground_name: the feed mixes the Bristol County Ground with 2nd
      XI and out-ground fixtures played well outside the city (Hatherley &
      Reddings CC in Cheltenham, for instance). Link events back to the human
      page rather than to the endpoint.
    notes: >-
      Verified 2026-08-17: https://www.gloscricket.co.uk/fixtures is the right page but is client-rendered and
      yields no fixtures to a fetcher, with or without a browser user-agent. The API endpoint it calls
      (discovered in the page's own JS bundle) returns dated forthcoming fixtures as JSON.
    addedAt: "2026-08-16"

  - id: sport/great-bristol-run
    name: Great Bristol Run (half marathon & 10K)
    category: sport
    kind: festival
    status: provisional
    url: https://www.greatrun.org/events/great-bristol-run/
    tags: [running, mass-participation, annual, road-closures, half-marathon, 10k]
    cadence: quarterly
    hints: |
      The city's main mass-participation road race, successor to the Bristol
      Half Marathon. Runs several distances on the same day — a half marathon
      and a 10K, sometimes a shorter family distance. Record each distance as
      its own event: they have separate start times, entry fees and sell-out
      dates, and a runner cares which one they are entering. Entries open the
      previous autumn, so use a long forward horizon.

      greatrun.org returns 403 to a plain fetcher and 200 to a browser
      user-agent — send one. The next edition's date is in the page <title>.
    notes: >-
      Verified 2026-08-17: the 403 recorded in the harvest was a bot wall, not a bad URL. With a browser
      user-agent the catalogued URL returns the live event page, titled "AJ Bell Great Bristol Run | 9 May
      2027". The 2026 edition ran 10 May 2026.
    addedAt: "2026-08-16"

