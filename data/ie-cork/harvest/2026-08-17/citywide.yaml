    notes: "22 rendered cards with a date and 20 application/ld+json Event objects, overlapping heavily; 19 recorded. Both were read because they carry different things: the JSON-LD covers only the nearest twenty dates but adds the venue's postal address and Eircode, while the rendered cards reach the far horizon (Darren Kiely at City Hall, 14 April 2027). Books a long way ahead exactly as the hint says.

      THE STATUS IS THE FIND. The JSON-LD is the only place today that flags Thumper at Cyprus Avenue on 6 September as EventCancelled and the 14:30 sitting of Michael Starring Ben on 5 September as EventRescheduled. Both are recorded with those statuses. entertainment.ie and the PROC guide both still list Thumper as on, which is the sort of disagreement worth surfacing rather than resolving.

      Dropped as outside the radius: four shows at Live By The Bay at The Maritime West Cork in Bantry and one at the Firgrove Hotel in Mitchelstown. The Clayton Hotel Silver Springs at Tivoli is inside and was kept, as venue.name — it is not catalogued.

      The per-event URLs recorded here are the hrefs from the discover page, verbatim, but ticketmaster.ie answers 401 to a plain fetcher on every /event/ path — check-urls will flag all nineteen and they are not broken.

      Ticketmaster addresses Wavelength to \"Winthrop lane, Cork, T12 PY8A\" where PROC calls it the Cyprus Avenue rooftop and gives it the same Eircode as Cyprus Avenue. Recorded as a name rather than a sourceId, since the catalogue has no Wavelength entry; it may deserve one, or a note on music/cyprus-avenue."
