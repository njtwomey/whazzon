    notes: "Confirmed real, and the corrected URL is right: The Makershed is a woodworking school running levelled courses. Two amendments to the hint. First, the /courses/ index carries no dates, and the dated programme is not in prose on the course pages either — it is in the site's own Events Calendar, reachable as JSON at /wp-json/tribe/events/v1/events?per_page=50&start_date=2026-08-17, which returned 51 entries every one of them titled \"Daytime classes\", with the course actually running that day named in the excerpt as \"(N of 8)\". That is one row per session of an eight-week course, so I have collapsed it to one row per course per §4 rather than recording 51 dated events. Second, the two-slug weekend/weekday pattern the hint describes was not there today: only /courses/tool-sharpening-day/ sits under /courses/, the four woodwork course pages sit at the site root, and there are no duplicate slugs. Because the index is thin and the programme is seven courses, I opened five course pages for `description` — Level 1, both Level 2s, Level 3 and the sharpening day. Two ambiguities left visible rather than resolved: the calendar slots every entry at 10:00–15:00 including the one whose excerpt calls it \"Tuesday Evenings Courses\", which contradicts the 6.20–8.45pm the course pages state, so the times are in `timesText` and those rows are confidence medium; and the sharpening day shows £75.00 at the top of its page and £65.00 in the course-fee block. The three Level 2 and Level 3 courses have no date anywhere, which the hint predicts — fully booked courses run waiting lists and some dates are held for email enquiry — so they are `undated` rather than dropped. Rent-A-Bench is bench hire rather than a class and is not recorded. Also noting a past date left out: the sharpening day page still carries 17th June 2026 alongside the live 28 October."
