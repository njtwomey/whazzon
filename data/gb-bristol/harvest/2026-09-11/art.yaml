        raw: "**Connections Through Wood** — Fri, 18 Sept 2026 18:00 to Wed, 30 Sept 2026 18:00, Centrespace Gallery & Studios


          Showing what’s possible when an artistic eye meets traditional skill, Connections Through Wood brings together a wide range of talents united by their appreciation of the wooden object.


          Exhibition Dates: Saturday 19th September - Wednesday 30th September

          PV: Friday 18th September, 6:00 - 9:00 pm

