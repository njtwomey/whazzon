    notes: "Browser user-agent required, exactly as the hint says: plain WebFetch is refused, a Chrome UA

      returns 200 on /shows and on every show-info page. Worth keeping in the hint.


      The whole programme is in the past. /shows still carries the finished **17-21 June 2026**

      edition — the banner states that range and the address Queen Square BS1 4JP — and 2027 is not

      yet announced, so all eight sittings below have already happened. Recorded as it stands rather

      than rolled forward, per the hint; the fold will call them finished. The festival is between

      editions, not dormant.


      Eight sittings over five days, three of them on Saturday 20 June and two on Sunday 21 June,

      each with a different bill and its own sold-out state, so they are eight events rather than one

      per day. Titled by their line-ups because the day headings alone would collide on event id.


      Day headings give weekday and day but no year; the year comes from the banner and every weekday

      checks out against June 2026, so all eight are high confidence.


      `description` captured for all 8 from their own show-info pages (/wednesday, /thursday, /friday,

      /saturday-early, /saturday-mid, /saturday-late, /sunday-mid, /sunday-late) — 8 extra fetches.

      The /shows index carries no prose at all, only line-up, times and price, so per §3 this small a

      programme is worth walking. Three of those pages carry line-up changes the index does not

      mention (Maisie Adam and Seann Walsh in for Rob Delaney and Ivo Graham; Elis James for Jen

      Brister; Thanyia Moore for Jayde Adams).


      `sold-out` is the page's own flag — five sittings show \"Sold Out\" in place of a Buy Tickets

      button. /line-up was not fetched: the hint says it carries no dates."
