  - id: festivals/upfest
    name: Upfest
    category: festivals
    kind: festival
    status: provisional
    url: https://www.upfest.co.uk/festivals/
    homepage: https://www.upfest.co.uk/
    area: Bedminster
    tags: [street-art, free, summer, outdoor, major]
    cadence: quarterly
    hints: |
      Europe's largest street art festival, across Bedminster and Southville.
      Biennial: the 2026 edition ran 15-31 May 2026, so the next Bristol edition is
      expected in 2028 and this is an announcement page rather than a diary until
      then. The homepage banner carries whichever edition is next, which includes
      Weston Wallz in Weston-super-Mare — outside this location, so do not record it.
    notes: >-
      Verified 2026-08-17: /festivals/ is Upfest's own (Upfest Ltd, 198 North Street,
      Bristol BS3 1JF) and names Upfest 2026 and Weston Wallz 2026 alongside archived
      editions back to 2016, but prints no dates on the page. The 15-31 May 2026
      dates and the biennial format come from Upfest's own announcement, carried by
      Visit West in February 2026.
    addedAt: "2026-08-16"

  - id: festivals/st-pauls-carnival
