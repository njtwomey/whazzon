  - id: theatre/travelling-light
    name: Travelling Light Theatre Company
    category: theatre
    kind: organiser
    status: provisional
    url: https://www.travellinglighttheatre.org.uk/shows
    homepage: https://www.travellinglighttheatre.org.uk/
    area: Barton Hill
    tags: [ family, young-people, touring ]
    cadence: monthly
    hints: |
      Produces for children and young people, touring into other venues rather
      than programming a building — set `venue.sourceId` where the host venue
      is in our catalogue.

      /shows is a Squarespace index that mixes the current productions with an
      archive going back to 2018 (igloo-2018, boing-2019, igloo-2020) — take the
      ones tagged as current and ignore the rest. Dates are stated as seasons,
      not days ("October 2026", "Autumn 2027"), so these are usually
      `occurrence.kind: undated` with the season in the note rather than a guessed
      date. Actual performance dates appear on the host venues' sites, not here.
      /whats-on is a 404.
    notes: >-
      Verified 2026-08-17: the catalogued apex 301s to www, so the harvest's "correction" was only the host prefix. Page is titled "Our Shows | Travelling Light Theatre Company"; the company and Barton Hill base are named on the site. Current productions are Wonder Baby (October 2026) and The Forest Door (Autumn 2027); no street address is published, so none added.
    addedAt: "2026-08-16"

