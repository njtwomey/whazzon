      The domain is sample-studios.com — samplestudios.ie does not resolve.
    notes: >-
      Verified 2026-08-17: /exhibitions/ named the Lord Mayor's Pavilion and TRISKEL SAMPLE Project Space, "Admission is free and all are welcome", and listed six upcoming shows to January 2027 (The Rocket's Red Glare 27 Aug – 3 Oct 2026; Cork Zine Fest residency 29 Oct – 29 Nov 2026). /events/ listed eleven dated upcoming items. /contact/ gives "Exchange Business Park Churchfield, Cork, Ireland T23 XV50". Busiest source in this category by event count. /whats-on/ 404s; /feed/ is news only.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

