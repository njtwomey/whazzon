    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: art/sirius-arts-centre
    name: Sirius Arts Centre
    category: art
    kind: venue
    status: provisional
    url: https://www.siriusartscentre.ie/exhibitions
    homepage: https://www.siriusartscentre.ie/
    area: Cobh
    tags: [ gallery, contemporary, free ]
    cadence: monthly
    hints: |
      Open Wednesday–Saturday 11:00–17:00. Exhibition dates carry no year
      ("4th Jul – 12th Sep"), and one long entry is the building's restoration
      project running to 2030 rather than a show — that one is `ongoing`, not a
      run. The centre also programmes concerts and residencies; /exhibitions is
      the visual-art slice, /all-events the whole thing.
      Refuses some fetchers with a 403 while answering a browser user-agent
      with a 200, so send a browser user-agent.
    notes: >-
      **Outside the configured radius — a human needs to decide on this one.** Measured 13.6 km from the centre in configs/ie-cork.yaml (51.8985, -8.4756) to Cobh, against `radiusKm: 12`. Included because Cork city organisations programme into it rather than because Cobh is in the city: both of Cork Printmakers' currently listed exhibitions ("Oceanic Imaginaries" and "In the Space Between") are at Sirius rather than at Wandesford Quay, and it recurs throughout the Munster–Cork visual arts listings. Drop it if the radius is to be read strictly. Uillinn (West Cork Arts Centre, Skibbereen) was checked against the same rule and excluded — 66.8 km, and its site is behind the same host-level 403 as Lavit's. Verified 2026-08-17: page names Sirius Arts Centre Cobh, gives 021 4813790, and listed Leanne McDonagh: Community & Connection (4 Jul – 12 Sep) and the Irish Georgian Society restoration project (1 Apr 2024 – 31 Dec 2030).
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
    address:
      lat: 51.849129
      lon: -8.297167

