    notes: "The hint's deeper paths are the right route and I followed both: /live/ and /club/. `fetch.url` records /live/ as the main one; /club/ is https://www.theklabristol.co.uk/club/ and supplied the four club rows below. /live/ carried 50-odd gigs to Wed.30.Oct.26 and /club/ 26 nights to Fri.30.Oct.26. I recorded the first six weeks of each — 18 live events to 2 Oct plus 4 club entries — and truncated the rest. Dates are in the Fri.21.Aug.26 form the hint describes, with an explicit two-digit year, so no inference was needed; every printed weekday agrees with 2026 as well. Two shapes worth flagging. Sodium Showdown XXIV is listed twice, on Sat 22 and Sun 23 Aug with separate links, and is one two-day tournament, so it is recorded as a `run` rather than two singles. And the club strand has genuine weekly residencies: Pressure. #TheklaThursdays recurs on Thursdays and Pop Confessional is billed \"Every Saturday Night\", so each is one `recurring` event rather than one row per week — that alone would otherwise have added a dozen near-identical cards. The Friday club slot rotates between brands (Club Classics on 21 Aug, Different Class on 28 Aug), so those stay as singles. Two gaps: /live/ prints doors times for some gigs and not others, and no prices for any; and it exposes no usable image URLs — the slots resolve back to the event page — so `image` is omitted throughout rather than pointed at a page. Also note Sodium Showdown and the DMC DJ championship are an esports tournament and a competition rather than gigs, tagged accordingly."
