    homepage: https://corkpotters.com/
    tags: [ ceramics, community, workshops ]
    cadence: monthly
    hints: |
      Non-profit society of ceramic artists working in Cork city and county,
      running since 1980. It organises workshops and exhibitions rather than
      holding a building, so treat everything as happening somewhere else and
      set `venue` where the post names one.

      Everything is a WordPress post on /news/ with the byline date, not the
      event date — "Unleashing Your Creativity – Workshops" was posted in
      February for spring workshops, and exhibition posts print the run inside
      the body ("30th May – 28 June"). Read the dates out of the text and treat
      the post date as publication only. Members exhibit well outside Cork
      (London, West Cork), so check location before recording.

      No Events Calendar plugin — /wp-json/tribe/events/v1/events 404s.
    notes: >-
      Verified 2026-08-17: corkpotters.com is the Society of Cork Potters, and its own description matches the Cork Craft & Design page for the society. Active — an August Craft Month 2026 post dated 18 July. corkpotters.ie, societyofcorkpotters.ie and societyofcorkpotters.com do not resolve.
