      the four are dead domains that have been re-registered by unrelated
      businesses and both serve 200 — see `notes`. The market name, day and hours
      on Taste Cork's own page are the usable part.

      /explore-cork/food-markets/farmers-markets/ is the whole county and reaches
      well past the radius; /whats-on is a separate dated diary whose body is
      rendered in JavaScript and returns almost nothing to a plain fetch.
