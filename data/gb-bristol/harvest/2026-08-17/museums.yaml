        raw: "13—27 August 2026


          FAMILIES: Join us for a relaxed family dress up session where children and adults can

          get creative together.\n"
        summary: "Three Thursday craft-and-story afternoons where families make medieval shields, Georgian fans and sixties headbands, then raid the dressing-up room."
        description: "Get all dressed up for our fashion-themed family craft and story sessions at Blaise

          Museum this summer!


          Take inspiration from the special display of costume dolls and our historical costume

          here in the museum. Then get creative and make your own accessories – whether it's a

          shield for a medieval knight, a fan for a Georgian aristocrat or some groovy headgear

          for a 1960s hippy. Visit our special dressing-up room and have your own fashion show

          wearing our child and adult costumes.


          Join us for a relaxed family session where children and adults can get creative

          together:


          - Take part in a costume craft activity – make your own medieval shield, Georgians

          \  fans and 1960s flower headbands

          - Contribute to a joint artwork – add cut-out pictures, drawings, words and drawings

          \  to create a collaborative costume

          - Enjoy a summertime story on the picnic blanket (indoors or out, depending on the

          \  weather!)


          This activity will be taking place on the following days: Thursday 13 August,

          Thursday 20 August, Thursday 27 August.


          The sessions run on a first-come, first-served basis. To ensure a safe and

          high-quality experience, we will ask people to return later if the session becomes too

          busy.


          2026 is National Year of Reading and here at Bristol Museums we're going to

          [Go All In](https://goallin.org.uk/). All our family events all include story time for

          children.


          Drop in, no booking required. Free, donations welcome.\n"
