    notes: "Everything the hint says about this source holds. The homepage is the diary — a When / What / Where / Price table, venue named on every row, 149 dated rows running from 20 Aug 2026 to 19 Jun 2027, with per-row artist and ticket links. (`/gigs` is a 404, as the hint says.) The page is served in latin-1, so apostrophes arrive mangled unless the encoding is respected.

      **This observation is deliberately partial, and here is the accounting.** Of the 149 rows, 121 are within the city and 28 are Cork county venues well outside the radius — Levis in Ballydehob (7), Sea Church in Ballycotton (3), Ballymaloe Grainstore (3), Book'd @ Prim's in Kinsale (3), De Barra's in Clonakilty (3), Garinish Island (2), Briery Gap in Macroom (2), and one each at St Catherine's Kinsale, Connollys of Leap, Paddy Mac's Coachford, St George's Mitchelstown and Creedon's Hotel Macroom. Those 28 are not recorded.

      Of the 121 city rows, 102 are dropped because a better source for the same gig was harvested today and recording them twice would put the same show on the site twice: Cyprus Avenue 58 (its own /gigs page), Coughlan's 17 (its own /whats-on/), Savoy Theatre 12, Live At St Luke's 4, Cork City Hall 2 (all three recorded from their own catalogued corkgigs venue profiles), Wavelength 8 (see below), White Horse Ballincollig 1 and Triskel 1 (their own pages). **19 events are recorded here** — the ones nothing else in this category covers.

      Three findings worth a curator's time.

      **1. Cork Opera House is missing from the music catalogue.** Fifteen of these rows are Cork Opera House concerts — Freya Ridings, Hothouse Flowers, Paul Brady (two nights), Glen Hansard, Declan O'Rourke, The Frank and Walters, Cormac Begley and more — and they are the largest seated music programme in the city. The only Opera House entry anywhere in this catalogue is comedy/cork-opera-house. Fourteen are recorded here with `venue.name: Cork Opera House`, which works but is the wrong home for them; the venue should have a music/ source with corkoperahouse.ie/whats-on/ as its listings route, since every row here deep-links there.

      **2. \"Wavelength\" is a room nobody has catalogued.** Eight rows are filed at a venue called Wavelength, and every one of them links to a cyprusavenue.ie/gigs ticket page — so it is a room inside the Cyprus Avenue complex, almost certainly the upstairs space the Cyprus hint calls Winthrop Avenue under a new name. They are recorded under music/cyprus-avenue from the venue's own page, which labels them \"Cyprus Avenue\", not repeated here.

      **3. Two Cyprus Avenue gigs appear here that the venue's own page does not list at all** — Thumper on 6 Sep and Sixpence None The Richer on 24 Sep. Both are recorded here with `venue.sourceId: music/cyprus-avenue`, because a gig the venue forgot to print is exactly what an aggregator is for.

      Smaller notes: corkgigs prefixes its own classifications into titles (\"[Tribute]\", \"[Comedy]\", \"[Jazz Fest]\", \"[SFSH]\"), which go into `subcategory` and are stripped from the title. It prints the Lemoncello row twice, which is a duplicate on their side. Gavin James on 30 Oct is filed here at Cork Opera House while linking to a Cyprus Avenue ticket page — that conflict is recorded on the Cyprus Avenue event rather than duplicated here. Three rows are in UCC rooms (Boole theatres, Boole library, UCC Library Creative Zone) and are recorded with `venue.name`, since music/ucc-music is the department's own listing rather than a room. The site's \"renovating\" banner is still up and the per-venue profiles are indeed thinner than the main diary."
