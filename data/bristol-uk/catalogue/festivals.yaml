  - id: festivals/forwards
    name: Forwards Festival
    category: festivals
    kind: festival
    status: provisional
    url: https://www.forwardsbristol.co.uk/lineup
    homepage: https://www.forwardsbristol.co.uk/
    area: The Downs
    tags: [music, summer, outdoor, ticketed, major]
    cadence: quarterly
    hints: |
      Two-day ticketed festival on the Downs. The lineup page is split by day but
      prints no year — the printed weekdays settle it (Sat 29 and Sun 30 August fall
      that way in 2026). Acts only, no set times, so a single event per day is the
      honest record until a stage clash finder appears.
    notes: >-
      Verified 2026-08-17: homepage reads "FORWARDS RETURNS FOR 2026" at Bristol
      Downs; /lineup lists acts under Saturday 29 and Sunday 30 August — Tems, Self
      Esteem, Wet Leg, Little Simz, Amyl and the Sniffers among them.
    addedAt: "2026-08-16"

