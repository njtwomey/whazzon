    url: https://www.corkvisioncentre.com/
    area: City Centre
    address:
      street: St Peter's, North Main Street
      city: Cork
      lat: 51.899549
      lon: -8.478862
    tags: [ gallery, free, civic ]
    cadence: quarterly
    hints: |
      **Do not harvest this.** corkvisioncentre.com is a parked domain, not a
