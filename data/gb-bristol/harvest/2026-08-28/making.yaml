    notes: "Still dormant, and the hint's warning is exactly right. The page reports \"0 events found\" and \"There are no upcoming events\"; everything visible on it sits inside the tribe-events-calendar-latest-past block, which I checked for in the markup before reading anything as upcoming. The newest of those is Meet Make Mend on 19 July 2025 — now thirteen months old — and behind it the Summer Social of 2 July 2025 and a Stitch Club Social of 23 June 2025. Nothing has been added since the last check on 17 August, and nothing at all is billed for the bank holiday weekend. The organisation is still there — the footer gives Bristol Textile Quarter CIC, Ground Floor, 1A Barton Road, St Philips BS2 0LF, company 9182267 — so this reads as a studio that has stopped publishing a public programme rather than one that has closed. Recorded as a successful fetch with no events, which is a real result and different from a failure."
