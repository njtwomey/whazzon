schema: whazzon.catalogue/1
category: food-drink
label: Food & Drink
description: >-
  Food and drink events in Cork — festivals, tastings, supper clubs, cookery courses, brewery and distillery tours, food-tour operators. Only sources that actually programme events belong here; a restaurant with no public programme is not a source, however good it is. The English Market, Marina Market and the farmers' markets are deliberately left to the markets category rather than catalogued twice.
sources:
  - id: food-drink/cork-on-a-fork-fest
    name: Cork on a Fork Fest
    category: food-drink
    kind: festival
    status: provisional
    url: https://www.corkcity.ie/en/cork-on-a-fork-fest/what-s-on/
    homepage: https://www.corkcity.ie/en/cork-on-a-fork-fest/
    tags: [ festival, food, civic, tastings ]
    cadence: quarterly
    hints: |
      Cork City Council's own five-day food festival, mid-August, and by a
      distance the largest food event in the city — the 2026 edition ran 12–16
      August with over 150 events.

      The `/what-s-on/` page itself is only a navigation hub and carries no
      events. The programme lives on eleven confirmed sub-pages, all of which
      answer 200 and each of which holds the full detail (time, day, venue,
      price, booking route, and status text such as "Booked Out" or
      "Cancelled"):

        by day:   what-s-on/wednesday/ thursday/ friday/ saturday/ sunday/
        by theme: what-s-on/dining/ trails-tours/ demos-workshops/
                  talks-tastings/ family/ community-free/

      The day pages and the theme pages overlap heavily — the same event appears
      on both — so deduplicate rather than recording it twice. Prefer the theme
      pages for the date range: a multi-day event is printed with its full run
      there ("Wed 12th, Thurs 13th, Fri 14th & Sat 15th Aug") but truncated to
      the single day on a day page.

      These are enormous HTML documents (roughly 600 KB), almost all of it the
      council's site-wide mega-menu. The programme is the last few thousand
      characters of the body.

      Many events are hosted by venues catalogued separately here (Rebel City
      Distillery, Rising Sons, L'Atitude 51, Fab Food Trails, Activity Days), so
      set `venue.sourceId` where it matches.

      Booking is never on corkcity.ie: each entry ends in an external link, an
      email address or a phone number.
    notes: >-
      Verified 2026-08-17. Catalogued here rather than under festivals: it is a food festival whose value is the individual tastings, demos and supper clubs, which is exactly what this category filters on. If the festivals agent has also proposed it, this entry is the duplicate to drop, because the day/theme sub-page structure above is recorded here. /what-s-on/trails-tours-tastings/ 302s to /what-s-on/trails-tours/ — use the latter.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/franciscan-well
    name: Franciscan Well Brewery & Brewpub
    category: food-drink
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://franwellbar.com/whats-on/
      - role: feed
        url: https://franwellbar.com/feed/
        note: the same event posts with pubDate attached, mixed in with cocktail recipes
    homepage: https://franwellbar.com/
    area: Sunday's Well
    address:
      street: 14b North Mall
      locality: Sunday's Well
      city: Cork
      postcode: T23 RHW2
      country: Ireland
      lat: 51.901217
      lon: -8.482019
    tags: [ brewery, taproom, independent, beer ]
    cadence: monthly
    hints: |
      Brewpub in a 13th-century Franciscan monastery site, brewing on the
      premises since 1998. Events are posted as WordPress blog posts, not
      calendar entries — /whats-on/ is a marketing page with three post teasers
      on it and a "BROWSE EVENTS" button into the blog.

      Two annual beer festivals are described at /beer-festivals/ — an Easter
      craft beer festival with around 13 Irish breweries, and an "Octoberfest"
      timed to the jazz weekend or the October bank holiday — but that page
      publishes no dates at all and says to follow their Instagram for
      announcements. Record them as `recurring` with a note rather than
      inventing dates.

      Tours and classes are at /experiences/: the Ultimate Craft Beer Experience,
      a private brewery tour and cocktail classes at The Monk, all "45 minutes to
      1 hour", "1 – 20 Guests per booking". Prices are not printed anywhere and
      two of the three are enquiry-only, so they are `recurring` or `ongoing`
      offerings, not dated events.

      The trad session, storytelling night and Brewhouse Jazz belong to the music
      programme, not the food one.
    notes: >-
      Verified 2026-08-17. franwellbar.com is the brewpub's own site (footer address matches, /beer-festivals/ and /experiences/ both real). The site is a year stale: the three events presented as upcoming on /whats-on/ are dated July 2025 (Tuesday Trad Session 8 July, Teddy Black Story Telling 7 July, Brewhouse Jazz 6 July) and the newest item in the RSS feed is 30 June 2025. Worth a human deciding whether this is `dormant` on the events side; the brewery itself is trading and appears in the 2026 Cork on a Fork programme. /?rest_route=/tribe/events/v1/events 404s — no events calendar plugin, so there is no API route.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/rising-sons-brewery
