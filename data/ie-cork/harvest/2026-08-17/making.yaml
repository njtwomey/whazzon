          \"This unique course offers a chance to enter Third Level as a

          part-time student to concentrate on textiles as an expressive medium

          within an Art College environment.\"


          No start date is printed.\n"
        summary: "The deep end of Cork's textile teaching: two part-time years inside the art college, stitch through weave, felt, paper, 3D and basketry, taught by the same senior staff as the full-time Applied Art degree and ending in a Level 8 award and an exhibition. Applications are open; the page prints no start date."
        description: "This unique course offers a chance to enter Third Level as a part-time

          student to concentrate on textiles as an expressive medium within an

          Art College environment.


          What will you be doing? This is a two year course: Year One integrates

          lectures and seminars (Mondays) with textiles studio (each Tuesday).

          Year One is a balance between essays, discussions, and presentations

          with the technical challenges of the broad range of textile techniques

          presented (stitch/print/weave/felt/paper/3d/basketry). In the second

          Semester, studio projects challenge creative investigation and research

          toward finished works around project themes. In Year Two only the

          Tuesday studio course is held, and is grounded in weekly group research

          discussions and seminars presenting samples and works in progress for

          feedback and development. Individuality and innovation are encouraged

          as final works evolve toward exhibition presentation. As a bonus,

          additional textiles research challenges entered alongside fulltime

          Applied Art students provide opportunities to exhibit both in the city

          and internationally.


          Why do this course?


          - It provides a structured and thorough immersion in textile making and

          \  textile culture, balancing studio and academic challenges.

          - It nurtures the research development of individual artistic languages

          \  in textiles, in the context of contemporary fine art and applied art

          \  practice.

          - It forms a supportive and inspiring peer group of like-minded textile

          \  makers, taught by senior lecturing staff of the MTU Crawford who also

          \  teach on the fulltime Fine Art and Applied Art Degree.

          - It offers project involvement and exhibition opportunities shared

          \  alongside the fulltime Contemporary Applied Arts Degree, such as

          \  recent exchange projects with Estonian and Lithuanian textile

          \  departments.\n"
        confidence: "medium"
    notes: "The catalogue hint is exact: the index carries no dates and every date, price and tutor is on the individual /courses/<slug>/ page, so these fetches were navigation rather than enrichment.

      **Coverage, stated plainly.** The index lists 44 courses in six blocks. The 5 undergraduate and 9 postgraduate degrees were ignored per the hint — a four-year BA is not an event. Of the remaining 30 (8 Part Time / Certificate, 7 Evening Semester 1, 7 Evening Semester 2, 8 Short Courses) I opened 11 pages and recorded 9 events. Deliberately not opened: the four art-therapy and portfolio-preparation short courses and TY WEEK (not making), the six non-textile/ceramic certificates, and two Semester 2 evening courses (Drawing and Painting – Developing Visual Language, Life Drawing: Intermediate) — those two are the same shape as the Semester 2 courses that are recorded and would each have cost another fetch.

      Every recorded course is one `recurring` entry with its weekday and time, not one event per week. Semester One weekdays all check out against 2026 (Tue 15th, Wed 16th, Thu 17th September 2026), and Semester Two against 2027 (Tue 19th, Wed 20th January 2027).

      **One page has a wrong year.** Ceramics: The Potter's Wheel prints \"Semester Two: Course commences Wednesday 20th January 2026\" while its own registration date is 1 December 2026 and its application deadline is 15 January 2027. 20 January 2026 was a Tuesday and 20 January 2027 is a Wednesday, so the intended date is 2027-01-20; recorded as such at `confidence: medium`.

      **Two pages are stale and produced nothing.** /courses/deep-dive/ advertises a full day in Cork City on \"Saturday 10th May\" with no year — 10 May was a Saturday in 2025 and a Sunday in 2026, so it is a 2025 event still on the site. /courses/eco-art-workshops/ lists five dated eco-arts workshops (Nov 8th–9th, Dec 14th, Jan 25th, Feb 28th/29th, April 4th/5th) with no year at all, and \"Feb 29th\" only exists in a leap year, which puts the programme at 2023–24 or 2024–25; its booking links point at events.mtu.ie eventIds 1083–1105. Neither is recorded, because an `undated` row for a past listing would sit on the site looking current for ever. Both are worth a `notes` flag for stage 1 — the eco-arts strand is genuinely making-relevant when it runs again."
