    notes: "Browser user-agent required, as the hint says: plain WebFetch is refused, a Chrome UA gets 200.


      Started from the catalogued /events/category/comedy/ page, which worked but **paginates at 12 a

      page** — the \"12 events found\" count is per page, not the programme, and there is a Next Events

      link. Rather than walk four pages of HTML I used the REST API the hint records, narrowed to the

      comedy category: `/wp-json/tribe/events/v1/events?per_page=50&page=1&categories=comedy` returns

      `total: 46, total_pages: 1`, and every one of the 46 carries the `comedy` term. That is the

