    notes: "The hint is right on both counts: showtimes are server-rendered, and only for today. The seven date buttons are a POST on searchFilterForm and ?date=YYYY-MM-DD is ignored, so this is Mon 17 Aug only — 39 individual performances, folded into 16 rows, one per film with every time in timesText. The chain-wide /cinema/events strand is a dead end for a fetcher: 51 KB of chrome, cookie tables and the cinema picker, and not one event in the HTML. Per-film pages are no better — /cinema/movie/cork/nt-live-golden-boy returns the correct <title> \"NT Live: Golden Boy | Cinema Showtimes\" and zero booking links, so the dates live only in client-side JS. That is the real gap here and it is worth a hint: the \"Filter movies & events\" dropdown does enumerate every title with a future showtime at Cork — 35 in all — and 19 of them are not on today's list and are undateable from this site. They are the event cinema and the anime strand: NT Live: Golden Boy, NT Live: The Misanthrope, Hadestown: The Musical, Fallen Angels by Noel Coward, LINKIN PARK: UNSHATTER, GIANT - The Play, Andre Rieu's 2026 Christmas Concert, the seven RBO Royal Ballet and Royal Opera titles plus Manon, Khalifa (Malayalam), and Kiki's Delivery Service in both dubbed and subtitled versions. Most of those are dated on the Arc's /whatson/eventcinema page, so the two sources can corroborate each other. One event-cinema title is captured because it plays tonight: James: Getting Away With It + Live Premiere Performance, 19:45, Screen 5, from €11.95. Accessibility: the filter panel documents Sensory Friendly (\"every weekend around noon\"), Subtitled (\"blockbuster movies on Monday evenings\") and Parent & Baby (Wednesdays) strands, but nothing in today's markup flags any screening as any of them — and today is a Monday, so if there is a subtitled show it is not identifiable from the page. Encoding, for the record: the page declares charset=iso-8859-1 and its own bytes contain a literal \"?\" wherever a curly apostrophe or a dash belongs (\"wasn?t\", \"O?Brien\", \"phenomenon?spawning\"). That is the page's own corruption rather than a decoding artefact, and the unambiguous cases are repaired in the synopses here rather than shipped to a reader; no fact was changed. Deliberately not recorded: nothing. Everything the page listed for today is here. What is missing is future days, which this source cannot serve."
