    notes: "**The single most productive source in this category, and the only one with a substantial forward diary.** Two fetches: the catalogued path and `?page=2`. The hint's warning about variant rendering did not bite — both pages returned a full `application/ld+json` `ItemList` of exactly 20 events each, with dates, venue, address, Eircode, image and a sentence of the listing's own copy, which is where every row here comes from. **That JSON-LD block is worth a catalogue hint: it is far cheaper and more complete than scraping the cards, and it is the reason this observation has an Eircode on nearly every venue.** **40 events read, 24 recorded, 16 excluded — every exclusion is on the radius, and here they are by name.** Cork's `radiusKm` is 12 from 51.8985,-8.4756. Outside it: Ballymaloe Grainstore Food Sessions (11 Sep) and Ballymaloe Festival of Food 2027 (14–16 May 2027), both Shanagarry, ~31 km; Wine, Cheese & Charcuterie Tasting Evening (3 Sep) and The Macallan Whisky Pairing Dinner (25 Sep), both Fota Island Resort, ~13 km — **these two are the marginal calls, barely outside, and a human may well want them in**; Cocktails, Canapés & Craic (3 Sep) and The Fork & Wheel Barista School (2 Sep), both Midleton, ~21 km; ART + WINE: 5 Artists × 5 Wines (4 Sep), Killeagh, ~30 km, and billed as part of \"fEast - East Cork Food & Drink festival\"; Barnahown x Aoife's Table Autumn Dinner (11 Sep) and Aoife's Table X Barnahown (12 Sep), Mitchelstown, ~50 km; Butter Making Demonstration at Annes Grove Gardens (23 Aug), Castletownroche, ~45 km; Paahto & The Bull, Book'd @ Prim's (26 Oct), Kinsale, ~25 km; An Evening of Jazz, Swing and Soul food (5 Sep), Coachford, ~20 km; Tea and Tunes by the Riverside (22 Aug), Bandon, ~24 km; Food Writing Retreat with Kate Ryan (6–9 Oct), Castletownshend, West Cork; and GATHER IN THE FOREST (26 Sep), which is in **County Limerick** and should not be on a Cork facet at all. Carrigaline (~11 km) and Douglas (~4 km) are inside and are recorded. **One more excluded, and not on geography:** \"Pints & Ponytails with KiwiCutz\" (11 Oct, Seventy Seven, Grand Parade) is a hairdressing session teaching fathers to style their daughters' hair. Eventbrite has it under Food & Drink; it is in the city and it is a real event, but it is not a food or drink event and putting it on this category's page would misrepresent both. Flagged rather than silently dropped — a human may want it moved to `family`. **The catalogue hint about prices is confirmed exactly: no price is recorded on any row**, because Eventbrite prints none. I checked the raw HTML for price strings as well as the JSON-LD `offers` (which is `null` on all 40) and found nothing to take, so `price` is omitted throughout rather than guessed. **Weekday verification: every one of the 19 rows for which Eventbrite printed a weekday matches the calendar for the year given**, so those are `confidence: high`. Four rows carry no time and I have not invented one: the two events dated today render as \"Today at …\" rather than with a weekday, and the cards for 19 and 20 August could not be tied to a specific time string with any confidence. One of today's two cards also carries \"+ 52 more\", which almost certainly makes it a weekly series — most likely the Shelbourne Bar whiskey tasting — but I could not attribute it, so that row is a `single` at `confidence: medium` with the ambiguity stated. Two rows are `recurring` on the strength of their own copy: the Hot Wing Challenge (\"every Wednesday\") and Table 26 (\"the 26th of each month\"), one row each rather than one per occurrence. **The find that matters most for stage 1** is under food-drink/franciscan-well: Eventbrite is selling \"Beyond White: Orange Wine & Cheese Tasting\" **at the Franciscan Well today**, an event that appears nowhere on the brewpub's own site, whose newest post is from July 2025. That is strong evidence against marking that source dormant, and an argument for adding an Eventbrite organiser feed to it. Eventbrite also gives the brewpub's Eircode as T23 P264 against the catalogue's T23 RHW2. Two other cross-references worth noting: Don Gregorio and Clancy's both appear here and both also appeared in the Cork on a Fork programme, so they are candidates for the catalogue in their own right; and \"Table 26: Dublin | Dinner with New Friends\" is titled Dublin while its venue is on Paul Street in Cork, which is the organiser's error rather than mine, hence `confidence: medium` on that row."
