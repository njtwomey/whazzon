    notes: "The corrected catalogue URL is right and needed no navigation: /events/ returned 200 first time and carried the whole forward horizon in one page, nine dated items from July 2026 to March 2027, so no month pages were read. This is four more than yesterday's run saw — Apple Day and the four Friends' Winter Lectures — because yesterday stopped at September; nothing here was found by walking further, the index simply lists it all.


      Seven event pages were opened for `description`: Wednesday Wanders, Botanic Garden Lates, Sketching Bristol's Long-lived Trees, Bee and Pollination Festival, Apple Day, the Knepp Estate lecture and the Charles Dowding lecture. The two \"to be announced\" lecture placeholders were not opened, since the index already showed their only content is \"Details to follow...\", and they carry no `description` as a result. The Dowding page is password protected — \"This content is password protected. To view it, please enter the password below.\" — so it has no `description` either, and no start time; the \"Protected:\" prefix WordPress adds is dropped from the title. Note that three /event/ URLs on the botanic-garden.blogs.bristol.ac.uk host 302 to the same path on botanic-garden.bristol.ac.uk, which is what is recorded.


      Two hints are now out of date and worth curating. First, \"No admission price is printed on either page\" — the /events/ index does print admission in full: weekday DAISY Days (Donate As It Suits You) and weekend adults £9, £9.90 with Gift Aid, alumni £5, free to members, under-18s, students and essential carers. That is recorded on the ongoing collections row. Second, the hint that lecture placeholders should keep their date is followed here and is the right call, but note the placeholders are only missing a subject: the date, time and venue are all stated, so they are `single` rows rather than `undated` ones. Recording them as `undated` would also collide on id, since two identically-titled placeholders would produce the same content hash.


      The four Friends' Winter Lectures are not at the garden. The Knepp page states the series \"will take place on the third Thursday of the month at the Frank Theatre, Wills Physics Laboratory, Tyndall Avenue, Bristol BS8 1TL\", so `venue` is set on all four; for Dowding and the two placeholders that is a join from the series statement rather than from their own pages, which is why those three rows are `confidence: medium`. Each date checks out as the third Thursday of its month. The Dowding lecture printed no year — 19 November is a Thursday in 2026 and the third Thursday of that November, so the inference is confirmed. The permanent collections row is derived from the opening-hours and admission block on the index rather than from a listing, so it is `confidence: medium` and carries no url; yesterday's row pointed at /plant-collections-and-glasshouses/, which was not opened today and so is not repeated."
