    notes: "The JSON endpoint recorded in the hint still works and is still the only usable route — /find-a-shed/ remains a maps widget that renders \"No results found in this location\" to a fetcher. The directory has grown since the last check: 1,110 markers rather than 1,098, and 17 match Bristol or a BS postcode rather than 16. The new one is \"Your Care, Dementia Day Club\" at 111 High Street, Hanham BS15 3QG, updated 19/08/26. Of the 17, six are North Somerset, Somerset or BANES rather than Bristol and are excluded here — Clevedon BS21, Axe Valley (Axbridge) BS26, Wedmore BS28, Nailsea, Portishead BS20 and Midsomer Norton (Farrington Gurney) BS39 — which is the check the hint asks for. Four more are in the Bristol area but publish no opening hours at all, so they are not recorded as events: Long Ashton, Downend (whose entry says they are \"currently moving to an exciting new premises\"), Wick Village, and the new Hanham entry. That leaves the seven below, every one of them a prose opening pattern inside the marker's description and never a dated event, so all seven are recurring. Nothing in the directory is billed for the bank holiday weekend, and no shed says anything about closing on Monday 31 August — several are Monday openers, so a reader should ring first. Each event carries a `venue` because these happen at the sheds, not at the directory."
