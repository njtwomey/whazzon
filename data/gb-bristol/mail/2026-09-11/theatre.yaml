    body: "Closer Each Day:


      World’s Longest Improvised Story Continues


      Beginning Mon 14th Sept & Every Other Monday


      7:30pm | £14 (£8 Closer Each Day Patron Members)


      Nothing is more Bristol than this anarchic and joyful on-going live comedy soap opera. We are delighted to announce that are returning to Bristol Legends’ Best Performing Arts Venue 2026, The Wardrobe Theatre, this September to continue their 15th birthday celebrations!


      https://mail.thewardrobetheatre.com/c/AQiQ-RUQobe0AhjalsLcASCMz9MXKLfH-wm9mMr8fr-AO2dqTRdSFnW1jINOIzVzLXaULWg_2s0i1g


      Book Now → <https://mail.thewardrobetheatre.com/c/AQiQ-RUQobe0AhjalsLcASCMz9MXKLfH-wm9mMr8fr-AO2dqTRdSFnW1jINOIzVzLXaULWg_2s0i1g>


      Set in the fictional location of Newtown, Closer Each Day has run fortnightly at The Wardrobe Theatre for over 15 years and almost 300 episodes. It is the longest running theatre show outside of London and the UK’s only live soap opera!


      Closer brings you all the drama, romance, and intrigue of a traditional soap, but with side-splitting comedy and the excitement of an unscripted live show. And anything can happen; an illicit affair, a joyful wedding, a nail-biting cliff-hanger or even a murder!


      Don’t worry if you’re a newcomer – we’ll catch you up on the action and you’ll be totally immersed from the very first scene. So, whether it’s your first time, you’re a binge-watcher or a life-long fan, come and find out what happens next!


      FINALIST – Bristol Life Awards 2026 and 2023


