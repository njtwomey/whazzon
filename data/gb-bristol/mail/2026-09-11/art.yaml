      VASW: MAKE SPACE INITIATIVE FOR ARTISTS

      Applications are open for Make Space, a new initiative giving artists dedicated time and space to set up, test and reflect on their work. Through the programme, artists can use Spike Island's residency space to install work, critically review progress, document work professionally, and invite feedback from peers.

      Learn more <https://us.list-manage.com/OUPOFl1XrMS?c2id=a7c541d1d2eca54a095703c2afcca581&m=hcr2XqzDQ_qyS-0-JxYnulXc2m5rUizWxPZVlkPFOaCDZDblwhgfiSgwocWB>


      OFFICE SPACE FOR RENT: UNIT 52

      Spike Island is seeking a creative business, organisation or collective to occupy a bright and flexible 860 sq ft first-floor workspace within our thriving arts and creative community in the heart of Bristol. Offering an open-plan layout with excellent natural light, you can adapt the space to suit your needs as a studio, office, collaborative workspace or creative production hub.

