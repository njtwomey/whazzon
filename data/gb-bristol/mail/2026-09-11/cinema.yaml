      Winner of the Silver Bear for Best Director at the 2026 Berlin Film Festival, Everybody Digs Bill Evans is a biographical drama film about the famous jazz pianist and composer Bill Evans.


      WATERSHED RECOMMENDS

      \"Grant Gee evocatively captures the world of 1950s NY jazz with all its seductive experimentations and addictions (extraordinary when you know it was filmed in Ireland!). Norwegian actor (and musician) Anders Danielson Lie inhabits Evans’ internal slide to depression, recovery and back again.\"

      Mark Cosgrove, Cinema Curator


