schema: whazzon.catalogue/1
category: making
label: Making & Craft
description: >-
  Makerspaces, workshops, printmaking, woodwork and craft courses.

  The distinctive problem in this category is that most listings are *courses*,
  not events — a ten-week evening class is not the same thing as a one-off
  workshop, and a "what's on" page is much less useful if it fills up with
  enrolment listings. Prefer one-off and short workshops, open days and public
  makes; record a recurring course as `occurrence.kind: recurring` with the
  pattern stated, rather than as a stream of dated events.
sources:
