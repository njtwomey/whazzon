      SPIKE ISLAND 50 SUMMER PARTY

      Saturday 5 September, 5pm–late

      Celebrating 50 years of Spike Island. Our building comes alive with an evening of live art performance, music, DJs and food, marking five decades of artist-led experimentation and community.

