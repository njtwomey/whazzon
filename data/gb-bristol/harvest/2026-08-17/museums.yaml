    notes: "/whats-on/events is the real index, as the hint says, but it paginates: page 1 carries ten cards and ?page=1 carries eight more, eighteen in all. Those eighteen are a superset of /whats-on/special-events (7) and /whats-on/daytime-planetarium-shows (4), both of which were also read and added nothing except confirming which section each item sits in — a hint saying the two sibling sections are redundant once pagination is followed would save the next run two fetches. The important fact about this source: **the listing cards carry no dates at all** — no date field, nothing but a title, a one-line summary and an accessibility label. Every date below comes from the event's own page, which is why thirteen pages were opened rather than the dozen the contract allows; without them almost every row would be `undated`, which is what happened yesterday. The remaining five (Storytelling and the four daytime planetarium shows) were not opened and are recorded as `undated` with the reason, since guessing \"ongoing\" for them would be an inference the index does not support. Years are printed on the event pages, and every printed weekday checks out against 2026, so confidence is high except where noted."
