    notes: "**Route.** The catalogued /courses-and-workshops is a category landing page wrapped around a search form, not a listings page: it prints category, duration, month, subcategory, day, time-of-day and tutor selects and no course rows at all. The form GETs https://www.bristolfolkhouse.co.uk/results. Bare /results returns 500; /results with every filter present but empty returns 200 and the whole prospectus, ordered by start date, ten to a page — \"We found 356 courses for you\". One-off workshops have their own route, https://www.bristolfolkhouse.co.uk/one-day-workshops?course_week=0, also date-ordered and ten to a page. Both are handovers for stage 1: the catalogued URL is a landing page, and these two result routes are what a harvest actually needs. `fetch.url` records the all-courses route as the one this observation is anchored on.


      **Declared partial.** 356 courses is far more than belongs on a city listings site, so this is a deliberate slice of 64: all 35 one-off workshops starting between today and Sunday 27 September 2026 (pages 1-4 of the one-day route); the 27 term courses of the Monday 14 September autumn-term cohort (pages 1-4 of the all-courses route); and two standing weekly things, the Folk House Choir and Drop in and Draw. Not read: pages 5 onward of the one-day route, which continue into October, and pages 5 onward of the all-courses route, which continue into the Tuesday-to-Sunday classes of the same autumn term. The slice is therefore honest about dates but skewed by weekday for term courses — every Monday class and no Tuesday one.


      **Courses are not expanded.** Each term course is a single `recurring` event with the length and start in the source's own words (\"6 Week Course, Mondays from 14 September 2026\") and never one row per class. `end` is omitted because the index prints a start and a duration but no end date, and deriving one would be inventing it.


      **Past rows dropped rather than undated.** Eight one-day workshops between 6 and 14 August have been and gone, as have \"Writing for All Course (Online)\" (3 weeks from 21 July) and \"I Wish I Could Paint (In Acrylics)\" (3 weeks from 3 August, whose last of three sessions falls today); none is recorded, since a past start is not what `undated` is for. \"Drop in and Draw\" is recorded despite a July start because it is a twelve-week weekly drop-in still running.


      **Id collisions.** Three titles recur inside the 14 September cohort as separate classes at different times — Pottery (Improvers) at 10:00 and 18:00, Line Dance (Beginners) at 12:00 and 17:00, Line Dance (Improvers) at 15:45 and 19:30. Event ids hash source, title and anchor date, so each pair would collide. The source's own printed course code is appended in brackets to those six titles and to no others.


      **Prices and images.** The result cards carry no fee and no thumbnail, so `price` and `image` are omitted rather than guessed. Detail pages do print fees (\"Full fee: £7.00 | Over 65s: £7.00 | Benefit: £7.00\"), but that is 63 further fetches for one field. Exactly one event page was opened: The Folk House Choir, because the one-day route files it as a \"1 Day Course\" when it is nothing of the kind — a weekly Tuesday-evening choir across two autumn terms — and the pattern and price had to come from the page. It is the only row here with a `description`.


      **Dates.** The all-courses route prints weekdays (\"Fri 17 July 2026\", \"Mon 14 September 2026\") and both check out against the calendar; the one-day route prints the year but no weekday. No year was inferred anywhere, so every row is `confidence: high`.


      **New tags.** Four coined, because nothing in Bristol's existing vocabulary covered what an adult-education prospectus mostly is: `creative-writing`, `languages`, `painting` and `drawing`. `new-writing` already exists but is in use for new plays in theatre.yaml, and `courses` is kept for term-length courses while `workshop` marks the one-off days.


      The hints' note that /feed/ serves the HTML page rather than RSS was taken on trust and not re-tested."
