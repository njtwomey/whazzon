        raw: "**An Evening with The Legendary Mr Pussy and Friends** — The Everyman, MacCurtain St. Wed 19 Aug 2026, 20:00. €28.50.\n"
        summary: "Alan Amsby's Mr Pussy, a fixture of Irish drag since the 1970s, brings a guest line-up to the Everyman for one night."
        description: "Get ready for a night of outrageous comedy, dazzling drag and unforgettable entertainment as one of Ireland's most iconic drag performer, Mr Pussy, takes to the stage with a fabulous line-up of special guests.


          A true legend of the Irish cabaret scene, Mr Pussy has been serving bold looks, razor-sharp wit and unapologetic glamour for decades. Known for pushing boundaries and leaving audiences in stitches, this is drag at its most fearless and fun. Joined by a handpicked selection of some of Ireland's most exciting drag talent, Mr Pussy and Friends is a high-energy spectacle packed with lip-sync performances, live vocals, camp comedy and plenty of surprises along the way.


          Whether you're a long-time fan or new to the world of drag, this is a night out you won't want to miss - full of laughter, attitude, and pure entertainment from start to finish.\n"
