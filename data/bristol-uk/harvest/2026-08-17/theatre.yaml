        raw: "**The Forest Door (2027)** — Travelling Light in partnership with Alibi present The Forest Door. \"We are currently making plans and fundraising to tour the show to primary schools in Bristol, Bath and surrounding areas, plus Exeter and the South West in autumn 2027.\" At A Glance: 27 September - 10 December 2027. Primary schools and community spaces across the South West. Suitable for all primary aged children and their families aged 4-11 (targeted at Reception - Year 4). No public tickets currently available.\n"
        summary: "A portal-into-a-forest adventure for primary aged children, with in-classroom activities either side of a 50-minute performance, planned to tour schools and community spaces across the South West in autumn 2027. Still at the planning and fundraising stage, with school bookings taken by request form."
        description: "Travelling Light in partnership with Alibi present *The Forest Door*.


          We are currently making plans and fundraising to tour the show to primary schools in Bristol, Bath and surrounding areas, plus Exeter and the South West in autumn 2027.


          **About the show**


          What happens when you go through a mysterious portal into another world? On the other side you find yourself in a magical forest, alive with wonder and excitement. Here, you'll meet other enchanting creatures preparing for a big festival… but there is a problem.


          Join us on this brand-new adventure, as we explore traditions, memories and solve problems; resulting in one unforgettable celebration.


          *The Forest Door* is a new theatre offer for primary aged children, incorporating performance, interactive in-classroom activities, and support and resources for teachers and families.


          Grown from the imaginations of young people – The Forest Door is based on ideas from local children who took part in the development in Bristol and Exeter.


          **Booking The Forest Door**


          To place a booking request for autumn 2027, please complete our School Booking Request Form. Suitable for all primary aged children and their families aged 4-11 (targeted at Reception - Year 4). Performance: 50 mins. Full experience: 2 hours.


          **At A Glance:** 27 September - 10 December 2027. Primary schools and community spaces across the South West. No public tickets currently available.\n"
        confidence: "medium"
    notes: "The catalogued URL works; the apex 301s to www, and the www URL is what is recorded in `fetch.url`. This is the one source in the worklist thin enough and small enough for §3, so all three current show pages were opened — three fetches — and their copy is in `description`. The hint needs a small correction for stage 1: the shows no longer state only seasons. Both current productions now print an explicit date range on their own pages (Wonder Baby 11-29 October 2026, The Forest Door 27 September - 10 December 2027), so they are `run` rather than `undated`. Neither has public tickets: Wonder Baby says \"No public tickets currently available. We will be announcing tour dates in early September\" and The Forest Door 2027 is still being planned and fundraised for, which is why that row sits at `confidence: medium`. Both tour into other people's spaces, so `venue.name` carries the page's own wording rather than letting the compile step imply the company's Barton Hill base; neither page names an individual host venue. A third entry, The Forest Door (2026), appears on the index alongside the current ones but its own page lists all seven of its dates as past (24 February - 7 March 2026, Barton Hill Academy through the Travelling Light Studio), so it is not recorded as an upcoming event. The long archive below it — Igloo, Boing!, Winter Lights, Cinderella and the rest, back to 1995 — was skipped as the hint directs. Worth a human's eye: Trinity Centre's own diary lists Wonder Baby at Trinity on 23 October 2026 at 10:00, inside the tour window, which is exactly the host-venue dating the hint says lives on host sites rather than here. No images are captured — the index carries none, and re-reading each show page for one more field is the second fetch §2 warns against."
