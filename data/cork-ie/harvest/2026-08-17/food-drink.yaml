rk on a Fork rows where they were actually printed. Eleven tour sittings a week are one `recurring` event, not eleven, per the hint. `/private- events/` and `/cork-on-a-fork-festival/` were not read: the former is private bookings, the latter duplicates a programme already harvested from corkcity.ie. The only og:image on these pages is a TripAdvisor \"Travellers' Choice 2024\" badge, so no `image` is set on any row."
