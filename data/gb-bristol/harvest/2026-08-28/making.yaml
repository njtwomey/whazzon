    notes: "Nothing at all on 29, 30 or 31 August: the whole site's forward diary starts on Wed 2 September. Read three pages — /live-music (the catalogued URL, page 1 of 4, all nine events on it recorded), /courses-and-workshops (no dates at all; just category/duration/month filters and a \"DOWNLOAD TERM PROGRAMME\" link to \"Autumn term 26 A4 web FINAL.pdf\"), and /one-day-workshops?course_week=0, which is where the dated autumn day workshops actually live. That last path is not in the catalogue and is worth adding as a route — it is the only place the one-day programme is dated. It runs to 16 pages; I took page 1 (the ten soonest, 15-20 September) and truncated the rest of the far future, which the coverage rule allows since none of it falls this weekend. The index carries no prices for those, so `price` is omitted rather than guessed. Two site quirks: the ticket-price template prints a doubled currency symbol (\"££15-£20\"), recorded here with a single £; and \"The Folk House Choir\" is filed under 1 Day Workshops with a stale blurb about a choir concert on \"TUESDAY 14TH JULY\", so that row is confidence low. Box office hours are printed as Monday-Saturday 9am-5pm, closed Sundays, with no bank holiday statement either way — not inferred."
