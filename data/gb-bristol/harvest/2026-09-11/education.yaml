        raw: "**150 years young: Opening the doors to Clifton and TQEC for a day of celebrations and activities** @ Clifton campus — Sat, 10 Oct @ 9:00am


          Lecture/Talk · Conference · Hands-on/Interactive · Showcase · Workshop


          The University of Bristol is opening its doors on Saturday 10 October for a public programme of events, in celebration of our 150th year and the opening of the new Temple Quarter Enterprise Campus. We would love to see you there.\n"
        summary: "The University opens both its Clifton and Temple Quarter campuses for a day: walking tours, exploration zones, debates and family activities showing the research going on behind the scenes, marking its 150th year and the new campus. Free and for all ages; some strands are ticketed, the rest drop-in, with the programme still emerging on the University's 150-years page."
        description: "The University of Bristol is opening its doors on Saturday 10 October for a public programme of events, in celebration of our 150th year and the opening of the new Temple Quarter Enterprise Campus. We would love to see you there.


          **Discover** the weird and wonderful research, innovation and creativity happening behind the scenes, told from the perspective of academics, students and community partners.


          **Explore** the University's Clifton and TQEC campuses as they come alive with walking tours, exploration zones, lively conversations and debates, and interactive, family-friendly activities.


          **Celebrate** with friends, family, neighbours, Bristol residents and our University community. Everyone is welcome; the more the merrier!


          Curious about our new campus? Excited by research? Interested to know what student life looks like today? This is an amazing opportunity to go behind the scenes of the University of Bristol, learn something new, and see how this new campus is the start of a wider regeneration project in the heart of our city.


          This is a free programme of events and is suitable for all ages.


          Some events are ticketed, and others are drop-in. The ticketed events are signposted on the website - please do RSVP to any ticketed events you wish to join to guarantee your place.


          [You can see the emerging programme of events here](https://www.bristol.ac.uk/university/150-years/events/).\n"
