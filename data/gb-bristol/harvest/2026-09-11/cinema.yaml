    notes: "The hint still holds: a plain fetch of the catalogued /bristol/ gives venue information and no showtimes. Rendered in headless Chrome instead (two renders: the bare venue page, which shows today only, then the URL the site's own \"next 7 days\" control produces, recorded in fetch.url). That view is a rolling seven days, Fri 11 – Thu 17 Sept, and is the whole horizon here. The strand a showtime belongs to is an icon with a title attribute rather than text (Baby Club, Silver Screen, Captioned, Beyond, Throwback, Toddler Club, Preview), which is how the special screenings were told apart. **The multiplex rule applied:** 17 films are on this week; the routine programme of ten of them (Practical Magic 2, Pressure, Oasis: Don't Look Back In Anger, Spider-Man: Brand New Day, The Odyssey, Tony, The Dog Stars, The Death Of Robin Hood, Coyote vs Acme, Insidious: Out of the Further) is deliberately not recorded. What is here is every showing in a labelled strand plus the anniversary re-release, the Exhibition On Screen documentary and the subtitled French-language De Gaulle: Résistance. Where one film has both a Baby Club and a captioned showing on the same day the rows are titled by strand so they do not collide on id. \"Almost full\" is the site's own wording and is not sold-out. Prices are not printed against showtimes, so price is omitted throughout. Film links are relative and resolved against https://www.everymancinema.com; poster images come from the site's CDN as rendered."
