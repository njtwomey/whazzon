    notes: "The re-pointed Headfirst mirror works and is unmistakably this venue: the page is headed The Croft at 117-119 Stokes Croft, BS1 3RW. It listed 85 dated gigs running from 1 Sep to 11 Dec 2026 and I recorded the soonest 16, to 17 Sep; the remaining 69 were truncated for budget, not missing from the page. Nothing at all is listed before 1 Sep, so the venue looks to be dark for the rest of August. The index carries only date, title and genre words — no times, no prices — so `raw` is thin by nature and no `description` was captured (per instruction, no event pages were opened for this run). Two rows worth a reviewer's eye: Sword II on 9 Sep is flagged Cancelled by the venue, and Oxygen Thief XX's 20th anniversary show on 26 Sep (beyond my cutoff) is sold out. `venue` is deliberately unset — Headfirst is the mirror, the gigs happen at The Croft, which is the catalogued source itself."
