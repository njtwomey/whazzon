      ELISA GIARDINA PAPA: SHE FLICKERED IN AND OUT OF HISTORY

      Institute of Contemporary Arts (ICA), London

      until Sunday 6 September 2026

      An immersive video and glass installation that tells the story of a Mediterranean island that emerged from the sea, sparked a colonial scramble, and vanished before anyone could claim it. This latest work by Giardina Papa is the second chapter in an ongoing trilogy of video installations, following U Scantu: A Disorderly Tale (2022), which premiered at the 59th Venice Biennale, exploring overlooked Mediterranean histories.

      Learn more <https://us.list-manage.com/1D4fHdMTSa8?c2id=a7c541d1d2eca54a095703c2afcca581&m=X-eff1HJgGm3K-4Ba2h32HLrAAkc2E_d8XweT3xOM-gtcDqs5brZ28tjChnd>


