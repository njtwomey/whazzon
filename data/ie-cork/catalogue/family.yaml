    url: https://www.ucc.ie/en/sefs/science-week/
    area: Western Road
    tags: [ university, free, science ]
    cadence: quarterly
    hints: |
      Annual, 8–15 November 2026, free, on the UCC main campus, and explicitly
      for all ages — magic shows and an expo alongside the lectures. The page is
      built up through the autumn: it was carrying one confirmed event in
      mid-August and says to check back, so it is near-empty for most of the
      year and worth a real look from October.
    notes: >-
      Verified 2026-08-17: page is live, stamped "Updated 7 August 2026", and gives Science Week 2026 dates with the theme "Water: From Molecule to Ocean" plus a Chemistry Magic Show on 9 November. Included as the family strand of the university's public programme.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: family/yourdaysout-cork
    name: Your Days Out — Cork
    category: family
    kind: aggregator
    status: provisional
    url: https://www.yourdaysout.com/events-on-in-county-cork-ireland
    homepage: https://www.yourdaysout.com/
    tags: [ family ]
    cadence: daily
    hints: |
      Ireland's family days-out listings site; the Cork page is explicitly
      "Family Events & Things To Do". Events carry age bands (Baby, Under 5,
      Under 9, Under 12, Teenager) and a free/paid flag, which is exactly the
      metadata a family listing needs.

      The page embeds a JSON-LD ItemList of Events with names, start dates and
      Place objects — read that rather than scraping the cards. Refuses some
      fetchers with a 403; answers a browser user-agent. County-wide, so it
      reaches well past the 12km radius — check the location on every event.
    notes: >-
      Verified 2026-08-17: 200 to a browser user-agent, page titled "What's On in Cork – Family Events & Things To Do", JSON-LD carried real dated items (Playful Culture Trail 1 June 2026, Stories from the Sea 26 Sept 2026). This is the family safety net — daily cadence is deliberate.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: family/eventbrite-cork-family
    name: Eventbrite — Cork Kids & Family
    category: family
    kind: aggregator
    status: provisional
    url: https://www.eventbrite.ie/d/ireland--cork/kids-and-family/
    tags: [ family ]
    cadence: weekly
    hints: |
      Catches the family events that have no venue website at all — parent
      groups, summer camps in community centres, music classes programmed into
      play centres. JSON-LD Events are in the served HTML, so it can be read
      without executing the page.

      Two cautions: it is Cork the region, not the city, so Carrigtwohill and
      Youghal turn up and need filtering on location; and it lists events at
      venues catalogued separately here (Fota Wildlife Park, Mayfield Library,
      Piccolo Play Village), so set venue.sourceId where it matches rather than
      creating a second copy of the event.
    notes: >-
      Verified 2026-08-17: 200, titled "Discover Kids And Family Events & Activities in Cork, Ireland", and the JSON-LD held eight real dated items including Cushion Concerts at Mayfield Branch Library on 19 Sept 2026 and Family Day Out at Fota Wildlife Park. Weekly rather than daily because Your Days Out is already daily and the two overlap.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
