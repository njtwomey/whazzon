        tags:
          - "workshop"
          - "courses"
          - "booking-required"
        raw: "**September in Elevate: Creative Facilitation** — Games, exercises, group dynamics, planning. Wednesday 16th September sees the very first Elevate session. There is still space for you to book on and join the session. You’ll learn a range of games and exercises; how to adapt games to the needs of the groups; when to use a game and how it can benefit you; how to plan and structure a workshop; the benefits of this work. This workshop will benefit anybody who facilitates groups as part of their work – not just for creative practitioners. Tickets are £20 full price, £10 concessionary. This year we are offering a full term ticket – this will give you entry to every workshop in the series, at a 25% discount. [Book today](https://us.list-manage.com/asbP9GSuAkV?c2id=178ee8babe3db6d0c3bd9d9141602d5e)"
        summary: "The first session of acta's Elevate workshop series for anyone who facilitates groups: games, exercises, group dynamics and workshop planning. No time printed."
        confidence: "high"
