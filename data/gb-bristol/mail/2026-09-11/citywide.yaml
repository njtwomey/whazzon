      SEPTEMBER 7-13 2026


      This week in Bristol, there's a bit of culture for everyone - whether you fancy Bristol Gaymers, Shangai Shuffle and plenty more.


      We wouldn't be able to do what we do at Bristol24/7 without our members.

      If you enjoy our What's On content, please consider b <https://us.list-manage.com/rioPEozdd1Z?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=esBUxL6cYtsX8fz5qLXcr2WyxCu758GAnEKEZ0PD10scL8VTVWIY3fTWMQtP>ecoming a member of Bristol24/7 for just £3 per month <https://us.list-manage.com/rmCPoukvIS2?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=gdSNsOHqYlhprUdFpgRONkcIidAQO6TY17uCHpfTJNgKr9VKuN3_mLeHAffx> to support independent journalism.


      Top events this week


      https://us.list-manage.com/amUhej556XG?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=7Rk0GCpreKSWys6gqoWuoj_MOTfVB3h8DrdNbHEnhhCm2hhNKUs36aMv9-2p


      Monday: Holy Wave + A Ghost Column + Trans-Siberian Express <https://us.list-manage.com/188pbPrBWHx?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=Y3ynR_U2UlWyCLmBFqUxaxckUJtnhK1n3JSdBbVRUS8wgiwPeZ8fHR9Ay91l>


      Texas psych-pop favourites Holy Wave headline an eclectic night of dreamy psychedelia, avant-pop and high-energy folk and blues. Joining them are A Ghost Column, the experimental project of Victoria Hamblett, and Bristol’s multi-instrumental sextet Trans-Siberian Express.


      Strange Brew, BS1 3DB


      https://us.list-manage.com/eFXMiZdZ2ds?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=i8Dnh_4uWDPpHMlrIrkr59tyXQ1En2sX50NYPuqK6ht1MZSOgRVtP60JFI0G


      Monday: Kurt Vile & The Violators <https://us.list-manage.com/V0FumXAnyQ7?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=7I19Rjmvs3m4FitGitC7qOg4ogDytFWinl3ajkUuG4-lQxVHhwBha4tWXjkk>


      SPONSORED | On 7th September, Kurt Vile & The Violators head to The Prospect Building bringing their hazy blend of slacker rock and psychedelic Americana. Led by Kurt Vile himself, the band’s laid-back grooves and sprawling guitar work have earned them a devoted following, with live shows that drift effortlessly between introspection and loose-limbed jams.


      The Prospect Building, BS2 0SE


      https://us.list-manage.com/13PIVhwHHk5?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=Zi6rbcCCgytkI67XbmhmOyQBj-8vFhxra7OBUGTNdCOYy-_oMDxZ2UEuI3m7


      Monday-Sunday: SENTIENTS <https://us.list-manage.com/bpeArpM83Ag?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=2aUR7Duu_Mo5BzJaWwvwauQvxmdnlPJcCMOcNOmnQGkV_xB5S9hEUU8Bx-QW>


      SPONSORED | Open your animal eyes. A collection of groundbreaking video games and virtual reality in Undershed.


      Watershed, BS1 5TX


      https://us.list-manage.com/BQrCeP9cpeo?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=hZdysXp56w0HpCHc6BG8V7AxT6A1UnTNyUT4TeVs6ubfZYFs_cttpHk295Kw


      Tuesday: Víkingur Ólafsson: Piano Recital <https://us.list-manage.com/f7xqE5neAvf?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=NYoyEWRcsKSBWrsRxtVpCBNi6MEAq6F4OHGgRX1v8lMy-mWOEa_Xy7iuJBjO>


      SPONSORED | Víkingur Ólafsson returns to Bristol with Opus 109, an exquisite piano recital centered on Beethoven’s final piano sonata. Drawing connections between Beethoven, Bach and Schubert, the celebrated Icelandic pianist brings his extraordinary artistry to a programme that moves from intimate melodies to profound, spellbinding moments. A beautiful showcase for one of today’s most acclaimed classical musicians.


      Bristol Beacon, BS1 5AR


      https://us.list-manage.com/OzgdVw4Wa15?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=qoUBstKyGVJOiCqIjtT0cZyg1-WrGTF9jjF3qVthM5Jc9ao7jp6ieoac6P_q


      Tuesday: Bristol Gaymers TTRPG Evening <https://us.list-manage.com/53Dua2rRlDI?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=2_W378-6-V3Uvnh4JTz62BPVpG2UFER9wU4vRW3griK1XX42t2WBG24o1gNz>


      Join Bristol Gaymers for an evening of tabletop roleplaying, where adventurers of all experience levels can gather, roll some dice and dive into fantastical stories.


      Old Market Tavern, BS2 0HB


      https://us.list-manage.com/KKop4Bj3ZrU?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=6aVgLzSZ_qVeBO9xN4RFtzWbziAVPNy-57rBag6yz_OEsozmaP6nRG52Tzqo


      Tuesday-Sunday: Badgers <https://us.list-manage.com/116usjcDIHp?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=DymtftVMvGSzQ4vVwTIo6qTwrbi_lrA7C9iIvEaR2_nwrK6ktofhP4sWrfiG>


      SPONSORED | Fresh from its critically acclaimed run at the Edinburgh Fringe Festival, don’t miss the ★★★★★ “supremely impressive and incredibly moving” (WhatsOnStage) Badgers. A shape-shifting new play blending folklore, mystery and true crime.


      Bristol Old Vic, BS1 4ED


      https://us.list-manage.com/Lq02daaxR3S?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=mEBdmsvlhHXZxDY6xgwArd-Z8yw_5bVN3GKfwVqa4X3YR-rhjOhSED88l5K1


      Wednesday: Shanghai Shuffle – 1920s Jazz band! <https://us.list-manage.com/188PR2YAWaI?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=CS_JMwAp52PrvCs7IPK-xpA7tw3nONuADeS7d45yFfhFym_A9YXhIV7O3vwa>


      Step back into the roaring twenties with Shanghai Shuffle, a 1920s-inspired jazz band bringing the sounds and spirit of the era to life. Get ready for lively hot jazz, infectious rhythms and vintage charm, perfect for anyone who loves classic swing and dancing.


      The Canteen, BS1 3QY


      https://us.list-manage.com/9F__iVmKQNO?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=tYAIln_PjEsB65Wocua9WWDwlHEjU3c9eYDkFE6a89G-GgBi0iD3mDrZDlHu


      Thursday: James Morton Groove Den <https://us.list-manage.com/xAqvnktZfDW?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=TlqMMqzs9MFngl08JILcbQvzyrrPJY2Sv6mB8BWWFabNbR_YbLgAFAoL8gIw>


      SPONSORED | James Morton Groove Den brings together an all-star lineup for an infectious collision of jazz, funk, soul, rock and hip-hop. With trombone virtuoso Dennis Rollins MBE, guitarist Alex Hutchings, Incognito drummer Francesco Medolia and Hammond specialist Anders Olinder, expect fiery improvisation and deep grooves.


      Bristol Beacon, BS1 5AR


      https://us.list-manage.com/Im10hKN2V_u?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=OUKTsGWgqDzYW3itdFjh1DLJ9ALGnobgv0tye2wnQ_v_M-Fp4P7FSWgAupQm


      Thursday: The Drag Dungeoneers <https://us.list-manage.com/16iV2cWQ3Rk?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=Kx5RAgO9w5gTWebvwCmbAIMylVnK1iLdYds8SClGXLdjgMM-equEShyZPLbI>


      Enter a world of fantasy, fabulousness and improvised adventure with The Drag Dungeoneers. This unique comedy show combines drag performance, tabletop roleplaying and audience interaction, creating a hilarious, unpredictable quest where anything can happen.


      Bristol Improv Theatre, BS8 1LP


      https://us.list-manage.com/kdwd3E2uFeB?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=xIw9dC1Ol_PxQ0jdVifnvdkyZAw1_vCTwLq2MkBMuIoVR2OxCWEH789Gv9wv


      Friday: Just An Illusion <https://us.list-manage.com/aqMDHEGGc7M?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=UGkze3dsa8rVxd8bbTPDW3yuOjo9TkEBgJ95R_X_dBGD9RV6R7qXm1a4oEn2>


      SPONSORED | It’s 1985. Vincent, almost 13, fumbles through life’s big questions: identity, friendship, family, first crushes… and why adults don’t seem to have things figured out either.


      Watershed, BS1 5TX


      https://us.list-manage.com/PkyRJTWut7X?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=m2MpZ9T4v34gGwMSFHPdlWfienrvu2b7gd_qAdf84W5C1_KZ7shSYr4ZIFWh


      Friday: Qigong in the Gallery <https://us.list-manage.com/RYtuMJP0kvl?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=OL5yL0fXxhtb2nMaaZRtaECivS-VfmtXX4Ca1axVY-DpYd-mpqj0lzwAjRlB>


      Free 60-minute Qigong session to help restore and reset your body in Arnolfini’s gallery. First come, first served basis. Suitable for all levels, and most importantly, free.


      Arnolfini, BS1 4QA


      https://us.list-manage.com/YmVTkSPIIFi?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=QUQFBl4xfqp7GE5DJho9UJO_395PK4VAbvPxurDRTHPCN-AdofiINJOuM5qF


      Friday: Live Music – Shallow Roots <https://us.list-manage.com/dDJcDtRNvNM?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=aq5wNvWkJN_AWxMqsMlnd_brYYT-mNKubZyB4M6iFeXXjbpuaLiR9THciDvS>


      SPONSORED | Eight-piece Shallow Roots head below deck at Grain Barge for a night of seriously danceable live music. Expect a joyful mix of Afro, Caribbean, Spanish and Latin influences, with three saxes, guitars, percussion and vocals bringing plenty of energy. £6 advance / £7 door.


      Grain Barge, BS8 4RU


      https://us.list-manage.com/F_SLwzubmrF?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=GkC8Dfnef-Lez9CqDOUNhBADXe7LR7vUMBAsF2Vu1D8FXo7iZHEDoBP3t3uL


      Friday & Saturday: Bristol Film Festival: To Infinity <https://us.list-manage.com/Cxyxe4KeyJv?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=fYvJXnEt3TcRXmO2xMLOaiEUmdl6j2llaDaDignedgJSZcI7ynq3oitnWAdC>


      Explore the Planetarium’s Space exhibition before embarking on your own Moon mission with Apollo 11 and Apollo 13 playing at The Planetarium, followed by Space Race films the following day with Hidden Figures and First Man.


      We The Curious, BS1 5DB


      https://us.list-manage.com/LY1tJOPRkpU?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=DIoqwytFgEVOwQw_P9kLNlOjTIIBqgrdh03iJevh3V9NB9TeuMw74WcVfuHP


      Saturday: Slipz & Evil B <https://us.list-manage.com/y1GNAMVwPXn?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=n-mPjFlPhlT4UQAjfUcPkgIp0Z6D3utqKJvuvLB02VOWe6yu2w3wgV_TGIau>


      Round off the night with Slipz and Evil B at Bristol’s after-party, bringing heavyweight beats, underground energy and plenty of bass. With both DJs known for their distinctive styles, this late-night session is made for hip-hop, grime and electronic music fans.


