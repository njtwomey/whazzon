    addedAt: "2026-08-17"

  - id: food-drink/fab-food-trails
    name: Fab Food Trails — Cork Tasting Trails
    category: food-drink
    kind: organiser
    status: provisional
    url: https://www.fabfoodtrails.ie/tours/cork-tasting-trails/
    homepage: https://www.fabfoodtrails.ie/
    tags: [ tours, tastings, independent, ticketed ]
    cadence: monthly
    hints: |
      Walking food tour operator. The Cork tour is 2.5–3 hours, starts at
      10.30am, "€85" per person, ages 16+, and takes in the English Market.
      No days of the week are printed, so it is one `recurring` event with a note
      rather than a set of dated departures.

      Booking is a FareHarbor embed and the dates are not fetchable: every
      FareHarbor route — the embed, /items/ and the month calendar endpoint —
      returns a 2 MB AngularJS template with the event data absent from the HTML
      and an "Error code: no-assets" message. Do not spend fetches on it, and do
      not record a departure date from it.

      They also run /tours/private-cork-tours/, /tours/group-tours-cork/ and
      /tours/corporate-cork-walks/, which are private bookings rather than public
      events.
    notes: >-
      Verified 2026-08-17. No address: a walking-tour operator with no premises, and the page does not print a meeting point. Ran the "Cork on a Fork Fab Food Trail" at €85 across four days of the 2026 festival, so cross-check against food-drink/cork-on-a-fork-fest in August to avoid recording it twice.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/activity-days
    name: Activity Days — Cork food tours
    category: food-drink
    kind: organiser
    status: provisional
    url: https://activitydays.ie/product-category/food-drink-tours/
    homepage: https://activitydays.ie/
    tags: [ tours, tastings, independent, ticketed ]
    cadence: monthly
    hints: |
      Blarney-based tour operator whose Cork food tours all walk the city centre.
      The catalogued page is a WooCommerce product category, so treat products as
      `recurring` offerings, not dated events — the schedule is prose on each
      product page.

      Cork Food History Tour: "Tours Tuesday, Wednesday, and Thursday at 10.00 am
      to 12.00", 2 hours, min 2 per booking, guided by Maire Ní Mhurchu, taking in
      the English Market and the Butter Museum. Also on the site: Cork Food and
      Pub Tour, A Slice of Cork (starts at the English Market at 12.30, 3 hours),
      and a children's food tour timed to Cork on a Fork.

      Prices contradict each other between pages — see notes. Record whichever
      page you actually read, verbatim, and say which.

      /product-category/category-cork/ is the other useful index and mixes food
      tours with kayaking and boat trips, so filter. Booking is FareHarbor plus a
      WooCommerce cart.
    notes: >-
      Verified 2026-08-17. Company address is "10 Bracken Wood, Blarney, Cork" — inside the 12 km radius, and the tours themselves run in the city centre — but no `address` is set because the tours have no fixed premises. Two pages of this same site print two different prices for the same tour and both are kept as printed rather than averaged: the Cork Food History Tour is "€ 70" on /product-category/food-drink-tours/ and on /product-category/category-cork/, but "Prices from €85PP" on /tour/cork-food-history-tour/. A third figure exists off-site — the Cork on a Fork programme priced the same tour "Adults €73.50 | Youth (10-17) €63.17 | Children u10 Free". A human needs to decide which is authoritative; nothing here should be reconciled by the harvester.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/taste-cork
    name: Taste Cork
    category: food-drink
    kind: aggregator
    status: provisional
    url: https://www.tastecork.ie/whats-on
    homepage: https://www.tastecork.ie/
    tags: [ aggregator, food, civic ]
    cadence: weekly
    hints: |
      The city and county's own food-sector platform, backed by Local Enterprise
      Office Cork City, Cork City and County Councils and Fáilte Ireland. It is
      the only Cork-specific food listings site, so it is the safety net for
      supper clubs, producer open days and tastings that no venue site publishes.

      /whats-on carries a month filter ("Any time / Aug 26 / Sep 26 / ... / Jan
      27") and paginates to /whats-on/2. Both pages rendered zero events on
      2026-08-17, so an empty result here is normal rather than a fetch failure —
      record the observation and move on.

      The rest of the site is a directory rather than a diary, but it is where
      new sources for this category come from: /explore-cork/taste-tours,
      /explore-cork/hands-on-experiences, /explore-cork/food-markets,
      /food-producers and /cork-food-map. Directory finds are catalogue work, so
      raise them as notes for stage 1 rather than harvesting them as events.

      Covers Cork county as well as the city — West Cork and East Cork entries
      are outside the radius.
    notes: >-
      Verified 2026-08-17: real site, correct listings path, but it listed nothing. The most recent example event visible anywhere on the page template was "Cork and Kerry Food Market 2024" and the footer still reads "© 2017 Taste Cork", so a human should judge whether the What's On is abandoned or merely quiet before promoting this past provisional.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
    address:
      lat: 51.896176
      lon: -8.443143

  - id: food-drink/eventbrite-cork-food-drink
    name: Eventbrite — Cork Food & Drink
    category: food-drink
    kind: aggregator
    status: provisional
    url: https://www.eventbrite.ie/d/ireland--cork/food-and-drink/
    tags: [ aggregator, ticketed, food ]
    cadence: weekly
    hints: |
      The ticketing platform is the only place a lot of Cork's food programme
      appears at all — one-off supper clubs, drag brunches, tastings in borrowed
      rooms, pop-ups with no website of their own. Worth the crawl for exactly
      the events no venue site will list.

      Eventbrite serves different variants of this page between fetches, and some
      of the listing is hydrated client-side, so an empty or short result is a
      symptom of that rather than a quiet week — re-fetch before concluding
      anything, and never record an absence as a fact from one attempt.

      Geography is Cork county, not the city, so check the venue against the
      radius. Facets exist for Food / Wine / Beer / Spirits.

      Most entries print "Check ticket price on event" instead of a price, so
      leave price absent rather than guessing.
    notes: >-
      Verified 2026-08-17: returned real dated Cork listings, e.g. "Camp Classics Drag Brunch with Mockie Ah!, Sat, Sep 19, 1:00 PM, Clancy's Cork". The variant path /d/ireland--cork/food-and-drink--events/ also answers 200 but returns half the page; the catalogued path is the fuller one.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"
