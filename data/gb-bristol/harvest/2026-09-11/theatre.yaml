        raw: "**Ocean of Dark** By acta's Young Carers — Thursday 29th October, 6.30pm. Legend tells of a beautiful sapphire created eternities ago that gives its wearer total power. It was thought it had been lost to history, but it has resurfaced and sparked a sea-faring power struggle like no other. An infamous pirate throws a party onboard her ship and invites all: queens, princesses, mermaids, and vampires alike. But is one of her wicked schemes brewing? Will all our revellers make it to the last dance? acta’s Young Carers’ Ocean of Dark is an exciting adventure, exploring the endless search for power and the consequences of it. This unique and thrilling horror will be spooky and dark, with some laughter along the way. [Book your free place for Ocean of Dark](https://us.list-manage.com/snE5FNQ1hUt?c2id=178ee8babe3db6d0c3bd9d9141602d5e)"
        summary: "acta's Young Carers group perform Ocean of Dark, a spooky pirate adventure about the hunt for a sapphire that grants total power, free to book."
        confidence: "high"
