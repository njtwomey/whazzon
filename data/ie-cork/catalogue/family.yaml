  - id: family/cruinniu-na-nog
    name: Cruinniú na nÓg Cork
    category: family
    kind: festival
    status: provisional
    url: https://www.corkcity.ie/en/cruinniu-na-nog/event-details/
    homepage: https://www.corkcity.ie/en/cruinniu-na-nog/
    tags: [ free, civic, workshops, community ]
    cadence: quarterly
    hints: |
      The national free day of creativity for under-18s, on a Saturday in June,
      programmed city-wide by Cork City Council. Almost everything happens on
      that one day in dozens of borrowed rooms — libraries, UCC, the Everyman,
      Blackpool, the Butter Museum — so nearly every event needs a venue set that
      is not the council.

      One page per event under /event-details/<slug>/ with an age range and a
      booking note; roughly forty in the 2026 edition. Pages stay up after the
      day, so read the year rather than assuming the list is forward-looking, and
      expect the page to be a shell outside April–June.
    notes: >-
      Verified 2026-08-17: /event-details/ returns 200 and carries 39 event pages — Make Your Own Puppet, Rod Puppet Workshop, Circus Céilí, New Moon Youth Dance, Story Seeds, Art Explorers at UCC. This is the single richest free children's listing on the council's site. No address: city-wide.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: family/cork-puppetry-festival
    name: Cork Puppetry Festival
    category: family
    kind: festival
    status: provisional
    url: https://corkpuppetryfestival.com/
    tags: [ puppetry, independent ]
    cadence: quarterly
    hints: |
      Late July into early August, in venues and on streets across the city.
      Founded by Dowtcha Puppets in 2014 and run by the Cork Puppetry Company
      since 2019, so older coverage credits the wrong organiser. If the site
      comes back, /performances/ is the programme page.
    notes: >-
      NOT verified. corkpuppetryfestival.com resolves and is served by Cloudflare, but returned HTTP 522 (origin unreachable) on every attempt on 2026-08-17, for both / and /performances/, so nothing on it could be read. The festival itself is real and the domain is the right one — it is indexed with a /performances/ programme page — but a human should confirm the 2026 edition happened and whether the site is being maintained; the last copyright a search index shows is 2023. Left in rather than dropped because a Cork family catalogue without the puppetry festival is missing something a resident would name.
    addedAt: "2026-08-17"

  - id: family/circus-factory-cork
    name: Circus Factory Cork
    category: family
    kind: organiser
    status: provisional
    url: https://circusfactorycork.com/for-kids/
    homepage: https://circusfactorycork.com/
    tags: [ circus, workshops, independent ]
    cadence: monthly
    hints: |
      Bot-walled: a plain fetch gets 403, or a 202 whose body is a captcha
      meta-refresh. Needs a browser user-agent and probably JavaScript. The wall
      answers identically for every path, so a status code proves nothing here.

      The youth programme is termly and recurring, not dated — Thursday Youth
      Circus (7–11), Circus Gymnastics (8+), Saturday Rebel Circus ensemble
      (10–17) — plus Easter and summer camps at /for-kids/camps/. They also
      publish a monthly "Cork Circus Guide" post (/your-july-cork-circus-guide/
      and so on) which lists circus events across the whole city, including other
      people's: worth reading, and worth setting the venue on those.
    notes: >-
      Domain and paths are real — /for-kids/, /circus-classes/, /for-kids/camps/ and the monthly guides are all indexed — but the content could not be read on 2026-08-17 through the captcha, so no verifiedAt is claimed. Note the domain is circusfactorycork.com; corkcircusfactory.com and .ie do not resolve at all. No address recorded because none could be read off the site.
    addedAt: "2026-08-17"

