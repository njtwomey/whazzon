    notes: "Both catalogued routes read: /exhibitions/ for six upcoming shows and /events/ for eleven upcoming dated items. Busiest source in the category, as the catalogue said. **Seven of the eleven /events/ items are marked \"Member Event\" and are not recorded**, per the catalogue hint that they are not public: the Curator Visits with Luke Currall (26 Aug), Benjamin Stafford (28 Aug), Helen Carey (6-13 Oct) and Matt Packer (16 Oct); Themed Members Meeting: Sample 15 (23 Sep); Member-Led Frame Making Workshop with Elize de Beer (17 Oct); and November Professional Development with Maeve Mulrennan (10 Nov). Four public ones are recorded. The long \"Past Exhibitions/Events\" lists below each index (50+ shows back to 2011, and events back through May 2026) were not taken. **None of the exhibitions is at the source's own address.** Three are at the TRISKEL SAMPLE Project Space inside Triskel, and two at Sample-Studios Gallery in The Lord Mayor's Pavilion, Fitzgerald's Park; `venue` is set from each listing so nothing lands at the Churchfield studios. The Pavilion's street address is not printed on Sample's own pages — the \"Fitzgerald's Park, Mardyke Walk, Cork T12 AW6R\" used here was read today off Cork Zine Fest's July Zine Club listing for the same building, not invented. Triskel's own site prints no address either, so \"Tobin Street\" comes from Crawford Art Gallery's In Conversation listing, read today. Expect duplicates against art/triskel-gallery: Billy Lingwood, Sarah Long, Cork Zine Fest, Siobhán Collins and Art History Reframed all appear on both sites. Both observations record them, because suppressing rows from one would make that observation a false account of what the page said — the pairs are named here so compile or a human can collapse them. Two event pages opened for descriptions (The Rocket's Red Glare, RAW Programme). \"In Conversation: Barbara Diener…\" prints no venue, and is almost certainly at the Pavilion alongside her exhibition, but the page does not say so, so no `venue` is set. **One new tag coined for the whole category: `residency`.** Nothing in Bristol's vocabulary distinguishes \"an artist worked here in public and this is the result\" from an ordinary exhibition, and four of Cork's art sources programme that way — it is used on eight events here."
