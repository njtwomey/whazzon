      Your guide to folk, roots and Americana this autumn


      Autumn is made for good boots and getting lost in live music. For thoughtful songwriting, captivating musicianship and stories that transport you.


      Over the next few months, we’re welcoming some of the most exciting names in folk, roots and Americana to Bristol Beacon, from the legendary songwriting of James McMurtry, to the beautifully crafted folk of Stornoway and the undiscovered gem that is Clara Mann, to name just a few.


      Come and discover your next favourite artist.


      Discover more <https://bristolbeacon-mail.org/c/AQjCkQ4QgIV6GI7W59YBIOW-tyQo_OvsFE7ylRIsGC13tuD8Kq7pTGrEqm2T4CzMbI1pkikAeuX5>


