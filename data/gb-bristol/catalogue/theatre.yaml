  - id: theatre/bristol-improv-theatre
    name: Bristol Improv Theatre
    category: theatre
    kind: venue
    status: provisional
    url: https://improvtheatre.co.uk/
    area: Clifton
    tags: [ improv, comedy, independent ]
    cadence: weekly
    hints: |
      Almost all output is improvised comedy — cross-listed under comedy.
      Programmes in short cycles, so a weekly visit is genuinely needed.

      The homepage is the diary. /whats-on serves a "Loading Article…" stub with
      no events in it — ignore it. The listing mixes public shows with the
      theatre school's courses and drop-ins; /?filter=Events narrows it to public
      performances, /?filter=Classes to the school. Drop-ins repeat weekly for
      months, so record them as `occurrence.kind: recurring` rather than one
      event per date.
    notes: >-
      Verified 2026-08-17: header reads "Bristol Improv Theatre", address 50 St Paul's Rd, Clifton, BS8 1LP, which agrees with area: Clifton. Dated shows server-rendered, e.g. Fire & Dice Thu 27 Aug and Adventures of the Improvised Sherlock Holmes Fri 11 Sep. The catalogued /whats-on path is a stub, and www redirects to the apex.
    addedAt: "2026-08-16"
    address:
      lat: 51.458755
      lon: -2.611884

