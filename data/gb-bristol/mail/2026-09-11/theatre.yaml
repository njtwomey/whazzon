      \ * The Acts: Thursday 3rd September 7:30pm and Friday 4th September, 7:30pm


      \ * Pieces of My Life: Friday 11th September 8pm (Interpreter Sherrie Eugene-Hart) There will also be a BSL interpreted post-show discussion.


