  - id: making/bricks-bristol
    name: BRICKS
    category: making
    kind: organiser
    status: provisional
    url: https://stanneshouse.org/whats-on/
    homepage: https://bricksbristol.org/
    tags: [ artist-led, studios, workshops, community ]
    cadence: monthly
    hints: |
      Artist-led organisation running studios and a public workshop programme.

      bricksbristol.org is a charity site with no diary on it — no events,
      what's-on, programme or calendar page exists. The public programme is
      listed on the site of the building they run, St Anne's House in
      Brislington, which is where this URL points. Much of it is weekly and
      open-ended (Art Club Wednesdays, Creative Circle Tuesdays) and belongs as
      recurring; the pottery open and holiday ateliers are dated runs.
    notes: >-
      Verified 2026-08-17: stanneshouse.org states "Bricks is the charity that set up and runs St Anne's House" (charity 1183118), same Brislington BS4 4AB address as bricksbristol.org, and its what's-on carries dated craft/pottery sessions through Jul–Sep 2026.
