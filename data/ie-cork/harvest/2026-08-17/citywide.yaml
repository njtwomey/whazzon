    notes: "Nine dated rows, server-rendered, \"Results Found: 9\" — matching the hint exactly. Seven were dropped and two kept.

      Dropped, with the reason for each, because \"mostly member-only\" is not a good enough record: SOLD OUT - Golf Classic 2026 (25 Aug, the title says sold out); Maximise Your Membership - Online Workshop (2 Sep, members only and online); Industry Insights: Europe's New Packaging Rules (8 Sep, online); Key Updates in Employment Law & Compliance (15 Sep, online); Leaders Lunch (17 Sep); Networking at Noon at Cloudera (24 Sep, at a member's offices); and Business Breakfast with Colin Hunt, CEO, AIB Group (29 Sep, at the Metropole). That last is the closest call in the file and was dropped only because the page prints \"Fees/Admission: Members €38\" and no non-member rate — if it turns out to admit the public it belongs in the next run.

      The two kept are both attendable: the Pont Aven networking lunch at €105 incl. VAT, and the Sustainable Cork Programme event with a European Commissioner's keynote, whose page prints no admission fee at all, so it carries no price rather than being marked free.

      One radius caveat recorded on the event: the Pont Aven is berthed at Ringaskiddy Port, roughly 13 km from the city centre and so just outside the 12 km radius. Kept because it is a Cork Chamber event in Cork Harbour, but flagged for the reviewer rather than silently included.

