    notes: "The rebrand is confirmed from the venue's own side: electricbristol.com serves a working /events/ listing and the catalogue's dead swxbristol.com is not needed. The pagination hint is right — 12 events per page over 6 pages — and I followed the pager once, so this observation covers pages 1 and 2: 23 events from 21 Aug to 20 Oct 2026. Pages 3 to 6 were not read, so anything after 20 Oct is missing rather than absent. What the index does not give is substantial: no start times, no doors, no prices, no support acts, no age restrictions, and no room. Every date does carry an explicit year, so the year inference problem does not arise and confidence is high throughout even without printed weekdays. One merge: Phoebe Bridgers on 21 Aug is sold as a matinee and an evening show under two listings, recorded as one event with both noted, per the several-showings rule; both are sold out. Two events share 2 Oct (Lime Garden and Nora En Pure) and two share 16 Oct, which is the pager boundary rather than a duplicate."
