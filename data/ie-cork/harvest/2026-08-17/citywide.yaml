    notes: "Took the api route and did not attempt the HTML at all — the hint is right that a 403 on ra.co/events/ie/cork is not evidence the data is unreachable. POST to https://ra.co/graphql with Content-Type: application/json and no authentication of any kind returned 200 and the full result. Area 387 still resolves to Cork.

      totalResults came back as 8 for the window 2026-08-17 to 2027-08-16 — the entire forward year in one fetch, so no pagination was needed and nothing was truncated. This is the complete Cork RA diary as of today. Weekly cadence is more than enough.

      Two rows, DOSE Social and DOSE18, come back with venue.name \"TBA - TEST SITE\" and a null contentUrl, which is RA's placeholder for a venue not yet announced. Recorded with that stated as the venue name and confidence medium, rather than omitted — omitting venue would let compile fall back to the source and show \"Resident Advisor\" as the place.

      contentUrl is site-relative and has been prefixed with https://ra.co as the hint says — which means every per-event URL here 403s to a fetcher for the same DataDome reason the listings page does. They are correct links for a reader in a browser, and check-urls will flag all eight.

      Coverage note for whoever reads this next to RA: Bandsintown carried a Fish Go Deep date at the Savoy on 22 August that RA's Cork area did not, so RA is definitive for club nights but not exhaustive."
