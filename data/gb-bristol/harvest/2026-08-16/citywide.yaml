    notes: "Read the catalogued /whats-on grid plus /whats-on/this-week-in-bristol/. Partial by design: the site carries several hundred listings behind about seventeen sub-listings (theatre, comedy, exhibitions, free, family, food and drink, classes) which were not followed; these thirty are the featured block plus the whole of \"this week\". The grid prints no times and no prices at all, so those fields are absent throughout, and its descriptions are hard-truncated mid-sentence. Every \"this week\" row is stamped with a start of today because the page filters from the current date, so those are recorded as runs with an end only. Three images on the featured grid were plainly mis-attributed (Bowood House against Encounters, Seven Saints of St Pauls against the Christmas Market, a harbour mooring shot against the Gromit exhibition) and were dropped. Note this source also lists attractions well outside Bristol — Weston-super-Mare, Wookey Hole, Thornbury, Bowood in Wiltshire."
