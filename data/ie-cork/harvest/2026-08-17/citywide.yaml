    notes: "One application/ld+json ItemList holding 54 distinct Event objects; read that rather than the cards, as the hint says, because the visible text uses relative dates. 26 recorded, and they earn their place: the Tallest Man on Earth at St Luke's, the Culture Night Late show in the City Hall Concert Hall, the two Jazz Festival City Hall Series gigs, Romanian Language Day at the Metropole and a drag brunch at Clancy's all reached this harvest here and nowhere else.

      LIMIT OF THE ROUTE: the JSON-LD carries startDate as a bare date with no time and no offers, so not one row here has a start time or a price. The rendered cards would have times; reading both was not worth a second pass.

      Dropped, and why: two speed-dating nights and a Pitch-A-Friend evening; eight online-only rows with no location at all (an SVPG masterclass, a Waterstones livestream, a US film-history livestream, an ARBD webinar, Cram 4 The Exam, an underwater photography class, a marketing webinar, live psychic readings); a singles beach party at Fountainstown, outside the radius; six commercial wellness bookings (a bareMinerals coffee morning, acupuncture, a breath session, medical qigong, a resuscitative surgery skills course, a health and fitness summit); a Zumba and card-reading morning; a Nemo Rangers members' anniversary banquet; and six rows that Skiddle, Ticketmaster or PROC already carry with a time and a price attached (Guaya, two Leaving Cert nights, Club 30, Dave Lofts, Thomas Green, Folklore/Female Aging)."
