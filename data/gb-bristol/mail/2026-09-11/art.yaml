      EXPLORE OVER 500 WORKS OF CONTEMPORARY ART THIS AUTUMN


      We open the doors to the 173 Annual Open Exhibition <https://us.list-manage.com/lppOUiczI4c?c2id=cc7a0efe922030ce1961c714c401bb38&m=0KXNbInPmhqDvnd-mfRbNJ6TInM8_5F4zBLrbs8g6hSkPk3eRkXoJgkJL6n8> on Saturday 12th September. With over 500 artworks by 381 artists, ranging from sculpture to video, to ceramics to print - and everything in between - this is our largest event of the year.


      The Annual Open is as much about enjoying art as it is about celebrating the artists, so we're bringing you exciting new opportunities to make the most of your visit to the exhibition.


      Explore the galleries after normal hours with our Tuesday Late Opens <https://us.list-manage.com/9URTI5rBEUA?c2id=cc7a0efe922030ce1961c714c401bb38&m=TRFnhOrM-kKJoN7cVATCYU-ykdwNfdcqmpdGk-O_FidBUAOlE0KuV3qpQWpU>, and Meet the Artists <https://us.list-manage.com/10Pfy9z_An7?c2id=cc7a0efe922030ce1961c714c401bb38&m=BlsNNzTuHZDWNRU-y7M5KXr3RyjPDV32zmANRCpN3VgI7NP-Bsk0uGJy5bwF> behind some of the work. Choose from six different kinds of exhibition tour <https://us.list-manage.com/FMS14Uf4zqo?c2id=cc7a0efe922030ce1961c714c401bb38&m=CuqTjhYY0ZXBhQuCGgxPxPiGuD-iAC8eNp1O5vuoSmubY17SyeRC7e9n_cH-> depending on what works for you.


      Planning to visit a few times? An Annual Art Pass <https://us.list-manage.com/MAFR_4xZRzI?c2id=cc7a0efe922030ce1961c714c401bb38&m=Vln64w00JIPX_9vhGxbJl3eyPBgFqZO3XOxU1_Y1mH5zuunLqofOnRDPVa8K> gives you unlimited entry to our exhibitions for a whole year.


      Explore 173 Annual Open Events <https://us.list-manage.com/cRzG4RBMAZg?c2id=cc7a0efe922030ce1961c714c401bb38&m=k_MYYzvsSPa293O4EAUrlwdcfTWVmTT2u480unkfDUHBuXMkJRBoOaXdo0R4>


      NEW FOR THE 173 ANNUAL OPEN


      INTRODUCTION TO COLLECTING ART


      19 September | 11am


      Find out more about starting or building your art collection with RWA Academicians Ione Parkin, Sara Dudman and Pennie Elfick, and Curator and Art Historian, James Russell. They'll offer advice from choosing art to fit within your home or office, to looking at art as an investment.


      Find out more about Intro to Collecting <https://us.list-manage.com/52obUetATxd?c2id=cc7a0efe922030ce1961c714c401bb38&m=0Wnqa560_-9f_JYH3pq0PH7T7mJr7P4fralmN9qpWJ2MnInB7K6PLMc8XvXW>


      TUESDAY LATE OPENS


      Every Tuesday | 5 - 8pm


      Do something a little different after work and explore the 173 Annual Open Exhibition. Open every Tuesday evening until 2027, with one-off events throughout the year.


      Find out more about Tuesday Late Opens <https://us.list-manage.com/12iOguve9WL?c2id=cc7a0efe922030ce1961c714c401bb38&m=uDX0PqFcN7f9v-Ni09yC7TasVt05LAVp5bfidSHFfXV7S2QciVC6eAsciHl_>


      EXPLORE THE EXHIBITION YOUR WAY


      BRITISH SIGN LANGUAGE GALLERY TOUR


      3 October | 1.30 - 3pm


      Led by Emily Rose, from a Deaf perspective, this exhibition tour of the 173 Annual Open Exhibition will be delivered in British Sign Language (BSL). Emily will bring the exhibition to life by selecting and exploring a variety of artworks.


      Find out more about BSL Gallery Tour <https://us.list-manage.com/a5wWmrnQm_b?c2id=cc7a0efe922030ce1961c714c401bb38&m=BHAXP8VUmlWSukW36yRPQ1DX4jZXeReIpb0L2c_ogGrfhLh04TsrzcpmopF8>


      FIRST SATURDAY EXHIBITION TALKS


      3 October | 11am


      Join us on the first Saturday of the month for a relaxed, artist-led session exploring works in our Annual Open Exhibition. The first session will be led by RWA Academicians Alice Kettle and Jemma Appleby and Jessica Lloyd-Smith from Modern ArtBuyer.


      Find out more about Saturday Talks <https://us.list-manage.com/HguzRiYgBEh?c2id=cc7a0efe922030ce1961c714c401bb38&m=pF_tROB1jhqzDCwuyy9x_RGU7n9Ofecp4cdwQmVlFEfAN87UldpZG05L-qyd>


      LIVING STORIES: LANDSCAPES OF BELONGING


      Across three workshops through walking, planting and creative writing, you will explore Bristol as a living landscape shaped by nature, migration, heritage and community, adding your own voice to its evolving story.


      7, 9 & 30 September


      Book Living Stories workshops <https://us.list-manage.com/15MiidY2xE7?c2id=cc7a0efe922030ce1961c714c401bb38&m=Z3dTWF5ibkXKD4-0RxkaDPGEQOfeyMxdj5aY93_C8C5c1wSMCadYo7eTK8ru>


      RWA NEWS


      SPOTLIGHT: MOHAMMAD BARRANGI, INVITED ARTIST


      5 March | 6.30-8.30pm


      Internationally acclaimed artist and former Paralympian Mohammad Barrangi is this year's Invited Artist. He will be showcasing new work '1001 Nights' in the 173rd Annual Open, his first exhibition in Bristol.


      Find out more about the Invited Artist <https://us.list-manage.com/KMVj6xzzR8t?c2id=cc7a0efe922030ce1961c714c401bb38&m=Gu2ZMtOUqymLMChfkF2cXlmhRSPiZbCJ4XKJtZZuv5sCpJ80LtE2dJjm0V-N>


      CALL TO ARTISTS FOR RWA BIENNIAL: PAINT


      19 March | 6.30-8.30pm


      A showcase of the expressive possibilities of paint as an artistic medium and subject, inspired by the RWA's upcoming major exhibition of recent works by Sir Frank Bowling OBE RA RWA (Hon). This is an opportunity to present fresh and compelling approaches to the theme in all its forms. Submission open on Monday 7 September.


      Find out more about Paint <https://us.list-manage.com/kr6mg_3HFBU?c2id=cc7a0efe922030ce1961c714c401bb38&m=f1J_D1EEHquofQl5C5qE_OYhrzv1lfqIApuIFTtKkM1QfQ-brAI-v4HY434u>


