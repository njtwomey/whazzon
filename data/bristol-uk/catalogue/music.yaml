  - id: music/bristol-beacon
    name: Bristol Beacon
    category: music
    kind: venue
    status: provisional
    url: https://bristolbeacon.org/whats-on/
    area: City Centre
    address:
      street: Trenchard Street
      city: Bristol
      postcode: BS1 5AR
    tags: [concert-hall, classical, major]
    cadence: weekly
    hints: |
      The city's main concert hall (formerly Colston Hall), reopened after a
      long refurbishment. Several rooms of very different sizes — a folk gig in
      the small hall and an orchestral concert in the main hall both appear
      here. Books a year or more ahead for classical: use a long horizon.
    addedAt: "2026-08-16"

