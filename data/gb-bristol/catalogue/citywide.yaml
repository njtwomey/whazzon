  - id: citywide/skiddle
    name: Skiddle — Bristol
    category: citywide
    kind: aggregator
    status: provisional
    url: https://www.skiddle.com/whats-on/Bristol/
    tags: [ tickets, national ]
    cadence: daily
    hints: |
      National ticketing platform filtered to Bristol. Good coverage of club
      nights and touring shows; heavy overlap with venue pages, so dedup
      carefully on title plus date.
      This page renders no visible list — the cards are lazy-loaded — but it
      still carries one `application/ld+json` Event block per listing, with
      name, startDate, endDate, image, description and the venue's postal
      address. Read those, not the HTML.
      The genre paths do render a full server-side list and are richer:
      /clubs/Bristol/ (179 events), /gigs/Bristol/ (63),
      /things-to-do/Bristol/ (19), /comedy/Bristol/ (3). Expect heavy overlap
      with citywide/resident-advisor on club nights — dedup against it first.
      Skiddle's "Bristol" region bleeds into Bath and Newport — filter on
      addressLocality, do not assume every listing is in Bristol.
    notes: >-
      Verified 2026-08-17: the catalogued page is the right one and is Skiddle's Bristol index, but the harvest read the rendered HTML and found nothing. It holds 104 JSON-LD Event blocks — 92 Bristol, 10 Bath, 2 Newport.
    addedAt: "2026-08-16"

  - id: citywide/resident-advisor
    name: Resident Advisor — Bristol
    category: citywide
    kind: aggregator
    status: provisional
    url: https://ra.co/events/uk/bristol
    tags: [ electronic, club, tickets ]
    cadence: daily
    hints: |
      Definitive for electronic music and club nights, which is a large part of
      Bristol's cultural output and poorly covered by mainstream listings.
      Do not fetch this URL — every HTML page on ra.co is behind DataDome and
      403s a plain fetch, a Chrome user-agent and a full browser header set
      alike. The wall does not cover the API. POST to https://ra.co/graphql
      with `Content-Type: application/json` and no auth of any kind:

        query GET_EVENT_LISTINGS($filters: FilterInputDtoInput, $page: Int,
                                 $pageSize: Int) {
          eventListings(filters: $filters, page: $page, pageSize: $pageSize) {
            totalResults
            data {
              id listingDate
              event {
                id title date startTime endTime contentUrl
                venue { id name contentUrl }
                artists { name }
              }
            }
          }
        }

      Bristol is area 446 — resolve it again if it ever moves with
      `{ area(areaUrlName:"bristol", countryUrlCode:"uk"){ id } }`. Variables:
      `{"filters":{"areas":{"eq":446},"listingDate":{"gte":"<from>T00:00:00.000Z",
      "lte":"<to>T00:00:00.000Z"}},"page":1,"pageSize":50}`. Page until you have
      `totalResults`. `contentUrl` is site-relative — prefix https://ra.co.
      Venue names come back plain, so match them to the catalogue by name.
    notes: >-
      Verified 2026-08-17: recovered. The harvest wrote this source off on the 403, but only ra.co's HTML is walled — the GraphQL endpoint is open and unauthenticated. Bristol area 446 returned totalResults 160 for 2026-08-17 to 2026-12-31, at Bristol rooms the catalogue already knows (The Love Inn, Strange Brew, The Gallimaufry, The Jam Jar, Sawmills). The url above stays the human-facing page; the API recipe is in hints.
    addedAt: "2026-08-16"

