      Víkingur Ólafsson: Piano Recital


      Tue 8 Sep


      Beacon Hall


      Celebrated pianist Víkingur Ólafsson returns to Bristol Beacon with Opus 109, a recital centred on Beethoven’s Piano Sonata No. 30. Music by Schubert and J.S. Bach completes a programme that brings together the works and influences behind one of Beethoven’s greatest piano masterpieces.


      With over one billion streams and a 2025 Grammy to his name, Ólafsson is one of today’s most acclaimed classical artists.


      £16 Saver Seats are now on sale with limited availability.


