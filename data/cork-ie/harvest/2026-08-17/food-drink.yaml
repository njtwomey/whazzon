        raw: "**Guerrilla Tasting – Meet The Makers** — Wednesday 4th March between 7 and

          9pm.


          \"We're delighted to welcome Baptiste Desrousseaux from iconic Loire vigneron

          family Domaine Breton and Sete Castro (Tren de Vida) from up and coming natural

          wine region Utiel Requena near Valencia to Cork – we're thrilled to have them

          in L'Atitude for the evening.


          This will be a winemaker takeover in the form of a Guerrilla Tasting – informal

          pop-up tasting where we give a flight of wines (in this case 6 wines, 3 from

          each winemaker) and the winemakers themselves will talk you through the wines.

          After that, you'll be able to chat and enjoy the wines. The kitchen team will be

          providing bites to accompany the wines.\"


          \"Price €40pp. There is no set start time, but the event will run from 7 to 9pm

          so join us anytime between then. Walk-ins welcome, but email

          info@latitude51.ie if you'd like to book.\"\n"
        summary: "A winemaker takeover of the usual Guerrilla Tasting — six wines, three each from Domaine Breton in the Loire and Tren de Vida in Utiel-Requena, poured and explained by the makers. Held in March 2026 and now past."
        confidence: "high"
