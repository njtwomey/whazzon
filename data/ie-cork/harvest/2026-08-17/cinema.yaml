    notes: "/cinema/ is the right route and lists exactly five things, ending Wed 2 Sep with nothing beyond — the calendar's September cells are empty from the 3rd. Because the index is that thin I opened all five event pages (five extra fetches, declared), so every `description` here is that page's own copy in full. Prices are the venue's printed cinema tariff, which appears in a Tickets Pricing tab on every event page rather than per film: before 5pm €8 full / €7 with annual membership / €7 child; from 5pm €11 / €8.50 / €8.50. Membership is €20, free for students, over-65s and jobseekers, and NC-rated titles are members-only. Occurrence choices: the two four-day titles are `run` with the per-day times verbatim in `timesText`, because the site itself heads them \"Sun 30 Aug - Wed 2 Sep\" and then prints one or two times against each day; the Burton titles are single Saturday screenings. Both four-day runs include one descriptive-subtitled screening on Wed 2 Sep, which is in the timesText and the raw. The Tim Burton season is five consecutive Saturday evenings in August and only the last two survive — three have already gone, which is why the season looks thin. Artists Film International is free and drop-in and runs Tue-Thu only inside its 11-27 Aug span; the site's own calendar paints it on every day in between, which is wrong, so the real pattern is in `timesText`. Its listing also carries a public talk with Thaís Muniz and Dr Eve Olney on Thu 27 Aug at 1pm — there is no separate listing or link for it, so it stays inside that event's copy rather than becoming a row I invented a URL for. Booking is per-show on Ticketsolve with real ids (/shows/873666174/events for Edward Scissorhands, /shows/873666569/ for Shoot The People), so the deep links exist even though the Ticketsolve host itself is the JavaScript shell the catalogue describes."
