    address:
      street: 4 Princess Row
      city: Bristol
      postcode: BS2 8NQ
    tags: [independent, volunteer-run, experimental, diy]
    cadence: weekly
    hints: |
      Volunteer-run microplex with a deliberately eclectic programme — film,
      music, performance and talks all in one listing. Do not assume every
      entry is a film.
    addedAt: "2026-08-16"

