  - id: notices/cape-clear-island
    name: Cape Clear Island / Oileán Chléire
    category: notices
    kind: aggregator
    status: provisional
    url: https://www.cleire.ie/
    area: Cape Clear
    tags: [island, gaeltacht, community]
    cadence: monthly
    hints: |
      **The Shetland knitting weekend was here**, and it is the reason this entry
      exists. The island's own site is the only published place a visiting tutor's
      weekend is likely to appear.
      A Gaeltacht island: notices may be in Irish only, and an event that reads as
      a course may be a residential weekend with the ferry timetable attached.
      Always record `venue` or the note as Cape Clear — getting there is a ferry
      from Baltimore and part of the decision.
      `capeclearisland.ie` is a second, separate island site and also answers 200;
      if this one goes quiet, try that before marking anything dormant.
    notes: >-
      Verified 2026-08-20: 200, and the page is the island's own.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"
