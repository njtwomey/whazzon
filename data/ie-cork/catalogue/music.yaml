  - id: music/corkgigs
    name: CorkGigs
    category: music
    kind: aggregator
    status: provisional
    url: https://www.corkgigs.com/
    tags: [ independent, community ]
    cadence: daily
    hints: |
      The best single source for Cork music, running since 2004 and maintained
      by hand. The homepage is the listings: a When / What / Where / Price table
      covering city and county, with the venue named on every row and dates
      running about ten months ahead.
      Because it names the venue per row, this is the source that most needs
      venue.sourceId set — it is also the fallback for the many Cork venues in
      this catalogue with no working listings page of their own.
      Two cautions. It covers Cork county as well as the city, so entries at De
      Barras in Clonakilty, Levis in Ballydehob, Sea Church in Ballycotton,
      Connollys of Leap and Green Glens in Millstreet fall well outside the
      12 km radius. And /venue/<slug> returns 200 for any slug, including
      nonsense ones — a 200 there proves nothing, so check that the venue's name
      appears in the page title before trusting it.
      The site announces itself as "renovating"; several venue pages read "No
      upcoming events listed" even for venues that are gigging, while the main
      diary is current.
    notes: |
      Verified 2026-08-17: the homepage carried 294 date strings, running from
      20 Aug 2026 to mid-2027, with venue and price per row — for example
      "Thu 20 Aug 2026 7:00PM The Wailers, Cyprus Avenue, €37.50" and "Wed 26
      Aug 2026 8:00PM Wunderhorse, Cork City Hall, €50". /venues is a real
      directory of 46 venues with per-venue profiles carrying address, phone and
      the venue's own website. The blanket-200 behaviour on /venue/<slug> was
      confirmed against a deliberately fake slug. /gigs is a 404 — the diary is
      on the root.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/cork-heritage-pubs
    name: Cork Heritage Pubs
    category: music
    kind: aggregator
    status: provisional
    url: https://www.corkheritagepubs.com/whats-on/
    tags: [ free, pub, community, trad ]
    cadence: daily
    hints: |
      A pub group's own listings page, and unexpectedly one of the highest-value
      sources in this catalogue: it carries the nightly free-music programme for
      about twenty Cork bars in one server-rendered list, each row giving act,
      pub, date and time. Almost none of these pubs publish their own dates.
      Pubs named in the listings include Crane Lane Theatre and Cantys, The
      Pavilion and Intermission Bar, The Vicarstown, Arty's Bar, The Park, The
      Poor Relation, Arthur Mayne's, The Old Town Whiskey Bar at Bodega, The
      Oval, Mutton Lane Inn, El Fenix, Rising Sons Brewery and Sin É — so set
      venue.sourceId from the pub name on each row.
      Two overlaps to handle. Sin É's entries are the Lee Sessions trad trail
      and belong to the trad category, not this one. And several pubs here are
      catalogued separately, so the same gig can arrive twice — the content-
      derived event id should absorb that, but expect it.
      Room names appear in brackets after the act ("(Crystal Bar)"), and much of
      the programme is weekly-recurring rather than one-off.
    notes: |
      Verified 2026-08-17: /whats-on/ returns 200, is titled "Cork Heritage Pub
      Trail | Cork's Best Pubs and Bars", and carried 122 weekday-and-month date
      strings from 17 Aug 2026 with the pub named on every row — for example
      "Jazz Improv! (All Players Welcome), Crane Lane Theatre, Mon 17 Aug, 9pm"
      and "The Professional Blues Band, The Poor Relation, Fri 21 Aug, 10pm".
      Individual events also have their own ?e=<id> URLs on the same path.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

