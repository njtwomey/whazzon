        raw: "**Conservation in Action: Documenting Crawford Art Gallery's

          Collection** — Tuesday 18 August, 12:30pm, Cork City Library.


          Discover what secrets lie beneath the surface of artworks. Free event,

          but booking is essential.\n"
        summary: "A Heritage Week look behind the scenes at how Ireland's National Collection is conserved and catalogued, with Crawford's conservator and its curator of collections. Free but booked out fast — held at the City Library rather than the closed gallery."
        description: "Attendees are invited to explore what lies hidden within artworks at

          this Heritage Week event. The presentation features Crawford Art

          Gallery's Dr Chiara Chillè (Conservator) and Dr Micheal Waldron

          (Curator of Collections and Special Projects) discussing \"the

          research, technology, and expertise involved in caring for and

          interpreting Ireland's National Collection\".


          The gallery notes that \"caring for a collection isn't just about

          preserving objects — it's about safeguarding their stories for future

          generations.\"


          Supported by the Heritage Council under the Heritage Stewardship Grant

          2026, and part of Crawford Art Gallery's wider Heritage Week

          programme. Booking via Eventbrite.\n"
        confidence: "high"
