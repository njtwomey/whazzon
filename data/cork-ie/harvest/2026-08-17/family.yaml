    notes: "Catalogue correction, and it is the significant one from this run. The catalogued URL — /en/what-s-on/children-and-young-people/ — returns 200 but is a programmes overview, not a diary: its whole body is four annual strands with no dates (Summer Reading Challenge, Spring into Storytime, Children's Book Festival \"every October\", Teen Day within Cork World Book Fest \"every April\"). The hundreds of dated /en/events/ links the catalogue counted are the site-wide mega-navigation, which every page on the site renders. The dated diary lives at /en/what-s-on/events-calendar/, which is what was harvested and what fetch.url records. The four annual strands are not recorded as events — none carries a date, and an undated row would sit on the site indefinitely — but the Children's Book Festival is worth a note for the October run.

      The calendar carries its own warning: \"Notice: Calendar Under Development — Please be patient as we continue to add events. Our new library calendar is currently under development, and not all events have been added yet\", and it points readers at a separate Events Guide (a PDF, currently \"events-guide-for-july-and-august.pdf\"). So this is a partial view by the library's own admission, and the PDF guide is an unexploited route.

      Coverage: the calendar listed 58 dated cards from 18 August to 31 October, the whole library programme with adult items included. Filtered to the children's and teen strands, which is 22 of the 58; the remaining 36 are adult or general (knitting and crochet for adults, 45 Club, Ciorcal Comhrá, book launches, Heritage Week talks and walks, the trad sessions, the neurodivergent and In Other Worlds book clubs, and a Medal Mash-up sports-medal exhibition at Mayfield running 1 August to 30 September).

      Folding: the calendar publishes each week of a weekly session as its own dated page with its own URL. Where the event's own copy states a pattern in words, or where four or more identical instances are listed, they are folded into one recurring event with the listed dates in `raw` and the soonest instance's URL — Teen Reading Circle, Teen Trad Group and Duplo Club. Where only two instances are listed and no pattern is stated they are left as two singles, which is what the library published: Lego Time, Children's Storytime and the Children's Colouring Competition. Recurring rows carry the last date the calendar actually lists as their `end`, so they retire rather than lingering.

      Cards carry no times and no prices, so nine event pages were opened for those and for `description`; the three later instances of the two-instance series were not opened and so carry no `description`. No price is recorded on any of these: the event pages print a Price field only when there is one, and none of the children's items printed anything, so free is not inferred. The branch is the venue in every case and is set as such; the library service itself is the listing.

      One data bug on the site, not a children's item but worth passing on: \"Seed Saving with Wolf Seeds\" at Hollyhill is listed as 20 Aug – 17 Jul, which ends before it starts."
