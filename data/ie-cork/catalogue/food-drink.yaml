    tags: [ brewery, taproom, independent, beer ]
    cadence: monthly
    hints: |
      Family pub in Mayfield with a five-barrel microbrewery underneath the
      lounge, running brewery tours that bundle beer flights, a tasting and
      finger food, booked by phone (021 450 3096). Live music every weekend.

      The whole domain refuses non-browser clients: every path tried, including
      the homepage, /whats-on/, /robots.txt and /sitemap.xml, returns an
      identical 187-byte Apache 403 from the Blacknight host. Do not treat that
      as the site being gone. If a fetch fails, record the fetch failure rather
      than concluding there are no events, and do not go looking for a listings
      path — none could be discovered from outside.
    notes: >-
      Unverified content as of 2026-08-17: the URL answers, but only with a 403, so nothing on the site could be read and no listings path could be confirmed. The homepage is catalogued for that reason. The pub, the microbrewery and the tours are real and independently attested by Pure Cork's listing, which is also where the street address above comes from — it is not read off the venue's own page and has no Eircode, so treat it as needing confirmation. Fixing this needs a browser user-agent or a human.
    addedAt: "2026-08-17"

  - id: food-drink/cookery-cottage
    name: Cookery Cottage
    category: food-drink
    kind: venue
    status: provisional
    url: https://cookerycottage.ie/adult-classes/
    homepage: https://cookerycottage.ie/
    area: Douglas
    address:
      street: Park Avenue, South Douglas Road
      locality: Douglas
      city: Cork
      country: Ireland
      lat: 51.884448
      lon: -8.459012
    tags: [ cookery, independent, family ]
    cadence: monthly
    hints: |
      Cookery school in Douglas, and the one source in this category that
      publishes a proper forward diary — the whole 2026/27 adult programme is on
      one page as explicit date lists, so capture the full horizon in one pass
      rather than revisiting for each month.

      Each date is a separate `single` event, not one recurring class: the
      one-night classes (Monday and Tuesday, 6–7.30pm, €35 per person) are
      Italian on Sept 7, Oct 5, Nov 2, Jan 11, Feb 1, Mar 1, Apr 5; Mexican on
      Sept 14, Oct 12, Nov 9, Jan 18, Feb 8, Mar 8; Curry on Sept 8, Oct 6,
      Nov 3, Jan 12, Feb 2, Mar 2, Apr 6. Japanese Night is €49 per person,
      6–8pm, on Sept 15, Oct 13, Nov 10, Jan 19, Feb 9, Mar 9, Apr 13. Christmas
      starters/charcuterie runs Dec 7, 8, 14, 15, 21 and gingerbread houses
      Dec 19–20. The dates print no year, so check the weekday against the year
      before recording anything — the page spans two calendar years.

      Other programmes are on their own pages and are worth reading too:
      /cooking-summer-camps/, /easter-camp/, /christmas/, /birthday-party/,
      /hen-parties/, /team-building/, /school-programs/. Birthday parties, hen
      parties, team building and school programmes are private bookings, not
      public events.

      Booking is by phone (021 4365083) or /book-online/.
    notes: >-
      Verified 2026-08-17. Address read off cookerycottage.ie/contact/ — "Park Ave, South Douglas Road, Douglas, Cork", no Eircode printed. Listed by Taste Cork as "Douglas Cookery Cottage". /contact-us/ 404s; /contact/ is the real path.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/cork-butter-museum
    name: Cork Butter Museum — butter making demonstrations
    category: food-drink
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://thebuttermuseum.com/events/
      - role: api
        url: https://thebuttermuseum.com/wp-json/tribe/events/v1/events
        note: returns the whole diary as JSON; confirmed answering, and empty on 2026-08-17
    homepage: https://thebuttermuseum.com/
    area: Shandon
    address:
      street: O'Connell Square
      locality: Shandon
      city: Cork
      postcode: T23 H004
      country: Ireland
      lat: 51.90275
      lon: -8.476596
    tags: [ tastings, community, free ]
    cadence: monthly
    hints: |
      Catalogued here for the food programme, not the exhibitions: butter making
      demonstrations run "Wednesday and Saturdays at 12.00 noon", with bread and
      newly-made butter to sample afterwards. That is one `recurring` event.

      It cannot be booked — the museum states plainly that it "cannot offer a
      pre-payment or booking facility for demonstrations", seats 35, advises
      arriving around 11am, and may not run the demonstration at all if seats are
      not taken by 11.45am. Record that conditionality in the notes rather than
      presenting it as a guaranteed sitting.

      Opening is seasonal and the demonstration follows it, so a Wednesday in
      January or February will not have one: Jan–Feb is weekends only, Mar–Apr
      and Nov–Dec are Wed–Sun, May–Oct is daily.

      One-off events go into a The Events Calendar install — use the api route,
      which is cheaper than the page.
    notes: >-
      Verified 2026-08-17. www.corkbutter.museum 302s to thebuttermuseum.com, which is the live site; address and demonstration times are read off its own footer. /events/ answered with "0 events found" and the api route returned {"events":[],"total":0}, so the calendar is genuinely empty rather than unreachable. /whats-on/ 404s and ?ical=1 returns an empty body, so there is no ics route worth carrying. The museum itself will also fit the museums category — this entry exists for the demonstrations, and whichever is the duplicate should be dropped by a human rather than both being harvested.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

