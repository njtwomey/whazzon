    address:
      locality: Carrigtwohill
      city: Cork
      postcode: T45 CD93
      country: Ireland
      lat: 51.892525
      lon: -8.31324
    tags: [ zoo, animals, outdoor, ticketed ]
    cadence: monthly
    hints: |
      Shopify site with no events calendar at all — /whats-on/ and /pages/events
      both 404. Dated one-off events are announced as news posts (International
