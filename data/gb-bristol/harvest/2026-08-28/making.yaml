    notes: "Twenty classes, all of them on the page today, and the bank holiday shows up clearly in two of them: Commercial (Beginners) prints \"Monday - no class 24/08 & 31/08\" and Aerial hoop - high intermediate prints \"Monday, no class 31/08, 05/10, 26/10 & 02/11\". Those two carry the `bank-holiday` tag, because the listing itself alters the schedule for the Monday. The four Monday classes that do run on 31 August — Beginner's Ballet, Advanced Ballet, Bristol Hoop School, Open Ballroom/Vogue — are not billed as bank holiday events, so they do not. Following the catalogue hint, every row is recorded as `recurring` with the page's own schedule string as the pattern, rather than as a stream of dated instances; the page prints a weekly pattern for some classes and just the next date for others, and both are reproduced verbatim. Every printed weekday checks out against the calendar (Sunday 30th Aug, Monday 31st Aug, Tuesday 1st Sep, Wednesday 2nd Sep, Thursday 3rd Sep are all correct for 2026) with one exception: IMPROVERS AERIAL HOOP COURSE is billed as Fridays but says \"no class 25/08\", and 25 August 2026 is a Tuesday. That row is recorded verbatim at confidence medium. Two other things a curator should see. The Exhibitions and Events and Club Nights sections of this page exist but are empty today, so there is no one-off bank holiday programming here at all. And the whole programme remains dance, ballet, aerial circus and ballroom with no making content — the recategorisation question the catalogue already records."
