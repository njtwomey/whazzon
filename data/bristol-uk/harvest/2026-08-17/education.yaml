    notes: "Bot-walled exactly as the catalogue hint records. /events/ returned 403 with a 1,395-byte body to a plain fetch, and the site root returned 403 with a 1,360-byte body. Retried once with the desktop Chrome user-agent §2 prescribes and got the same 403 both times. The body is not an error page but a \"Checking your browser...\" interstitial that redirects via JavaScript to /?ki-cf-botcl=1, with a noscript meta-refresh to the same place — a bot check, so this is the genuine wall §2 distinguishes from a host that merely dislikes an unfamiliar fetcher, not a dead site. No page body was read, so no events, and none are attached to the failed fetch. Needs a JS-capable fetcher or a browser; the catalogue entry and its missing `verifiedAt` are both still accurate."
