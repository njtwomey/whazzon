    notes: "Read the route the 2026-08-28 run found: the browse page renders no list, but `window.__SERVER_DATA__` in its HTML holds `search_data.events.results`, twenty rows a page with name, dates, times, venue with postal address, image, summary and canonical url. The catalogued URL was not fetched this run; /events--this-weekend/ pages 1-3 were, three fetches, 58 rows of the 1,282 the pagination reports for 11-13 September (49 pages). That is a deliberate truncation — 46 pages unread — and the coverage claim is \"the first three pages of Eventbrite's own ranking\", nothing more. Of the 58: 21 recorded. Left out and why: 21 are not in Bristol (Bath x5, Cardiff x2, Newport, Weston-super-Mare x2, Shepton Mallet x3, Timsbury, Trellech, Batheaston, Keynsham x2, Failand, Yate, Winterbourne, Warmley); 9 are also on other citywide sources this run (Kate Bush at the Cathedral, Talib Kweli, Oas-is, Banshee, Bon Jovi Experience, Bambalan's Terrace Soul closing party, DJ Q, Sweet Escape, the two UWE freshers rows); 7 are not cultural events — speed dating, a networking mixer, a beauty brunch, \"Authentic Dating\", a sip-and-paint retail product, a public swim and a Coppa Club promotion. `ticket_availability` is absent on every row, so no price is recorded anywhere. The gong bath is recorded as `recurring` because its own blurb says \"every second Friday of the month\"; the food festival is a two-day `run`. Rows outside Bristol proper but inside the BS postcode ring are kept where the venue is a real place people travel to (Emersons Green, Filton) and dropped where it is a village hall in Somerset. `summary` is Eventbrite's own one-liner where it says more than the title; no event page opened. Venues here that the catalogue does not hold: Bristol and Bath Science Park, Bambalan, BAWA, The Beehive Centre, One B Coffee House, The Vench, Woodcroft Community Orchard, Bristol School of Yoga, Hartcliffe City Farm, The Golden Lion, Glenside Hospital Museum."
