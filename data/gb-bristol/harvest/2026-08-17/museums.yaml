        raw: "24 October—1 November 2026


          FAMILIES: These autumn activity days will celebrate the season at Blaise Museum with

          something to do for all the family.\n"
        summary: "Six half-term activity days built around the season — tiny doors with fairies behind them, face painting, woodland trails and story time for under-nines."
        description: "Join us for autumn fun, stories and exploration!


          Perfect for families with children aged 0-9, this enchanting event will immerse you in

          the richness and warmth of the season, celebrating nature this autumn.


          Peep into our tiny world autumn doors and spot the fairies and animals that live

          behind them. What stories do they tell? Let your creativity flow and create your own

          story/poem inspired by our autumn creatures to take home with you.


          This event is a delightful way to introduce young ones to the magic of the season with

          lots of creative activities.


          What's on:


          - Snuggle up and enjoy a story time with our friendly volunteers

          - Our art students will be on hand for face painting; will you transform in to a bat?

          \  A squirrel? Or perhaps decorated with leaves and acorns?

          - Enjoy a drink and a tasty treat on our terrace while you soak up the autumn colours

          - Enjoy the scenes of the season and spot the cuddly woodland birds and their friends

          \  hiding in our museum, can you find them all?

          - Come dressed in your favourite costumes, ready to explore, learn, and make memories

          \  in the beautiful scenery of the Blaise estate

          - Make a paper woodland friend to take home with you

          - Enjoy a nature walk and learn all about our local fauna and flora with our special

          \  outdoor trail around the park and grounds


          Happening on: Saturday 24 October, Sunday 25 October, Thursday 29 October, Friday 30

          October, Saturday 31 October, Sunday 1 November.


          Entry tickets are £5 per person (except children under 4) and activities are included

          in the entry price. Child aged under 4: Free. Discounted family group tickets are

          available for 2 adults + 2 children, 1 adult + 3 children and 2 adults + 1 child.

          Walk ins on the day if space is available.\n"
        confidence: "high"
