schema: whazzon.catalogue/1
category: citywide
label: City-wide
description: >-
  Cross-category listings sites, the council and the tourist board. These are the safety net: anything the category catalogues miss — pop-ups, one-off community events, venue-less happenings — tends to surface here first.
sources:
  - id: citywide/visit-bristol
    name: Visit Bristol
    category: citywide
    kind: aggregator
    status: provisional
    url: https://visitbristol.co.uk/whats-on
    homepage: https://visitbristol.co.uk/
    tags: [ tourist-board, official ]
    cadence: daily
    hints: |
      The official tourist board listing. Broad but shallow — good for
      discovering events, weak on detail. Prefer the venue's own page for
      anything it lists that we already catalogue.
    notes: Best single safety net for events with no venue of their own.
    addedAt: "2026-08-16"

  - id: citywide/bristol-247
