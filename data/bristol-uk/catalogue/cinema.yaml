sources:
  - id: cinema/watershed
    name: Watershed
    category: cinema
    kind: venue
    status: provisional
    url: https://www.watershed.co.uk/whatson/
    area: Harbourside
    address:
      street: 1 Canon's Road
      locality: Harbourside
      city: Bristol
      postcode: BS1 5TX
    tags: [independent, arthouse, major, cultural-cinema]
    cadence: daily
    hints: |
      The city's main independent cinema and a cultural centre in its own
      right — also runs talks, festivals and industry events. Listings change
      daily and screenings are often one-offs with a single showing, so a
      weekly harvest will miss things. Capture the individual screening date,
      not just the film's run.
    addedAt: "2026-08-16"

