schema: whazzon.catalogue/1
category: museums
label: Museums & Heritage
description: >-
  Civic and independent museums, forts, historic buildings, cathedrals and an observatory — plus the heritage societies and heritage-week platforms that programme into them. Mostly permanent collections (`occurrence.kind: ongoing`) with temporary exhibitions as `run` and tours or talks as `single`.
sources:
  - id: museums/cork-public-museum
    name: Cork Public Museum
    category: museums
    kind: venue
    status: provisional
    url: https://www.corkcity.ie/en/cork-public-museum/visit/upcoming-events/
    homepage: https://www.corkcity.ie/en/cork-public-museum/
    area: The Mardyke
    address:
      street: Fitzgerald's Park
      city: Cork
      country: Ireland
      lat: 51.895998
      lon: -8.49585
    tags: [ civic, free, local-history, exhibitions ]
    cadence: monthly
    hints: |
      Free entry, council-run, lives inside the Cork City Council site rather
      than on its own domain — so the page is buried under a very large council
      mega-menu; the real content is inside <main>.
      Publishes exhibitions, not a dated diary: the two entries carried on this
      page are collection exhibitions with no printed end date, so they are
      `ongoing` unless a date is stated. Dated one-offs (curator tours, staff
      talks, Heritage Week drop-ins) appear only in the child page
      /visit/upcoming-events/events-and-exhibitions/, which is worth a second
      fetch but is currently stale — it still heads its programme "Heritage Week
      2025" and refers to the museum's 80th anniversary (1945+80 = 2025), so
      check the printed year against the weekday before recording anything from
      it.
      The permanent galleries are listed separately under
      /en/cork-public-museum/exhibitions/.
    notes: |
      Verified 2026-08-17: title "Upcoming Events - Cork City Council",
      breadcrumb reads Home / Cork Public Museum / Visit / Upcoming Events, and
      the page lists "SUFFERING THE MOST — Tomas MacCurtain and Terence
      MacSwiney" and "Our Collections: Aspects of Life in Medieval Cork".
      The museum's own Getting Here page confirms it is in Fitzgerald's Park,
      1.8km west of the centre, off the Western Road — hence the Mardyke area.
      No street-level address or Eircode is printed anywhere on the site (the
      footer gives Cork City Council's City Hall address instead), so the
      address here stops at the park and no Eircode is guessed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/cork-city-gaol
    name: Cork City Gaol
    category: museums
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://corkcitygaol.com/news-updates/
      - role: booking
        url: https://bookings.corkcitygaol.com/book
        note: >-
          the only place tour times are printed — self-guided admission any time, guided tour 2pm daily and hourly through July and August
    homepage: https://corkcitygaol.com/
    area: Sunday's Well
    address:
      street: Convent Avenue
      locality: Sunday's Well
      city: Cork
      postcode: T23 VX25
      country: Ireland
      lat: 51.89948
      lon: -8.498993
    tags: [ heritage, ticketed, family, local-history ]
    cadence: monthly
    hints: |
      There is no what's-on page. /news-updates/ is a blog that mixes seasonal
      events (Easter Bunny Trail, Halloween Family Fun, Culture Night) with
      history articles (prisoner profiles, "Did You Know?"), and the event posts
      carry no date in the listing — open the post for the date, and discard the
      history pieces rather than recording them as events.
      Watch the year: a "Culture Night 2025 - Fully Booked" post is still on the
      first page.
      The core offer is recurring, not one-off: self-guided admission during
      opening hours plus a 2pm guided tour daily, hourly in July and August.
      The Radio Museum Experience is in the same building and is not ticketed
      separately.
    notes: |
      Verified 2026-08-17: corkcitygaol.com serves "Home - Cork City Gaol" and
      /news-updates/ serves "News & Updates - Cork City Gaol" with the event and
      history posts above. Address and Eircode read off the venue's own
      /visit-us/ page (Convent Avenue, Sunday's Well, Cork City, T23 VX25; it
      also prints GPS 51.8995105, -8.4990497). The booking route was fetched and
      is a live basket-driven shop, not a redirect to a third-party lander.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/butter-museum
    name: The Butter Museum
    category: museums
    kind: venue
    status: provisional
    url: https://thebuttermuseum.com/
    area: Shandon
    address:
      street: O'Connell Square
      locality: Shandon
      city: Cork
      postcode: T23 H004
      country: Ireland
      lat: 51.902747
      lon: -8.477033
    tags: [ heritage, ticketed, independent, local-history ]
    cadence: quarterly
    hints: |
      Homepage is the listings page — there is nothing else. /category/upcoming-
      events/ exists but renders an empty list, and the site's Events Calendar
      plugin answers at /wp-json/tribe/events/v1/events with a diary of zero
      events, so neither is worth a fetch.
      The only date-shaped content is recurring and lives on the homepage:
      traditional butter-making demonstrations Wednesdays and Saturdays at 12.00
      (35 seats, no booking, arrive by 11.40), plus season-dependent opening
      hours that change four times a year. Record the demonstration as
      `recurring` and the museum itself as `ongoing`.
      Tickets are sold through thebuttermuseum.clr.events, which currently holds
      one product — general admission — so it is not an events source.
    notes: |
      Verified 2026-08-17: title "Home - The Butter Museum", copy describes the
      Cork Butter Exchange and Kerrygold, address read off the site's own
      /visit-the-area/ page (O'Connell Square, Shandon, Cork T23 H004).
      corkbutter.museum also resolves and serves the same site.
      Cadence set to quarterly rather than the monthly used for the other
      museums here, because the diary is genuinely empty and only the seasonal
      opening hours change.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/shandon-bells-st-annes
    name: Shandon Bells & Tower, St Anne's Church
    category: museums
    kind: venue
    status: provisional
    url: https://www.stanneshandon.ie/news-events/
    homepage: https://www.stanneshandon.ie/
    area: Shandon
    address:
      street: Eason's Hill
      locality: Shandon
      city: Cork
      postcode: T23 YN88
      country: Ireland
      lat: 51.904338
      lon: -8.474754
    tags: [ heritage, ticketed, community, local-history ]
    cadence: monthly
    hints: |
      shandonbells.ie is the name people use but its certificate has expired —
      https:// fails outright, http:// redirects to stanneshandon.ie. Use
      stanneshandon.ie.
      The listing mixes three different things and they need different
      occurrence kinds: weekly Sunday services ("12th Sunday After Trinity",
      10:15), one-off heritage tours and talks, and the year-round ticketed
      climb to ring the bells, which is `ongoing` rather than an event.
      Paginated 6 to a page and 27 pages deep, oldest kept forever — take the
      first page or two and stop; everything after that is archive.
      Times are printed as ranges ("10:30 AM to 12:00 PM").
      Not a WordPress Events Calendar site: /wp-json/tribe/events/v1/events
      404s, and the entries are a custom /event/<slug> post type.
    notes: |
      Verified 2026-08-17: title "St. Anne's Church News & Events | Latest
      Updates" with dated entries — Heritage Week 2026: Uncovering Hidden
      Shandon (Tue 18 Aug 2026), Conserving a Lost Cork Institution: The
      Heritage of the Green Coat School (Sat 22 Aug 2026), Cork Heritage Open
      Day Shandon Walking Tour (Sat 15 Aug 2026). Address and Eircode read off
      the venue's own /plan-your-visit/ page.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/nano-nagle-place
    name: Nano Nagle Place
    category: museums
    kind: venue
    status: provisional
    url: https://nanonagleplace.ie/nanoevents/
    homepage: https://nanonagleplace.ie/
    area: Douglas Street
    address:
      street: South Presentation Centre, Douglas Street
      city: Cork
      postcode: T12 X70A
      country: Ireland
    tags: [ heritage, ticketed, community, exhibitions ]
    cadence: monthly
    hints: |
      /whats-on/ 301s to /nanoevents/ — use /nanoevents/ directly.
      The page carries upcoming and past events in one list, each row labelled
      "Upcoming Event" or "Past Event"; trust the label, because the list is not
      in date order and some rows print a range with no year ("August 15th -
      August 22nd") or no date at all.
      Programmes exhibitions in the Design & Crafts gallery alongside talks,
      workshops and festival slots (Cork Midsummer, Choral Festival, Lifelong
      Learning, Bealtaine, Heritage Week), so many events here belong to another
      organiser and only borrow the room.
      The museum, gardens and heritage centre themselves are `ongoing`.
      No Events Calendar API — /wp-json/tribe/events/v1/events 404s.
    notes: |
      Verified 2026-08-17: title "Nano Nagle Events Archive - Nano Nagle Place",
      dated entries include Preserving Nano Nagle's Treasures with Conservator
      Karen Horton (25 Aug 2026), National Heritage Week (15-22 Aug), The Past
      from the Press exhibition (June-September 2026) and the Playful Culture
      Trail. Address read off the site's own /visitor-info-tours/ page.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

