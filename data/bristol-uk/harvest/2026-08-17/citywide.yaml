    notes: "Server-rendered as the hints say, and `pageSize` is honoured, so the whole diary came back in one request rather than 18 pages of 12: /events/search-results?page=1&pageSize=250 returned all 206 rows. **A better route for next time.** The listing supports an audience filter, `?a=General+public`, which UWE itself uses to mark what is open to the public. It cuts 206 rows to 19 and is the fetch recorded above. Worth a hint for stage 1. What was left, and why. Of the 206, the overwhelming majority is either recruitment (campus tours at three campuses, undergraduate on-campus and virtual open days, applicant and postgraduate webinars, \"Campus Tour International\") or internal student life (16 International drop-ins, 9 Student Life drop-ins, freshers' parties and fairs, sock-monkey making, sip 'n' paint, bowling, karaoke, ice cream vans, academic-skills workshops on essay structure and critical thinking). None of that is what is on in Bristol, and none of it is recorded. 15 events are: the public exhibition, the public-facing talks and conferences, the open-to-all music ensembles and the public masterclasses. Two judgement calls a human may want to revisit. The Bristol Business Breakfast, the decolonisation conference and the ALIBSA congress are not tagged \"General public\" by UWE — they are tagged Businesses/Alumni, Students/Staff and \"Bristol and local area\" respectively — but all three take open registration from outside the university, so they are included. The Six Triple Eight is tagged Current students yet its own page says \"This is a free event, and all are welcome\", so it is included on the page's own words. Left out for the opposite reason: \"Questions of no importance\" and the Global Buddies sessions (Transport in Bristol, the Arnolfini coffee morning) read as student-support activities despite being open-ish, and \"Big Hello – UWE Voices\" and \"Big Hello - UWE Brass\" are the same kind of open ensemble as the five recorded below but are not tagged General public, so they were left. **7 event pages opened for `description`** — SENTIENTS, the business breakfast, both mindful eating sessions, the decolonisation conference, the ALIBSA congress and The Six Triple Eight — because the index carries only a date with no year, no time, no room and no price, and the public programme is small enough to walk. The five Big Hello ensembles and the three Ableton masterclasses have no `description`: their pages were not opened, so their rows carry only what the index said. The Big Hello ensembles are recorded as one recurring event each, with the pattern in the listing's own words, rather than as the two dated occurrences the index shows for each. Every date in the diary omits its year; each one recorded here has had its printed weekday checked against the calendar, including the Ableton masterclass on Saturday 13 February, which confirms 2027. Image paths are root-relative without the leading slash (\"-/media/uwe/...\") and have been prefixed with https://www.uwe.ac.uk/ (one checked, 200 image/jpeg)."
