        raw: "**Festival of Economics** @ City centre — Fri, 13 Nov — Fri, 20 Nov


          Lecture/Talk · Debate


          The 15th edition of the Festival of Economics arrives at a time when artificial intelligence, geopolitical instability and rising costs of living have shifted the global economic mood away from hope a…\n"
        summary: "The fifteenth Festival of Economics, a week of talks and debates with economists, policymakers and journalists at venues across the city centre, asking whether AI, instability and the cost of living are growing pains or the start of a dystopia. Full programme and tickets on the festival's own website; the University is a supporter."
        description: "The 15th edition of the Festival of Economics arrives at a time when artificial intelligence, geopolitical instability and rising costs of living have shifted the global economic mood away from hope and toward cynicism.


          This year, we will examine whether these are growing pains that are necessary to achieving resilience and a stronger future, or signs that we are quietly transitioning into a 'Brave New World'-style dystopia.


          Join world-class economists, policymakers, journalists and thinkers in November to share your perspective on the state of today's economy, learn from and challenge the experts, and contribute towards a vision for renewed economic prosperity.


          The Festival of Economics takes place 13-20 November 2026 at multiple venues across Bristol.


          **Full programme and tickets are available at: [www.economicsfestival.co.uk](http://www.economicsfestival.co.uk/)**


          Proudly supported by the University of Bristol.


          Organiser: Festival of Economics, info@economicsfestival.co.uk.\n"
