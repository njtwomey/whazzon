      **Coverage: complete, nothing truncated.** The guide printed 60 day headings

      from Mon Aug 17 to Sun Dec 27 2026 carrying **110 dated rows**, and those 110

      rows are recorded above as **16 recurring events**. That is the whole guide,

      not a sample. Grouping was mechanical — one event per distinct (venue, printed

      start time) pair — and the sixteen groups are:


      | venue | printed time | rows | last date printed |

      | --- | --- | --- | --- |

      | Sin É | 6:00 pm | 8 | Tue Aug 25 |

      | Sin É | 9:00 pm | 6 | Tue Aug 25 |

      | Sin É | 5:30 pm (Sun) | 1 | Sun Aug 23 |

