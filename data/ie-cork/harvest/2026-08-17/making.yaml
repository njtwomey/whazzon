        raw: "**Certificate in Art Textile (Level 8)** — Duration: Two years

          (4 Semesters) in duration, culminating in a Level 8 Special Purpose

          Award. Course Fee: Year One: €1,700 (€300 of this fee to be paid as a

          deposit on acceptance of place). Year Two: €900. **Applications Now

