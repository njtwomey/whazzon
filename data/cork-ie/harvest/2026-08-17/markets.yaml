ch dinner-and-film — are food experiences rather than markets or pop-ups, which does not match what the catalogue says this source is for; they are recorded because this route is catalogued only under markets and would otherwise go unobserved, and their tags say what they are. Nothing was truncated: all 23 entries were accounted for."
