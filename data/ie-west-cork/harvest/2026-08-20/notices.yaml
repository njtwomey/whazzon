schema: "whazzon.harvest/1"
locationId: "ie-west-cork"
date: "2026-08-20"
category: "notices"
harvestedAt: "2026-08-20T11:50:00Z"
model: "claude-opus-5[1m]"
observations:
  - sourceId: "notices/heritage-week"
    fetch:
      ok: true
      url: "https://www.heritageweek.ie/event-listings?county=cork"
      status: 200
    events: []
    notes: "2,648 events nationally, paginated, and the county filter did not narrow the first page — the only Cork item visible was a knitwear display in the city, which is out of scope here. This matters more than a zero suggests. The West Cork Heritage Week events *are* on this site — every event recorded under `textiles/duchas-clonakilty` today links to a heritageweek.ie page — they simply cannot be reached through this listing in one fetch. Going in through the local organiser's own page worked; going in through the national index did not. Next run: try the map view, or fetch the county filter as a real query parameter once its shape is known."
  - sourceId: "notices/southern-star"
    fetch:
      ok: true
      url: "https://www.southernstar.ie/things-to-see-and-do"
      status: 200
    events: []
    notes: "A section of articles, not a diary. Headlines and publication dates, with the event details inside the piece — and some of those are subscriber-only. Nothing extractable without opening each article. Still the best-informed source in West Cork on flax and craft; it is just that reading it costs a fetch per story. Worth a hint: follow only headlines that name a month or a weekend."
  - sourceId: "notices/west-cork-people"
    fetch:
      ok: true
      url: "https://westcorkpeople.ie/category/dont-miss/feed/"
      status: 200
    events: []
    notes: "The feed works and is cheap, but the July–August items are profiles and round-ups rather than dated notices. One in-scope thing surfaced by name — the West Cork Creates exhibition in Skibbereen — which is not yet in the catalogue and should be."
  - sourceId: "notices/cape-clear-island"
    fetch:
      ok: true
      url: "https://www.cleire.ie/"
      status: 200
    events: []
    notes: "**The one that matters, and the one that failed.** cleire.ie answers 200 but is a JavaScript application: the HTML contains nothing but script tags, so a fetch-based harvest can read no events from it at all. This is the site the Shetland knitting weekend would have been announced on. `capeclearisland.ie` is the alternative and is server-rendered, but its Diary page is a stub — a \"Cape News\" heading and a Fastnet exhibition, no dates. So Cape Clear currently has no machine-readable diary. Options, in order: the ferry company's site, which is server-rendered and has reason to list what is on; the island co-op; or accepting that the island needs a browser."
  - sourceId: "notices/explore-west-cork"
    fetch:
      ok: true
      url: "https://explorewestcork.ie/festivals-events"
      status: 200
    events: []
    notes: "Reachable and clearly a festivals-and-events page, but not read closely this run — the budget went on the two anchor sources. Left for the next harvest rather than recorded as empty."
