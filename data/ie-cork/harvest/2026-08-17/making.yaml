        raw: "**Fix Your Bike Session with Cork Community Bikes** — Saturdays,

          14:00–17:00. Venue: Cork Community Bikes. Organiser: Cork Community

          Bikes. Category: CRNI Member Event.


          \"We are open for a public session every Saturday afternoon 2-5pm, when

          you can bring your bike to our workshop. We are all volunteers and are

          on hand to guide you, and our focus is on helping you to fix your own

          bike. You don't need any experience to come along, just be willing to

          try.\"\n"
        summary: "The national reuse network's calendar carries Cork's weekly DIY bike workshop week by week — Saturday afternoons in Blackpool, volunteers on hand, tools and second-hand parts to use, five euro an hour towards costs. Listed here out to August 2028."
        description: "We are open for a public session every Saturday afternoon 2-5pm, when

          you can bring your bike to our workshop. We are all volunteers and are

          on hand to guide you, and our focus is on helping you to fix your own

          bike. You don't need any experience to come along, just be willing to

          try. In the workshop, we have a good range of tools, new and

          second-hand parts for you to use. We have set prices for parts, and we

          ask for 5 Euro per hour donation to cover the costs of running the

          workshop and buying tools.


          We have limited spaces for users to work on their bikes, so please be

          aware we can get busy. There are limited spaces indoors and more spaces

          outside, so weather can affect what we can offer. There is no shade or

          shelter in the car park. In case we don't have space indoors, please

          bring whatever you need to be comfortable outdoors.\n"
        confidence: "high"
    notes: "Took the `api` route and added `search=Cork`, which is a cheaper filter than paging the whole national calendar — 104 matches over 3 pages instead of 471 events over 10. All three pages were read.

      **Every one of those 104 matches is the same event.** Cork Community Bikes' Saturday Fix Your Bike session, expanded by The Events Calendar into one entry per week from 22 August 2026 through to 12 August 2028. Folded back into a single `recurring` event as the catalogue hint instructs, rather than recorded as 104 rows. Nothing else in the Cork slice — no Cork repair café, no Men's Shed, nothing from any other Cork member organisation. The rest of the calendar is Limerick and Dublin and was discarded.

      This overlaps deliberately with the observation for making/cork-community-bikes, which records the same session from the workshop's own page. Both are kept because both sources really do list it and the fold should not depend on either one surviving, but a curator may want to drop one at compile time — they will surface as two cards. What CRNI adds that the venue's own page does not is the forward horizon (the session is scheduled two years out) and confirmation that it is still running week to week.

      `search=Cork` is worth recording as a hint on this entry: it turns a ten-page crawl into a three-page one and makes the \"city field is often blank\" problem irrelevant, since it matches the venue name too."
