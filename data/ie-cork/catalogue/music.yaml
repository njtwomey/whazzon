schema: whazzon.catalogue/1
category: music
label: Music
description: >-
  Concert halls, songwriter rooms, converted churches, club and warehouse spaces, the docklands marquee season, the conservatoire, and the promoters and gig guides that carry what no single venue publishes. Cork's largest category.
sources:
  - id: music/cyprus-avenue
    name: Cyprus Avenue
    category: music
    kind: venue
    status: provisional
    url: https://www.cyprusavenue.ie/gigs
    homepage: https://www.cyprusavenue.ie/
    area: City Centre
    address:
      street: Caroline Street
      city: Cork
      postcode: T12 PY8A
      lat: 51.898586
      lon: -8.46987
    tags: [ independent, mid-size, indie, touring ]
    cadence: weekly
    hints: |
      Cork's main independent mid-size room, and the one most touring indie acts
      play. The listings path is /gigs with no trailing segment — /whats-on/
      returns the site chrome with no gigs in it.
      One box office covers three rooms in the same complex: Cyprus Avenue
      itself, the 80-capacity Winthrop Avenue upstairs (opened 2019, for newer
      acts) and the Old Oak next door. Listings name the room, so read it off
      each entry rather than assuming Cyprus Avenue.
      Dates run about five months out with a few entries into 2027. Rendered as
      a static table of date, act, doors time and price, with no pagination.
    notes: |
      Verified 2026-08-17: /gigs is headed "CYPRUS AVENUE", gives "Caroline
      Street, Cork Ireland, T12 PY8A" matching the address below, and lists
      dated gigs from 20 Aug 2026 (The Wailers, Babyshambles 22 Aug, Boyce
      Avenue 2 Sep). The catalogued homepage returns only header and footer to a
      fetcher, which is why /gigs and not the root.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/coughlans
    name: Coughlan's
    category: music
    kind: venue
    status: provisional
    url: https://www.coughlans.ie/whats-on/
    area: Douglas Street
    address:
      street: 7 Douglas Street
      city: Cork
      lat: 51.892517
      lon: -8.468401
    tags: [ independent, grassroots, folk, acoustic, pub ]
    cadence: weekly
    hints: |
      The city's best-loved songwriter room, on the Douglas Street side. Very
      high volume — something on most nights, often two or three on a Saturday.
      Three strands share the one list and only one of them is this category:
      live music, the "Comedy Cavern" stand-up nights, and Monday trad sessions.
      Prefix the listing title to tell them apart.
      The Monday trad session is weekly and unticketed — state it as a recurring
      occurrence rather than minting one event per Monday.
      Coughlan's also runs its own festival in late September, tagged #CLMF26 in
      titles, and occasionally promotes into The Everyman on MacCurtain Street —
      set the venue on those rather than filing them here.
      Titles carry "SOLD OUT" inline; that is decoration, not part of the name.
      The host 403s some fetchers but answers a browser user-agent.
    notes: |
      Verified 2026-08-17: /whats-on/ returns 403 to a plain fetcher and 200 to
      a browser user-agent. The page is titled "Coughlan's Bar & Live Music
      Venue, Cork, Ireland" and lists a dense dated programme from 17 Aug 2026
      (Trad Session 17 Aug, Son Of Crazy Chester 22 Aug, Paul Tiernan 27 Aug)
      through late October, including Cork Jazz Festival dates. /feed/ is not a
      feed — it serves the site's catch-all HTML — so no feed route is proposed.
      Address is from the corkgigs.com venue profile, not read off the venue's
      own page.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/live-at-st-lukes
    name: Live at St Luke's
    category: music
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://www.corkgigs.com/venue/live-at-st-lukes
        note: third-party listings page; the venue's own domain does not resolve
      - role: booking
        url: https://www.eventbrite.ie/o/the-good-room-34032697875
        note: promoter's Eventbrite, covering St Luke's and the Savoy together
    area: Victorian Quarter
    address:
      street: Summerhill North
      city: Cork
      postcode: T23 XE29
      lat: 51.902734
      lon: -8.461135
    tags: [ independent, historic, acoustic, classical, folk ]
    cadence: weekly
    hints: |
      A deconsecrated church up the hill on the north side, prized for its
      acoustic and used for seated, listening-room shows — songwriters, chamber
      and choral work. Run by the promoter The Good Room, which also programmes
      the Savoy, so the same Eventbrite carries both: read the venue off each
      listing rather than assuming St Luke's.
      Do not follow liveatstlukes.com. It is the venue's real address and is
      still printed everywhere, but it is currently unreachable — see notes.
    notes: |
      Verified 2026-08-17, and this one needs an owner's decision.
      liveatstlukes.com is registered and its nameservers answer, but the
      authoritative A record is 127.0.0.1 with a 3600s TTL — confirmed
      identically via 8.8.8.8 and 1.1.1.1, so this is the real published record
      and not a local resolver artefact. Every connection is therefore refused,
      from anywhere. The venue is emphatically not closed: the corkgigs profile
      is headed "Live At St. Luke's", gives "Summerhill North, Cork", and shows
      forthcoming gigs, and the corkgigs diary listed The Tallest Man On Earth
      at Live At St. Luke's on 27 Aug 2026. The Eircode T23 XE29 below is read
      off the venue record in The Good Room's Eventbrite page. Worth someone
      telling the venue their DNS is broken.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/triskel-christchurch
    name: Triskel Christchurch
    category: music
    kind: venue
    status: provisional
    url: https://triskelartscentre.ie/live-music/
    homepage: https://triskelartscentre.ie/
    area: City Centre
    address:
      street: Tobin Street
      city: Cork
      lat: 51.897742
      lon: -8.475668
    tags: [ independent, classical, jazz, historic, concert-hall ]
    cadence: weekly
    hints: |
      A former church inside the Triskel Arts Centre complex on Tobin Street,
      and the city's main room for chamber music, early music and serious jazz.
      /live-music/ is the music-scoped view; /whats-on/ is the same hub widened
      to include cinema, visual art and talks. Prefer /live-music/ here so the
      film and gallery programme does not arrive in this category.
      Much of the programme is stated as a named series running over months —
      Spotlight Chamber Music, Autumn String Quartet Series, Triskel Lunchtime
      Jazz, ECM Cork — so expect series pages alongside single concerts.
      Gulpd is Triskel's own bar and small venue on the same site; gulpd.com
      resolves but serves an empty page, so anything at Gulpd should be looked
      for here rather than on its own domain.
    notes: |
      Verified 2026-08-17: /live-music/ is titled "Live Music – Triskel Arts
      Centre" and /whats-on/ carries dated entries in the served HTML, both as
      day-and-month ("22 Aug", "29 Sep") and as ISO dates, linking to
      /events/<slug>/ pages (Aurelian Ensemble, ConTempo Quartet, Bill
      Laurance). /wp-json/tribe/events/v1/events 404s and /feed/ returns a 500,
      so no api or feed route is proposed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: music/crane-lane-theatre
    name: Crane Lane Theatre
    category: music
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://www.cranelanetheatre.ie/event/
        note: grid is loaded by AJAX — nothing dated in the served HTML
      - role: feed
        url: https://www.cranelanetheatre.ie/event/feed/
        note: one item per event with title, link and body text; pubDate is the publication date, not the event date
    area: City Centre
    address:
      street: Phoenix Street / Pembroke Street
      city: Cork
    tags: [ independent, club, historic, free, nightly ]
    cadence: weekly
    hints: |
      A 1920s former gentlemen's club off Oliver Plunkett Street, now part
      country pub, part ballroom, part cabaret room. Music almost every night
      and much of it free. Two rooms are listed separately — Crane Lane Theatre
      and Cantys — plus a Crystal Bar DJ slot that appears in listing titles in
      brackets.
      Take the dates from the RSS feed or from Cork Heritage Pubs rather than
      /event/: the listings grid is an AJAX widget whose empty state reads
      "Sorry, No events are scheduled at this time", and the served HTML for
      /event/ contains no event links and no dates at all. The feed gives
      titles and body copy but each event's actual date lives on its own page.
      Part of the Cork Heritage Pubs group, whose /whats-on/ page carries the
      same gigs with dates and times already attached.
    notes: |
      Verified 2026-08-17: root is titled "Home - Crane Lane Theatre", the
      corkgigs profile gives "Phoenix St / Pembroke St, Cork" matching the
      address below, and /event/ is titled "Events Archive - Crane Lane
      Theatre". /events/ redirects to /live-music which is itself a 404, and
      /gigs/ and /listings/ are 404s, so /event/ is the real path.
      /wp-json/wp/v2/event 404s. /event/feed/ is a genuine events RSS feed —
      first item "The Guilteens and Sir Marmalade" with a full description.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

