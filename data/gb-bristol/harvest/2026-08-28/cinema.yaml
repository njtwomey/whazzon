    notes: "Both walls in the catalogued hint are still there — the Queue-It redirect is passable with a cookie jar, but behind it the body is JavaScript-only and, as the hint says, showtimes are not in the HTML at all. Harvested in a real browser instead. The page's own showtimes come from a Vista OCAPI endpoint at vwc.odeon.co.uk (site id 315 is ODEON Luxe Bristol), which needs a JWT the page holds and returns 401 to anything else; that is a discovery for stage 1 to weigh up, not a catalogue edit made here. The date picker runs to 23 February 2027; this harvest swept 28 August to 31 October. **The multiplex rule applied:** eight screens, dozens of showings a day, and none of the routine programme is recorded. What is here is the strands ODEON labels — ODEON Kids, Event Cinema, Autism Friendly, Open Captioned, subtitled and foreign-language screenings, anniversary re-releases and ODEON Pride Nights. Everything so labelled on 29, 30 and 31 August is here in full. **Truncated:** the horizon stops at 31 October 2026; whatever is on sale from November to February 2027 was not swept. Two things worth a human's eye. First, **the whole Monday 31 August programme carries a \"Saver\" pricing attribute** — but so do Monday 7 September, Monday 14 September and Monday 12 October, so it is ODEON's standing Monday pricing and not bank holiday pricing; no event is tagged bank-holiday on the strength of it. Second, \"Audio Described\" and \"Watchword\" are set on most showings as film-level capability flags rather than marking a particular screening, so they are not treated as special here — only Open Captioned and the subtitled/foreign-language attributes are. Prices are not recorded per row: the page prints a per-film \"Adult price from\" that ranges £7.95 to £12.95 and is not tied to a screening. A standing offer runs to 1 September — \"Enjoy more family cinema trips with a little ticket tax break on our child and family tickets from 25 June to 01 September\" — and a One Night Only competition closes 30 August. Catalogue note, unchanged from the last run: this site is ODEON Luxe Bristol in Cabot Circus, so `area: City Centre` and the plain `ODEON Bristol` name are still stale. Links are relative and resolved against https://www.odeon.co.uk."
