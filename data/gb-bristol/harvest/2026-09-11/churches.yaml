    notes: "Second harvest, and the picture from 28 August holds: both catalogued routes answer 200 (968 KB and 1 MB) and neither prints a forward diary to a fetcher. /whats-on is a Duda page whose only content is the Tockify widget (data-tockify-calendar=\"STMARYREDCLIFFEEVENTS\") and the line \"Join us for a concert, film screening or talk\"; /music is the same historical page as before, news tiles dated 2020–2024. `fetch.url` is therefore the Tockify public API again, which returned the whole forward diary (17 rows, 8 distinct events) in one fetch to a browser user-agent. **The `api` route handover stands**: https://tockify.com/api/ngevent?calname=stmaryredcliffeevents&startms=<ms>&endms=<ms>&max=200 belongs in the catalogue.


      Two things this run adds to that handover. First, every event has a real page at https://tockify.com/stmaryredcliffeevents/detail/<uid>/<tid>, built from the `eid.uid` and `eid.tid` the API returns; one was fetched in full (200, with a JSON-LD Event block confirming the title, date and an image URL) and the other seven were checked with a request each and all answered 200, so `url` is now set on every diary row. Second, the API's `imageSets[].ownerId` plus `imageIdNg` give a resolvable image at https://d3flpus5evl89n.cloudfront.net/<ownerId>/<imageIdNg>/scaled_1024.jpg; each was HEAD-checked and seven of eight answer 200 (FAUST's returns 403, so that row has no image). Five page fetches — /whats-on, /music, the API, one detail page, the Chatterton page — plus fourteen HEAD/status checks on the CDN and detail URLs; one over budget, as last time, and spent for the same reason.


      The API caps `description.text` at 400 characters, so every `raw` ends where the diary's own text does, marked with an ellipsis; a second call with `noDetail=false` returned the same truncation. No `description` is set anywhere because no event page's full text was readable: the detail pages are client-rendered and carry only the same 400 characters in their JSON-LD.


      New since 28 August: \"Lunchtime at Redcliffe: Autumn Season\", ten Thursday 13:00 dates from 17 September to 19 November, recorded as one `recurring` row with the dates in `timesText` rather than ten singles. It settles the question the last run left open — the free Thursday recitals are running — so the standing \"free Thursday organ recital\" row from /music is re-recorded with the same title and pattern (unchanged on the page today) and its confidence raised from low to high; the two rows describe the same series, one as the standing claim and one as this season's dates, and a human may prefer to retire the generic one. The Chatterton exhibition page was re-fetched and is unchanged. The seven concert rows are unchanged in date and time.


      Still no service pattern recorded: /music says \"three sung Sunday services each week\" without times, and /worship1af9a00d was not fetched. The nav still links \"LUNCHTIME AT REDCLIFFE: FREE RECITALS\" to the malformed path /stmaryredcliffe.co.uk/recitals. No mail for this source; it has no `mail:` binding in the catalogue."
