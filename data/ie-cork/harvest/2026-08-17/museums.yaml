        url: "https://www.spikeislandcork.ie/spike-island-literary-festival-2026/"
        image: "https://b3081985.assetcdn.net/3081985/wp-content/uploads/2026/07/2026-SILF-Days-SocialMedia_33.png?lossy=2&strip=1&webp=1"
