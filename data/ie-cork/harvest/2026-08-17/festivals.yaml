    notes: "Three fetches — ?q=cork and pages 2 and 3 — and this is the one source in the category that is live right now: Heritage Week runs 15-23 August 2026 and today is the 17th, so most of what follows is happening this week. **Declared truncation, and it is substantial**: the site reports 364 events nationally, the ?q=cork query paginates twelve to a page, and I read three pages, i.e. 36 entries out of an unknown Cork total that runs to at least page 4. Of those 36, nineteen are in Cork City; eighteen are recorded here and the nineteenth, Cork Heritage Open Day, is recorded under its own catalogue source instead of being duplicated. The other seventeen are Cork County — Skibbereen, Cobh, Ahakista, Castletownshend, Charleville, Drimoleague, Monkstown, Fermoy, Glandore, Youghal, Ballydehob and West Cork generally — and are dropped, as the hint requires. A further page would yield more city events and a fourth fetch was the budget's limit. One query artefact worth knowing: ?q=cork matches on substrings, so page 3 returned \"Living in Corkagh House & Demesne\", which is at the Clondalkin Round Tower Visitor Centre in South Dublin; it is excluded. Six of the eighteen recorded events have already happened (15 and 16 August) and carry their real past dates so the pipeline retires them rather than being mis-recorded as undated. The listings print no weekday and no year on the cards, but the page's own header states the week as \"15th–23rd August 2026\" and every date falls inside it, which is a stronger check than a weekday, so these are high confidence. Admission is not stated on any card — Heritage Week events are generally free but the index does not say so, so `price` is omitted throughout rather than assumed. Several are at venues catalogued elsewhere (Cork Public Museum, Cork City Library, St Anne's Shandon, St Fin Barre's Cathedral, City Hall), so `venue.name` is used here and a future run should resolve them to `venue.sourceId`. Note the last two slugs carry a **-2 suffix** that no slugifier would produce from the title, and one slug diverges from its title entirely (/screening-of-corks-heritage-on-film for \"Screening of Cork Heritage Videos\"); all links are taken verbatim. One image URL was dropped: the Undercover Cork's Kilmainham card's image path contains an unencoded apostrophe and the CDN returns 403 for it, and guessing an encoding would be inventing a URL."
