    notes: "33 events across two pages of /whatson/ (page 2 at https://arnolfini.org.uk/whatson/page/2/; there is no page 3). Every row's href was taken verbatim from the card markup rather than derived from the title — the odd suffixes are real (/whatson/latinasinbristol-2/, /whatson/womenscraftclub-3/, /whatson/communityworkshopactivity-2/, /whatson/1947-workingtheatre/, /whatson/adultportraitdrawing/ for \"Portrait Club\", /whatson/adultlifedrawing/ for \"Life Drawing\"). All 33 rows carry a link and all 33 are recorded with one.

      Bank holiday: nothing on the site ties anything to the August bank holiday. \"Bank holiday\" appears nowhere on either listings page. No one-off event is dated 29, 30 or 31 August; what is live across the weekend is the standing exhibition programme plus the final session of Life Drawing Fundamentals on Saturday 29 August.

      Opening hours: /plan-your-visit/ is a hub of links, not the hours — the hours live at /visiting-information/, which states \"Galleries are open Tuesday to Sunday, 11am to 6pm\" and prints no bank holiday variation. The only special-hours block on that page is a stale festive one (Sat 21 Dec – Thu 2 Jan) left over from a previous year. Whether the galleries open on Monday 31 August is therefore not stated anywhere on the site, and has not been inferred here. That page also still carries a Covid-19 social distancing notice and says the Café Bar is \"closed for now… getting ready for summer\", both of which read as long out of date.

      The index is thin — category, date line and title only, no excerpt — but the programme is 33 events, so §3's walk-the-whole-programme rule does not apply. Four event pages were opened, spent on this weekend per the run brief: the two headline exhibitions, Besides the Sea and Life Drawing Fundamentals. Those four carry a `description`; the other 29 do not, and none has been invented. No start times are printed on the index, so the single-date rows carry no `startTime`.

      Every row prints an explicit year, so no year was inferred and no weekday check was needed."
