  - id: making/maker-shed
    name: Maker Shed
    category: making
    kind: venue
    status: provisional
    url: https://themakershed.co.uk/courses/
    homepage: https://themakershed.co.uk/
    tags: [ makerspace, workshops, diy, unverified ]
    cadence: monthly
    hints: |
      Woodworking and furniture-making school, not an open-access makerspace:
      output is multi-week courses and the occasional one-day class (sharpening
      day), plus Rent-A-Bench.

      The /courses/ index lists the courses but carries no dates — each course
      has its own page, and the same course exists at two slugs (/<slug>/ and
      /courses/<slug>/) for weekend and weekday variants, so follow the links
      rather than assuming one page per course. Start dates are stated in prose
      on those pages, several terms ahead, and some carry stale copy from the
      previous year alongside the live dates: take the year from the text and
      ignore anything already past. Fully booked courses run waiting lists and
      some dates are held back for email enquiry, so a course with no bookable
      date is still running. Record each course as recurring with its session
      pattern, not as one event per session.
    notes: >-
      Identified 2026-08-17, and it is real: The Makershed, St Paul's Learning Centre, 94 Grosvenor Road, St Pauls BS2 8XJ — a wood workshop running woodwork courses at levels 1–3. Not the hackspace and not a Men's Shed; the previous URL pointing at Bristol Hackspace was a stand-in and is now corrected. Active: course start dates of 14 Jul, 8 Sep and 3 Nov 2026 are published. Catalogued name "Maker Shed" should probably be "The Makershed", and the `unverified` tag no longer applies — both left for the owner.
    addedAt: "2026-08-16"

  - id: making/mens-sheds-bristol
    name: Men's Sheds — Bristol area
    category: making
    kind: aggregator
    status: provisional
    url: https://menssheds.org.uk/find-a-shed/
    tags: [ woodwork, community, wellbeing, diy, free ]
    cadence: quarterly
    hints: |
      National directory of community workshops — filter to the Bristol area.
      Individual sheds rarely have their own listings, so this directory is the
      only practical route to them.

      Fetching /find-a-shed/ is pointless: it is a wp-google-maps widget and the
      HTML renders "No results found in this location" until a postcode is typed
      in. The whole directory is available as JSON instead, at
      https://menssheds.org.uk/wp-json/wpgmza/v1/markers — 1,098 sheds, of which
      16 match Bristol or a BS postcode (Patchway, Filton, Warmley, Downend,
      Lawrence Weston, Long Ashton, Thornbury, Yate, Keynsham and others; some
      BS-postcode ones are North Somerset or Bath, so check before claiming them
      for Bristol). It is ~900 KB, so filter on the `address` field. Opening
      hours are prose inside `description` ("open Tuesday to Thursday 9am–1pm")
      — a recurring pattern, never a dated event. /sheds/ is prose about sheds
      generally and names none.
    notes: >-
      Verified 2026-08-17: this is the UK Men's Sheds Association shed finder, right page for a human but unusable to a fetcher. Kept the URL as the human front door and recorded the JSON endpoint that actually carries the data in hints.
    addedAt: "2026-08-16"
