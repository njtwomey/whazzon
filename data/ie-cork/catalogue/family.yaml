      Verified 2026-08-17: fotawildlife.ie is live and the news blog carries dated 2026 posts (rhino calf 11 Aug, sea eagle chick 30 Jul). Address read off the park's own /pages/contact-us. Sits 11.3km from the configured centre by great-circle distance, so it is inside the 12km radius despite the Carrigtwohill postal address — and it is the family attraction Cork residents name first, so it belongs here on merit as well as geography.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

