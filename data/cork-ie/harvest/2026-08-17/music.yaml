    notes: "/whats-on/ is correct and the hint is accurate in every detail: 21 dated rows from 19 Aug 2026 to 31 Jan 2027, each naming its room, with door time and price alongside. Rows are `?e=<id>&rand=<random>` links; the `rand` is a per-load cache-buster and `?e=<id>` alone resolves, so the shorter stable form is recorded.

      The room naming is exactly as the hint predicts — \"The Pavillion\" with the double L for ticketed shows, \"Intermission Bar\" for the free late DJ strand — except that one row (Dr Herringbone Dread, 29 Aug) spells it \"The Pavilion\" with one L. Room names are kept in `raw`; `venue` is not set, since these are all in this building.

      The seven Wednesday \"Panic At The Disco\" rows are folded into one recurring event as the hint instructs, giving 15 events from 21 rows. Nothing is truncated.

      **Read this alongside the music/cork-heritage-pubs observation.** The group's aggregator page lists four Pavillion shows this page contradicts, and the contradiction is at the level of the event id, not the date: id 11197974 is \"The Blue Mist 2026 In Cork\" here and \"'Who's That Girl' — Eurythmics Experience\" there; id 11197975 is \"The Amy Winehouse Experience\" here and \"'Crest Of A Wave' — Rory Gallagher Tribute\" there. This page also does not list a Eurythmics show or a Rory Gallagher tribute at all. Both versions are recorded, both at reduced confidence, and a human needs to ring the venue.

      Prices look fee-inclusive rather than door prices (€9.55, €29.93, €25.11, €17.07), and three rows read \"From €X\", recorded as a minimum with no maximum."
