          final note. Don't miss the opportunity to hear one of the Southwest's

          finest brass bands deliver a rich, evocative sonic experience live.


          Date & Time: Saturday 29th August, 7pm - 9pm.


          Ticket Information: Free Entry.


          Event address: The Barrel Store, 2-8 York Street, St Werburghs,

          BS2 9XT.\n"
