    notes: "The /all-events/ hub is exactly as catalogued: it names nine programmes — Cork Rebel Run, Cork Bike Week, the Annual Cork Walking Celebration, Cork Rebel Ramble, Cork Rebel Swim, Cork Parkruns, European Week of Sport, Supported Community Events and Cork SportsAbility Month — and dates none of them. Three child pages were opened; `fetch.url` is the one that yielded events. **Cork Rebel Run** is dated and detailed: Sunday 18 October 2026 at MTU Bishopstown, with genuinely separate races — 5k off at 9.30am from the bottom tier of the carpark at €15, 10k off at 9.45am from the third tier at €20 — so it is recorded as two events, which also resolves the time discrepancy on the Cork Athletics listing of the same day. **Cork SportsAbility Month is stale and the weekday check catches it**: the page announces \"the inaugural Cork Sportsability month will take place this September\" with events on \"Sunday 4th September\", \"Saturday 10th September\" and \"Saturday 17th September\", but in 2026 those dates are a Friday, a Thursday and a Thursday — they are 2022 weekdays, and the page elsewhere refers to \"SportsFest 2024\". Nothing was recorded from it, and a year must not be inferred onto those rows. **European Week of Sport** gives no 2026 dates either, only \"takes place in September each year\", but it does carry a \"Sport/Club Directory\" listing clubs with standing weekly session times and venues — Cork Lacrosse (Sundays noon–2pm, Tramore Valley Park), Na Laochra Aeracha, Munster's first LGBTI+ inclusive GAA club (Wednesdays 6.30pm at Glen River Park, Sundays 10.30am at Tramore Valley Park), Cork Hellhounds RFC (Sunday mornings 11am–1pm at Mahon Rugby Grounds, Tuesdays 7pm at Tramore Valley Park in spring/summer, Friday nights at Sundays Well RFC in autumn/winter), plus free-to-borrow outdoor table tennis and petanque at Tramore Valley Park. These are free, drop-in and genuinely city-centre, but the directory is headed \"SportsFest 2024\" and is a club listing rather than an event listing, so none of it was recorded as events. It is probably stage 1 material — several of those clubs would make good catalogue sources in their own right. The site's tribe REST endpoint was not re-tested; the catalogue already established it is empty."
