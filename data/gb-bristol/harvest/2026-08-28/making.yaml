    notes: "Nothing on the bank holiday weekend, but the September intake is published and bookable, which is the other thing this run was after. The hint about the shape of this site is exactly right and worth keeping: /courses/ is a picture menu with no dates, each course page is a hub listing time-slot options in prose, and the dates live one level deeper again on the option pages. That took eleven fetches in total (the index, six course and scheme pages, four option pages), which is inside the §3 dozen for a programme this small, and it is the only way to get a date out of this source. What came back: Woodwork for Beginners Level 1 on Tuesday evenings starts 8 September (£325, eight consecutive evenings); the Level 1 weekends course runs 3, 4, 10 and 11 October (£325); Thursday and Friday daytime mixed-level classes are bookable individually at £60 a day from 10 September to 30 October; and Tool Sharpening Day runs again on 28 October. Three courses — Level 2 Cabinet, Level 2 Lidded Box and Level 3 — publish class times but no start dates at all, so they are recorded as undated rather than given an invented one; the hint's point that a course with no bookable date is still running applies to them. Stale copy confirmed as the hint predicts: the Tuesday evenings page still offers 14th July 2026 in its start-date list, and the Level 2 Lidded Box weekends course offers only 15, 16, 22 and 23 August 2026, all now past, so that course is not recorded. A future Tuesday evening start of 3 November 2026 is named in prose but explicitly not yet released for booking. Two other things: the Tool Sharpening Day page prices itself at £75.00 at the top and \"COURSE FEE: £65.00\" in its own description, and the checkout figure is what is recorded; and Rent-A-Bench (£100 a month, open to people who have finished levels 1-3) is a membership scheme with no dates, so it is not recorded as an event. Finally, a route discovery for stage 1 that turns out to be a dead end: the site runs The Events Calendar and advertises /calendar/?ical=1 and /wp-json/tribe/events/v1/, but the ICS URL returns a WordPress login page rather than a feed, so it is no use as an `ics` route."
