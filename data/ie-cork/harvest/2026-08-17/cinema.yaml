      url: "https://cinematimes.com/ie/cork/"
      status: 200
    events: []
    notes: "Reached, working and full of listings — and nothing it lists is additive, so the empty `events` here is a deliberate zero, not a failure. The page is titled \"Cork Cinema Showtimes Today · Mon 17 Aug\" and reads \"23 films are showing across 6 cinemas near Cork today\" and \"545 screenings near Cork\". Every cinema it names inside the radius is already a catalogued source and was harvested today: Arc Cinema Cork 0.2 km (9 films tonight), The Reel Picture Blackpool 1.8 km (9), Omniplex Cork-Mahon Point 5.8 km (17), The Reel Picture Ballincollig 7.8 km (7). The remaining two are outside it: The Gate Midleton 20.4 km (14) and The Gate Mallow 28.9 km. Recording its rows under this sourceId would put a second card on the site for every screening those four venues already reported, which is worse than recording none. Three corrections for the catalogue. (1) It does **not** list Triskel Arts Centre or Cork Cine Club today — the independents are absent, contrary to the hint, and its directory link now reads \"All 13 cinemas in Cork\" rather than the 18-within-80 km the hint implies. (2) The Blackpool double-count is gone: one entry only, at /ie/cork/cinemas/the-reel-picture-cork-city/. (3) The naming lag is confirmed and reaches Cork itself — the Arc's own city-centre slug is /ie/cork/cinemas/the-arc-cinema-the-gate-cork/, and Midleton and Mallow are still printed as \"The Gate\". Where it earns its place is unchanged and is worth a hint: it carries per-showtime booking deep links straight to each venue's own ticketing host, so if a venue fetch fails on a future run this page can stand in for it."
