      Green Gig just announced: This Is The Kit


      Sat 30 Jan 2027


      Beacon Hall


      This Is The Kit comes to Bristol Beacon for an evening of intimate, richly textured folk music, as part of our Green Gig <https://bristolbeacon-mail.org/c/AQjCkQ4QgIV6GI7W59YBIKertiQo_OvsFLWbUKZtrmEzuqq7A3Pn5u9kN5IIbYU01-MJzP9p6Yr0> series.


      Led by songwriter Kate Stables, the band’s thoughtful songs and warm arrangements invite you to listen closely. With Rozi Plain on bass, Jamie Whitby-Coles on drums and Neil Smith on guitar, expect a live set that shifts between tenderness and intensity.


      Alongside the music, the show will put greener ways of working in live music into practice, from production and catering to encouraging more sustainable ways for audiences to travel.


