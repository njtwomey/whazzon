schema: whazzon.catalogue/1
category: textiles
label: Textiles & Fibre
description: >-
  Wool, knitting, weaving, spinning, dyeing, felting, stitch — and flax and linen,
  which West Cork grew and processed until the industry collapsed two centuries
  ago and is now reviving.

  This is the anchor category and the thinnest one, which is the finding rather
  than a gap. Fibre in West Cork is organised by people, not by venues: a network,
  a heritage society, a handful of makers, and a Facebook page each. Almost none
  of it has a listings page, so most of what belongs here will be caught by
  `notices` and only later attributed back to whoever ran it.

  Both anchor events sit here. The Clonakilty flax day is Dúchas Clonakilty
  Heritage's, and it does have a site. The Cape Clear knitting weekend has no
  standing home at all and has to be caught through the island's own page or the
  local papers.
