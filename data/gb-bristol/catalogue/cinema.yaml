    url: https://www.showcasecinemas.co.uk/cinema-listing/BCC/bristol-cabot-circus
    area: Broadmead
    tags: [ multiplex, commercial, mainstream ]
    cadence: daily
    hints: |
      Closed — kept so it is not re-proposed. The building is now
      cinema/odeon-bristol; that is the entry to harvest.
    notes: >-
      Verified closed 2026-08-17: the catalogued page is a 404, and Showcase's own /cinemas/ index lists only one Bristol site — Bristol Avonmeads, "Avonmeads, St Philips Causeway, BS2 0SP" — with no Cabot Circus entry anywhere on the domain. Reporting confirms the last film screened 30 November 2023 after lease terms could not be agreed; the auditoriums reopened as ODEON Luxe Bristol on 12 February 2026. Retiring this entry against cinema/odeon-bristol is a curation call, not a URL fix.
    addedAt: "2026-08-16"

  - id: cinema/vue-cribbs-causeway
    name: Vue Bristol — Cribbs Causeway
    category: cinema
    kind: venue
    status: provisional
    url: https://www.myvue.com/cinema/bristol-cribbs-causeway/whats-on
    homepage: https://www.myvue.com/cinema/bristol-cribbs-causeway
    area: Cribbs Causeway
    tags: [ multiplex, commercial, mainstream, out-of-town ]
    cadence: daily
    hints: |
      The URL is right but the showings are loaded client-side: a plain fetch
      returns the venue description plus "there's currently no showings that
      match your request", which is the empty state and not the truth. Expect no
      dated events without a browser. The schedule is refreshed every Tuesday
      and runs Friday to the following Thursday, so harvest after a Tuesday.
      Big Screen Events (concerts, sport, opera, theatre) are the part worth
      capturing rather than every showing of every blockbuster.
    notes: >-
      On the northern edge of the city, at the limit of the configured radius. Verified 2026-08-17: page reads "Vue Bristol Cribbs Causeway", "12 screens - including an EPIC screen", "opposite Cribbs Causeway", reachable from junction 17 of the M5 — identity and area confirmed, URL unchanged.
    addedAt: "2026-08-16"
    address:
      lat: 51.523285
      lon: -2.604659

  - id: cinema/odeon-bristol
    name: ODEON Bristol
    category: cinema
    kind: venue
    status: provisional
    url: https://www.odeon.co.uk/cinemas/bristol/
    homepage: https://www.odeon.co.uk/
    area: City Centre
    tags: [ multiplex, commercial, mainstream ]
    cadence: daily
    hints: |
      Two walls, both passable. The host sits behind a Queue-It "safetynet" that
      302s to a `?queueittoken=…` URL, so a fetch without cookies loops and
      returns an empty body; `curl -sL -c jar -b jar` with a browser user-agent
      gets through on the second hop. Behind that the body is JavaScript-only
      ("You need to use JavaScript to access this web page"), but the venue
      record is in an embedded JSON payload — that is where the address and the
      IMAX flag came from. Showtimes are fetched from an API and are *not* in the
      HTML at all, so do not expect dated screenings from this route. Do not
      confuse it with /cinemas/bristol-union-street/, the closed predecessor,
      which still resolves.
    notes: >-
      Verified 2026-08-17: this URL is live and is ODEON Luxe Bristol — embedded payload gives "Cabot Circus, Broadmead, Bristol, BS1 3BX", isImax true, and the copy reads "ODEON Luxe Bristol is conveniently located in the Cabot Circus Shopping Centre". It opened 12 February 2026 in the former Showcase Cinema de Lux auditoriums; the old Union Street ODEON closed 11 February 2026 after 88 years and survives only as an announcement page. So `area: City Centre` and probably `name` are stale — left for a curator, as is whether cinema/showcase-cabot-circus is retired against this entry.
    addedAt: "2026-08-16"
    address:
      lat: 51.456687
      lon: -2.591528

  - id: cinema/bristol-film-festival
    name: Bristol Film Festival
    category: cinema
    kind: festival
    status: provisional
    url: https://bristolfilmfestival.com/
    tags: [ festival, site-specific, seasonal ]
    cadence: monthly
    hints: |
      Programmes screenings in unusual locations — caves, ships, chapels —
      rather than a fixed venue. Runs in bursts through the year, so the site
