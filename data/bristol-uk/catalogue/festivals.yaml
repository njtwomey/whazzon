  - id: festivals/bristol-open-doors
    name: Bristol Open Doors
    category: festivals
    kind: festival
    status: dormant
    url: https://bristolopendoors.org.uk/
    tags: [free, heritage, autumn, architecture, citywide]
    cadence: quarterly
    hints: |
      Free access to buildings normally closed to the public, one weekend each
      September. Listings appear late and slots book out immediately. Dormant since
      2023, so expect nothing until an edition is announced — Bristol's buildings
      currently open under the national Heritage Open Days scheme instead (11-20
      September 2026), which this catalogue does not cover.
    notes: >-
      Checked 2026-08-17: no live 2026 or 2027 page exists. The site still fronts
      "13 - 15 October 2023" and its /?page_id=250 what's-on lists those 2023 slots;
      the about page reads "2023 marks 30 years of Bristol Open Doors. This
      anniversary year will be our next festival as we move to a biennial format".
      No 2025 edition followed, and the predecessor site bristoldoorsopenday.org.uk
      is frozen on September 2018. Dormant rather than closed: the site is up and
      states no closure.
    addedAt: "2026-08-16"

  - id: festivals/winter-lanterns
    name: Bedminster Winter Lanterns
    category: festivals
    kind: festival
    status: provisional
    url: https://www.lanternparade.org/
    area: Bedminster
    tags: [winter, family, outdoor, ticketed, light]
    cadence: quarterly
    hints: |
      An announcement page rather than a listing: the next parade is a Saturday in
      January 2027, still undated and "subject to funding", so `undated` with a note
      is the honest record until a date appears. Lantern-making workshops are
      advertised through the preceding autumn, so dated items should show from about
      October.
    notes: >-
      Verified 2026-08-17: the catalogued winterlanterns.co.uk does not resolve at
      all (connection fails outright). The live site is lanternparade.org, headed
      "Bedminster Winter Lantern Parade – returning 2027" and describing itself as the
      biggest creative community event in South Bristol (BS3). The event's own name is
      "Bedminster Winter Lantern Parade", longer than the catalogued name.
    addedAt: "2026-08-16"

  - id: festivals/downs-festival
    name: The Downs Bristol
    category: festivals
    kind: festival
    status: closed
    url: https://www.thedownsbristol.com/
    area: The Downs
    tags: [music, summer, outdoor, ticketed]
    cadence: quarterly
    notes: >-
      Checked 2026-08-17: the domain has lapsed. It JS-redirects to /lander, a GoDaddy
      parking page (window._trfd pushes ap:"parking", assets from
      img1.wsimg.com/parking-lander) with no content of its own — which is why the
      harvest saw an empty body. No successor site for the festival exists; the Downs
      as a site is now used by Forwards (festivals/forwards) and Feast On Bristol.
      Closed rather than dormant: lapsed domain, no successor.
    addedAt: "2026-08-16"

