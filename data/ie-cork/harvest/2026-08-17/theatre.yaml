    notes: "Both the catalogued /performing-arts/ feed and its narrower /d/ireland--cork/theatre/ sibling were read; each answers 200 and each reports the same 1,583 events over 49 pages, so this is a very large aggregator taken deliberately partially — **8 events recorded from page one of each feed, out of 1,583; pages 2 onward were not fetched.** The rows are not scraped from the HTML but read out of the `window.__SERVER_DATA__` blob the page ships, which gives each event's own URL, start and end datetimes in Europe/Dublin, venue name and full address with Eircode, and a one-line summary — worth a hint for stage 1. The catalogue's warning about signal-to-noise is exactly right: page one of /performing-arts/ is mostly Glucksman art camps and gallery tours, painting and puppet-making workshops, an art-therapy class and a Sunday art class, none of which are performances. /theatre/ is much the cleaner filter and most of what is recorded comes from it. The catalogue's other warning is also confirmed: **every Cork city row is tagged neighbourhood \"Blackpool\"**, including City Hall, the Kino and The Roundy, so that label was ignored entirely — where the venue is itself catalogued (Kino Events House, Cork City Hall) the event carries `venue.sourceId` alone and the catalogue supplies the area; where it is not, `venue.name` and the printed address are recorded and no area is guessed. Comedy-club rows (The Roundy, City Limits) and gig rows (Cyprus Avenue, Crane Lane) were left to the comedy and music categories. Rows outside the radius were skipped: The Glen Theatre in Banteer (4), the Verdant Troupe's promenade tours at Doneraile and Annesgrove (2), The Field at Ballymaloe Grainstore, and The Rime of the Ancient Mariner at My Place Community Centre in Midleton on 22 Aug — that last is the same John O'Mahony production Cork Arts Theatre stages on 5 Sep, recorded there. Mamma Mia at the Radisson Blu is kept but is out at Little Island (T45), which a human may judge too far. Every row here happens somewhere other than the source, so all eight carry an explicit `venue`. Secret Magic Show and Circus Extreme appear on both this feed and Pure Cork; Secret Magic Show is recorded here, where the row resolves cleanly to the catalogued Kino Events House, and Circus Extreme under pure-cork-theatre, which prints all thirteen performance times and the showground's Eircode. Neither is recorded twice. No price data is exposed on either index, so `price` is omitted throughout rather than guessed."
