        raw: "**Bristol Harbour Festival — 17-19 July 2026.**


          \"This year, we're bringing a reimagined footprint to Bristol that puts the

          water right back at the heart of the celebration. Stretching along the

          harbourside from Thekla to Underfall Yard, the festival's refreshed layout

          turns Bristol's iconic waterfront into a living stage - packed with

          back-to-back entertainment, dockside moments and maritime magic.\"


          \"Bringing the best of Bristol's emerging artists as well as established and

          international performers across all genres, expect three days of

          back-to-back entertainment alongside some proper maritime magic with our

          on-the-water programme. More announcements to come soon!\"


          Underfall Yard is the official Charity Partner for 2026, \"celebrating the

          place that has kept Bristol's Floating Harbour alive for more than 200

          years\". The Harbour Festival Wayfinder is billed as \"your ultimate

          interactive guide\", with a Harbour Treasure Hunt collecting digital stamps

          at ten festival locations.


          Programme at a glance is published by stage, with lineups viewable by day.\n"
        summary: "Bristol's three-day harbourside festival, whose 2026 footprint stretched from Thekla to Underfall Yard across 23 stages and on-the-water venues, with music, circus, theatre, talks and boat parades. This edition is over and no 2027 dates have been announced."
        confidence: "high"
    notes: "The re-pointed www URL works: /whats-on/programme-at-a-glance returned 200 and, contrary to the hint, has not emptied between editions — it still serves the complete 17-19 July 2026 programme, about 318 slot rows across 23 stages and on-the-water venues (Amphitheatre, Thekla, Bristol Rising, Red Bull Beach Hut, Tidal Stage, Cumberland Basin, Prince Street Bridge Water Arena, Baltic Wharf, The Matthew, Underfall Yard, Expression Stage, Fringe, three Spike Island venues and more). Those rows are labelled by weekday and clock time only (\"Friday 19:30-20:15 Sam And The Womp\") with no calendar dates, no per-act links and no per-act images, and the edition finished a month ago, so they are deliberately not expanded into events — that would be 318 finished rows built on a weekday-to-date join. The edition dates come from the homepage hero (\"Bristol Harbour Festival / 17-19 / July / 2026\"), which was the second fetch; it now leads with a post-event survey (\"DID YOU HAVE A BLAST AT THIS YEARS BRISTOL HARBOUR FESTIVAL?\") and carries no 2027 dates, so the hint that the homepage banner is where the next dates appear holds but there is nothing there yet. For the reviewer: yesterday's run recorded this festival as `undated` because the dates had not been read; today's row is the same festival with the dates the site prints, so the two will not fold together and the older undated row will carry indefinitely. Lower down the homepage there is also stale 2024 copy (\"We're back between Friday 19th - Sunday 21st July 2024\") and the footer still reads \"©Bristol Harbour Festival 2024\"; neither was treated as current."
