      SPONSORED | From the creators of Yippee Ki Yay, laugh-out-loud parody Top Gunchained comes to Bristol! This uplifting comedy brings you a jet-powered tour through all the romance and action of Tom Cruise’s aerial blockbuster. Essential viewing for Top Gun veterans and rookies alike. “An aerodynamic comic verse blast” ★ ★ ★ ★ (Daily Telegraph).


      Bristol Old Vic, BS1 4ED


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=c80b6991a4


