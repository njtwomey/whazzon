    notes: "Harvested the ICS feed named in the hints rather than /diary/, which renders a Google

      Calendar iframe and shows a fetcher no dates at all. `fetch.url` is therefore the feed, not

      the catalogued page — the catalogue entry is not wrong, the diary is the human view of this

      same calendar.


      The feed is \"BCyC Public Events\" and holds 882 VEVENTs going back to 2015, so almost all of

      it is history. After discarding every rule whose UNTIL has passed or whose COUNT is spent,

      two standing meetings remain, plus exactly one dated one-off ahead. Both meetings are

      recorded as `recurring`, not expanded month by month.


      The committee meeting's rule is FREQ=MONTHLY;COUNT=10;BYDAY=2TU from 10 February 2026, so

      its tenth and final occurrence is 10 November 2026 — that end date is arithmetic on the

      rule, not a guess, and it means the series lapses in November unless the calendar is

      extended. Space4Cycling carries no UNTIL and is open-ended. Neither gives a location; the

      feed's older copies of the Space4Cycling entry included a Zoom registration link, so these

      may well be online, but the current entries do not say and nothing was assumed.


      The Kidical Mass ride is the one exception to the meetings: `DTSTART 20260919T100000Z`,

      UTC-stamped where the meetings use floating local time, which is 11:00 local on a Saturday

      in BST. It happens in Queen Square rather than anywhere belonging to the campaign, so it

      carries `venue`. Its own site is kidicalmassbristol.co.uk, which is a separate organiser and

      not fetched.


      This confirms the hints: the diary is thin and the 2026 social ride dates are still absent

      from the feed, so a run that finds two meetings and one ride has found everything there is."
