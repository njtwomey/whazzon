    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/cape-clear-island
    name: Cape Clear Island / Oileán Chléire
    category: notices
    kind: aggregator
    status: provisional
    url: https://www.cleire.ie/
    area: Cape Clear
    tags: [island, gaeltacht, community, knitting]
    cadence: monthly
    hints: |
      **The Shetland knitting weekend was here**, and it is the reason this entry
      exists. A visiting tutor's weekend on the island is announced here or nowhere.
      **Rendering it settled the question, and the answer is worse than a broken
      fetch: there is nothing there.** Loaded in headless Chrome the site renders
      fully — and it is a one-page site: a welcome in Irish, a map, a newsletter
      box and the co-op's contact details. No events section, no news, no diary,
      and the only internal link is `/pages/map`.
      So the knitting weekend was never here to be missed. It will have been on
      social media, or on the tutor's own site, or in the ferry company's listings.
      Keep this source at a low cadence as the island's front door, and look for the
      event elsewhere.
    notes: >-
      Verified 2026-08-20: 200, and the page is the island's own — but JS-only.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"
