      SPONSORED | Grab your magnifying glass and get your ‘finger of suspicion’ at the ready! Bristol favourites Degrees of Error are back, ready to present an Agatha Christie inspired masterpiece like no other – using audience suggestions to create an extremely comical murder mystery on-the-spot. “Hilarious… the show is a riot” ★ ★ ★ ★ ★ (Scottish Daily Mail).


      Bristol Old Vic, BS1 4ED


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=f4958c78b3


      September 25 & 26: FUTURES: A festival of Discovery <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=715a844172>


      SPONSORED | FUTURES is a FREE festival bringing research to life across Bristol and Bath this autumn. Meet researchers, get hands-on with experiments and activities, and explore ideas shaping our future, from climate and technology to health, creativity and artificial intelligence.


      Various venues


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=7c1b00cc58


      September 30: Jazz Sabbath <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=3eb54f61e3>


      SPONSORED | What happens when Black Sabbath gets a jazz makeover? Jazz Sabbath have the answer. Led by 2026 Grammy Award winner Adam Wakeman (of Black Sabbath), the trio take metal classics and completely rework them into swinging, instrumental jazz. With three Billboard-charting albums and millions of streams behind them, their playful reinvention of Sabbath is seriously groovy.


      Lantern Hall, BS1 5AR


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=7d2d97b5c0


