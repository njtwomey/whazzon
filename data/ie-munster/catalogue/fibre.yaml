  - id: fibre/tipperary-museum
    name: Tipperary Museum of Hidden History, Clonmel
    category: fibre
    kind: venue
    status: provisional
    url: https://www.tipperarycoco.ie/museum-faqs/upcoming-events
    homepage: https://www.tipperarycoco.ie/museum-faqs
    area: Clonmel
    tags: [weaving, knitting, felting, workshop, tipperary]
    cadence: monthly
    hints: |
      The one venue in Munster that ran three fibre workshops in a single week —
      weaving, knitting and felt-making, all with Leisa Grey, during Heritage Week
      2026. If a fibre day happens in Tipperary, it is likely to be here.
      The museum lives inside the county council's site, and its diary is a page
      buried under `/museum-faqs/`, which is exactly where nobody would look. Most
      of what is on it is family workshops at €3; take the textile ones.
      Also worth watching for the same tutor at the Thomas MacDonagh Museum in
      Cloughjordan, which ran hand weaving on traditional looms the same week and
      has no site of its own.
    notes: >-
      Verified 2026-08-20: 200. Found by working back from the Heritage Week sweep
      to the organisers who had appeared more than once.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: fibre/common-knowledge
    name: The Common Knowledge Centre, Kilfenora
    category: fibre
    kind: venue
    status: provisional
    url: https://www.ourcommonknowledge.org/full-listings
    homepage: https://www.ourcommonknowledge.org/
    area: Kilfenora
    tags: [workshop, course, traditional-craft, clare, basketry, mending]
    cadence: monthly
    hints: |
      A social enterprise on fifty acres in the Burren, teaching what it calls lost
      skills: basket weaving, mending, natural building, growing. It also runs
      REKINDLE, a festival of lost skills in Lisdoonvarna, which surfaced in the
      Heritage Week sweep.
      Not purely fibre — take the textile and basketry strands and leave the stone
      walling and the fermentation. Courses are dated and bookable, which makes
      this one of the few sources here with a real diary.
    notes: >-
      Verified 2026-08-20: 200 at /full-listings.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

