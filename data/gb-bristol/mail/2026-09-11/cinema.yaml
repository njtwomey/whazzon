    body: "Did someone say £4 cinema tickets?


      View email in your browser <https://mailchi.mp/75273427fa4c/weekly-newsletter-fri-4-thu-10-sept>


      WEEKLY NEWSLETTER: FRI 4 - THU 10 SEPT


      £4 CINEMA TICKETS ALL WEEKEND? ABSOLUTE CINEMA!


      Join us on Sat 5 and Sun 6 Sept 2026, when cinemas across the UK will come together for National Cinema Weekend.


      Hi everyone,


      September has barely had time to settle in and already we’ve got a very good excuse to head to the cinema: National Cinema Weekend <https://us.list-manage.com/UszbE53bdAH?c2id=944927b628e367996f6a53da7340e920&m=ZXk13StE6pm1b5YuNYiwvVx6Qj08ZJ23EUrWbwl9nDnGWF4Hqn_UBr0KCm3D> is coming to Watershed, with every ticket just £4 all weekend! And whether you’re in the mood for aliens, apples or anime, we’ve got something for you.


      New in our cinemas this Friday are three very different films: The Incomer <https://us.list-manage.com/kJztcdOJ9FH?c2id=944927b628e367996f6a53da7340e920&m=LgBcOPryCj2ir_Lrrwuj94tr4t6CrVvTIrXuWbcHHC17qL3mPka24_8iyD3E>, Louis Paxton’s warm, surreal debut about two oddball siblings whose remote Scottish island life is upended by a nervous council official; Leviticus <https://us.list-manage.com/1AUKJGv0sQ4?c2id=944927b628e367996f6a53da7340e920&m=kGidorlrYoYjOecH6EoOGDZUyLluCLw86gzTEYSn2w5lulC1xZQnxv2nkXHn>, Adrian Chiarella’s chilling queer horror about forbidden teenage love and a supernatural force that knows exactly where to find its victims; and Super Nature <https://us.list-manage.com/vpGGQMondqf?c2id=944927b628e367996f6a53da7340e920&m=k6rOr3MnO1CAIMJ9aWSwHDYyBSkx9PRZ_3id7HCjT-Wtt1_Ii7H0R2XQncad>, Ed Sayer’s beautiful, beguiling journey across 25 countries, filmed entirely on Super 8 and exploring our connection to the natural world.


      Then Sunday brings a double dose of special screenings. Our brand-new Sleepover Season <https://us.list-manage.com/iDTSiqzBM8l?c2id=944927b628e367996f6a53da7340e920&m=KApy9LtrAdiladJwtV5i4qAgWi0m9lYIIdifxPgpEiSagcK6NkFFuVOLfsrP> kicks off with Attack the Block <https://us.list-manage.com/SHysMcaY5N0?c2id=944927b628e367996f6a53da7340e920&m=7s4SlOxgS7mPMXPkqp6Ayi9leEnYx4_YELfVGu5tbhgipyLhRd2IOlLuxGCm>, introduced by guest co-curator Reba Martin and starring a very young John Boyega. Later that day, there’s a preview of Bad Apples <https://us.list-manage.com/leeqqQ6vy3K?c2id=944927b628e367996f6a53da7340e920&m=OETjBF7cQm5USSbzLn4cnAmCDCHlDmg8g0zhUc2NQy0vdX0yt4QUQehuaDlM>, starring four-time Oscar® nominee Saoirse Ronan as a primary school teacher whose attempts to deal with one particularly chaotic pupil take a very unexpected turn. Filmed at The Bottle Yard Studios <https://us.list-manage.com/n68ayTm7qeV?c2id=944927b628e367996f6a53da7340e920&m=QWMpV0KEuxlMJ9r4sJ9UvlYJJxYvoVJhCk3k29yPmWoBxxv3N-AiRJz6BGaW> and on location in the South West, this special preview screening will be introduced by local actors Amy Mason and Alice Lamb, who both appear in the film.


      And did we mention £4 tickets? For National Cinema Weekend, Sat 5 – Sun 6 Sept, every ticket at Watershed is just £4 – any ticket type, any film, any time. That means you can catch all of the above, plus Teenage Sex and Death at Camp Miasma <https://us.list-manage.com/KTJV4XlS4FX?c2id=944927b628e367996f6a53da7340e920&m=8YL74o_vV36S4xWFOcYFIpB-mdUw9wz22m2ZRqqCUn50NUm5iBadLnD2tIpd>, Bitter Christmas <https://us.list-manage.com/UKjAw4QDQyE?c2id=944927b628e367996f6a53da7340e920&m=vAxyDdRIB9L6FPpETQgq3vf3i4riAz2Gq3PdXfN0HuwWyH45Tg0yawaACPM6>, I Want Your Sex <https://us.list-manage.com/_ZdYxwar6ey?c2id=944927b628e367996f6a53da7340e920&m=2ClA9DDbIEMfUTN0rn9ECcyW0dnaj73DxsbSs9ounw9ivob-4Mozp7EDfuAG>, Tony <https://us.list-manage.com/MNzXn0SNI36?c2id=944927b628e367996f6a53da7340e920&m=RA2UOUDyb_DiGhhgTCJsaueKdVeXk14uOGkrAflr2nvgX8b_4AozS450ESqF> and Kiki’s Delivery Service <https://us.list-manage.com/MaHt6ctAsP8?c2id=944927b628e367996f6a53da7340e920&m=2IpwQ-x-cK94DG4HFv0M7Y5F2v-X4LAhHMTPxnR_wiZ1N41VFX3rqplXrtea> for the price of a coffee!


      Speaking of celebrating cinema, Ali Plumb is bringing his much-loved Untitled Film Quiz Project <https://us.list-manage.com/UlYK5kWVOCm?c2id=944927b628e367996f6a53da7340e920&m=Njr2r-6daVKBp8vqerbBCeo26oKAoLelldP1gI75SSwJTWQUe3dduNLob46u> to Watershed this Sat 5 Sept. The self-proclaimed “movie bloke off the internet with the interviews, specs and beard” is bringing his delightfully nerdy quiz to an actual cinema, complete with big-screen rounds, silly questions, spot prizes and enough film trivia to make you either very smug or spectacularly humbled.


      Read on for everything else coming up this week – including the return of First Friday <https://us.list-manage.com/SW5i_mUpyaD?c2id=944927b628e367996f6a53da7340e920&m=fz84z8dq8N6Ox_m2A7RHim0cIq3UzjxHKkvPzxP_z21WrGzfs8VxerRgzs9-> after its August hiatus, plus the launch of Timothy X Atack’s debut novel Father Alberto and the Flying Girl <https://us.list-manage.com/P0s9G_DTefK?c2id=944927b628e367996f6a53da7340e920&m=3sy7xWRoPyJ2rW94szQq9WTtEMV35EwcEt-HYt2L4zg-fBd_wd4L4lVMU2eL>.


      With love,

      Team Watershed x


      FIRST FRIDAY


      Fri 4 Sept 17:00


      First Friday is a monthly social and showcasing event open to anyone. It takes place in the Pervasive Media Studio.


      Read more <https://us.list-manage.com/11qjIfHDvLh?c2id=944927b628e367996f6a53da7340e920&m=lRHAb5OLZ8yFnGc3PdL4kF1U942reLVQ3tXsYZLuwsbEL2RwLaAK6lJ_Twz7>


      LUNCHTIME TALK: PLEASURE, LEGACY AND DISCRIMINATION


      Fri 4 Sept 13:00


      In this Lunchtime Talk, Writer, Director and Access Consultant Jane Gauntlett discusses her most recent work, Legacy, and her experience dealing with burn-out and discrimination - and how her journey’s led her to build her new company, Tech, Paper, Scissors.


      Lunchtime Talks <https://us.list-manage.com/Tvdq9EbMFHz?c2id=944927b628e367996f6a53da7340e920&m=mLVPg6QiiDK073hvQF0HxvXroAMpODpL-wGpApo_69SYLjfkipy_XrgNZnx8> are a series of informal presentations at Watershed’s Pervasive Media Studio <https://us.list-manage.com/p051BYfYUB_?c2id=944927b628e367996f6a53da7340e920&m=h2B1s994YmF-rd_A10KweGHtuQGg_2dq-10kU6cyDAVcPVXTHJy-IjdJDeTw>. They take place at 13:00 on a Friday and are free and open to everyone.


      Read more <https://us.list-manage.com/rP4v8hUB6fR?c2id=944927b628e367996f6a53da7340e920&m=EdBvP4hnk6_aDBlU7xkiOquTjXGLoQfCQHBx5QcyO9Ce6Cv_wi0qpv-jZayG>   Buy tickets <https://us.list-manage.com/UBtC3oJVzyH?c2id=944927b628e367996f6a53da7340e920&m=Dli2IkTI5hJSc2lMyTvZD5pzvdI4QlQSWxLWlYaq5lDp3rBaqaL97sqENHH8>


      LEVITICUS 15


      Dir: Adrian Chiarella, Australia, English, 2026, 1hr 28mins

      Fri 4 Sept for at least one week


      Move over Heartstopper... this haunting debut has some teeth to it! A chilling sensation in queer horror from director Adrian Chiarella, Leviticus follows two lovestruck teenage boys who face off against supernatural evil in the wake of harrowing 'deliverance healing'.


      \ * All screenings until Thu 10 Sept feature Audio Description.

      \ * The Tue 8 Sept 20:30 screening features Descriptive Subtitles.


      Read more <https://us.list-manage.com/z3K0EzsbZBn?c2id=944927b628e367996f6a53da7340e920&m=fTH_DkiEoQq62asBvTkXDqpcdSJU4TUNk1jlkPnSjs2tgIMav3dBpA3L9Foo>   Buy tickets <https://us.list-manage.com/Q9E5da2thiO?c2id=944927b628e367996f6a53da7340e920&m=wXzax42_kCi7LtJkV6zSecErd3UGb48e2qPBrx-kxiFrba_8FslX2Rg18Tqz>


      SUPER NATURE PG (PS)


      Dir: Ed Sayers, UK, English, Dutch, 2025, 1hr 22mins

      Fri 4 Sept for at least one week


      A love letter to nature filmed exclusively on Super 8, Super Nature proposes a new way of seeing. A celebration of all we have and reflecting on all we have to lose, this global co-creation project journeys across 25 different countries, creating a visceral, poetic and personal meditation on the natural world.


      WATERSHED RECOMMENDS

      \"The director describes watching Super 8 footage as almost like having your memories water-coloured for you. I couldn't agree more. Super 8 gives such a depth to the footage and you get to see nature like you haven't experienced it before.\"

      Gavin Sunderland, Environment Group Coordinator


      \ * The Sat 5 Sept 14:40 and Wed 9 Sept 20:40 screenings feature Descriptive Subtitles.

      \ * The Wed 9 Sept 11:00 screening is a Cinébabies Screening <https://us.list-manage.com/LeXRzHMzOnT?c2id=944927b628e367996f6a53da7340e920&m=yd5vnVx3OkaG3nl_02UTNOpNYjxxrgFTiuG9CWhquhcUpXQ4UGptX923urPJ>.


      Read more <https://us.list-manage.com/dsVV_xRHtPC?c2id=944927b628e367996f6a53da7340e920&m=SBpdEIacm1HAL8MHo63IQzdh8wKUOIXhu0efhAzco1yx-bL5MCsf9UzbBTGC>   Buy tickets <https://us.list-manage.com/oO8qeOPLZyL?c2id=944927b628e367996f6a53da7340e920&m=U8log1LYui5FMgdMudxQfMk-4l0wXjgkAPaf5isKNRWCYOlpulfi9FbMXaZH>


      THE INCOMER 12A


      Dir: Louis Paxton, Ireland, English, 2026, 1hr 42mins

      Fri 4 Sept for at least one week


      Writer-director Louis Paxton's debut feature sees a nervy council official attempt to evict two siblings who have never had any human contact from their outside world.


      \ * All screenings until Thu 10 Sept feature Audio Description.

      \ * The Fri 4 Sept 11:00 screening is an Elevenses Screening <https://us.list-manage.com/Du6K32NQ23x?c2id=944927b628e367996f6a53da7340e920&m=XaDxzNFReGDDXPpVOiYiH0oh0Zx6ytIOKBYdOZtsp0vYpcrTvPVkNQarcUE9> and features Descriptive Subtitles.

      \ * The Sun 6 Sept 11:20 screening is a Relaxed Screening <https://us.list-manage.com/VEL6TYW66Ul?c2id=944927b628e367996f6a53da7340e920&m=1t33Yyx6D2gq8GwfDw2-XisPNzQemwpszp_iSXeNlT8vViyKueNtkIx9m7pJ> and features Descriptive Subtitles.

      \ * The Mon 7 Sept 17:50 screening features Descriptive Subtitles.


      Read more <https://us.list-manage.com/13hKjT2UQ0f?c2id=944927b628e367996f6a53da7340e920&m=pzghttnwmZcgI-4e9PnV9P3YiSinX9_r1qj5u-ZNvDAh6oPIvSkQWnYXFq7Z>   Buy tickets <https://us.list-manage.com/akMJLjKHCPz?c2id=944927b628e367996f6a53da7340e920&m=7iqkkPTqn28r8eYRuLXL3l2GlYSr3SG3Sh3NV8zuId3qhJk88TZUK604Gsr6>


      ALI PLUMB'S UNTITLED FILM QUIZ PROJECT: A BRAND NEW MOVIE QUIZ


      Sat 5 Sept 19:30


      Ali Plumb – that movie bloke off the internet with the interviews and the specs and the beard – is taking his delightfully nerdy film quiz on the road again… and you should definitely come.


      Read more <https://us.list-manage.com/17MAebhEgQD?c2id=944927b628e367996f6a53da7340e920&m=Wy68XGzzVY-noxbiyjPZNR-WipX_JBcD-7HfB-ixnopfLs3tdOBtnOC4YQOu>   Buy tickets <https://us.list-manage.com/B3jvtNz2bPq?c2id=944927b628e367996f6a53da7340e920&m=JMZ-8XpTCOzR-yXw0bmcDHL9E_RFYzvr47qV-39X0NNBGB8pyx-MACysYHdr>


      PREVIEW: BAD APPLES 15


      Dir: Jonathan Etzler, UK, English, 2025, 1hr 41mins

      Sun 6 Sept 16:00


      A struggling primary school teacher begins to make some questionable decisions after one of her students is injured.


      \ * Introduced by local comedian and actor Amy Mason and actor Alice Lamb, who both appear in the film.

      \ * This screening features Audio Description.

      \ * Bad Apples <https://us.list-manage.com/TiChYcvrWY3?c2id=944927b628e367996f6a53da7340e920&m=7pvQiEAQJ40MlY02miTH6pWTFu-xM9NResceUg9QJf2uZmitcstms0dQD5VB> then opens Fri 18 Sept.


      Read more <https://us.list-manage.com/I4fZkAucmOO?c2id=944927b628e367996f6a53da7340e920&m=JipplkB1y0geaYAY5ocxg0OgnXChl3HWwSs7epUEkg-3Dshy-Onu4v1-Tg9w>   Buy tickets <https://us.list-manage.com/GCrIaRDcMV2?c2id=944927b628e367996f6a53da7340e920&m=lfFwHu7_lkPF5ngx0R_3R-1OCE5fnH1Lr8XmWQqVQy71njwuDwAH5nBsxsv3>


      ATTACK THE BLOCK 15


      Dir: Joe Cornish, UK, English, 2011, 1hr 28mins

      Sun 6 Sept 14:00


      What's a good sleepover without a bit of a scare? And what's a good fright without a good laugh? Attack the Block brings British-humoured slapstick adventure to a South London housing block, where endlessly hostile encounters are never quite what they seem.


      \ * Introduced by season guest co-curator Reba Martin.


