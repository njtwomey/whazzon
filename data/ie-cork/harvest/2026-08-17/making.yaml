    notes: "The safety net earned its place. Read three index pages — /crafts/ pages 1 and 2 and the /craft-workshop/ slice — parsing the `window.__SERVER_DATA__` block rather than the rendered cards, which gives ISO dates, times, venue with Eircode, image and the organiser's own one-line summary in a single fetch each. That is worth a hint: no date-resolution guesswork was needed, so every row here is `confidence: high` on its date.

      **Truncation, with numbers.** The index reports 1,583 results over 49 pages; I read 3 pages (about 55 rows after de-duplication) and recorded 20. Left behind on the pages I did read: singing circles and pop-up choirs, a taekwondo fundraiser quiz, a tattoo convention, a trading-card show, wine and paint nights, two summer art camps, a Sunday art class, a hairdressing course and an interior-decorating talk — none of them making. Food-making workshops (a pasta class, a cocktail and canapé class, a food-preservation workshop) were also left, on the assumption that food-drink catalogues them.

      **The catalogue hint about /craft-workshop/ is out of date.** It is described as \"a second, differently-populated slice\"; today it returned the same 1,582-result set and largely the same first page as /crafts/, adding only two rows. Worth correcting.

      **Four findings that belong to other catalogue entries.** Cork Printmakers sells four dated weekend courses here that its own site does not publish (bookbinding, etching, stone lithography, photopolymer). Benchspace, whose own domain is behind a captcha, has a workshop here on 3 September with an Eircode that confirms its corrected address. Greywood Arts hosts three August Craft Month workshops that never reached the Cork Craft & Design collection, and is not catalogued at all. Cork Community Art Link's two August Craft Month puppet sessions are here and nowhere on its own site. Where the venue is catalogued, `venue.sourceId` is set so compile can join it.

      **Two duplications, deliberate.** \"Build Your Own Ceramic House\" is also recorded under making/society-of-cork-potters, which is where it was found first; both sources list it and both records are kept.

      **Radius.** Six of the twenty are outside the config's `radiusKm: 12` — Killeagh (~35 km, three rows), Midleton (~22 km, two rows), Whitechurch (~10 km), Mallow (~35 km), Shanagarry (~35 km) and Darrara near Clonakilty (~50 km). They are recorded rather than dropped, with the distances flagged here, because a radius policy is a curator's call and this category's catalogue already reaches into East Cork.

      **One listing has a wrong time.** \"Lampshade workshop all materials are included\" is listed 06:30–20:30 on 3 September; the same organiser's Mallow workshop runs 18:30–20:30, so 06:30 is almost certainly a typo for 18:30. No `startTime` is set on it and `timesText` records what was printed.

      No `description` is written for any event here — the index rows were read but no event page was opened, and the summaries are the organisers' own one-liners as returned by the index."
