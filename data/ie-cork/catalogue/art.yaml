  - id: art/lavit-gallery
    name: Lavit Gallery
    category: art
    kind: venue
    status: provisional
    url: https://lavitgallery.com/upcoming-exhibitions/
    homepage: https://lavitgallery.com/
    area: City Centre
    tags: [ gallery, independent, exhibitions ]
    cadence: monthly
    hints: |
      **Bot-walled, not gone.** The host runs SiteGround's challenge: the
      homepage answers 403 with a generic "403 - Forbidden" illustration page,
      and inner paths answer 202 with a meta-refresh to
      `/.well-known/sgcaptcha/?r=…`. A plain fetcher of any user-agent gets
      nothing readable, so this needs something that executes the challenge.
      When it cannot be read, the Munster–Cork listing at
      art/visual-artists-ireland-cork carries Lavit's dates instead — that is
      where "Summer 2026, 16 Jul – 29 Aug 2026" came from.
      Programmes about ten exhibitions a year, including a show by Cork
      Printmakers or Backwater Artists Group in alternate years.
    notes: >-
      Trading name of Cork Arts Society, founded 1963 — the two names are one organisation, so there is deliberately no separate Cork Arts Society entry. Checked 2026-08-17: not verified by reading the page, because the captcha wall blocks it; the path is taken from the site's own indexed "Upcoming Exhibitions" page title and its programme is independently confirmed by the Visual Artists Ireland Cork listing. `verifiedAt` is deliberately unset. `address` omitted: third-party sources place the gallery at Wandesford Quay, Clarke's Bridge (it moved from Father Mathew Street) but that could not be read off the gallery's own page, and a guessed Eircode would put the map pin in the wrong place.
    addedAt: "2026-08-17"
    address:
      lat: 51.896366
      lon: -8.479383

