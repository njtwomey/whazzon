  - id: sport/parkrun-bristol
    name: parkrun — Bristol area
    category: sport
    kind: aggregator
    status: provisional
    url: https://images.parkrun.com/events.json
    homepage: https://www.parkrun.org.uk/events/events/
    tags: [running, free, weekly, 5k, community, all-abilities]
    cadence: monthly
    hints: |
      Free timed 5K runs every Saturday morning at many sites around the city —
      Ashton Court, Eastville, Little Stoke, Pomphrey Hill and others, plus
      junior 2K runs on Sundays.

      Model each location as a single `occurrence.kind: recurring` event with
      the pattern stated ("every Saturday, 9:00"), not as a new event every
      week — otherwise this one source floods the entire site. The national
      events list needs filtering to the configured radius. Cadence is monthly
      because what changes is the set of locations, not the schedule.

      The human events page is a JavaScript map. The url above is the GeoJSON
      feed behind it: ~2,960 events, each with eventname, EventLongName,
      EventLocation, seriesid (1 = Saturday 5K, 2 = Sunday junior 2K) and point
      coordinates — filter to the radius on the coordinates. For a start time
      and course description fetch https://www.parkrun.org.uk/<eventname>/,
      which is server-rendered but needs a browser user-agent.

      Bristol-area entries at time of checking: ashtoncourt, eastville,
      eastville-juniors, blaisecastle, pomphreyhill, littlestoke-juniors,
      chippingsodbury.
    notes: >-
      Verified 2026-08-17: the 403 recorded in the harvest was a bot wall. A browser user-agent gets 200 from
      parkrun.org.uk, but /events/events/ carries no event names — the list is drawn client-side from
      images.parkrun.com/events.json, which is public, needs no user-agent trick, and contains all seven
      Bristol-area events. https://www.parkrun.org.uk/ashtoncourt/ confirms "Every Saturday at 9:00am" at
      Ashton Court Estate.
    addedAt: "2026-08-16"

