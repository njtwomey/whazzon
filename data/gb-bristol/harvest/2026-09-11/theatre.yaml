        raw: "**Babbers! - New term starting September** — Mondays, 10am & 11am. Babbers has just started for another term! Ever popular, our 11am slot is very nearly sold out with just one space left! This term runs up to the end of November. You can save £3 a session if you book for the remaining term - although you can book a single drop-in session to try it out. [Book the full term here](https://us.list-manage.com/R2ViS7GYsOA?c2id=178ee8babe3db6d0c3bd9d9141602d5e)"
        summary: "acta's weekly Monday-morning Babbers sessions, bookable by the term or as a single drop-in; the 11:00 slot is nearly full."
