    notes: "Solved, and the route is worth recording as a hint. The hint's two halves both check out — the catalogued page 403s a plain fetcher and returns 200 to a browser user-agent, and nothing is in the served markup — but a headless browser is not needed. The listings are a DICE widget, and the page's own streamed payload carries its configuration in clear text, including `partnerId` 664cedfb, an `apiKey`, and `venues: [\"Rough Trade Bristol\"]`. Calling the DICE partner API with that key and venue filter returns the whole programme as clean JSON: 50 events from 17 Aug to 10 Oct 2026, already scoped to Bristol, with times, ticket types, ages, images and status. `fetch.url` is that endpoint rather than the catalogued page, since it is what I actually read; the API key goes in an x-api-key header and so is not in the URL. I recorded the soonest 25, to 12 Sep, and truncated the remaining 25. Times need care and have been converted: DICE returns UTC with a separate `timezone: Europe/London`, so every printed time here is the local wall-clock the widget shows, an hour ahead of the raw field while BST holds. Pricing is genuinely unusual and I have followed the ticket types rather than flattening them: many in-stores sell entry only as part of an LP or CD bundle, several also offer a free entry or free RSVP ticket, and where a free ticket exists I have set `price.free` true and kept the bundle ceiling in `max`. One deliberate merge: DMA'S on 31 Aug is sold as a matinee and an evening show, recorded as one event with both times in `timesText` per the several-showings rule. Big Truck on 30 Aug is cancelled — the API says so outright, it is not my inference. Beyond my cutoff, Pacific Avenue on 30 Sep appears twice, once on-sale and once off-sale and sold out, which looks like a duplicate the store has not tidied. One thing left on the table on purpose: the DICE payload includes each event's full own description, at no extra fetch, and this run was told to leave `description` off for music. A future run could populate it for this source without opening a single event page."
