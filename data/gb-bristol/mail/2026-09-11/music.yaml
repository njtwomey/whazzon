      Our new Orchestral Season is underway!


      Our 2026/27 Orchestral Season got off to a flying start last night as superstar pianist Víkingur Ólafsson gave a thrillingly virtuosic recital of his ‘Opus 109’ programme, placing Beethoven’s Piano Sonata No. 30 Op. 109 in an illuminating musical dialogue with Schubert and J.S. Bach. It was such a treat for one of the world's most celebrated classical artists to open our new season.


      Our first orchestral concert is just around the corner - Bournemouth Symphony Orchestra return to Beacon Hall on Thu 1 Oct to start their Road to Joy series, marking Beethoven's bicentenary in 2027. Spanning two seasons, the BSO will follow a chronological journey through all of Beethoven's symphonies with Principal Conductor Mark Wigglesworth.


      Book Tickets <https://bristolbeacon-mail.org/c/AQjCkQ4QgIV6GI7W59YBIMumtiQo_OvsFMbjQbqxij7hrbxZmbPQ_YuNzrwZac4-fITdTz3EDIMR>


      Alongside their performances, the BSO will host three immersive afternoons - Beethoven Now - exploring the composer’s universal relevance through discussion and debate. The first of these events is on Sun 1 Nov in Lantern Hall and includes talks and readings from John Suchet, Samuel West and Dame Evelyn Glennie.


