    notes: "Twenty cards on the first page of results, all recorded, with title, date, time, venue, image and deep link on every one. Pagination was not followed — twenty is the page's own set and the aggregator is allowed to be partial; there may be more beyond it.


      **This source is the reason the category is not just the Opera House.** Five of the twenty are in rooms no other Cork comedy source carries: The Merchant (a Beamish Room club night, 11 Sep), Paddy Mac's (Fred Cooke, 11 Sep), Winthrop Avenue @ Old Oak (Paddy McDonnell, 21 Oct), Triskel Arts Centre (Test Tube Babies, 5 Sep) and Mabel Lane (10 Sep). It also carries three Roundy shows the PROC diary does not — Sharon Mannion 24 Oct, Eric Lalor 17 Oct, \"Cork's Best Stand-Up\" 29 Aug — and one City Limits show PROC misses, Paul Crowley on 11 Sep.


      **Overlap is deliberate, not accidental.** Nine rows restate events already recorded under comedy/coco-comedy-club (the Roundy weekly slots and the Deirdre O'Kane 17 Sep sitting) or comedy/city-limits (Risteard Cooper, both Mike Rice shows, Catherine Bohart, Anne Gildea). Both sources said these things today, so both records say so; deciding which to show is compile's problem, not a witness's.


      **Eventbrite's clock is broken on the Mike Rice rows and it matters.** It prints \"Fri, Oct 2, 9:00 AM\" and \"Fri, Oct 2, 7:00 AM\" for two evening shows that City Limits' own diary times at 9:30pm and 7pm — twelve hours out, and thirty minutes out on top. Those two carry the venue's corroborated evening time in `startTime`, with Eventbrite's string verbatim in `raw`, and `confidence: medium`. Publishing a 9am stand-up gig contradicted by another source in the same run would have been the worse error.


      **Do not trust `area` from here, as the hint warns.** Every Cork row is labelled \"Blackpool\" — including Castle Street, Coburg Street, Cyprus Avenue and Triskel — so no `venue.area` is set anywhere in this observation; only `sourceId` or `name`.


      Two venue names were left as `name` rather than resolved to an id, because the catalogue holds more than one candidate and guessing would put the event in the wrong room: **Triskel Arts Centre** (catalogued three times, as music/triskel-christchurch, cinema/triskel-christchurch and art/triskel-gallery, none of them the umbrella venue Eventbrite names) and **Winthrop Avenue (@ Old Oak)** (Old Oak is catalogued twice, as music/old-oak and trad/old-oak). Both worth stage 1 resolving.


      Titles here are marketing copy, as the hint says — \"Corks Biggest and Original Comedy Club\" is appended to Paul Crowley's show name, and Mike Rice's second show carries \"Extra Show , been recorded as a Special !\". Recorded as printed rather than tidied, since the id derives from the title and trimming it here would break the match on a later run.


      Two rows print a weekday and no date — \"Saturday at 6:30 PM\" and \"Wednesday at 8:30 PM\" — which is a pattern, not a date, so they are `recurring` rather than being pinned to a guessed Saturday. Badges like \"Selling fast\", \"Almost full\", \"Sales end soon\" and \"Just added\" have no equivalent in the status enum and are kept in `raw` instead. Test Tube Babies' link is on eventbrite.**co.uk**, not .ie, and is recorded as found."
