    area: Churchfield
    address:
      street: Exchange Business Park
      locality: Churchfield
      city: Cork
      postcode: T23 XV50
      lat: 51.913589
      lon: -8.494248
    tags: [ studios, artist-led, free, contemporary ]
    cadence: monthly
    hints: |
      **The exhibitions are not at the studios.** The studios are in Churchfield;
      the shows are in two other buildings — Sample-Studios Gallery in The Lord
      Mayor's Pavilion, Fitzgerald's Park, and the TRISKEL SAMPLE Project Space
      inside Triskel Arts Centre. Set `venue` from the listing, never from this
