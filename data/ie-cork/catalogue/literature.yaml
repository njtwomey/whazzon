schema: whazzon.catalogue/1
category: literature
label: Literature & Talks
description: >-
  Cork's literature organisations and festivals, the city library service, bookshops that run launches and readings, university literary programmes, poetry and short-story nights, and public lecture societies.
sources:
  - id: literature/munster-literature-centre
    name: Munster Literature Centre
    category: literature
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://munsterlit.ie/events/
      - role: feed
        url: https://munsterlit.ie/feed/
        note: WordPress RSS; carries workshop, mentorship and fellowship announcements, which are the centre's own dated events
    homepage: https://munsterlit.ie/
    area: Douglas Street
    address:
      street: Frank O'Connor House, 84 Douglas Street
      city: Cork
      postcode: T12X802
      country: Ireland
    tags: [ independent, poetry, writers, festival, major ]
    cadence: monthly
    hints: |
      The engine of literary Cork: founded 1993, based in Frank O'Connor's
      birthplace, and the promoter behind both the Cork International Poetry
      Festival and the Cork International Short Story Festival (each catalogued
      separately, with its own site — the centre's own pages carry no festival
      dates). /events/ is two things at once: an "MLC Workshops" block (often
      "TBA") and a hand-curated noticeboard of other people's Cork literary
      events, so treat it as a cross-venue listing and set `venue.sourceId`
      where an entry matches another source. It currently names Waterstones
      Cork, the UCC School of English, Cork City Libraries, Ó Bhéal go Béal and
      the Frank O'Connor Writers' Group (Mayfield Library, 2nd Tuesday 3.30pm,
      no meetings in July or August). Recurring entries there are stated in
      words with no dates — `occurrence: recurring`. Competition deadlines are
      not events.
    notes: >-
      Verified 2026-08-17: munsterlit.ie serves 200 (www redirects to the bare domain), the footer address reads "84 Douglas Street, Cork, T12X802", and /events/ carries the noticeboard described above. No Tribe/The Events Calendar API — /wp-json/tribe/events/v1/events and ?rest_route=/tribe/events/v1/events both 404 — so the RSS feed is the only structured route. Two entries on its noticeboard are deliberately not catalogued: De Barra's Spoken Word is in Clonakilty and Lime Square Poets is an online Zoom series hosted out of Limerick, so neither is inside the 12km radius or is a Cork place-based event.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/cork-international-poetry-festival
    name: Cork International Poetry Festival
    category: literature
    kind: festival
    status: provisional
    url: https://www.corkpoetryfest.net/programme.html
    homepage: https://www.corkpoetryfest.net/
    tags: [ festival, poetry, annual, major ]
    cadence: quarterly
    hints: |
      Run by the Munster Literature Centre and directed by Patrick Cotter. Mid
      May, five days, programming into borrowed rooms rather than a venue of its
      own — Cork City Library, Cork Arts Theatre, the Farmgate Café and the
      Hayloft Bar all appear in the schedule, so set `venue` on events where the
      host is a different catalogued source. A flat hand-built HTML site: the
      whole programme is one page, /programme.html, with day headings and times
      but no year printed against each event — take the year from the festival
      dates in the heading. Quiet from June to the new year; the site keeps the
      previous edition up until the next is announced. Sister pages worth a look
      when the programme page is stale: /venues.html, /workshops.html.
    notes: >-
      Verified 2026-08-17: /programme.html is the 2026 edition, "12–16 May, 2026", with dated sessions including the Farmgate Café National Poetry Award (Tue 12 May, 6.30pm), readings at Cork City Library (Wed 13 May, 2.30pm) and the Fool for Poetry & Gregory O'Donoghue Prize readings at Cork Arts Theatre (Sat 16 May, 3pm). The edition it advertises has already run, four months before this check, so expect no events until the 2027 programme is posted — not dormant.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/cork-international-short-story-festival
    name: Cork International Short Story Festival
    category: literature
    kind: festival
    status: provisional
    url: https://corkshortstory.net/programme.html
    homepage: https://corkshortstory.net/
    tags: [ festival, annual, major ]
    cadence: quarterly
    hints: |
      The Munster Literature Centre's other festival, descended from the Frank
      O'Connor International Short Story Festival it founded in 2000. Mid
      October, four days, across Cork City Library and Cork Arts Theatre — set
      `venue` where the host is another catalogued source. Same flat HTML build
      as the poetry festival: one /programme.html with day headings and times,
      the year only in the top heading.
    notes: >-
      Verified 2026-08-17: site live and unmistakably the right festival, but /programme.html is still the 2025 edition, "15–18 october 2025" (Southword Showcase at Cork City Library Wed 15 Oct 2.30pm, Rosemary Jenkinson & Kirsty Logan Thu 16 Oct 4pm, Ó Faoláin Prize Reading at Cork Arts Theatre Sat 18 Oct 3pm). So on 2026-08-17 the 2026 edition is unannounced with roughly two months' notice left — worth a human asking the centre, and worth re-crawling weekly through September rather than quarterly.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/cork-world-book-fest
    name: Cork World Book Fest
    category: literature
    kind: festival
    status: provisional
    url: https://corkworldbookfest.com/events/
    homepage: https://corkworldbookfest.com/
    tags: [ festival, annual, free, civic, family ]
    cadence: quarterly
    hints: |
      Cork City Libraries' own festival, so a Cork City Council service rather
      than an independent promoter — largely free, and the biggest single burst
      of literary events in the city's year. Late April, six days, roughly fifty
      events centred on the City Library on Grand Parade and Triskel Arts
      Centre, plus a street market on the Grand Parade. Programme is a single
      WordPress /events/ page; the previous edition stays up between years.
      Several of its events will also appear on the Cork City Libraries calendar
      — the same event from two sources, so expect to reconcile.
    notes: >-
      Verified 2026-08-17: www redirects to the bare domain; the page states the fest "returns from Tuesday 21 – Sunday 26 April 2026" and lists roughly 50 dated events across those days, with the site itself crediting "Cork City Libraries is a service of Cork City Council". The 2026 edition has already run. No event API: /wp-json/tribe/events/v1/events redirects back to the HTML /events/ page, and /programme/ 404s. /feed/ is valid RSS but essentially empty, so it is not catalogued as a route.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/waterstones-cork
    name: Waterstones Cork
    category: literature
    kind: venue
    status: provisional
    url: https://www.waterstones.com/events/search/shop/cork
    homepage: https://www.waterstones.com/bookshops/cork
    area: City Centre
    address:
      street: 69 Saint Patrick's Street
      city: Cork
      postcode: T12C921
      country: Ireland
      lat: 51.900041
      lon: -8.470631
    tags: [ bookshop, author-events, chain ]
    cadence: weekly
    hints: |
      The only Waterstones in the Republic outside Dublin, and the default room
      for a Cork book launch — trading on St Patrick's Street since 1988.
      Cork is a single shop, so one filter covers it: /events/search/shop/cork
      on the national events search. waterstones.com returns 403 to plain
      fetches and to WebFetch; a browser user-agent gets a clean 200. Prices in
      the page chrome are sterling and the delivery banner is UK — ignore both,
      the events themselves are Cork. Individual events live at
      /events/<slug>/cork. Mostly free, unticketed launches and signings, plus
      a monthly fiction book club.
    notes: >-
      Verified 2026-08-17: fetched with a browser user-agent, the applied-filter label reads "Cork" and the page returns 6 dated events — a Gareth Hanrahan signing Sat 22 Aug 14:00, Fiction Book Club Thu 27 Aug 18:00, and Paul Howard in conversation with Mick Clifford Tue 1 Sep 18:30, among them. The shop page gives the address "Waterstones Cork, 69 Saint Patrick's Street, Cork, T12C921" and also teases a Culture Night event with Conal Creedon and Mona Lynch on Fri 18 Sep. The Munster Literature Centre independently points at this same shop filter from its own noticeboard.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/rebel-reads
    name: Rebel Reads
    category: literature
    kind: venue
    status: provisional
    url: https://www.rebelreads.ie/events/
    homepage: https://www.rebelreads.ie/
    area: The Marina
    address:
      street: Unit O2, Marina Commercial Park, Ballintemple
      city: Cork
      postcode: T12VW53
      country: Ireland
      lat: 51.89856
      lon: -8.450708
    tags: [ bookshop, independent, community, free ]
    cadence: weekly
    hints: |
      Volunteer-run secondhand and radical bookshop out in the Marina
      Commercial Park, successor to Solidarity Books on Douglas Street. Not a
      launches-and-signings programme: it lends the room free to community
      groups, so the diary is language classes, zine workshops, clothes swaps,
      film nights and the monthly Cork Anarchist Library. Mostly free or
      pay-what-you-can, and heavily recurring — prefer `occurrence: recurring`
      for the standing groups (Cork Anarchist Library, 2nd Tuesday; Rang
      Gaeilge, Mondays) over one event per instance.
    notes: >-
      Verified 2026-08-17: /events/ lists dated events through August and September 2026 (Leeside Rebel Kitchen 20 Aug, Bookshop Work Night 25 Aug, queer migrant zine collective 26 Aug, book sale 30 Aug, Clothes Swap 2 Sep, Rang Gaeilge 7 and 14 Sep, Cork Anarchist Library 8 Sep) and gives the address above. No Tribe API (/wp-json/tribe/events/v1/events 404s) and ?ical=1 just returns the HTML page again, so neither is catalogued. It is roughly 2km east of the centre, comfortably inside the radius.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/vibes-and-scribes
    name: Vibes & Scribes
    category: literature
    kind: venue
    status: provisional
    url: https://www.vibesandscribes.ie/events/tickets/
    homepage: https://www.vibesandscribes.ie/
    area: City Centre
    address:
      street: 3 Bridge Street
      city: Cork
      country: Ireland
      lat: 51.901409
      lon: -8.470039
    tags: [ bookshop, independent, workshop ]
    cadence: monthly
    hints: |
      Cork's best-known surviving independent bookseller — two shops, books on
      Lavitt's Quay and art, craft and yarn on Bridge Street. Its ticketed
      programme is not literary: /events/tickets/ is a BigCommerce product
      grid of craft classes (embroidery, knitting, crochet) held at the Bridge
      Street shop, with the day and month in the product title and no year, so
      the year has to be inferred and sold-out past classes stay on the page.
      Check the dates rather than assuming everything listed is still to come.
      The 404 page returns 200-sized HTML, so a wrong path looks like a page —
      confirm the heading, not the status code.
    notes: >-
      Verified 2026-08-17: the shop trades and the site is live, but the guessable literary paths are all wrong — /pages/events, /blogs/events, /blogs/news and even /sitemap.xml all 404 (into a large custom 404 page). The only events path linked from the site's own navigation is /events/tickets/, and everything on it is a craft workshop at "VIBES & SCRIBES, 3 BRIDGE ST" — embroidery on Saturday 28th March, two-week crochet and knitting courses — with no year given and several marked SOLD OUT, so the grid looks stale. A human decision: no readings or launches were found here, and if the craft classes are wanted at all they may belong in another category. Kept rather than dropped so the next stage 1 run does not re-propose it blind.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/o-bheal
    name: Ó Bhéal
    category: literature
    kind: organiser
    status: provisional
    url: https://www.obheal.ie/blog/
    area: City Centre
    tags: [ poetry, spoken-word, independent ]
    cadence: monthly
    hints: |
      Cork's poetry institution since 2007, and the parent of the Winter Warmer
      Poetry Festival and the annual Poetry Film Competition. Read the front
      page carefully before recording anything as upcoming: its own long-running
      reading night has ended and the live programme has passed to Ó Bhéal go
      Béal (catalogued separately), so what remains here is the festival, the
      competitions and a deep archive. Competition opening and closing dates are
      deadlines, not events. WordPress under /blog/ with a working /feed/, but
      no events plugin.
    notes: >-
      Verified 2026-08-17: obheal.ie/blog/ is live and current — it announces that the original Ó Bhéal events have concluded and that programming continues as Ó Bhéal go Béal, 2nd Monday monthly 8.30pm (poetry films 7.30pm) at the Hayloft Bar upstairs at the Long Valley, Winthrop Street. It also carries the 14th Poetry Film Competition (submissions from 1 May 2026) and notes the Five Words competition has run its final year. /blog/events/ and /blog/wp-json/tribe/events/v1/events both 404 — there is no separate listings page, so the blog front page is the listing.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/o-bheal-go-beal
    name: Ó Bhéal go Béal
    category: literature
    kind: organiser
    status: provisional
    url: https://www.instagram.com/obhealgobeal/
    homepage: https://linktr.ee/obhealgobeal
    area: City Centre
    tags: [ poetry, spoken-word, independent, free ]
    cadence: monthly
    hints: |
      The successor to Ó Bhéal's reading night and now the city's standing
      monthly poetry event: 2nd Monday of the month at the Hayloft Bar, upstairs
      at the Long Valley on Winthrop Street — 7.30pm Cork and Irish poetry
      films, 8.30pm Five Word Challenge, 9.20pm guest poet then open mic. It is
      also the current home of the Winter Warmer festival programme. It has no
      website: everything is announced on Instagram and Facebook, with a
      linktr.ee/obhealgobeal hub in between. Treat the monthly night as
      `occurrence: recurring` stated in words rather than inventing dates, and
      take the guest poet from the Munster Literature Centre noticeboard or the
      poetry festival programme when Instagram is unreadable.
    notes: >-
      Verified 2026-08-17 as an organisation but not as a fetchable listing. The venue, day and running order above are read off the Munster Literature Centre's noticeboard and off obheal.ie, both of which name it as Ó Bhéal's continuation; it also appears in the Cork International Poetry Festival 2026 programme as a Mon 11 May fringe event at the Hayloft Bar. instagram.com/obhealgobeal/ and linktr.ee/obhealgobeal both return 200 but neither yields readable listings to a fetcher — the linktree holds only Instagram, Facebook, a newsletter signup and a "Festival Programme - The Winter Warmer 2025" link. No verifiedAt, because a 200 on Instagram is not confirmation of a programme. A human may prefer to fold this into literature/o-bheal.
    addedAt: "2026-08-17"

  - id: literature/winter-warmer-poetry-festival
    name: Winter Warmer Poetry Festival
    category: literature
    kind: festival
    status: provisional
    url: https://www.obheal.ie/blog/winter-warmer-poetry-festival/
    tags: [ festival, poetry, annual, spoken-word ]
    cadence: quarterly
    hints: |
      Ó Bhéal's November weekend, running since 2013: 23-plus poets and
      performers from Ireland and seven or eight other countries, poetry films,
      dance and theatre collaborations, and open-mic sets. Multilingual, and
      city-centre rather than tied to one address. The programme has historically
      arrived as a linked PDF or image rather than HTML. Crawl this alongside
      literature/o-bheal-go-beal in September and October, when the edition is
      announced.
    notes: >-
      Verified 2026-08-17: the page is live and is the right festival, but it has not been updated past the 12th edition in 2024 — /blog/winter-warmer/ redirects into the 2013 archive, and /blog/festival/ redirects to a videos-and-reviews page. The festival itself is not dormant: the Ó Bhéal go Béal linktree carries a "Festival Programme - The Winter Warmer 2025" link, so the live programme has moved to that organisation's social channels while this page lags. Worth a human confirming which URL the 2026 edition will be published on.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/ucc-school-of-english
    name: UCC School of English & Digital Humanities
    category: literature
    kind: listing
    status: provisional
    url:
      - role: listings
        url: https://www.ucc.ie/en/english/news/
      - role: booking
        url: https://www.eventbrite.ie/o/school-of-english-digital-humanities-92204433423
        note: where the public readings actually appear; page is JavaScript-rendered and serves no event data to a fetcher
      - role: api
        url: https://www.eventbrite.ie/org/92204433423/showmore/?page_size=50&type=future&page=1
        note: JSON behind that Eventbrite page; type=past returns the back catalogue, has_next_page pages it
    homepage: https://www.ucc.ie/en/english/
    area: Western Road
    tags: [ university, student, free, talks, poetry ]
    cadence: weekly
    hints: |
      UCC's literary programme is the busiest university strand in the city:
      a public reading series that has hosted John Patrick McHugh, Clara
      Kumagai, Maureen N. McLane, Dean Browne, Rosamund Taylor, Jeff Young and
      Issa Quincy, plus symposia and journal launches, and an Arts Council
      Writer in Residence. Two halves that must both be read: readings are
      ticketed through Eventbrite and never appear on ucc.ie, while symposia,
      launches and prize news appear only on /en/english/news/ as dated items
      whose event dates sit in the body text, not the headline. Events are on
      the main campus off Western Road, not out at Bishopstown. Termly rhythm —
      dense October to April, nearly silent in summer. Filter out anything
      addressed to enrolled students (induction lectures, module briefings).
    notes: >-
      Verified 2026-08-17: /en/english/news/ is the school's own news index with dated items to 26 Jun 2026, including a "Death Rituals and Death Technologies" symposium at UCC on 28-29 May 2026 and the Double Space vol. 5 launch. /en/english/events/ and /en/englishlit/news/ both 404, which is why the news index is the listings route. The Eventbrite organiser page is real and correctly identified ("School of English & Digital Humanities", linked from the Munster Literature Centre's own noticeboard) but is entirely JavaScript-rendered — zero JSON-LD, zero startDate in the served HTML. The showmore endpoint is the same data as JSON: type=future returned an empty list on this date, and type=past returned five real readings with has_next_page true, which is how the organiser identity was confirmed rather than guessed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/cork-historical-archaeological-society
    name: Cork Historical & Archaeological Society
    category: literature
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://corkhist.ie/
      - role: feed
        url: https://corkhist.ie/feed/
        note: WordPress RSS; the programme posts arrive here first, ten items deep
    area: Western Road
    tags: [ talks, community, university, annual ]
    cadence: monthly
    hints: |
      Founded 1891 and one of the oldest local-interest societies in Ireland.
      A winter lecture series from October to April, held in rooms in the West
      Wing of University College Cork, plus a County Lecture, a Christmas
      lecture and a summer outings programme. Free-standing dated posts rather
      than a calendar: "Winter Lecture Series 2025-26", "Summer Programme 2026".
      The lecture list has arrived as a JPG of a poster more than once — read
      the linked image caption or the post body, and expect a whole season of
      dates in one post rather than one event per page. Outings are day trips
      well outside the city; keep the lectures.
    notes: >-
      Verified 2026-08-17: corkhist.ie is live and current — the homepage's own Recent News block lists Summer Programme 2026, Winter Lecture Series Update and Winter Lecture Series 2025-26, and the RSS feed dates the most recent post 28 Apr 2026. /events/ is linked from the society's own navigation but returns a genuine server 403 error document, not a bot wall, so the homepage is used as the listings page instead. Individual outings sit under /mc-events/<slug>/, and the 2025-26 lecture list is a wp-content JPG.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/cork-radical-bookfair
    name: Cork Radical Bookfair
    category: literature
    kind: festival
    status: provisional
    url: https://corkradicalbookfair.ie/
    tags: [ festival, annual, free, community, independent ]
    cadence: quarterly
    hints: |
      One-day April bookfair — radical booksellers, small presses and
      distributors, talks and workshops, free entry, followed by an evening
      social. Grew out of Rebel Reads. Held at Blackpool Community Centre rather
      than in the centre, which is a different area to the rest of this category.
      A single-page site with no separate programme path, so the homepage is the
      listing; between editions it reads entirely in the past tense.
    notes: >-
      Verified 2026-08-17: the homepage confirms "Cork's first Radical Bookfair" ran Saturday 18 April 2026, 11am-5pm at Blackpool Community Centre, describes itself as annual, and points at radicalbookfaircork@gmail.com for the next one. /programme/ 404s. Nothing is announced for 2027 yet, which four months after a first edition is expected rather than a sign of trouble.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/eason-events
    name: Eason Events
    category: literature
    kind: organiser
    status: provisional
    url: https://www.easons.com/eason-events
    tags: [ chain, author-events, bookshop ]
    cadence: monthly
    hints: |
      "Eason Presents" is a national programme that hires big rooms rather than
      using its own shops, and Cork Opera House is one of its regular
      Irish venues — which is exactly the kind of event no Cork venue-by-venue
      crawl catches. One page for the whole country, so filter hard: each entry
      prints its city on a line beginning with a location marker, and only the
      Cork ones belong here. Set `venue` to the host venue, not to Eason.
      Ticketed and often expensive, unlike most of this category. Mostly
      celebrity memoir and sports autobiography.
    notes: >-
      Verified 2026-08-17: /events redirects to /eason-events, which lists dated national events including "Eason Presents: An Evening with Peter O'Mahony" at Cork Opera House on Monday 28 September 2026 at 8pm (tickets from €48), and a Kyla Cobbler evening offered in Dublin or Cork. eason.com does not resolve at all — the live domain is easons.com. Page is heavy with retail navigation; the event blocks are near the foot of the main content.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/eventbrite-cork-literary
    name: Eventbrite — Cork literary events
    category: literature
    kind: aggregator
    status: provisional
    url: https://www.eventbrite.ie/d/ireland--cork/literary-art/
    tags: [ ticketing, bookshop, author-events ]
    cadence: weekly
    hints: |
      The safety net for this category. Unlike Eventbrite's organiser pages,
      this browse view is server-rendered with JSON-LD, so the whole grid parses
      in one fetch — read the ld+json blocks rather than the visible markup.
      Two things to watch. It is keyed to County Cork, not the city, so it
      returns Kinsale, Midleton and Bandon venues that fall outside the 12km
      radius: check the venue before recording. And its idea of "literary" is
      loose, so expect art therapy and community-centre workshops mixed in with
      launches and readings. Cork bookshops with no site of their own surface
      here and nowhere else.
    notes: >-
      Verified 2026-08-17: served 200 to a browser user-agent with two ld+json blocks and dated events spanning 2026-08-17 to 2026-10-22, naming Cork venues including Cork City Library and The Everyman alongside out-of-radius ones (Prim's Bookshop in Kinsale, a Midleton community centre). WebFetch reads it as mostly chrome, so parse the JSON-LD rather than the rendered text.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: literature/poetry-ireland
    name: Poetry Ireland — What's On
    category: literature
    kind: aggregator
    status: provisional
    url: https://www.poetryireland.ie/whats-on/
    tags: [ poetry, national ]
    cadence: weekly
    hints: |
      The national poetry body's calendar of readings across the island,
      including Cork events that never reach a venue website — Poetry Day
      Ireland in particular, when the city fills up with small readings.
      Behind a challenge page: every path on the host answers HTTP 202 with a
      meta-refresh to /.well-known/sgcaptcha/, so a plain fetch gets a
      four-line HTML stub rather than a 403. Needs a JavaScript-capable client
      or a cookie from a real browser session; do not read the 202 as a dead
      URL. Listings paginate as /whats-on/P12, /whats-on/P24 and so on, and the
      calendar is national, so filter to Cork venues.
    notes: >-
      Unverified content, 2026-08-17. The host resolves and answers, but every path tried — /whats-on/, /events, /events/, /poetry-events, and the root — returns 202 plus `<meta http-equiv="refresh" content="0;/.well-known/sgcaptcha/?r=...">`, and WebFetch receives an empty body. /whats-on/ is nonetheless the right path: indexed page titles for it read "News & Events | Poetry Ireland" and "What's On | Events, Readings, and Activities | Poetry Ireland", with a paginated variant at /whats-on/P12. Recorded as a bot wall rather than closed, per the Bristol lesson. No verifiedAt until something actually reads the page.
    addedAt: "2026-08-17"
