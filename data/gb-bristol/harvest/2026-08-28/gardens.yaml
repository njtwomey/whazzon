        raw: "**4 Haytor Park openings — Visit by Arrangement, from May to August.**


          \"This garden opens for By Arrangement visits from May to August for groups of

          between 10 and 30. Please contact the garden owner to discuss your requirements

          and arrange a date for a group or bespoke visit.\" Refreshments: \"Tea, coffee &

          cake.\"


          \"A secret space, lovingly cultivated for almost 40 years. Hiding behind a 30s

          semi and packed with gorgeous plants. Up trees, in pots, around ponds and on a

          green roof. Linger awhile in this peaceful spot on the many seats surrounded by

          scents. Seek out dragons, follow paths through spaces created by wacky screens.\"


          Features: Cashless, Children Very Welcome, Groups Welcome, Plants for sale,

          Refreshments, Tours Welcome, Town Garden, Wildlife Garden. Owner Mr C & Mrs P

          Prior. No admission price is printed.\n"
        summary: "The only National Garden Scheme garden in Bristol still available this year, and only to booked groups of 10 to 30 — a densely planted suburban garden in Coombe Dingle worked for nearly forty years, with a newt pond, a green roof and a dragon trail for children. Arrange a date with the owners; tea and cake included. The window the page gives runs \"from May to August\", so it closes within days."
        confidence: "medium"
    notes: "Nothing opens for the National Garden Scheme in Bristol over 29–31 August. The Bristol index still prints no dates, so — per the source's hints — all 13 gardens on it were opened individually, plus Dormers, the single garden on /gardens/near/bristol/, which is the site's own \"next 28 days\" answer for the area: 14 pages in total, all HTTP 200. Ten say verbatim \"This garden has now completed its National Garden Scheme openings for this year\" (1 Sunnyside, 30 Kingsholm Road, 81 Coombe Lane, 87 Hallen Road, 9 Codrington Road, Algars Manor, Algars Mill, Charlton Road Allotments, Greystones, Japanese Garden Bristol, Dormers). The remaining three offer By Arrangement group visits only, with no published dates. The bank holiday assumption does not hold for this source: NGS Bristol openings are a spring and early summer affair and the 2026 season here is effectively over, which matches the catalogue's cadence note that the useful window reopens with the February 2027 handbook. Location line: of the three By Arrangement gardens only 4 Haytor Park (BS9 2LR) is in Bristol and it alone is recorded. Camers (BS37 6RG, Old Sodbury) and Doynton House (BS30 5SR, Doynton) are South Gloucestershire and Dormers (BS39 5TL, Clutton) is Bath and North East Somerset — all outside the 12 km radius, all left out even though NGS files them under Bristol. Doynton House prints Adult £12.00 / Child £0.00 if a human decides the radius should stretch. For stage 1: findagarden.ngs.org.uk is still a JavaScript shell that serves no listings to a fetcher (confirmed again today, 4 KB of loader), but the \"specific time range\" link on /gardens/near/bristol/ resolves to a real parameterised URL, https://findagarden.ngs.org.uk/garden-list with search_bounds, filter[days_open] and filter[opening_type] — worth someone finding the JSON behind it, since a dated search is exactly what this source lacks."
