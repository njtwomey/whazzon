    notes: "The single biggest yield in this category, and better than the catalogue expected: the fixture rows **are** server-rendered, so the season download was not needed. The men's page carries the full 2026/27 Domino's Men's Super League — 132 rows with date, time, both teams and venue — and the parallel /WomensSuperLeagueFixtures page another 90. Both were fetched (two fetches); `fetch.url` is the catalogued men's page and the 18 women's rows below are marked by their `subcategory`, so a reviewer can tell them apart. Filtered on venue as the hint instructs, keeping only Cork grounds and dropping the rest of the country: 51 fixtures at Neptune Stadium (11), Mardyke Arena (18), Parochial Hall (12) and MTU Arena (10). **Three corrections for the catalogue.** The hint names Neptune and UCC Demons as Cork's Super League sides, but **Ballincollig** is a third, playing at MTU Arena in Bishopstown and inside the radius. On the women's side there are two more: **Career Decisions UCC Glanmire** at Mardyke Arena and **Gurranabraher Credit Union Brunell** at the Parochial Hall. And UCC Demons do not play everything at the Mardyke — three of their games are at the Parochial Hall. Rows are not individually linked (the only per-fixture href is a basketballireland.tv video page), so `url` is omitted. The Division One, BIDL and U20 pages exist and were not fetched; Cork sides in those would be a further catalogue decision."
