    notes: "**Failed, exactly as the catalogue entry predicted, and the 403 is a genuine wall rather than an unfamiliar-fetcher problem.** Per §2 of the prompt I retried with a full Chrome user-agent before recording the failure, and it made no difference: the homepage and /whats-on/ both returned the identical 187-byte page, `<TITLE>403-forbidden</TITLE> ... Error occurred: 403 - forbidden ... Apache Server at: d1264741-46040.cp.blacknight.com`. Byte-for-byte the same for both paths and both user-agents, so this is host-level blocking of anything that is not a real browser, not a missing page and not a dead venue. Two fetches, both 403; per the hint I did not spend more looking for a listings path, since none can be discovered from outside. **This is recorded as a fetch failure with no events rather than as \"nothing on\"** — the pub, the five-barrel microbrewery under the lounge and the phone-booked brewery tours are all real and attested elsewhere, so an empty successful observation here would be a lie about coverage. **For stage 1: nothing has changed since the catalogue entry was written; fixing this needs a headless browser or a human, and until then the entry's `status: provisional` and unverified address are right. Polling it monthly is spending two fetches a month on a guaranteed 403 — worth considering `dormant` or a much longer cadence purely to stop the retries.**"
