    tags: [ independent, club, mid-size, nightlife ]
    cadence: weekly
    hints: |
      Carey's Lane venue in the Huguenot Quarter, running club nights, tribute
      shows and mid-size gigs. Two rooms with quite different programmes and
      the room is named on every listing: "The Pavillion" for ticketed shows,
      "Intermission Bar" for the free late-night DJ strand. Note the venue
      spells the larger room with a double L in listings.
      Prices and door times are printed alongside each date, and many
      Intermission nights are free and weekly-recurring — Panic At The Disco
      runs every Wednesday, so prefer a recurring occurrence over fifty-two
      single events.
    notes: |
      Verified 2026-08-17: /whats-on/ is titled "What's On - The Pav" and lists
      dated events from 19 Aug 2026 (Panic At The Disco 19 Aug, Kiss Nights Cork
      City 22 Aug, Aja - A Tribute To Steely Dan 12 Sep). /events/ and /gigs/
      are 404s. Address is from the corkgigs profile.
