      - id: "food-drink/latitude-51#b1a2690e91"
        sourceId: "food-drink/latitude-51"
        title: "Guerrilla Tastings"
        occurrence:
          kind: "recurring"
          pattern: "Tastings generally take place on Wednesdays and there is no set start time – you can basically join us anytime between 5.30pm and 8.00pm"
          startTime: "17:30"
        status: "scheduled"
        tags:
          - "wine"
          - "tasting"
          - "drop-in"
          - "weekly"
        raw: "**GUERRILLA TASTINGS**


          \"Our Guerrilla Tastings are informal pop-up tastings – arranged at a moment's

          notice – a bit like a flashmob event.


          Born during a time when outdoor dining was all we had and the weather played a

          huge part. When we saw the weather was going to be good, we'd pop-up on the

          terrace for an informal tasting, pouring flights of wine along a given theme.

          These tastings proved to be so popular, that we've decided to continue them on

          indoors, keeping that nature of surprise and spontaneity.


          Here's how they work: we pour a flight of wines and serve accompanying bites to

          match. These aren't formal tutored tastings. We leave you to your own devices

          to enjoy the drinks, but give a brief explanation of each wine. The perfect way

          to catch up with your friends! Tastings generally take place on Wednesdays and

          there is no set start time – you can basically join us anytime between 5.30pm

          and 8.00pm.\"\n"
        summary: "The wine bar's standing informal pop-up tasting — a themed flight with bites to match, drop in any time between half five and eight, usually on a Wednesday. Themed editions are announced individually as they come up."
        confidence: "high"
      - id: "food-drink/latitude-51#5d11edf1d6"
        sourceId: "food-drink/latitude-51"
        title: "Meet The Makers: Un Saumon dans La Loire"
        subcategory: "Wine Tasting"
        occurrence:
          kind: "single"
          date: "2026-04-16"
          startTime: "19:00"
        status: "scheduled"
        url: "https://latitude51.ie/2026/04/03/meet-the-makers-un-saumon-dans-la-loire/"
        price:
          free: false
          text: "€48pp"
          min: 48
          currency: "EUR"
        tags:
          - "wine"
          - "tasting"
          - "talk"
        raw: "**Meet The Makers: Un Saumon dans la Loire with Marie Thibaut and Frantz

          Saumon** — Thursday 16th April, 7pm.


          \"In the Central Val de Loire, 2 winegrowers consistently seduce our palates

          with their wines – Frantz Saumon and Marie Thibaut. Both incredibly talented

          winemakers in their own right, together they make a formidable team.

          Collaborating together under the smile-inducing name 'Un Saumon dans la Loire',

          they have been creating some insanely delicious, energetic wines that beg to be

          imbibed with friends.\"


          \"Join us for a tasting of a selection of their delicious wines and accompanying

          bites from the L'Atitude kitchen.\"


          \"Price €48pp. Spaces limited, so booking essential. Email info@latitude51.ie to

          book.\"\n"
        summary: "A Meet The Makers evening with the Loire natural winemakers Marie Thibault and Frantz Saumon pouring their own wines with bites from the kitchen. Held in April 2026 and now past."
        description: "\"If we had to choose one winemaking region above any other region, that region

          would have to be the Loire. Not just for the diversity of grapes and styles it

          produces, or its ability to make seriously age-worthy wines, but mostly because

          it has long been a leading light in the natural wine world, with each village

          boasting an abundance of exciting natural winemaking estates and creative

          winegrowers.


          In the Central Val de Loire, 2 winegrowers consistently seduce our palates with

          their wines – Frantz Saumon and Marie Thibaut. Both incredibly talented

          winemakers in their own right, together they make a formidable team.

          Collaborating together under the smile-inducing name 'Un Saumon dans la Loire',

          they have been creating some insanely delicious, energetic wines that beg to be

          imbibed with friends.


          Frantz, a former forester, arrived in the wine world by chance. Frustrated by

          how long it took to see results in forestry (decades or centuries), he switched

          to winemaking because he could harvest and enjoy the results of his labour

          within a year. An internship in natural wine led to his eureka moment – he fell

          in love with the 'crazy vinifications' that produced lively and energetic wines.

          He erected a humble 3-ha estate in Montlouis-sur-Loire which has blossomed into

          an ecologically adherent six ha of sincere winemaking.


          Marie Thibault always knew she wanted to be a winemaker. She started her career

          in winegrowing in 2002 working for Domaine François Chidaine in

          Montlouis-sur-Loire and from 2004, started making wine by herself. In 2010 she

          bought 3.5 hectares of old vines in Touraine-Azay-le-Rideau and has been making

          incredible wines of great freshness and purity ever since.


          We're delighted to welcome Marie and Frantz to L'Atitude on Thursday April 16th

          (7pm) to share their wines and their story with us. Join us for a tasting of a

          selection of their delicious wines and accompanying bites from the L'Atitude

          kitchen.


          Price €48pp. Spaces limited, so booking essential. Email info@latitude51.ie to

          book.\"\n"
        confidence: "high"
