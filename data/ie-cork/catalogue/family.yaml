schema: whazzon.catalogue/1
category: family
label: Family & Kids
description: >-
  Wildlife and science attractions, young people's theatre, puppetry and circus, play centres, and the children's strands of the city libraries and the council's own programme. Cork's free family programme is largely civic — the council, the libraries and the two universities carry it — and it spikes at midterms, Cruinniú na nÓg in June and Halloween.
sources:
  - id: family/fota-wildlife-park
    name: Fota Wildlife Park
