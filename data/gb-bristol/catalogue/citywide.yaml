  - id: citywide/bristol-city-council
    name: Bristol City Council — events
    category: citywide
    kind: listing
    status: dormant
    url: https://www.bristol.gov.uk/residents/museums-parks-sports-and-culture
    homepage: https://www.bristol.gov.uk/
    tags: [ official, civic, free ]
    cadence: monthly
    hints: |
      Do not harvest. The premise of this source was wrong: the council runs no
      events diary of any kind, so there is nothing here to extract and no path
      that would change that. Left in the catalogue, marked dormant, only so it
      is not proposed again. Its programme reaches us elsewhere — the museums it
      runs are catalogued under museums/, and its own pages send the public to
      Visit Bristol, which is citywide/visit-bristol.
    notes: >-
      Checked 2026-08-17, confirming the harvest's diagnosis on four counts: /whats-on 404s; the /events vanity path redirects to arts-and-culture funding; the proposed arts-culture-and-events page is policy, filming permits, busking guidance and grant applications with no dated content; and hold-an-event-in-a-park is an application form, not the register of granted permissions the old hints assumed. No diary exists to point at, so the URL is left as the culture hub rather than aimed at a policy page.
    addedAt: "2026-08-16"

  - id: citywide/bristol-libraries
    name: Bristol Libraries
    category: citywide
    kind: listing
    status: provisional
    url: https://bristol.events.mylibrary.digital/
    homepage: https://www.bristol.gov.uk/residents/libraries-and-archives
    tags: [ official, civic, free, family ]
    cadence: monthly
    hints: |
      Free community events across every branch — talks, children's sessions,
      reading groups. Under-represented everywhere else.
      Unreachable as of 2026-08-17: the platform answers every route with a
      Cloudflare "Just a moment..." interstitial, and a Chrome user-agent plus a
      full browser header set does not get past it. Needs a JS-capable fetcher;
      the URL is correct, so it should start working without a catalogue change.
    notes: >-
      Verified 2026-08-17 as the right target, not as reachable. The catalogued gov.uk page is the library service's landing page and carries no events; its "What's on in our Libraries" link points here, which is the platform the harvest was actually being blocked by. URL moved to the platform and the gov.uk page kept as homepage, so the identity is recorded even though the fetch still fails.
    addedAt: "2026-08-16"

  - id: citywide/university-of-bristol
    name: University of Bristol — public events
    category: citywide
    kind: listing
    status: closed
    url: https://www.bristol.ac.uk/events/
    tags: [ university, talks, free ]
    cadence: weekly
    hints: |
      Public lectures and open research events. Free and open to the public
      despite looking institutional — worth including.
      Nothing is server-rendered here. The "Forthcoming events" block is a
      Timely embed and the page itself says events only appear once cookie
      preferences are set. The calendar is
      https://calendar.time.ly/s4f7hatq/list (numeric id 15953078), which is
      client-rendered — its HTML holds no event data and its sitemap lists only
      the posterboard view. The underlying API,
      calendar.time.ly/api/calendars/15953078/events, exists but 403s "not
      authorized" without the token the embed script mints, so there is no
      unauthenticated route. Needs a JS-capable fetcher.
    notes: >-
      Superseded by `education/university-of-bristol`, which carries the same URL and the same findings. Closed rather than renamed: this id appears in the 2026-08-16 harvest log, and the log is append-only, so changing the id here would orphan an observation. Closed sources are not harvested, so the university is fetched once rather than twice. The original finding stands and is worth keeping: the URL is right and the harvest recording "listed nothing" was accurate rather than a miss, because the page is a shell around a cookie-gated Timely widget. It produced zero events across its whole history.
    addedAt: "2026-08-16"

