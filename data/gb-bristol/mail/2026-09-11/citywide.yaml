    body: "All your Bristol highlights for this week


      View this email in your browser <https://mailchi.mp/bristol247.com/things-to-do-aug-31-sep-6-26>


      Sent this by a friend? Sign up here <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=b27d48565e>


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=c099b3a56f


      AUGUST 31-SEPTEMBER 6 2026


      This week in Bristol, there's a bit of culture for everyone - whether you fancy Fire in the Mill, a hot jazz jam and plenty more.


      We wouldn't be able to do what we do at Bristol24/7 without our members.

      If you enjoy our What's On content, please consider b <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=c87d8c8b31>ecoming a member of Bristol24/7 for just £3 per month <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=11e0aa365e> to support independent journalism.


      Top events this week


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=8cde0e8c31


      Monday: Konformer & Omega Institute <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=842a0914ef>


      Get lost in Konformer’s hypnotic, bass-led kosmische sound, blending synths, drums and a touch of Cold War noir. They’re joined by Bristol’s Omega Institute, whose dubby rhythms and stuttering electronics bring an intense free-jazz edge to this experimental night of music.


      The Old England Pub, BS6 5PT


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=c37ffd5dc0


      Tuesday: Open Mic <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=00025c2356>


      SPONSORED | Open Mic has a new home on Tuesdays. Come along for a fun, casual evening of live music on the Grain Barge. It’s open to all; seasoned performers, first-timers and everyone in between. Grab a drink, take the mic or simply settle in and enjoy the show.


      Grain Barge, BS8 4RU


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=b02947d22f


      Tuesday: The Psychology of Possession & Exorcism <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=41748ba624>


      What really happens when people believe they’re possessed? This fascinating talk explores the psychology and neuroscience behind alleged demonic possession, from historical cases linked to medical conditions to hypnosis, dissociation and the darker consequences of labelling vulnerable people as possessed.


      The Hen & Chicken, BS3 1JF


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=23179eae20


      Tuesday & Wednesday: Summer Holidays at Wookey Hole <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=0f8eb6f3ca>


      SPONSORED | Head to Wookey Hole to see the spectacular new immersive cave projections this Summer. Using cutting-edge projection mapping, the legendary caves come alive with stories of the Witch, ancient geology and daring explorers. Combined with circus shows, 4D cinema and vintage family attractions, it’s a fabulous Somerset adventure, just 45 mins from Bristol, with up to 20% off advance tickets until 2nd September 2026.


      Wookey Hole, BA5 1BA


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=246fe66216


      Wednesday: Queer Contact Improvisation: Taster Session <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=0606571ea6>


      This welcoming movement session explores connection, touch, trust and self-expression through improvisational dance, with no previous experience needed. Come along, get moving and discover a more intuitive way to connect with others with experienced CI practitioners Ania Varez (they/them) and Rhiannon Colvin (she/her),


      St Werburghs Community Centre, BS2 9TG


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=43dd42e382


      Wednesday: Spell Songs <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=891a782229>


      SPONSORED | Spell Songs return with In Thin Air, the latest chapter in their extraordinary musical journey inspired by the work of Robert Macfarlane and Jackie Morris. Featuring Karine Polwart, Julie Fowlis, Seckou Keita, Kris Drever, Rachel Newton, Beth Porter and Jim Molyneux, expect soaring harmonies, virtuosic musicianship and songs that celebrate the natural world.


      Bristol Beacon, BS1 5AR


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=a457e86784


      Thursday: Hot Jazz Jam <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=07c37af401>


      Swing into the evening with a lively hot jazz jam, bringing musicians and music lovers together for an evening of classic jazz sounds. Whether you’re there to play or simply soak up the atmosphere, it’s a relaxed chance to enjoy some spontaneous live music.


      Grounded Fishponds, BS16 3UP


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=6dd6ca3a48


      Friday: Queer as F*ck <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=42e4131b07>


      Queer As F*ck returns with another night of unapologetic queer club culture, bringing DJs, dancing and a proudly inclusive atmosphere to Old Market. Expect a high-energy mix of house, disco and pop, with plenty of glitter, attitude and space to dance all night.


      The Old Market Assembly, BS2 0DF


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=0da2d1552d


      Friday: Food Truck Friday <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=af860a4cd0>


      SPONSORED | It’s the last Food Truck Friday of the season at Tobacco Factory, so come down and enjoy the finale. Expect brilliant street food, a Good Chemistry tap takeover at the Yard Bar and a DJ providing the soundtrack. Good food, good beer and good tunes – all in one place.


      Tobacco Factory, BS3 1TF


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=de79291a9a


      Friday: Cliftonwood & Hotwells Open Air Cinema Presents: Matilda The Musical Film <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=a34bcf426c>


      The Hotwells & Cliftonwood Community Association’s annual open air cinema is back. Come and see this magical, uplifting musical about a remarkable girl who dares to change her world.  It’s a great family event for the end of the summer.


      Argyle Place Park, BS8 4RH


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=62f9736211


      Friday: The Beatles by Candlelight <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=ef8aa700d7>


      SPONSORED | Experience the iconic melodies of The Beatles like never before in the Bristol Ensemble’s stunning orchestral concert. Immerse yourself in some of the legendary group’s greatest hits performed by live orchestra, including Yesterday, All you need is love, Hard day’s night, I want to hold your hand… and many more. An unforgettable evening of nostalgia, warmth and musical brilliance!


      The Riverfront, NP20 1HG


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=dd633ef4c7


      Friday: The Incomer <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=6dca95532a>


      SPONSORED | Writer-director Louis Paxton’s debut feature sees a nervy council official attempt to evict two siblings who have never had any human contact from their outside world.


      Watershed, BS1 5TX


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=98b55812c5


      Friday-Sunday: Force of Nature <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=2d041e553e>


      Join us for an ecosystem of art that celebrates the natural world, for one weekend only in the heart of Stokes Croft. Experience art from local artists working across a vast range of visual media in this free entry exhibition open to all ages.


      Kit Form, BS2 8JP


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=a4566bdc21


      Saturday: I’ll House You ft Deli G <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=e6fec72855>


      Get ready for a night of house music as I’ll House You brings Deli G to Bristol for a high-energy DJ set. The dancefloor-focused sound blends deep grooves, rolling basslines and feel-good club rhythms, with plenty of energy to keep things moving late into the night.


      The Gallimaufry, BS7 8AL


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=f9477ce001


      Sunday: Fire In The Mill <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=a833f4c066>


      Fire in the Mill brings together a line-up of live bands and DJs for an afternoon of music at Sawmills. With proceeds supporting local causes, the event combines live performances, food and drink, and a relaxed community atmosphere for a Sunday afternoon by the water.


      Sawmills, BS5 0TW


      https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=6557b80eef


      Until September 13: SENTIENTS <https://bristol247.us7.list-manage.com/track/click?u=7b935cfb4a332a0d1c952d2d9&id=aa906cecb7>


