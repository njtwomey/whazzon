    notes: "The `api` route works and returned all 414 rows, so this is a successful fetch that legitimately yields **no current events**, not a failure.

      The catalogue's caveat needs refining rather than confirming, and the distinction matters for whoever curates this. Of the 414 rows, 8 are \"breaker\" day-header rows whose `declare_day` values run \"Wednesday 22nd\" through \"Wednesday 29th\" — the 22–29 April **2026** week the site's banner announces, and 22 April 2026 is indeed a Wednesday. The 406 event rows carry `day_ofweek` (which is what the Vue page joins to those headers) plus a `date` column that still reads 10–16 April **2024**, the 2024 festival. So the sheet is not simply \"the 2024 programme\": it is a live sheet whose legacy date column was never cleared, and its content is mixed — some rows name 2026 explicitly (\"Cork Textiles Network's Spring 2026 exhibition\", \"this four-month initiative in 2026\"), one names an \"MTU Registrar's Prize Exhibition 2025\".

      Either way nothing here is current: 22–29 April 2026 finished four months ago and no 2027 edition is announced. Recording 406 rows of finished events, against contradictory years, would be worse than recording none, so none are recorded and this note is the result. 175 of the 406 rows are craft, creative, workshop or textile-flavoured, which is a fair measure of what this source is worth in April — it is the largest single body of turn-up-and-make events in Cork's year and much of it appears nowhere else.

      Two practical notes for stage 1. The first row's `event_by_title` really is every event name concatenated (2,251 characters), so the hint's advice to skip it stands. And re-checking in April is not enough on its own: the `date` column cannot be trusted even then, so the `day_ofweek`-to-breaker join is the route to a real date. Cadence `quarterly` looks right; a check in early April 2027 is the one that will pay."
