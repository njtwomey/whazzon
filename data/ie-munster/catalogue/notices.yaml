    status: provisional
    url:
      - role: listings
        url: https://westcorkpeople.ie/category/dont-miss/
      - role: feed
        url: https://westcorkpeople.ie/category/dont-miss/feed/
    homepage: https://westcorkpeople.ie/
    tags: [newspaper, listings, free-paper, west-cork]
    cadence: weekly
    hints: |
      The free monthly paper's what's-on column. WordPress underneath, so read the
      category feed first and open a page only when an item looks textile.
      Cheap enough to keep despite the widening: it is one fetch and it found an
      exhibition nobody else listed.
    notes: >-
