    notes: "The hint is right that this is the highest-yield page in the catalogue, and it is worth saying why: eleven Cork pubs publish their nightly free-music programme here and almost none of them anywhere else. 122 rows, each giving act, pub, date and time, in a plain server-rendered list.

      **It 403s WebFetch** and answers a browser user-agent — a hint the catalogue does not yet carry. Rows are `?e=<id>&rand=<random>` links; the `rand` is a per-load cache-buster, and **`?e=<id>` alone resolves fine**, so that shorter stable form is what is recorded. Those detail pages carry a price and a paragraph of copy the index does not — a route worth adding to the catalogue.

      Row counts by pub: Crane Lane Theatre 30, Sin É 21, The Vicarstown 16, The Pavillion 15 (plus 1 spelled \"The Pavilion\"), Cantys 14, Intermission Bar 7, Arty's Bar 6, The Poor Relation 5, The Old Town Whiskey Bar at Bodega 4, The Park 3. The hint also expects The Oval, Mutton Lane Inn, El Fenix, Rising Sons Brewery and Arthur Mayne's; **none of those five appear in today's programme at all**, which is worth a curator's eye.

      Of the 122 rows, 71 events are recorded here and every exclusion is deliberate:

      - **21 Sin É rows excluded** (16 of them \"The Lee Sessions Trad Trail\").

      \  The hint routes Sin É to the trad category, and trad/sin-e,

      \  trad/lee-sessions and trad/cork-heritage-pubs all exist to catch them.

      - **19 Pavillion / Intermission Bar rows excluded** because thepav.ie

      \  publishes the same shows with prices and room names, and they are

      \  recorded under music/the-pavilion instead. The four Pavillion rows that

      \  thepav.ie does **not** agree with are kept here — see the warning below.

      - **6 rows excluded as instances of a Crane Lane residency** (Jazz Improv

      \  ×3, Ceili By The Lee ×2, DJ Ian Richards ×1). Crane Lane's own RSS feed

      \  states those as weekly patterns in words, so they are recorded once each

      \  as recurring events under music/crane-lane-theatre rather than as dated

      \  instances here.

      - **1 row excluded** — \"Closed For A Private Event\", Crane Lane, Sun 23

      \  Aug. A real listing, but a closure notice rather than an event.

      - The four \"DJ Sadbh Casey, The Vicarstown\" rows (Thu 20, Sat 22, Thu 27,

      \  Sat 29 Aug) are folded into one recurring event.

      - **1 row dropped as an unresolvable duplicate.** \"King Jeff and The Happy

      \  State\" is listed at Cantys and at The Poor Relation at 10pm on the same

      \  Sat 29 Aug, with the same image and two different ids. Two rows with one

      \  title and date under a single source would collide on a content-derived

      \  id, so only the Cantys row is recorded and the Poor Relation row is

      \  reported in that event's `raw`. One of the two listings is wrong.


      **The Pavillion conflict, which needs an owner's decision.** CHP and thepav.ie disagree about four autumn shows, and the disagreement is not a simple date shift — **the same event id renders as a different act on each site**. CHP's `?e=11197974` is \"'Who's That Girl' — Eurythmics and Annie Lennox Experience\" on Fri 9 Oct; thepav.ie's `?e=11197974` is \"The Blue Mist 2026 In Cork\" on Fri 9 Oct. CHP's `?e=11197975` is \"'Crest Of A Wave' — Rory Gallagher Tribute\" on Fri 20 Nov; thepav.ie's `?e=11197975` is \"The Amy Winehouse Experience\" on Fri 20 Nov. Both sites are run by the same group off the same event ids, so one of the two datasets is stale. The four CHP versions are recorded here at `confidence: low` and the four thepav.ie versions under music/the-pavilion; nobody should assume either is right until a human checks.

      Prices: the index prints none. I opened four detail pages across four different pubs — The Insiders at Cantys, The Professional Blues Band at The Poor Relation, DJ Sadbh Casey at The Vicarstown and The Guilteens at Crane Lane — and all four read FREE, so the pub rows are recorded `free: true` on that four-of-four sample plus the group's own \"free music\" framing. The four ticketed Pavillion concerts carry no price, because neither the index nor a detail page gave one. Those same four detail pages also supplied the only `description` values in this observation.

      Two smaller things. Room names in brackets after the act (\"(Crystal Bar)\") are Crane Lane's upstairs DJ room and are kept in the title as printed. And four rows print a \"12am\" start filed under the preceding night (Fri 21 Aug, Fri 28 Aug, Sat 29 Aug) — recorded on the date the listing files them under, with startTime 00:00, because that is how a reader will find them. Cantys is recorded as an uncatalogued `venue.name`; the Crane Lane hint calls it one of that venue's two rooms, so a curator may prefer to map it to music/crane-lane-theatre."
