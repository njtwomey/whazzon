        raw: "**Fridays & Saturdays — Brewery Tours**

          The Taproom, Old Market


          > A beer lover's perfect day out.


          Date & Time: Brewery tours run on alternate Friday nights and Saturday

          daytimes, and last approximately one hour. Friday: 6.30pm - 7.30pm.

          Saturday: 2pm - 3pm.


          Ticket Information: Tickets cost £20 plus booking fee. Booking is via

          [Eventbrite](https://www.wiperandtrue.com/products/brewery-tours).\n"
        summary: "An hour behind the taproom bar and into the working Old Market brewery, guided by the brewing team, from raw ingredients through to packaging, and finishing with a fresh pint at source. Alternate Friday evenings and Saturday afternoons, booked ahead through Eventbrite."
        description: "A Wiper and True brewery tour is the beer lover's perfect day out.


          Step through the taproom and into our brewery to explore the

          behind-the-scenes magic of the Wiper and True beers you know and love.

          Guided by our friendly, knowledgeable team you'll get all the insider

          information on how we design, brew and package our beautiful beer from

          raw ingredients, right through to the finished product.


          To round off the tour, you'll enjoy a super-fresh pint, direct from

          the source. You'll find our brewery tucked away in Old Market, a

          vibrant suburb of one the UK's most creative cities.


          Date & Time: Brewery tours run on alternate Friday nights and Saturday

          daytimes, and last approximately one hour. Friday: 6.30pm - 7.30pm.

          Saturday: 2pm - 3pm.


          Ticket Information: Tickets cost £20 plus booking fee. Booking is via

          Eventbrite. Spaces are limited, so booking is essential. When you

          arrive, head to the taproom bar and let our team know you're here for

          the tour.


          Brewery tours are fully wheelchair-accessible, with level access

          throughout the building including into the brewery itself. To discuss

          accessibility before or after booking, email bookings@wiperandtrue.com

          or call 0117 9412 501.


          Event address: The Taproom, Unit 11, City Business Park, Easton Road,

          Bristol, BS5 0SP.\n"
        confidence: "medium"
