    notes: "The GraphQL recipe in the hints is still correct and still needs no auth — but it now needs browser headers, which the hints say it does not. A plain `POST https://ra.co/graphql` with only `Content-Type: application/json` returned 403 and a Cloudflare \"Attention Required!\" page. The same body with a Chrome User-Agent plus `Referer: https://ra.co/events/uk/bristol` and `Origin: https://ra.co` returned 200 immediately. Worth correcting in the hints — the line \"The wall does not cover the API\" is now only half true.


      Bristol is still area 446. Filtered 2026-08-28 to 2026-10-31, four pages of 50: totalResults 167, 155 unique events after collapsing multi-day listings that repeat per listingDate.


      THE BANK HOLIDAY, WHICH IS WHAT THIS SOURCE IS FOR. RA carries 32 events across 28–30 August and this is the run's clearest bank-holiday signal: Sunday 30 August has five club nights programmed as though it were a Saturday, including one billed \"Clock Factory: REDACTED (Bank Holiday)\". Saturday 29 August carries 16, including two separate Forwards after-parties at The Love Inn and a \"[Bank Holiday Weekend]\" free rave at The Clock Factory. Only the two events whose own titles say so are tagged `bank-holiday`.


      MONDAY 31 AUGUST IS GENUINELY EMPTY on RA — zero events, not a truncation. The Sunday night programming runs into the small hours of the Monday instead, which is what the bank holiday buys.


      TRUNCATED: October. All 113 events from 28 August to 30 September are recorded; 42 October events were dropped. Nothing in the 29–31 August window was cut.


      `raw` is composed from the API's own fields (title, venue, date, times, line-up) because the eventListings query returns no body text — there is no listing prose to copy. No `description` is recorded for the same reason: no event page was opened. The API also returns no price and no image, so those fields are absent throughout rather than guessed. RA prints end times that cross midnight; those are dropped rather than written as a same-day `endTime`, and they remain in `raw`.


      Venue names come back plain and were matched to the catalogue by name. Most of RA's Bristol rooms are not catalogued — The Clock Factory (18 events), The Love Inn (8), Moon Club, Lost Horizon, Sawmills, The Crown, Electric Bristol, The Jam Jar, Green Works, Cosies, After Dark, Document, The Red Church, Mickey Zoggs, Basement 45, Take Five Cafe, The Plough, The Mothers' Ruin — and they carry a lot of the city's club programme. That is a real gap for stage 1 to consider."
