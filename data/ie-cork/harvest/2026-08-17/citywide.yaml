    notes: "Read 3 of the 30 filtered pages — 144 of the 893 Cork City rows. 131 of those 144 (91%) share an event id with citywide/proc-event-guide, so the two really are substantially the same rows: only five distinct events were unique to Pure Cork (Billy Lingwood and Artists Film International at Triskel, Craic! at Cork Arts Theatre, Mr Pussy and A Streetcar Named Desire at the Everyman). Those five are recorded in full, with their own Pure Cork event pages opened; the rest of this observation is five rows kept only because Pure Cork's \"Free Entry\" flag is a fact the PROC row lacks. Where an event appears in both, the PROC row is the fuller one.

      The ?locations= filter was kept, and it is doing real work — but it is not a radius filter: Pure Cork files Briery Gap in Macroom and the Cork City Trails tour operator under \"Cork City\".

      The index prints one dated row per event per day and never a range, so a run's extent is not observable from the pages alone — that is why five event pages were opened. They carry the real range, the price and the body copy: Billy Lingwood is 2 July - 30 August, Artists Film International is Tue-Thu weekly through August 10:00-15:30, Craic! is 18-22 August at €18/€15, Streetcar is 20-22 August from €21.

      Pure Cork puts Streetcar's curtain at 19:00 and entertainment.ie at 19:30 on the same nights; recorded at confidence medium with both in timesText."
