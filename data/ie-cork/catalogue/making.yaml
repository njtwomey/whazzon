schema: whazzon.catalogue/1
category: making
label: Making & Craft
description: >-
  Makerspaces, print and craft studios, pottery, textiles, woodwork, boat building, repair projects and the public course programmes of Cork's art college.

  Two things shape this category in Cork. First, most of what these sources publish is a *course* rather than an event — a ten-week evening class is not a one-off workshop, and a "what's on" page fills up with enrolment listings if they are treated the same. Prefer one-off and short workshops, open days and public makes; record a recurring course as `occurrence.kind: recurring` with its pattern stated.

  Second, the dates are usually on a booking platform rather than a listings page. Cork Craft & Design sells its whole programme as Shopify products with the date in the product title; Cork Printmakers publishes course subjects and no dates at all. Where a booking route is the only place real dates exist, it is recorded as a route here rather than left for stage 2 to discover.

  The August peak is Cork Craft Month, and the April one is the Lifelong Learning Festival — between them they carry more hands-on making than the year-round programme does.
sources:
  - id: making/benchspace-cork
    name: Benchspace Cork
    category: making
    kind: venue
    status: provisional
    url: https://benchspacecork.ie/events/
    homepage: https://benchspacecork.ie/
    area: Docklands
    tags: [ makerspace, woodwork, courses, workshops, studio, independent ]
    cadence: monthly
    hints: |
      Shared-access woodworking and design workshop — benches and industrial
      machinery, plus silver jewellery and laser cutting. Output is mostly
      multi-week courses ("Wood Skills" 8 weeks, "Machine Making" 10 weeks,
      "Silver Jewellery Design and Make" 10 weeks) with occasional one-off
      classes and a Christmas market. Record each course as recurring with its
      session pattern, not one event per session, and expect course pages to be
      titled with the month they start (Mar 2026, Sep 2026) several terms ahead.

      The whole domain sits behind a SiteGround captcha wall: every path returns
      HTTP 202 with a meta-refresh to /.well-known/sgcaptcha/ regardless of
      user-agent (browser, curl, mobile, none) and cookie jars do not clear it.
      A real browser session is needed. Do not read the 202 as a dead site.
    notes: >-
      Confirmed real and active 2026-08-17, but the URL could not be fetched — see hints for the captcha wall. Existence and paths verified from the search index: /events/ is titled "Events Archive - Benchspace Cork", /calendar/ is "Calendar | Benchspace", and individual course pages sit at /events/<slug>/ with 2026 dates (Mar, Apr and Sep 2026 intakes). /events/ is used here as the listings page and /calendar/ is the alternative if it turns out to be the populated one.

      The lead that produced this entry placed Benchspace at Wandesford Quay. That is wrong — Wandesford Quay is Cork Printmakers and Backwater. Their own contact page gives Unit O15 (wood workshop) and Unit B1b at Marina Commercial Park, Centre Park Road, in the docklands. `address` is omitted rather than guessed: two units with two Eircodes, and the page could not be read directly to settle which is the public one.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/cork-printmakers
    name: Cork Printmakers
    category: making
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://www.corkprintmakers.ie/education/adult-education/
        note: the course programme — media and enrolment terms, but no dates anywhere on it
      - role: listings
        url: https://www.corkprintmakers.ie/exhibitions/exhibitions-current/
        note: the only page on the site carrying dates — studio gallery exhibitions
      - role: feed
        url: https://www.corkprintmakers.ie/feed/
        note: full-text WordPress feed, fresh to 12 Aug 2026; exhibitions and residencies, no courses
    homepage: https://www.corkprintmakers.ie/
    area: City Centre
    address:
      street: Wandesford Quay, Clarke's Bridge
      city: Cork
      postcode: T12 E26D
      country: Ireland
    tags: [ printmaking, courses, workshops, studio, open-access ]
    cadence: monthly
    hints: |
      Open-access fine-art printmaking studio — etching, screenprint,
      letterpress, lithography, bookbinding, photo etching. Courses run
      year-round in groups of no more than six.

      Expect no dated courses. /education/adult-education/ lists the media
      taught and the refund policy and nothing else; there is no calendar, and
      booking is by contacting the studio, so record the programme as recurring
      or undated rather than inventing a start date. /education/exhibitions-events/
      exists but renders "No Results Found" — do not treat it as a listings
      page. The Shopify shop at cork-printmakers.myshopify.com sells prints
      only: 462 products across two pages, none of them a course or workshop.

      There is also a year-long course at /education/year-long-course/ — one
      recurring entry, not a stream of sessions.
    notes: >-
      Verified 2026-08-17: site is the right organisation — "Cork Printmakers CLG", charity 20028923, Wandesford Quay, Clarke's Bridge, Cork T12 E26D read off its own footer. Two current exhibitions dated to July 2026 on the exhibitions page. /wp-json/tribe/events/v1/events and /events/ both 404, so there is no Events Calendar plugin here.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/backwater-artists-group
