    notes: "Both walls in the hint are still there; the page was opened in a real browser, where it renders today's showings only, with each showtime's attributes as icons. The showtimes come from the Vista feed at vwc.odeon.co.uk (ocapi/v1/showtimes/by-business-date/<date>?siteIds=315), which the page calls with the anonymous site token it is served in its own initial data; the same call was made from within the page for the 112 business dates from 11 Sept to 31 Dec 2026, which is the date picker's whole published horizon bar Jan–Feb 2027 (the picker runs to 23 Feb 2027; nothing was checked past 31 Dec). That is the route stage 1 may want to note, with the caveat that it answers only with the page's token; nothing was written to the catalogue. 73 films and 430 showtimes were on sale in that window, most of it the Fri 11 – Thu 17 Sept week plus event cinema. **The multiplex rule applied:** the routine programme is not recorded; what is here is every showtime the feed marks with an attribute ODEON labels (Event Cinema, ODEON Kids, Newbies, Silver Cinema, Autism Friendly, Open Captioned, the £1/£2/£4 web prices and non-English audio with English subtitles) plus the titled specials — Pride Nights, Spotlight, anniversary and encore re-releases, the weekly Harry Potter and Hunger Games re-runs — and a handful of limited-run releases with only one to three showings (Eddie Cochran, Kuzma, The Incomer, Sinners). Dune: Part Three has two showings on 15 Dec, three days before its release date on the feed, and is recorded as a preview. Where one film has two different special showings (Practical Magic 2: Newbies on Tuesday, open captioned on Wednesday) they are separate rows titled by strand so they do not collide on id. Deep links use the site's own /films/<slug>/<HO code>/ shape: the HO code is the routing key and the slug is generated from the title the way the site's own JavaScript does; the pattern was checked against the seven hrefs rendered for today's films and one unrendered film, National Theatre Live: The Misanthrope (200 without a redirect). No poster images: the feed carries none and the film pages are JavaScript shells. Prices are not recorded per row: the page prints a film-level \"Adult price from\" (£7.95 or £12.95) that is not tied to a showing; the £1/£2/£4 web attributes are noted in raw. Catalogue note, unchanged from the last two runs: this is ODEON Luxe Bristol in Cabot Circus (Broadmead, BS1 3BX), so \"ODEON Bristol\" and area \"City Centre\" are stale."
