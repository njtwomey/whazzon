  - id: theatre/bristol-old-vic
    name: Bristol Old Vic
    category: theatre
    kind: venue
    status: provisional
    url: https://bristololdvic.org.uk/whats-on
    homepage: https://bristololdvic.org.uk/
    area: Old City
    address:
      street: King Street
      city: Bristol
      postcode: BS1 4ED
    tags: [producing-house, historic, major]
    cadence: weekly
    hints: |
      The oldest continuously working theatre in the English-speaking world.
      Programmes a long way ahead and major shows sell out months in advance —
      capture the full forward horizon, not just the current month. Runs a
      studio strand (Weston Studio) and the Ferment new-work programme; both
      belong in the same harvest.
    addedAt: "2026-08-16"

