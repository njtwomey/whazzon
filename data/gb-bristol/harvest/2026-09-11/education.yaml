        raw: "**FUTURES 2026: Discovery Day** @ We the Curious — Sat, 26 Sep @ 10:00am


          Hands-on/Interactive


          What will you find out at Discovery Day in Bristol? Join us for this free event and experience cutting-edge research brought to life through amazing hands-on activities and incredible conversations.\n"
        summary: "The FUTURES research festival's free day at We the Curious: dozens of hands-on stalls from University of Bristol and Bath researchers — quantum science, climate, solar power, dark matter, animal emotions, AI — plus short Discovery Talks through the day. Book a morning or afternoon session; the ticket does not include the museum's exhibition floors."
        description: "What will you find out at Discovery Day in Bristol? Join us for this free event and experience cutting-edge research brought to life through amazing hands-on activities and incredible conversations.


          You'll find **dozens of interactive stalls and activities** from researchers at the Universities of Bristol and Bath, where you can ignite your curiosity and explore everything from **quantum science to climate change, solar power to superconductors, germs to dark matter, and animal emotions to artificial intelligence**.


          Alongside the stalls, enjoy a programme of short **Discovery Talks** throughout the day.


          **Want to come?** [Book a ticket](https://www.eventbrite.co.uk/e/futures-discovery-day-tickets-1994832626084) to either the morning Discovery Day session (10-12:30) or the afternoon Discovery Day session (1:30-4:00). Your ticket will also give you access to any of the talks (but not to the permanent exhibition floors at We The Curious).


          **[Tickets and more information can be found here.](https://futuresnight.co.uk/events/discovery-day-bristol/)**


          Organiser: Public Engagement Team, cpe-info@bristol.ac.uk, https://www.bristol.ac.uk/public-engagement/\n"
