    notes: "All 5 of these are from the autumn newsletter sent 4 September; the website was not fetched this run (source not due). The newsletter is a selection, so the website's other rows from the 28 Aug run (Friday Craft, Super Saturday November and December, and the four separately-listed costume craft sessions) are simply absent here, not withdrawn. Three things for the reviewer. (1) Picnic in the Park keeps the same title and date as the 28 Aug web row so it folds onto the same id; the newsletter gives the Scrapstore's hat-making slot as 2pm - 5pm where the website said 2:00pm - 5:30pm on 28 Aug, and the newsletter is the older statement, so the website should be believed if they still disagree. (2) The costume craft sessions are recorded as one event per day with both sessions in timesText, as §5 asks, so they get new ids beside the website's four per-session rows; the newsletter also prints different times from the website (Sat 10:00-12:00 and Sun 11:00-13:00, plus 14:00-16:00 both days, against the website's 10:00-11:30 and 14:00-15:30 each day). Which is current needs a web fetch. (3) The Arts Trail section is headed \"4th & 5th October\" but its body says Saturday 3rd and Sunday 4th, which the weekday check and the costume-craft weekend both confirm, so 3-4 October is recorded at confidence medium. Messy Play gets a start date the website never printed (term-time sessions resume 15 September), which also gives it a new id beside the website's undated recurring row. Event links are the newsletter's own Mailchimp click-redirects, taken verbatim; the 28 Aug run recorded the destination pages directly. The newsletter carries no image URLs, so none are recorded. Not recorded: the deep clean closure of 8-11 September (no Playroom sessions; ends today), and the mentions of monthly Super Saturdays and the summer programme, which are retrospective and give no forward date."
