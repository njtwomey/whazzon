          - "workshop"
          - "booking-required"
        raw: "**Just announced: October Half Term Drama Club!** — Monday 26th and Tuesday 27th October, 10am - 3pm. For ages 8-12. Come and join us in the October half term holidays for two days of creative theatre play! In just two days you’ll create a never-before-seen play which you can then perform to family and friends. We’ll combine your ideas (weird and wacky ones encouraged!) to create something truly unique. Places cost £50.00 per day, and are booked in blocks of two days. We are able to offer three half price places for low-income families – if you would like one of these, please email info@acta-bristol.com. [More information and book a place on Eequ](https://us.list-manage.com/xgWIPSDc6Ip?c2id=178ee8babe3db6d0c3bd9d9141602d5e)"
        summary: "Two days of half-term drama club for ages 8 to 12, making and performing a brand-new play to family and friends."
        confidence: "high"
