        raw: "**Wonder Baby (2026)** — At A Glance: 11 - 29 October 2026. Various early years settings and community spaces across the South West. Suitable for 0-3's and their families and carers. No public tickets currently available. We will be announcing tour dates in early September.\n"
        summary: "A movement and clowning show for babies and toddlers up to three, touring early years settings and community spaces across the South West through late October. Ninety minutes including a gentle start and a break; individual tour dates were still unannounced when the page was read."
        description: "What does that first step feel like? How does interacting with someone else make us feel? Why does rolling over feel so good!


          Join us as we journey from 0-3 years old, finding our feet, our feelings and our fun. Find a connection whether you have children of your own, or from when you yourself were a child.


          Using movement and clowning, *Wonder Baby* invites children and families to explore physical play and experience the joy of creating space to play together.


          Grown from the imaginations and experiences of babies, toddlers and their families – *Wonder Baby* was developed in collaboration with families who took part in the early development of the show.


          For 0-3's and their families.


          **Duration:** This is a play and performance experience, lasting approximately 90 minutes - this includes a gentle start and time for a break if needed.


          **At A Glance:** 11 - 29 October 2026. Various early years settings and community spaces across the South West. Suitable for 0-3's and their families and carers. No public tickets currently available. We will be announcing tour dates in early September.\n"
