        raw: "**FREE SUPER SCRAP COSTUME CRAFTS FOR SUSTAINABLE FASHION WEEK**


          As part of being a hub for [Sustainable Fashion Week](https://us.list-manage.com/uekCh3Kdh1X?c2id=189f808a56f9b99c0adb21d5d841853d), on Saturday 3rd & Sunday 4th of October, we will be decorating white gauze scarves saved from waste with scrap fabrics, pens and sticky back to create an unique outfit that you can wear over your normal clothes!


          This free drop-in activity is aimed at primary school aged children and their families. No unaccompanied children.


          These sessions run from 10:00am - 12:00pm Saturday 3rd & 11:00am - 1:00pm Sunday 4th of October, as well as 2:00pm - 4:00pm on both days.


