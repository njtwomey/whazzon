    notes: "REACHABLE AGAIN — the catalogue hint is out of date. The hint says the host answers 202 with an empty body to WebFetch and to a full Chrome header set alike, and that no URL will fix it. Today a plain `curl -A '<Chrome UA>'` to https://www.bristolpost.co.uk/whats-on/ returned 200 and 941 KB of real server-rendered HTML, titled \"What's On in Bristol - News, guides, reviews - Bristol Live\", and so did four article pages. The Reach plc bot challenge either lifted or no longer applies to this user-agent. Worth a hint saying it needs a browser user-agent rather than the current \"do not spend a slot on it\".


      NO BANK HOLIDAY ROUNDUP. The brief asked for one and there isn't one. /whats-on/ and the /all-about/things-to-do-in-bristol topic hub were both read and neither carries a \"things to do this bank holiday weekend\" piece. The section is dominated by affiliate shopping copy (cardigans, hair tools, advent calendars) with no event in it, and the only bank-holiday item on the index is an Aldi voucher competition. This is a newspaper section, not a diary: it has no dated listings feed at all.


      Its actual weekend value is service journalism about Forwards Festival — five separate pieces (travel, banned items, what to do with children, full guide). Four articles were opened, which is the \"thin index, small programme\" allowance in §3, and two carried a usable date and venue.


      NOT RECORDED: \"90s Garage stars to play family music event\" is Raver Tots at Bristol Amphitheatre on Sunday 23 August 2026 — five days before this run. §4 forbids recording a passed listing as `undated`, and a past date on an aggregator adds nothing, so it is left out rather than invented forward. Several other headlines (\"England Rugby stars taking to the stage in Bristol this month\", \"Parks near Bristol hosting fish and chip picnics tonight\") print no date at all and were not opened."
