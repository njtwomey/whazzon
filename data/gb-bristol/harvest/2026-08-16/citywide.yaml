    notes: "The homepage is itself the listings page, so no navigation was needed. Partial: this is the first screen of Headfirst's grid, about thirty-six of what runs to several hundred across /gigs-and-live-music, /club-listings, /event-listings, /whats-on/tonight and /whats-on/this-weekend, none of which were followed. The grid prints no start times and no prices — those live on the event pages, which were not opened. Dates carry a weekday and day-of-month but no year; every one was checked against the 2026 and 2027 calendars and the weekdays match, so August-to-December are 2026 and the two February dates are 2027, but all are marked medium confidence because the year was inferred. Descriptions exist only for the older editorial picks lower down the page."
