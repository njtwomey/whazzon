        raw: "**History 1976 graduates: 50th anniversary reunion** — 22 August 2026, 11.00 AM - 22 August 2026, 5.00 PM. Wills Memorial Building, Queens Rd, Bristol BS8 1RJ.\n"
        summary: "Historians who graduated in 1976 mark fifty years over lunch at the Wills Memorial Building, with an optional public Tower Tour beforehand. Organised by alumni volunteers, and independent of the University."
        description: "The Historians of 1976 are delighted to invite you to a reunion to mark their 50th anniversary, on Saturday 22 August 2026.


          Join them to catch up with friends and share memories over a celebratory lunch at 1 pm. They will also be going on a public Tower Tour of Wills Memorial Building at 11 am before the lunch. This costs £5 per person and you are welcome to join.


          **Contact / RSVP**


          If you are interested in coming along, please contact the reunion organisers on bristolhistory1976@gmail.com. They will send further details closer to the time.


          You are more than welcome to bring a guest, and please do share the invitation with any fellow historians you are still in touch with.


          **Organisers**


          This event has been organised by Pat, Susanne, Vijay, Roger, Jane, Yvonne and Tess. They hope you will be able to join them for this celebration.


          This event is organised by alumni volunteers and is independent of the University of Bristol. The University of Bristol does not accept any liability for this event.\n"
