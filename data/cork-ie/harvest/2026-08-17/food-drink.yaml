        raw: "**Halloween Camp 2026**


          \"Join us for our 4-Day Halloween Cookery Camp, where young chefs will conjure up

          frighteningly delicious treats, creepy creations, and magical recipes in a

          fun-filled kitchen packed with Halloween spirit!\"


          - \"Create spooky bakes and monstrous cupcakes\"

          - \"Decorate ghostly biscuits and creepy cookies\"

          - \"Cook hauntingly tasty savoury dishes\"

          - \"Make wickedly delicious chocolate treats\"


          Camp Details: \"4-Day Halloween Cookery Camp / Ages 4–17 years (children are

          grouped by age) / Only €95 per child / The Cookery Cottage, Douglas, Cork\"


          \"Juniors: 10:30am-1pm, ages 5-8 years. Pre-teens: 10:30am-1pm, ages 9-13 years.

          Teen Camp 2-5pm, ages 13-17 years.\"


          \"Recipes, aprons, lunch, drinks & treats included in the price. A non-refundable

          deposit of €30.00 is required to hold a space in the camp. Balance is due 1 week

          prior to camp start date.\" BOOKINGS: 021 436-5083.\n"
        summary: "A four-day Halloween cookery camp for children from four to seventeen, grouped by age into two morning classes and a teen afternoon class. Ninety-five euro a child including lunch; the page never says which four days."
        description: "\"🕸️🎃 CALLING ALL LITTLE WITCHES, WIZARDS, GHOULS & GOBLINS! 👻🧙‍♀️

          Something spooky is brewing at The Cookery Cottage this Halloween…


          Join us for our 4-Day Halloween Cookery Camp, where young chefs will conjure up

          frighteningly delicious treats, creepy creations, and magical recipes in a

          fun-filled kitchen packed with Halloween spirit!


          - Create spooky bakes and monstrous cupcakes

          - Decorate ghostly biscuits and creepy cookies

          - Cook hauntingly tasty savoury dishes

          - Make wickedly delicious chocolate treats

          - Learn new cookery skills, make new friends, and enjoy four days of Halloween

          \  magic!


          Every young chef receives all ingredients, recipes, equipment, and an apron—then

          takes home their spooky creations each day to share (if they dare!).


          Beware… our Halloween camps disappear faster than a ghost in the night! Spaces

          are limited, so book now before they vanish!


          Sessions: Juniors 10:30am-1pm (ages 5-8), Pre-teens 10:30am-1pm (ages 9-13),

          Teen Camp 2-5pm (ages 13-17).


          Recipes, aprons, lunch, drinks & treats included in the price. A non-refundable

          deposit of €30.00 is required to hold a space in the camp; this can be paid

          online or over the phone. Please contact us to see if we have space before

          paying the deposit. Balance is due 1 week prior to camp start date. Please let us

          know if there is any dietary needs / allergies.


