    notes: "The catalogued root 302s to /site/index.asp, which is the full listing, exactly as the hint

      says. `fetch.url` is the redirect target. One fetch was enough; the section links on 301.asp are

      filters over the same rows, so following them would only re-read what is already here. Served

      fine to a Chrome user-agent; the page is windows-1252, so it must be decoded as such or every

      pound sign and curly quote comes out mangled.


      46 dated shows, Fri 4 Sep 2026 to Thu 25 Feb 2027. The listing prints no year except on one row

      (\"Friday 23 October 2026\"), so the rest are inferred from the page's own ordering — and every

      one of the 46 weekdays checks out against the inferred year, so all are high confidence.


      This is an **organiser, not a venue**: 45 of the 46 are at the Hen & Chicken Studio and one —

      Neil Delamere, 30 Oct — is at the Redgrave Theatre. Per the hint, `venue.sourceId` is set on

      every event, to comedy/hen-and-chicken or theatre/redgrave-theatre, both of which are

      catalogued. Nothing appeared at the other rooms the hint mentions (Lakota, Bristol Old Vic,

      Tobacco Factory, 1532).


      Jacob Hawley is listed as one block for \"Thur 8 & Fri 9 October\" and is recorded as a two-night

      `run`. The same two nights appear as two separate dated events on comedy/hen-and-chicken; both

      records stand as each page presented them.


      **No `status` is set from the button text.** Six rows offer only \"SEE MORE\" where the other

      forty say \"SEE MORE / BOOK ONLINE\", and three of those six are confirmed sold out by the Hen &

      Chicken's own banner (Zachary Ruane 7 Sep, Peter Antoniou 26 Nov and 3 Dec) — but the other

      three (Jamie Hutchinson 9 Sep, Robert White 14 Oct, Fatiha El-Ghorri 18 Nov) are not, so the

      missing button is not a reliable sold-out signal and this page never says the words. Left

      `scheduled` rather than inferred. Those same six rows also print no ticket price, so `price` is

      omitted on them rather than guessed — including `free`, which is not set on a missing price.


      No `description` captured: the index already carries a paragraph of the venue's own copy per

      show, and 46 events is well past the point where §3 makes opening each page worthwhile. `raw`

      holds that paragraph.


      Overlaps heavily with comedy/hen-and-chicken — the Comedy Box has run out of that building since

      1998. 43 of these 46 rows also appear there (they map to 44 of the Hen's 46, because Jacob

      Hawley's two nights are one row here and two there). The three the Hen's comedy category does not

      carry are Boothby Graffoe & Antonio Forcione (4 Sep), Joe Wells (4 Oct) and the Redgrave date

      (30 Oct); the Hen carries two the Box does not, its Wednesday Night Improv dates.

      **Deliberately not deduplicated**:

      each observation records what that page said, which is the point of the log, and the two differ

      in ways worth keeping (the Hen states sold-out and gives 20:00-22:00 windows and its own images;

      the Box gives doors times, price bands, and the Redgrave date the Hen does not carry at all).

      Compile-time dedup will need to handle it, and cannot do so on event id, which includes

      `sourceId`."
