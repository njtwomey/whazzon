      talks, exhibitions and family events. Everything is free.
      This is the single highest-yield fetch in the category, but only in July
      and August: the programme goes up a few weeks ahead and comes down after.
      Child pages carry the detail — /events/, /events/family-friendly-events/,
      the buildings list grouped as civic, commercial, cultural, military,
      sacred, educational and historic, and /heritage-week/ for the week that
      follows.
