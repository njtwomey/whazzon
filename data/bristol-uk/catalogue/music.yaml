  - id: music/ashton-gate-stadium
    name: Ashton Gate Stadium — concerts
    category: music
    kind: venue
    status: provisional
    url: https://www.ashtongatestadium.co.uk/
    area: Ashton Gate
    tags: [stadium, major, summer]
    cadence: monthly
    hints: |
      Stadium concerts, a handful each summer, announced up to a year ahead.
      Monthly is enough — the programme barely moves week to week. Sport at the
      same venue is catalogued separately under sport. Listings live on the root,
      under an "Upcoming Events" heading; the /events/ path 404s despite being
      linked from that heading. Most of what appears there is conferences,
      luncheons, charity challenges and trade shows, so filter hard for music.
    notes: |
      Verified 2026-08-17: root is headed "Ashton Gate - Largest Events Venue In Bristol & South West" and gives Ashton
      Road, BS3 2EJ, matching area Ashton Gate. Dated events are genuinely on the root, including a music one (Michael
      Jackson Tribute Night, 28 Nov 2026), so the root is acceptable here; the catalogued /events/ path was retested and
      is a hard 404.
    addedAt: "2026-08-16"

  - id: music/bristol-beacon-presents
    name: Bristol Sounds
    category: music
    kind: festival
    status: provisional
    url: https://www.bristolsounds.co.uk/
    area: Harbourside
    tags: [summer, outdoor, concert-series]
    cadence: monthly
    hints: |
      Outdoor summer concert series at the Amphitheatre. Dormant most of the
      year, with the whole lineup announced in one go over winter and spring.
      Expect to find nothing between the end of the season and the next
      announcement — that is the normal state, not a broken URL. The page is
      mostly an image carousel with artist names in the filenames and no dates in
      the text, so a run that finds no dated events here is correct.
    notes: |
      Verified 2026-08-17: URL is unchanged and correct. Page names "Canons Marsh Amphitheatre, Canons Way, BS1 5LL",
      which matches area Harbourside. It listed no dates when checked, consistent with the between-seasons behaviour in
      the hints, so this is not a URL fault. Two mismatches for an owner: the page is presented by Crosstown Concerts,
      not Bristol Beacon, so the id music/bristol-beacon-presents is misleading against the name Bristol Sounds; and the
      footer still reads "copyright 2025".
    addedAt: "2026-08-16"
