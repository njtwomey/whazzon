  - id: music/bodega
    name: Bodega
    category: music
    kind: venue
    status: provisional
    url: https://www.bodegacork.ie/
    area: City Centre
    address:
      street: 46-47 Cornmarket Street
      city: Cork
      lat: 51.899482
      lon: -8.476506
    tags: [ independent, club, nightlife, free ]
    cadence: weekly
    hints: |
      Large room on Cornmarket Street, off the Coal Quay — club nights, DJs and
      occasional live bands. Part of the Cork Heritage Pubs group, which lists
      its gigs as "The Old Town Whiskey Bar at Bodega", so the group page is the
      more reliable source of dates.
      The host has a TLS quirk: it completed for curl with a browser user-agent
      but aborted the handshake for a stricter client. Retry rather than
      treating a handshake failure as a dead site.
    notes: |
      Verified 2026-08-17: https://www.bodegacork.ie/ returned 200 to curl with
      a browser user-agent, and the same URL raised an SSL
      UNEXPECTED_EOF_WHILE_READING from Python's client, so the certificate or
      TLS termination is imperfect but the site is live. bodega.ie was not
      reachable. Address is from the corkgigs profile. Dates were not confirmed
      on the venue's own page — the Cork Heritage Pubs listing is what confirmed
      it is programming.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

