    events: []
    notes: "Needs the browser user-agent, exactly as the hint says; with it, 200 and \"Cork Cinema Film Times - Cinema Listings for Cork\". The index carries no showtimes at all — one tile per cinema with a film count, and nothing else — so there is nothing here to record without a fetch per cinema, and those would duplicate the four venue sources. Empty `events` is the honest result. What it is for is the trading signal, and today it names eight County Cork cinemas: The Arc Cinema, Cork (30 movies), Omniplex Cork, Mahon Point Shopping Centre (18), The Arc Cinema, Mallow (18), The Arc Cinema, Midleton (16), The Reel Picture, Blackpool (11), The Reel Picture, Ballincollig (8), Bantry Cinemax (7) and Park Cinema, Clonakilty (7). The same four sit inside the radius, with the same counts the catalogue recorded this morning. Still no Douglas cinema, no Gate and no Triskel — the first two corroborate the closed entries, and the third is a reminder that this source only knows commercial cinemas, so it can never be a check on Triskel or Cork Cine Club going quiet."
