    notes: "33 events: 32 from the two pages of /whatson/ (page 2 at https://arnolfini.org.uk/whatson/page/2/; no page 3), plus the Joy Gregory preview evening, published today and not yet on the index, which surfaced through the site's WordPress REST API and was confirmed by opening its page — the only event page opened. The index prints title, dates, category and image but no times, prices or copy, so one fetch of https://arnolfini.org.uk/wp-json/wp/v2/event?per_page=100 supplied the excerpts in raw: it returns link, title and excerpt for the 100 most recently published event posts, with no dates and an empty acf block, so it supplements the index rather than replacing it — worth an `api` route in the catalogue with that caveat. Six events took their times, and FVU New Takes its current film, from the 2 September newsletter ('September at Arnolfini' in data/gb-bristol/mail/2026-09-11/art.yaml); no event came only from the mail — everything it lists is on the site. The newsletter's Creative Wellbeing Workshop entry repeats the Deep Listening blurb word for word, so only its date and time were taken; its booking link for the Baldock tour goes to Headfirst rather than the site, and the site's own page is recorded as the url. QiGong in the Gallery and Threads: Movement Workshop, listed on 28 August for 10–11 September, are no longer on the index and are not recorded. Prices are not printed on the index and are omitted except where a page or excerpt stated them."
