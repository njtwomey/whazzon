    notes: "The Headfirst mirror works and is the venue's real programme: headed \"What's on at Strange Brew in Bristol\", 10-12 Fairfax St, BS1 3DB. It listed 82 dated events from 18 Aug 2026 to 28 Jan 2027 and I recorded the soonest 16, to 4 Sep, truncating the remaining 66 for budget. No times and no prices anywhere on the index, so `raw` carries date, title and the venue's own genre words only; no event pages were opened, so no `description`. The programme is genuinely mixed and the tags carry the whole distinction — the same week holds a jazz gig, a drag cabaret, a film screening and two techno nights. Six of the 82 are marked sold out by the venue, one of which (Way Dynamic, 2 Sep) falls inside my window. `venue` is unset throughout: the events are at Strange Brew, which is itself the catalogued source, and Headfirst is only the server-rendered mirror of the widget its own site embeds."
