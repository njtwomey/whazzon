    body: "Hungry? Dig into the latest food and drink news from Bristol24/7 🍴


      View this email in your browser <https://mailchi.mp/bristol247.com/restaurant-to-close>


      https://us.list-manage.com/K4Ov7xGoWxf?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=xz-Vd2vXO8vvkmg2xmb8QFV2pndaFuLmDxMX7CnVL2iF_ZJ6oXh9DY573iGI


      THURSDAY, SEPTEMBER 10 2026


      This newsletter is brought to you for free by Bristol24/7. Become a member to support our independent journalism and social impact projects.


      If you're like me and swear by your morning coffee, the Bristol Coffee Festival this weekend is your ultimate treat. Bristol is already blessed with too many amazing coffee shops, but to have so many talented roasters under one roof is a joy of a different kind. To make it even better, former World Barista Championship winner James Hoffman will be in attendance, speaking about the future of coffee. What's better? The supply of coffee is unlimited - depending only on how much you can handle. Hopefully I'll be seeing you there!


      https://us.list-manage.com/G5LyJ6QV3V4?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=4RgrYckKBKdtH1PCOCA0Tj1Sq1Ze5MOTaRBjxrNdc_EEcQnQZnmuVAJb5AZG


      Award-winning restaurant to close after a decade <https://us.list-manage.com/16Slo9VqfMg?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=gGYiqiieKRjpi-eQuZw-sbqQ60HKAuezVLLsGbcizjqP4BLZnm8I4YqvI5ke>

      Tess' recommendations for our annual EatDrink24/7 guide are some of the most fun to read. I'm incredibly sad to see their beautiful restaurant close, but also looking forward to everything they do next. Planning a visit soon, so I can properly say goodbye to them and Box-E's beautiful cooking.


      Read full story <https://us.list-manage.com/EaCWIgNqlGx?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=1cZapnCrGAXhuU1NvFC9eWbvOc8PxI-F7JQh9D-38YsYasvEDDFNfzaSv8hm>


      https://us.list-manage.com/zcaSi6WtYug?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=ZH70B3vE9RTADYwhVYo3N73azBU-J3BEGhTmOmYOCoIZxRTeUMCfARri90_A


      Bristol brewer wins top award for world’s best alcohol-free pale ale <https://us.list-manage.com/MHedNXAhPSt?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=cxYgeR9ObHCkN4N2sMAecHWBO8oT5DK72JhMDD4N6NOF4v41gSjrrEuJ2Gob>

      The alcoholic version of Kaleidoscope is certainly my favourite beer in Bristol, but after this win, I'm very tempted to try its alcohol-free iteration. Maybe this weekend when I'm tired of downing too much coffee?


      Read full story <https://us.list-manage.com/1CfKdEWqasi?c2id=63f64146b3ce1ab2ec09c8ae56594b91&m=3J2XAAlRNHezC6Pf68bFIlfdxxkrH5SekuDdKhMjodz0Ws0p1GB5110R6DSU>


