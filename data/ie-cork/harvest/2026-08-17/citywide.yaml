    notes: "\"Showing 1-150 of 1,385 events\", window Mon 17 Aug 2026 to Mon 16 Aug 2027, ten pages of 150.

      TRUNCATION: read pages 1-5 (17 Aug - 24 Sep) and page 10 (25 Mar - 19 Jun 2027) = 785 of 1,385 rows, 57%. Pages 6-9, covering late September 2026 to March 2027, were not read, so the autumn and winter middle of the year is missing from this observation. The 785 rows fold to 264 distinct events; 131 are recorded here.

      Also read the source's booking route, https://tickets.peoplesrepublicofcork.com/ — 52 dated ticketed shows to Feb 2027 with prices, mostly Coughlan's and Levis'. The Coughlan's prices below come from there, since the guide itself prints none. Only one fetch can be recorded in fetch.url; the listings route is recorded because it is the one the events came from.

      Dropped as outside the 12 km radius: Bantry, Bandon, Macroom (Briery Gap), Ballydehob (Levis Corner House), Ballycotton (Sea Church), Fermoy (The Richmond Revival), Cape Clear, Sherkin Island, Glengarriff (The Ewe Experience), Kilbrittain (The Hideout Café), Ballyvourney (The Mills Inn, An Súgán, Ionad Áise), West Cork Collective Gift Shop, Blackwater Valley Makers Gallery, Camus Farm, Hanna's Bees, and the Lusitania Museum at the Old Head of Kinsale. Whitechurch and Glounthaune, both about 9-10 km out, were kept.

      Also dropped, deliberately: roughly twenty one-off DJ slots in the Crane Lane's Crystal Bar, the Vicarstown and Bodega that appear under a different DJ's name each week. The residencies that repeat under a stable name are recorded as recurring; the one-off names are not.

      CATALOGUE HANDOVERS.

      (1) The index truncates every title longer than about 55 characters and appends \"..\"; the full title survives only in the URL slug. Six rows here carry a title corroborated from another source read today, with the truncated string kept verbatim in raw. Worth a hint.

      (2) Pagination by GET ?page=N works even though the visible controls POST. Confirmed on pages 2-5 and 10.

      (3) \"Centre Park Road\", the venue PROC gives Circus Vegas, is the Live at the Marquee ground — entertainment.ie lists the same run at \"Live at the Marquee, Cork\". Set to music/live-at-the-marquee here.

      (4) \"Cork City Trails\" is a walking-tour operator, not a venue, so its three tours carry a meeting point as venue.name rather than a sourceId.

      (5) The Lee Sessions trad trail is advertised under one title at seven pubs on overlapping dates. Three of them start on 17 August, and eventId is sourceId + normalised title + anchor date, so the plain title would mint one id for three events. Titles are suffixed with the pub for that reason."
