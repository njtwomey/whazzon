    notes: "The hint is right that the listings live on the root under \"Upcoming Shows\", and /events/ was not fetched again — the catalogue already records it as a group-bookings page. The block holds 12 dated shows from 15 Aug to 13 Nov 2026, each with a start and end time, a one-line teaser and its own /<slug>/ page. All 12 are recorded, plus the weekly Sunday trad session the root advertises in its own words, giving 13 events.

      The index is thin enough to justify opening event pages, so **five were opened** — Caleb Klauder & Reeb Willms, Alfi, Mick Hanly, Ger O'Donnell & Trevor Sexton and Pilgrims — and their `description` is the venue's own copy in full. The other seven carry only the index teaser in `raw`.

      The 15 Aug J.P. Cormier date has already passed and is recorded with its real past date so the pipeline can retire it, rather than being dropped or made undated.

      **No prices anywhere on this site**, not on the index and not on the five event pages I opened. The single price below, €25 + BF for Ger O'Donnell & Trevor Sexton, comes from the corkgigs diary. Three titles carry \"Sold Out\" inline (Wallis Bird, Chris Kent, and both White Horse Guitar Club nights, one of them as \"Sold Out – ... (Going Fast)\", which is contradictory); that is stripped to `status: sold-out` and the wording kept in `raw`.

      Two rows print the weekday as \"Thurs\" and two omit the year; every inference was weekday-checked and all 12 are consistent with 2026. Chris Kent is a comedian rather than a musician and is tagged as such — the venue's own nav calls the strand \"Music & Comedy\". The venue also runs the Ballincollig Winter Music Festival at /ballincolligwintermusicfestival/ and an Emerging Artist Residency at /emergingartistresidency/; neither was fetched, and the festival is probably a festivals-category matter."
