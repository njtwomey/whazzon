    notes: "The catalogue hint is now out of date and should be corrected. The homepage is no longer the diary: it is a Blazor app that server-renders one carousel slide per strand, so a plain fetch of it yields exactly two dated rows. The real diary is /events/ — twenty-seven dated public shows from tonight to 4 Dec, with times, weekdays and blurbs — and the filter is /events/?filter=Events, not /?filter=Events as catalogued (the latter is just the homepage again). /events/?filter=Classes is the school side, and /events/?date=Today and ?date=ThisWeek exist too. Read with curl and a browser user-agent and parsed as HTML. Every row prints a weekday and all check out against 2026. The diary carries no prices except where a show says it is free, and its cards are rendered without hrefs, so a deep link is recorded only where the same title is linked from the homepage carousel; the rest are left without a `url` rather than having one constructed. Three shows fall in the bank holiday window, including a Monday 31 Aug student showcase — a night a theatre would usually be dark — but nothing here is billed as a bank holiday event, so none is tagged as one. The Monday drop-in is recorded from its stated pattern; whether it runs on the bank holiday itself is not stated and the Classes listing was not read in full."
