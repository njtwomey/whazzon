    notes: "Nothing over 29–31 August: the calendar's next entry is 4 September. Seven meetings are listed, and because the index gives only a date and one teaser sentence and the whole programme is small, all seven event pages were opened under §3 — seven fetches, all HTTP 200. That was worth it: the detail pages carry start times, a named leader and a full meeting point with grid reference and what3words, none of which is on the index. It also contradicts a catalogue hint. The hint says the listings \"do not say which section (botany, ornithology, geology, invertebrates) a meeting belongs to, so leave `subcategory` off\" — but each event page prints an explicit \"Category\" field, and `subcategory` is now set from it verbatim. The hint should be updated. The spread of categories confirms the other standing concern: only two of the seven are botany, and this entry sits in the gardens category under a name (Bristol Botanical Society) that does not match the site (Bristol Naturalists' Society). Two of the seven are outside the location — the OUGS outing to Symonds Yat and Ross-on-Wye is in Herefordshire and Gloucestershire, Oldbury Power Station is on the Severn well north of the city — and both are recorded, since unlike the National Garden Scheme this source has no in-Bristol subset to fall back on and its meetings are genuinely what a Bristol member would travel to. No prices anywhere; the site charges nothing at the point of listing."
