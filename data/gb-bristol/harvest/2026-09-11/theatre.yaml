        title: "The Star Catchers"
        occurrence:
          kind: "run"
          start: "2026-12-05"
          end: "2026-12-11"
        status: "scheduled"
        timesText: "Various dates and times between 5th and 11th December; two weekend matinee showings"
        tags:
          - "young-people"
          - "community"
          - "seasonal"
          - "family"
        raw: "**The Star Catchers** By Phoenix Theatre — Various dates and times between 5th and 11th December. Something strange is happening in the night sky… The stars are disappearing — and without them, the magic of Christmas is beginning to fade. In a quiet corner of the woods, an unlikely discovery sets a curious adventure in motion, while elsewhere a festive hotel is losing its sparkle and, in fairyland, the fairies are finding their magic mysteriously slipping away. Could it all be connected? As the worlds collide, a daring quest begins to uncover who — or what — is behind the missing stars. Join us for a thrilling festive adventure full of mystery, magic and, of course, stars! [Book your tickets for The Star Catchers](https://us.list-manage.com/gTTEtEyhL0e?c2id=178ee8babe3db6d0c3bd9d9141602d5e)"
        summary: "acta's Christmas show, performed by its Young Adults group Phoenix Theatre: a festive quest to find out why the stars are vanishing, with two weekend matinees among the dates."
        confidence: "medium"
