      Studio group in the Wandesford Quay building it shares with Cork
      Printmakers and the Lavit Gallery, with two gallery spaces and Studio 12
      as a project space.

      The events page tags every entry either "Members Event" or "Public Event"
      — only the public ones belong on the site, and the distinction is printed
      in the listing itself. Dates are in prose ("Thursday 27 August 6 pm"),
      with no year given, so read the year from the page order rather than
      assuming. /whats-on/ does not exist and silently 301s to the homepage.
    notes: >-
      Verified 2026-08-17: page titled "Events – Backwater Artists", address read off its own contact page as Backwater Artists Group, Wandesford Quay, Cork T12 E26D. Well populated — eight or more dated entries from 12 August to late September 2026.

      Worth a curator's eye: the public programme is artist talks, curator visits, peer critiques and studio tours rather than hands-on making, so this may belong in `art` instead. It is kept here because its own site says the public programme "includes artist talks, workshops, and guided tours", and because Heritage Day and Culture Night open studios are things you can turn up to. If `art` also catalogues it, drop this entry rather than carrying both.
