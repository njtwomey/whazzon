    verifiedAt: "2026-08-17"

  - id: making/cork-craft-and-design
    name: Cork Craft & Design
    category: making
    kind: organiser
    status: provisional
    url:
      - role: listings
        url: https://corkcraftanddesign.ie/collections/workshops
      - role: api
        url: https://corkcraftanddesign.ie/collections/workshops/products.json?limit=250
        note: the dated programme as Shopify products; date, time and venue are inside the product title
    homepage: https://corkcraftanddesign.ie/
    area: Douglas
    address:
      street: 27A St. Patrick's Woollen Mills
      locality: Douglas
      city: Cork
      postcode: T12 H932
      country: Ireland
    tags: [ craft, workshops, community, independent ]
    cadence: monthly
    hints: |
      Membership body for Cork makers, with a gallery-shop at St Patrick's
      Woollen Mills in Douglas and a second unit in Douglas Shopping Centre.

      This is the booking-platform case in its purest form: the site is Shopify,
      /pages/events-whats-on exists but is an empty page with only a heading on
      it, and every real date lives in the workshops collection as a product.
      The whole record is in the product title — "Lino Printing Workshop with
      Solas agus Scath- Sat 15th Aug 1-4pm- Fota House" — so parse title, not
      body. Titles give no year; take it from the collection being current.

      Workshops are held at several venues, not at the Douglas shop: St Peter's
      on North Main Street and St Patrick's Woollen Mills are in the city, but
      Fota House (Carrigtwohill) and Greywood Arts (Killeagh) are outside it, so
      set `venue` on those events rather than letting them inherit this source's
      address. Sub-collections exist per venue (/collections/fota-house-workshops,
      /collections/greywood-workshops, /collections/st-peters-workshops).

      The collection is an August programme in practice — expect it near-empty
      outside Cork Craft Month.
    notes: >-
      Verified 2026-08-17: corkcraftanddesign.com 301s to corkcraftanddesign.ie, same organisation. Address read off its own /pages/our-locations. The workshops collection held 11 dated workshops from 14 to 29 August 2026 and the products.json endpoint returned all of them.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/mtu-crawford-college
    name: MTU Crawford College of Art & Design
    category: making
    kind: listing
    status: provisional
    url: https://crawford.mtu.ie/areas-of-study/
    homepage: https://crawford.mtu.ie/
    area: City Centre
    address:
      street: Sharman Crawford Street
      city: Cork
      postcode: T12 XK25
      country: Ireland
      lat: 51.895121
      lon: -8.48183
    tags: [ university, courses, ceramics, textiles, adult-education ]
    cadence: quarterly
    hints: |
      The public-facing part of the art college is the evening and short course
      programme, and /areas-of-study/ is the index that groups it: "Evening
      (Semester 1)", "Evening (Semester 2)" and "Short Courses" sit below the
      degrees. Ignore the undergraduate and postgraduate blocks — a four-year BA
      is not an event.

      The making-relevant ones are Ceramics (Intro to Throwing, Processes and
      Techniques, The Potter's Wheel, Bringing Your Ideas to Life), Textiles
      (Techniques and Materials, Creating 2D and 3D Textile Art), the Art
      Textile certificate and the drawing/painting courses. Each is an
      accredited 5-credit module, one evening a week for a semester, so record
      one recurring entry per course with its weekday and time rather than a
      session per week. Dates and prices are on the individual
      /courses/<slug>/ pages, not the index.

      Note the college is spread over four addresses — 46 Grand Parade, the
      Envision Centre on Sober Lane, Sharman Crawford Street and MTU
      Bishopstown. Evening courses have run at Sharman Crawford Street.

      /news/adulteducation/ is a stale September 2024 announcement whose links
      still point at the retired crawford.cit.ie domain; do not harvest dates
      from it.
    notes: >-
      Verified 2026-08-17: crawford.cit.ie no longer resolves and the college is at crawford.mtu.ie. /courses/ 301s to /areas-of-study/, which is where the evening and short course index lives. Eircodes for all four campuses are printed on its own /connect/ page; Sharman Crawford Street T12 XK25 is recorded because that is where the evening courses have been held — re-check if a semester moves.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: making/cork-textiles-network
    name: Cork Textiles Network
    category: making
    kind: organiser
    status: provisional
    url: https://corktextilesnetwork.com/events/
    homepage: https://corktextilesnetwork.com/
    tags: [ textiles, community, workshops ]
    cadence: monthly
    hints: |
      Membership network for textile and fibre artists, founded 1998. Programme
      is a handful of workshops a year led by members (needle felting, foil
      decoration, layered cloth) plus two annual exhibitions and an AGM.

      Most workshops are members-only and say so in the listing — keep that
      distinction. The events index shows truncated excerpts with the date
      buried in the body text, so follow each "Keep reading" link rather than
      parsing the index. Several posts describe past events with no marker, so
      check the date before treating anything as upcoming. No address: the
      network meets in borrowed rooms and has exhibited at Bishopstown Library.
    notes: >-
      Verified 2026-08-17: corktextilesnetwork.com is the live site and carries the network's own history and member list. The older corktextiles.com also answers 200 but renders nothing except a cookie notice — a dead shell, not used here.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

