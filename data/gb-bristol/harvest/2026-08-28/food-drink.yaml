    notes: "Catalogued URL is correct and served the events index first time (200); page 2 of 2 was followed for the rest of the horizon. The whole programme is recorded — 23 events, which is what the page's own \"Showing 23 products\" counter claims — so nothing is truncated in either direction. The index is thin (title, day and month, venue, one clause, no time and no price at all), so per §3 I opened event pages, spending them on this weekend first as the brief directs: the five events dated 29-30 August, tonight's Summer Session, and the three standing recurring events, nine pages in total. Those nine carry a `description` and exact times; the fourteen events from 04 September onwards are recorded from the index alone and therefore have no time, no price and no description — that is the limit on this observation's coverage.

      **Bank holiday.** Five events fall on 29-30 August and all five are recorded in full. Nothing at all is listed for Monday 31 August. Only two are billed by the venue as bank holiday events and only those two carry the `bank-holiday` tag: Downbeat Melody Soundsystem (\"Celebrate the Bank Holiday with global grooves...\", \"a Bank Holiday weekend celebration as part of the East Bristol Brewery Trail\") and the City of Bristol Brass Band (\"Join us on the bank holiday weekend for a an early evening of...\" — the doubled article is theirs). The two East Bristol Brewery Trail days and Roots Society sit inside the weekend but neither listing mentions the bank holiday, so per the brief they are untagged.

      **Altered hours, as printed, not inferred.** Both venue pages print a bank holiday block above their normal hours. The Taproom, Old Market (/pages/the-wiper-and-true-taproom-old-market-bristol) prints \"Opening Hours / Bank Holiday Monday / Monday: 12pm - 10.30pm\" against a normal Monday of \"4pm - 10.30pm\" — four hours earlier — and separately lists \"Planned Closure Dates: Monday 7th September; Sunday 11th October from 5pm\". The Barrel Store, St Werburghs (/pages/barrel-store) prints \"Opening Hours / August Bank Holiday Opening Hours / Monday: 3pm - 9.30pm\", and its normal week starts on Wednesday, so it is opening on a Monday it is otherwise shut. Neither page ties the wording to a specific date beyond \"Bank Holiday Monday\" / \"August Bank Holiday\", and neither is an event, so both are recorded here rather than as rows. Two fetches.

      **For stage 1 — the catalogued identity of this source is wrong, and it matters for every event above.** The source is catalogued as \"Wiper and True Barrel Store\" with `area: Old Market`, but the site runs two separate venues and labels every listing with which one it is at: \"The Taproom, Old Market\" at Unit 11, City Business Park, Easton Road, BS5 0SP (19 of the 23 events, and the site's own filter agrees: \"The Taproom, Old Market (19)\"), and \"The Barrel Store, St Werburghs\" at 2-8 York Street, BS2 9XT (the other 4: Board Games Night, the Brass Band, and the two Pottery & Pints workshops — the filter says \"The Barrel Store, St Werburghs (3)\", counting only the three then-future ones). The catalogued name and the catalogued area therefore name different buildings, and the Taproom's postcode is Easton rather than Old Market despite its name. I have deliberately left `venue` off every event rather than guess which of the two the source is meant to be — setting it would assert the answer — and the printed venue line is kept in each event's `raw` instead. Whichever way stage 1 resolves it, this probably wants to be two sources.

      Two smaller handovers, both from pages I opened: the standing Brewery Tours page still says \"2025 dates live now\" and sends booking to Eventbrite, which is a stale line on an otherwise current page; and the Board Games Night index card says \"Every Friday\" while its own detail page says \"every first, second and third Friday of the month\" — the detail page's wording is the one recorded. Route discovered, not written to the catalogue: https://www.wiperandtrue.com/products/<handle>.js returns each event's price, availability and images as JSON, though its `description` field comes back empty because the body text lives in metafields, so the rendered page is still needed for times and copy. Note also that the whole site sits behind an age-verification interstitial that a browser user-agent passes straight through."
