        raw: "19 December 2026


          **Christmas Murder Mystery Evening** — Take part in an exhilarating evening of

          entertainment on board the captivating SS Great Britain.\n"
        summary: "A three-course festive dinner on board that turns into a whodunnit — the strange case of Santa's 'Claws', set at a snowbound school board meeting in Christmas 1937."
        description: "Take part in an exhilarating evening of entertainment on board the captivating SS Great

          Britain. During your dinner, keep your eyes open for clues as you become the detective and

          help solve the mysterious crime. We offer guests the ultimate, memorable evening.


          **The plot** — Introducing the strange case of Santa's 'Claws'…


          Christmas 1937. Mr Uffton Harlecombe had just left the December meeting of the Board of

          Governors at St David's School. However, there was very little 'Christmas cheer' at the

          meeting this evening. In fact, as he pulled his thick coat tightly around him to shield him

          from the silently falling snow, he smiled to himself. He had left no one at that meeting in

          any doubt that crossing him was not a smart career move.


          Still laughing to himself, he crossed the road and walked along the snow-covered side

          street back to his Bentley Sports motor car. Everywhere was silent; a chill wind suddenly

          picked up, making him huddle in a doorway to light his cigar. Perhaps he may have seen the

          white-bearded face and the crimson costume for a fleeting second. Maybe he even saw the

          weapon—a wicked steel claw!


          Uffton Harlecombe had misjudged tonight's meeting. The information he had spilt to the

          assembled people had been taken far more to heart than he could ever have imagined. One

          person would make this a Christmas everyone wants to forget. The spirit of Christmas may

          never die, but there are people here tonight who are going to do just that!!


          **Key info** — Price: £99pp. Time: 6.30pm-12am. Includes: arrival drink, 3 course festive

          menu & murder mystery experience. Group bookings: for tables of 8, contact

          events@bristoldockyards.org.\n"
        confidence: "high"
    notes: "The rebrand holds: the page brands itself Bristol Dockyards throughout, the `<title>` reads \"What's On | SS Great Britain - Bristol Dockyards\", the footer reads \"Bristol Dockyards @ 2026 … Operated by SS Great Britain Trust. Registered Charity: No. 262158\", and contact addresses are now @bristoldockyards.org. Same trust, same site, new brand — so the catalogue `name` \"Brunel's SS Great Britain\" is out of step with what the venue calls itself, which is a decision for the catalogue owner and not something recorded here. Eleven cards, and all eleven event pages were opened for `description`; that is what turns yesterday's four undated month-range rows (Go Aloft, Sunday Roasts, Afternoon Tea, and the walking tour's dates) into real dates and patterns, since the index prints only \"March – October 2026\" with no day of month. One extra row was split out of the Ma-ad Science Mayhem page: the Aardman Shaun the Sheep model workshop on 28 October is separately ticketed and separately dated, so it is its own event even though it shares that URL. Sunday Roasts is the one thing still soft — the page gives sitting times but hides individual dates behind a booking widget, so it stays `recurring` with no start or end rather than inventing a 1 June. The Calm Sessions page contradicts itself and is flagged on that row. Where the shop still links to shop.ssgreatbritain.org the old domain survives in outbound links only."
