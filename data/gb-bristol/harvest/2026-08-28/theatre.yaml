    notes: "A very dense diary — roughly a hundred listings reaching to October 2027 — and it books further ahead than any other theatre source here. The index prints title, a date or date range with an explicit year, and an availability flag (\"Last Few\", \"Sold Out\"); it prints no times, no prices, no images and no blurbs, so those fields are absent throughout and the year never has to be inferred. **Truncated:** everything from January 2027 onwards is left out — around thirty further listings, from NT Live's Golden Boy on 6 Jan 2027 to The Comedy Store on 30 Oct 2027 — in favour of taking 29 Aug to the end of 2026 whole. Nothing later than that is affected by this weekend. One event page was opened under the bank-holiday rule, Things I've Never Said on Sat 29 Aug, which supplied its time, its prices and its content warning; it is not billed as a bank holiday event, and there is nothing at all on Sun 30 or Mon 31 Aug. \"Last Few\" is availability rather than a status the schema models, so it is kept in `raw` and the row stays `scheduled`."
