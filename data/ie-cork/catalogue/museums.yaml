  - id: museums/st-fin-barres-cathedral
    name: St Fin Barre's Cathedral
    category: museums
    kind: venue
    status: provisional
    url: https://events.stfinbarres.ie/
    homepage: https://www.stfinbarres.ie/
    area: Barrack Street
    address:
      street: Bishop Street
      city: Cork
      postcode: T12 K710
      country: Ireland
      lat: 51.894356
      lon: -8.4805
    tags: [ heritage, ticketed, exhibitions, community ]
    cadence: monthly
    hints: |
      Two separate WordPress sites. www.stfinbarres.ie is the visitor site and
      its /tours-and-events/ page is a signpost with no dates on it; the diary
      lives on the events.stfinbarres.ie subdomain, which is the URL to fetch.
      It filters by All / Music / Readings / Talk & Discussion and prints full
      dates and times ("17 August 2026 · 7:00 pm"), with "Free" where
      applicable.
      Both sites run The Events Calendar but both answer
      /wp-json/tribe/events/v1/events with zero events, and /events/?ical=1
      returns an empty body on both — the listings are hand-built pages, so
      there is no cheap structured route here.
      Expect a monthly rhythm of Friday lunchtime organ recitals (1.10pm)
      alongside readings, conservation talks and Heritage Week openings.
      Admission to the cathedral is ticketed and `ongoing`.
    notes: |
      Verified 2026-08-17, and the URL needed correcting twice. corkcathedral.ie
      is NOT this cathedral — it 301s to corkcathedralfop.ie, the Catholic Cork
      Cathedral Family of Parishes site for the North Cathedral (St Mary and St
      Anne), which serves a healthy 200 of mass times and parish notices.
      corkcathedral.com 301s to www.stfinbarres.ie, which is how the real domain
      was established. events.stfinbarres.ie then serves "Events & Arts at St
      Fin Barre's Cathedral, Cork" with dated entries (Caring for an Icon
      conservation talk 17 Aug 2026 7pm, Friday Lunchtime Organ recital 21 Aug
      1.10pm). Address and Eircode read off www.stfinbarres.ie/visit/.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/st-peters-cork
    name: St Peter's Cork
    category: museums
    kind: venue
    status: provisional
    url: https://stpeterscork.ie/events
    homepage: https://stpeterscork.ie/
    area: City Centre
    address:
      street: 87a North Main Street
      locality: City Centre
      city: Cork
      postcode: T12 RF8D
      country: Ireland
    tags: [ heritage, free, exhibitions, community ]
    cadence: monthly
    hints: |
      A deconsecrated medieval church on the city's medieval spine, now an
      exhibition and event venue — so most of what it lists is somebody else's
      programme in its room (Cork Craft & Design showcases, festival slots,
      workshops). Set `venue.sourceId` to this source and attribute the event to
      its organiser.
      /events prints category, day and month, venue line, start time and price
      ("Workshops / 22 Aug / Lino Cut Workshop / 1pm / €45"), but no year.
      Below the list sits a live calendar block that renders client-side and
      falls back to "No publicly listed events this month" — ignore it, the
      cards above are the real listing.
      A separate "Cultural Calendar" section on the same page names the annual
      festivals it hosts (Ortus Chamber Music Festival in February, and others)
      months ahead of any dates being fixed; treat those as `undated` unless a
      date is printed.
    notes: |
      Verified 2026-08-17: title "What's On | St. Peter's Cork" with three dated
      entries (Playspaces from 17 Aug, Crafting Legacy Members Showcase
      Exhibition 10-31 Aug 2026, Lino Cut Workshop with Solas Agus Scath 22 Aug
      2026). Address and Eircode read off /plan-your-visit (87a North Main
      Street, Cork City Centre, T12 RF8D). Not to be confused with the Cork
      Vision Centre, which occupied this building until it closed;
      corkvisioncentre.com is now a parked domain serving an empty page, so it
      is deliberately not catalogued.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/blarney-castle
    name: Blarney Castle & Gardens
    category: museums
    kind: venue
    status: provisional
    url: https://blarneycastle.ie/
    area: Blarney
    tags: [ heritage, ticketed, major, outdoor ]
    cadence: quarterly
    hints: |
      There is no what's-on page and the homepage is the best available listing.
      /news/ looks like one but is the head gardener's monthly diary — prose
      about the arboretum, dated by publication rather than by anything
      happening. Do not read those posts as events.
      What the homepage does carry is authoritative and `ongoing`: castle and
      gardens open all year, with admission times that change month by month
      (Jan-Mar 9.00-17.00, Apr 9.00-17.30, and so on) and a printed last
      admission. Record the visit as `ongoing` or `recurring`, not as a series
      of single dates.
      Inside the 12km radius, roughly 7km northwest, and inside the city
      boundary since the 2019 extension — a Cork City entry, not a county one.
      Also a gardens and outdoors venue; do not duplicate it there.
    notes: |
      Verified 2026-08-17: www.blarneycastle.ie 301s to blarneycastle.ie, which
      serves "Family Friendly Holiday | World-Famous | Blarney Castle" and names
      the Blarney Stone, Cormac MacCarthy and the rock close. Ticketing is at
      blarneycastle.retailint-tickets.com; not catalogued as a booking route
      because it was not fetched and appears to sell timed admission only. No
      address recorded — the site prints directions rather than a street
      address, and Blarney is unambiguous enough for a map pin.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/fota-house
    name: Fota House, Arboretum & Gardens
    category: museums
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://fotahouse.com/events/
      - role: api
        url: https://fotahouse.com/wp-json/tribe/events/v1/events
        note: >-
          whole forward diary as JSON with full body text, 9 events in one fetch — cheaper and richer than the page, which renders its cards client-side
      - role: ics
        url: https://fotahouse.com/events/?ical=1
        note: text/calendar, Europe/Dublin, dates without any parsing
    homepage: https://fotahouse.com/
    area: Fota Island
    tags: [ historic-house, heritage, ticketed, exhibitions ]
    cadence: monthly
    hints: |
      Prefer the API route: /events/ is an Events Calendar view whose cards are
      assembled in the browser, so a plain fetch of the HTML returns the search
      widget and little else, while the JSON gives id, url, title, description
      and dates for the whole diary.
      A Regency house run by the Irish Heritage Trust — conservation talks,
      guided house tours, seasonal trails and outdoor events, with a separate
      /outdoor-events/ page. The house, arboretum and gardens are `ongoing`.
    notes: |
      Verified 2026-08-17: /events/ serves "Events from August 10 - August 15 -
      Fota House / 9 events found", the API returns event JSON (Presentation on
      the Conservation of Furniture, /event/presentation-on-the-conservation-of-
      furniture/) and the ICS route returns a real VCALENDAR with PRODID
      "Fota House - ECPv6.17.1".
      Outside the 12km radius, at roughly 13km east — included because Fota is
      part of how Cork programmes its east side (the config names the wildlife
      park next door as one of the institutions carrying the city's family
      offer), it is on the Cork-Cobh commuter line with its own station, and it
      has a genuine year-round events diary rather than a static visitor offer.
      Distance is a judgement for the catalogue owner to confirm; no address
      recorded because the site gives directions rather than a street line.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: museums/spike-island
    name: Spike Island
    category: museums
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://www.spikeislandcork.ie/news-and-events/
      - role: booking
        url: https://spikeislandcork.digitickets.ie/tickets
        note: >-
          ferry-and-tour departures sold as timed products; special events appear here as separate products
    homepage: https://www.spikeislandcork.ie/
    area: Cork Harbour
    tags: [ heritage, ticketed, major, family ]
    cadence: monthly
    hints: |
      /news-events mixes dated events with press notices ("Named One of the
      Top Visitor Attractions in Ireland") — keep the first, drop the second.
      Dates are printed day-and-month with no year, and some entries name only a
      month ("returns this September").
      Every visit is a ferry sailing from Kennedy Pier in Cobh, so an event here
      always has a departure time attached and capacity is hard-capped; the
      standard Spike Island Experience is `recurring` and only the specials
      (Haunted Spike, the literary festival, Culture Night screenings, the 5K)
      are `single`.
      A separate /exhibitions/ page holds the permanent displays, which are
      `ongoing`.
    notes: |
      Verified 2026-08-17: title "News & Events - Spike Island Cork" with dated
      entries (Haunted Spike 22 August, Spike Island Literary Festival in
      September, 5K Run 12 September 2026, Culture Night Film Screening: Mná na
      DXP 18 September). The digitickets shop was fetched and is a live product
      catalogue.
      Outside the 12km radius, roughly 15km southeast in Cork Harbour, and
      reached via Cobh — included because it is genuinely part of the city's
      programme rather than Cobh's: it takes part in Culture Night Cork and Cork
      Harbour Festival, and its own events are marketed city-wide. Worth the
      catalogue owner's confirmation.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

