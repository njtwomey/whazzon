  - id: textiles/duchas-clonakilty
    name: Dúchas Clonakilty Heritage
    category: textiles
    kind: organiser
    status: provisional
    url: https://duchasclonakiltyheritage.ie/News-and-Events/
    homepage: https://duchasclonakiltyheritage.ie/
    area: Clonakilty
    tags: [flax, linen, heritage, talk, exhibition]
    cadence: monthly
    hints: |
      **This is the source that would have caught the flax day.** Dúchas runs the
      Clonakilty end of the flax and linen revival — "Flax – Threads of Time" and
      the Mallow-to-Mizen thread project — alongside winter lectures, field trips
      and walking tours.
      2026 is the bicentenary of the collapse of Clonakilty's linen industry, so
      expect an unusually heavy flax programme this year, clustered around
      Heritage Week in August.
      **Go to the sub-page, not the index.** The News-and-Events index carries only
      a couple of dated posts; the actual programme is one level down — the
      Heritage Week 2026 page held eleven events when this was catalogued.
      A society's news page, not a box office: dates arrive as notices, sometimes
      without a start time, and lectures are a winter series. Take a date with no
      time over inventing one.
    notes: >-
      Verified 2026-08-20: 200. News-and-Events lists forward dates including
      Heritage Week 2026 and a lecture on the rise and fall of Clonakilty linen.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"
