    notes: "The catalogued corkgigs venue profile works and is headed \"Savoy Theatre\", confirming identity, and its \"Forthcoming gigs at Savoy Theatre\" block lists 12 dated shows from 21 Aug to 30 Dec 2026. All 12 are recorded.

      The profile block gives only a title and a day-and-month, so the start times and prices below were read off the corkgigs main diary (https://www.corkgigs.com/), which carries the same 12 rows with time, price and ticket link. Both pages are corkgigs and were both read today; the venue-scoped profile is what `fetch.url` records because it is the catalogued route. Where corkgigs prints no price, none is recorded.

      Two things for a curator. corkgigs prefixes its own classifications into the titles — \"[Tribute]\", \"[Radio Solstice presents]\", \"[Jazz Fest]\" — and those are carried into `subcategory` and stripped from the title, since they are the aggregator's labels rather than part of the act's name. corkgigs also marks Charlie Bones \"** rescheduled **\", recorded as `status: rescheduled`.

      And the profile's own copy is worth reading: it says the Savoy \"reopened 14 February 2026 under the direction of local promoters The Good Room\", with a new entrance on Drawbridge Street. That confirms the catalogue's note that savoycork.ie answering 503 is a server fault at a live, trading venue — the room is six months into a relaunch, not dormant. It also confirms the catalogue address, 7 Drawbridge Street, T12 YW13."
