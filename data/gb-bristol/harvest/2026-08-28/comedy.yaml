    notes: "**The catalogued URL no longer reaches the listings.** The site has been rebuilt on Blazor since the last harvest. https://www.improvtheatre.co.uk/?filter=Events still returns 200 (the www host 301s to the apex improvtheatre.co.uk), but the root is now a homepage: a six-slide carousel of featured shows, not the diary. The full filtered programme has moved to **https://improvtheatre.co.uk/events/?filter=Events**, which is where the homepage's own \"See all upcoming shows\" button points. The `?filter=Events` parameter still works exactly as the hint describes — the \"Shows & Events\" pill is the active one and the theatre-school course listings are excluded. Catalogue URL needs updating to the /events/ path, and to the apex host while stage 1 is in there.

      27 dated shows from tonight to Friday 4 December, taken whole; the page has no pagination or load-more, so that is the site's full forward horizon.

      **Bank holiday weekend: three of these fall inside it** — The Improv Spotlight tonight (Fri 28), The Saboteur on Saturday 29, and a Level 4 Student Showcase on **Monday 31 August**, the bank holiday itself. Nothing is programmed for Sunday 30. Nothing on the site is billed as a bank holiday event and the words do not appear anywhere on the page, so no row carries a `bank-holiday` tag — the Monday show is simply a Monday show that happens to land on it. Recorded here on that basis rather than inferred.

      This source is also catalogued under theatre, deliberately; these rows come from the comedy-side reading of the same programme and are expected to collide with theatre/bristol-improv-theatre at compile time.

      The listing carries a real synopsis per card, so no event pages were opened. It does not print prices — only the Student Showcases state a price at all, in their own copy (\"Free entry with optional supporter tickets\"), so `price` is absent everywhere else rather than guessed. Recurrence chips (\"Every other month!\", \"The first Friday of each month\") describe the series, not this sitting; each card is a dated instance, so each is recorded as a `single` with the chip kept in `raw`. Every card prints a weekday and all 27 check out for 2026."
