    events: []
    notes: "Reached, right venue, nothing listed — the same result as yesterday. The Headfirst page is headed The Black Swan at 438 Stapleton Rd, BS5 6NR, which matches the catalogued area, but the \"What's On At The Black Swan\" heading has no rows beneath it. I did follow the hint's suggestion to cross-check Skiddle, and it does not help: skiddle.com/whats-on/Bristol/The-Black-Swan/ is a different pub altogether — The Black Swan, 92 Stoke Lane, Westbury-on-Trym, BS9 3SP — and that page also says \"No events to display\". So the hint's fallback should be corrected: the Stapleton Road venue is not the Skiddle Black Swan, and this is now a third near-miss to add to the two already recorded in the catalogue notes. Given the venue programmes through Instagram and ticket agents and has no site of its own, two empty weekly runs in a row suggest either a different aggregator or a lower cadence is needed; that is a stage 1 call."
