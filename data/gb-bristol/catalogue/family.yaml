    homepage: https://windmillhillcityfarm.org.uk/
    area: Bedminster
    tags: [ city-farm, free, community, outdoor ]
    cadence: monthly
    hints: |
      Free to visit; events cluster in school holidays. The calendar is a
      BookThatApp/FullCalendar widget: course titles are in the HTML but the dates
      load client-side from bookthatapp.com/calendar/events.json, which is why the
      harvest read the page as empty. Several titles carry a weekday and day with
      no year.
    notes: >-
      Verified 2026-08-17: the catalogued /whats-on/ path redirects to this apps/bookthatapp/calendar URL. Page heads "Courses & Events Calendar", names Windmill Hill City Farm and gives Philip Street, Bedminster, Bristol BS3 4EA; over 100 courses and sessions listed.
    addedAt: "2026-08-16"
    address:
      lat: 51.442218
      lon: -2.592954

