    notes: "Read /whats-on/ once; it server-renders the whole diary as 52 cards with no pagination, from K-POP ALL STARS (17 Aug) to Steve Steinman's Bat Out of Hell (04 Jun). Nothing truncated. Two things the index does not carry: **no year** and **no start times**. Dates print as \"20 Aug–22 Aug\" or a bare \"06 Sep\", so years are inferred from the diary's own chronological order — it runs monotonically forward from today, rolling 2026 to 2027 between 04 Nov and 14 Jan. No weekday is printed anywhere, so that inference cannot be checked the usual way. Where the card's own image filename states a year matching the inference (34 of 52, e.g. `A-Streetcar-Named-Desire_The-Everyman-Cork_20-–-22-Aug-2026`) the row is confidence: high; where it does not, or where the filename is stale artwork from another date, the row is confidence: medium. Streetcar and Judy are additionally confirmed by Pure Cork, which prints their weekday, year and 19:30 curtain, and those two carry timesText from there. Runs print as a date pair and are recorded as one `run` each. Two rows (Ross Browne 05 Feb, Paranormal Activity 25–29 May) have no Book Now link yet. The Queue-it waiting room in front of everymancork.ticketsolve.com was not approached, per the catalogue's trap note, so no per-performance times were obtained from the box office. The month dropdown on the page is hardcoded to 2026 and is no help with the year; the WordPress /feed/ was not fetched, since the catalogue records it as news rather than listings."
