    notes: "The catalogue hint says Ticket Tailor 403s a plain fetcher and serves a browser user-agent perfectly. That has stopped being true. Per §2 the one permitted retry was made with the Chrome user-agent the prompt gives, and it returned HTTP 403 again with a Cloudflare \"Just a moment...\" JS challenge page — a genuine wall, not a header check, so it was not retried further. There is no fallback: the venue's own site at almatavernandtheatre.co.uk carries no listings at all, which is why the catalogue points at the box office in the first place. Nothing is recorded for this source today, including for the bank holiday weekend, and the gap is real rather than the venue being dark — the August 2026 run found 52 listings here reaching to November 2027, so it is very likely something is on. For stage 1: the `hints` line about sending a browser user-agent should be rewritten to say the Ticket Tailor box office is now behind a Cloudflare JS challenge and needs a real browser rather than a header."
