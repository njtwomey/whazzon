      Verified 2026-08-17: /whats-on/ names Crawford Art Gallery throughout, carries the closure notice, and listed seven dated items from 11 August to 17 October 2026 (Artists Film International 2026 at Triskel 11–27 Aug; Conservation in Action at Cork City Library 18 Aug; Culture Night Projection Playspace 18 Sep). The gallery's postal address during redevelopment is 2nd Floor, 80a Hibernian House, South Mall, Cork T12 ACR7 — that is an office, not a venue, so `address` records Emmet Place instead and the Eircode is left out rather than guessed.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

