    notes: "All 5 of these from the 8 Sep newsletter (\"September at acta: Come along to our Christmas show!\"); the source was not due and the website was not fetched this run. The message has no view-in-browser link, so `fetch.url` is the catalogued listings page. Ocean of Dark and the Elevate workshop print weekdays that check out against 2026; The Star Catchers gives only \"various dates and times between 5th and 11th December\" and is a run with that wording in timesText at medium confidence. The newsletter's booking links are Mailchimp tracking redirects; they are kept in `raw` but not written to `url`, which is left off rather than guessed. The same newsletter also plugs three events elsewhere (Heritage Open Days, South Bristol Arts Trail 19-20 Sep, QiGong at Arnolfini 11 Sep); they are not acta's and are not recorded here. The 29 Aug message was a subscription confirmation and lists nothing."
