schema: whazzon.catalogue/1
category: making
label: Making & Craft
description: >-
  Makerspaces, workshops, printmaking, woodwork and craft courses.

  The distinctive problem in this category is that most listings are *courses*, not events — a ten-week evening class is not the same thing as a one-off workshop, and a "what's on" page is much less useful if it fills up with enrolment listings. Prefer one-off and short workshops, open days and public makes; record a recurring course as `occurrence.kind: recurring` with the pattern stated, rather than as a stream of dated events.
sources:
  - id: making/bristol-folk-house
    name: Bristol Folk House
    category: making
    kind: venue
    status: provisional
    url: https://www.bristolfolkhouse.co.uk/live-music
    homepage: https://www.bristolfolkhouse.co.uk/
    area: Park Street
    address:
      street: 40A Park Street
      city: Bristol
      postcode: BS1 5JG
      lat: 51.454473
      lon: -2.601546
    tags: [ courses, craft, adult-education, music, independent, historic ]
    cadence: monthly
    hints: |
      Long-running adult education centre: craft, art, woodwork and language
      courses plus a folk music programme and a café. Output is mostly termly
      courses — capture one-off workshops and the music programme as dated
      events, and courses as recurring with the term stated. Enrolment opens
      well before a term starts, so use a long forward horizon.

      Despite the /live-music path this is the site's whole "What's On" — the
      dated one-off workshops (visible mending, creative writing) sit on it
      alongside the gigs. The termly course index is a separate page at
      /courses-and-workshops, grouped by subject (crafts, pottery, woodwork)
      rather than dated; the catalogued /courses/ path no longer exists.
    notes: >-
      Verified 2026-08-17: page carries the "Bristol Folk House Cooperative Ltd" byline and the 40a Park Street BS1 5JG address, with eight dated events from 20 Aug to 5 Sep 2026 including two craft/writing workshops.
    addedAt: "2026-08-16"

  - id: making/bristol-hackspace
    name: Bristol Hackspace
    category: making
    kind: venue
    status: provisional
    url: https://www.ticketsource.co.uk/bristol-hackspace
    homepage: https://www.bristolhackspace.org/
    area: St Philips
    tags: [ makerspace, electronics, open-evening, community, diy, free ]
    cadence: monthly
    hints: |
      Volunteer-run makerspace with regular open evenings anyone can attend —
      typically weekly and recurring rather than individually listed, so record
      the pattern rather than inventing dates.

      The hackspace's own site has no diary: /visit describes the space and
      links out to TicketSource, which is where the dated open days live. That
      TicketSource page 403s to a plain fetch and 200s to a browser
      user-agent, so send one. Open days are irregular (roughly monthly, on a
      Sunday), not weekly — take the dates as listed rather than assuming a
      pattern.
    notes: >-
      Verified 2026-08-17: ticket page titled "Bristol Hackspace event tickets" lists Open Days on 18 Oct and 1 Nov 2026. Own site confirms the org at Unit B, Meridian Studios, Queen Victoria Street BS2 0QR but lists no dates.
    addedAt: "2026-08-16"
    address:
      lat: 51.452781
      lon: -2.572975

