    notes: "Seventy dated listings from 12 Sep 2026 to 7 May 2027, all recorded — nothing truncated this run. Dates print as DD/MM/YYYY with a time, so nothing is inferred and rows are `high`; the index gives a title, a one-line strapline and a thumbnail (relative path, prefixed with the site root), no prices. Music dominates, as the hint says, and every row is tagged on its own terms. Two rows carry status in the title: Bristol Ragas is marked CANCELLED and Idiot's Guide to Wine (9 Oct) SOLD OUT — the decoration is moved to `status` and the title cleaned; Overpass prints \"Venue change\", kept in `raw`. NHS blood donation is listed five times (28 Sep, 26 Oct, 2 Nov, 23 Nov, 14 Dec); one row is recorded with the other dates in its summary rather than five near-identical cards. The separate \"Groups & Classes\" block prints a stale first-session date rather than a cadence: the six groups whose blurb states a pattern (Bristol Samba, Gentle Dance, Ilu Axe, Aid Box women's group, garden volunteering, Contemporary Dance) are recorded as `recurring` with that wording, Skills for Life and Work with its printed 21 Sep start, and five that state none (Gerry's Attic, Hype Dance Company, Black Creatives, Next-Gen Sounds, Girls Group) are left out rather than given a date from January that has passed. Wonder Baby (23 Oct) is Travelling Light Theatre Company's show, at Trinity, so no `venue` override; Travelling Light's own newsletter this run was only a sign-up welcome and lists nothing."
