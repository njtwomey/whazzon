    tags: [knitting, crochet, yarn, workshop, class]
    cadence: monthly
    hints: |
      Cork's yarn shop, and the page catalogued here is where it sells tickets to
      its own events — which is as close to a listings page as a shop gets.
      Take one-off workshops and visiting tutors. A standing weekly class is not
      what this location is for, and the shop's stock pages are not events at all:
      if the extraction starts producing yarn brands, it has wandered into the
      catalogue.
    notes: >-
