    notes: "The hint is right on both counts. /live-music is the whole what's-on — nine dated events from 20 August to 5 September 2026, gigs and craft and writing workshops mixed together. The termly course index at /courses-and-workshops turned out to carry no courses at all: it is a filter interface, ten subject headings (Arts, Crafts, Photography, Pottery, Writing, Music Dance and Performance, Languages, Fitness, Wellbeing, Life and Leisure) linking to /results?category_parent=N, plus a /one-day-workshops?course_week=0 path. No course names, dates or prices appear on it, so no termly course rows are recorded and a future run would need to walk those /results pages to get them. The index is thin — title, date, time, price and nothing else — and the programme is nine events, so per §3 I opened five event pages for `description`: the four soonest (20, 20, 22 and 25 August) plus the 5 September creative-writing workshop. The other four have no `description`. Three things a curator should see: the Pride Exhibition is listed twice, on 20 and 27 August, as the same exhibition on two days; \"Between The Lines - Poetry Night\" has a slug ending 05-08-2026 while the listing itself says Wednesday 2 September 2026, so the slug is stale and I have taken the listed date; and the price for the visible-mending workshop reads £10/£12/£5.88 on the index and £10/£12/£15.88 on the event page, so I have kept the text and left min/max off."
