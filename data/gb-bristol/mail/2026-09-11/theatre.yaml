      Join us for the hometown premiere of this powerful new play from Bristol-based artist Kirris Rivere.


      PIECES OF MY LIFE <https://arts-mail.co.uk/c/AQjLmwUQmuW4Bxju1aKkAyCIzNKvASi4-OdCLySkeNEPxB6otokRyvjrtKSRZ1og1Y6-myTHA65-NuA>https://arts-mail.co.uk/c/AQjLmwUQmuW4Bxju1aKkAyCIzNKvASi4-OdCLySkeNEPxB6otokRyvjrtKSRZ1og1Y6-myTHA65-NuA


      Written and performed by Kirris Rivere, produced by Ad Infinitum.


      An autobiographical story of love, loss and resilience.


      Facing a two-week eviction notice just days after his mum’s death, Kirris sets up a makeshift podcast studio in his childhood council flat, recording the story of his life before he has to leave.


      Weaving memories, music and fragments from his journal, he brings to life the experiences that have shaped him, confronting identity, grief and the lifelong struggle with systemic racism.


      At the heart of the show is his fiercely optimistic mum, whose love, humour and creativity continue to guide him.


      With original music, raw vulnerability and powerful storytelling, Pieces of My Life is a deeply human exploration of defiance, family and home.


      Suitable for ages 12+


      This show contains themes of racism against black people, racial abuse, and mental health challenges. Contains strong language including one very strong racial slur.


      The performance on Friday 11 September will be BSL-interpreted by Sherrie Eugene-Hart.


      You can learn more about the show on the Ad Infinitum website. <https://arts-mail.co.uk/c/AQjLmwUQmuW4Bxju1aKkAyCg5NKvASi4-OdCJIHJ5ZG8dkuHhzH11oeuv4KbwZvHMxvOXk3ICTuYC2w>


