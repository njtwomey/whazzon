    notes: "Whole diary taken — all 34 entries the programme page lists, from Sat 29 August to Wed 25 November — nothing truncated. The programme mixes film, live music, performance and talks, so each row is tagged by what it actually is rather than assumed to be a film; the venue's own one-word label (\"film\", \"music\") is carried in subcategory where it prints one. The index prints no prices at all, so price is omitted except where an event page was opened. Two event pages were opened, both for this bank holiday weekend, per the run brief: Annie Gardiner (Sat 29 Aug) and Skydaddy (Mon 31 Aug); their full body text is in description and the Annie Gardiner page is the only one of the two that prints a price. The rest of the programme is more than the dozen-event cap allows opening, so the other 32 rows carry the index line in raw and no description. Nothing on the site is billed as a bank holiday event — the Cube simply has a gig on the Saturday and another on the Monday — so no event carries the bank-holiday tag. Note for stage 1: the programme page offers an RSS route at https://www.cubecinema.com/programme/rss/ which is not in the catalogue and would be the cheaper route next time. Event hrefs are relative and have been resolved against https://www.cubecinema.com."
