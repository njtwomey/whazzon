      ONE-TO-ONES, GROUP CRITS AND MORE THIS SEPTEMBER

      This month, as Spike Island Associates re-enter the art world after a much needed summer break, we're encouraging a gentle re-introduction to creative practice. We've got one-to-ones with international curator of modern and contemporary art, Laura Barlow; a group crit with film critic, performer and cinema consultant Tara Judah; and a workshop on access riders with Neuk Collective – a community of and for neurodivergent artists in Scotland.

      Join Spike Island Associates from £9 a month <https://us.list-manage.com/3kFakFuCq_R?c2id=a7c541d1d2eca54a095703c2afcca581&m=ZqAnl2WBRI9WlXHDr3ylh8KTE1tJCRuXQ9hSpcyFRPtRuThKK4RgQNhJyttw>


