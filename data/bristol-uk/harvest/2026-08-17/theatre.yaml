    notes: "The corrected canonical host serves the full diary in one page: 55 dated events from 28 Aug 2026 to 14 Mar 2027, no pagination and no load-more link, all 55 recorded and nothing truncated. The hint is borne out — music dominates and only three rows are theatre (Wonder Baby, The Seamstress, Adventures in Hidden History), so the tags do the classifying. Dates are printed as DD/MM/YYYY with an explicit year, so no year had to be inferred; no weekdays are printed, but none were needed. The site's own genre label goes into `subcategory` verbatim. Prices appear nowhere on the diary, so `price` is omitted throughout rather than guessed. Image paths are relative and have been resolved against the site root. Four titles carry status decoration, which is stripped from `title` and recorded in `status` and `raw`: Nu:Bass Generation and MISSIO are cancelled, Frost Children is sold out, and \"overpass - Venue change\" flags a move without saying where to — no `venue` is set for it because the page names none, and it sits at `confidence: low`. Two rows carry no genre and no description at all (Tara Clerkin Tro, OMEGA NEBULA) and are `medium`; the first also looks like a truncated band name, recorded as printed. One oddity for stage 1 rather than for us: the Art for Wellbeing Course sits under a /whats-on/2025/ URL path while being dated 24/09/2026. The diary is far past a dozen rows, so no event pages were opened and no `description` is set."
