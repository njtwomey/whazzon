    notes: "A genuine wall, not a stale URL and not a dead site, so nothing is recorded and this must not be read as the aggregator having nothing on. I did more than fetch once: /markets-cork/ answered 202 with a meta refresh to /.well-known/sgcaptcha/, I fetched that challenge with a browser user-agent and a cookie jar and got 200 on a page titled \"Robot Challenge Screen\" reading \"Checking the site connection security\", then retried /markets-cork/ carrying the cookies and got 202 again with a fresh challenge token. The loop is closed to a plain fetch and needs a real browser. The same wall blocks /markets/blackrock-village-sunday-market/, which is the other IOMST entry in this category; the consequence is that the small volunteer-run markets IOMST is catalogued for are unobservable, and Blackrock's trading days had to come from Cork City Council's licensing page instead. IOMST's Cork index, its per-market pages and its dated diary at /whats-on/ were all unreadable, so the market list on /markets-cork/ remains unverified for a second run in a row. For stage 1: this source is worth either a browser route or a note that it cannot be harvested by the current fetcher."
