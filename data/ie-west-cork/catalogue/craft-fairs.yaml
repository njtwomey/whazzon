    homepage: https://www.clonakilty.ie/
    area: Clonakilty
    tags: [town, market, christmas-fair, festival]
    cadence: monthly
    hints: |
      The town's own site, run by the chamber. It carries the Friday market, the
      Christmas fairs and the town festivals, mixed in with shop and restaurant
      promotion — take the dated notices and leave the rest.
      Craft strand only for this location: a food festival is out of scope unless
      making is part of it.
    notes: >-
      Verified 2026-08-20: 200. /whats-on/ is a 404; /events is the real route and
      is what this now points at, corrected from the first harvest's finding.
      That listing is rendered by JavaScript, so a plain fetch reads the navigation
      and nothing else — this source will not yield anything until it is read with
      a browser.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: craft-fairs/bantry
