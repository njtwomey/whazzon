    notes: "/projects/ has a \"WHATS ON\" block with exactly three entries — Blackpool Block Party, In the Heat of the Night, Dragon of Shandon — above a year-by-year archive back to 1998. All three project pages were opened for dates, as the hint said would be necessary. /workshops/ was not fetched: the hint records that it describes capability rather than dates and its event block reads \"Nothing found\".

      Two things a curator should see. **The Dragon of Shandon page is stale** — it still says \"NEXT DRAGON : 31st OCTOBER 2025\". The parade is annual on 31 October and there is every reason to think it will run in 2026, but the page does not say so, so the printed 2025 date is recorded and the pipeline will retire it rather than a 2026 date being invented. Re-check in September.

      **The film night page has leftover copy from a previous screening.** Its heading block is unambiguous — \"BLACKPOOL COMMUNITY CENTRE ● SATURDAY 29TH AUGUST ● DOORS AT 6.30PM ● FREE ENTRY ● IN THE HEAT OF THE NIGHT from 1967\" — and 29 August 2026 is a Saturday. But a paragraph below it still reads \"We're screening '12 Angry Men' on Saturday 28th March at 6.30pm\", which is the previous film. Only the current screening is recorded. It is a film night rather than a make, and it sits in `making` because the source does; the `screening` tag is what tells it apart.

      This organisation's hands-on August Craft Month sessions (Make your own puppet, Puppet Café) are sold through Eventbrite and appear nowhere on its own site, so they are recorded under making/eventbrite-cork-crafts. An Eventbrite organiser route on this catalogue entry would close that gap."
