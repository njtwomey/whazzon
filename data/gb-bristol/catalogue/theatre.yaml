  - id: theatre/alma-tavern-theatre
    name: Alma Tavern Theatre
    category: theatre
    kind: venue
    status: provisional
    url: https://www.tickettailor.com/events/almatheatrecompany
    homepage: https://www.almatavernandtheatre.co.uk/theatre
    area: Clifton
    tags: [ pub-theatre, fringe, independent ]
    cadence: weekly
    hints: |
      Small pub theatre. Its own site carries no listings at all — the theatre
      page is Wix prose about booking policy, and its "What's On" nav item points
      straight at the Ticket Tailor box office, which is the url above.

      Ticket Tailor 403s a plain fetcher; send a browser user-agent. The box
      office is then server-rendered: title, "Wed 19 Aug 2026 8:00 PM", venue
      "Alma Tavern and Theatre, BS82HY". Multi-night runs show as a start–end
      pair, so they are `occurrence.kind: run`. The same list carries acting
      workshops and a comedy club alongside the plays, plus gift vouchers that
      are products rather than events — skip those.

      It books a long way out — over 50 listings reaching into late 2027 — so use
      a long forward horizon and paginate to the end rather than taking the first
      screen.
    notes: >-
      Verified 2026-08-17: catalogued almataverntheatre.co.uk is the wrong host; the venue is at almatavernandtheatre.co.uk, "ALMA TAVERN & THEATRE, 18-20 ALMA VALE ROAD, BRISTOL, BS8 2HY", agreeing with area: Clifton. That site lists nothing, which is why the harvest found it empty. Its Ticket Tailor box office server-renders a dense dated diary — 52 listings at that venue, 19 Aug 2026 to Nov 2027.
    addedAt: "2026-08-16"
    address:
      lat: 51.462634
      lon: -2.614874

  - id: theatre/the-loco-klub
    name: The Loco Klub
    category: theatre
    kind: venue
    status: provisional
    url: https://www.headfirstbristol.co.uk/whats-on/loco-klub
    area: Temple Meads
    tags: [ immersive, independent, arches ]
    cadence: weekly
    hints: |
      Railway arches used for immersive theatre, art and club events. Output
      spans theatre, music and nightlife — classify per event, not per venue.

      The venue has no website of its own any more, so the Headfirst venue page
      is the only listing. It is server-rendered and promoter-led: each row is
      whoever hired the arches that night, not a house programme, so expect club
      nights and cabaret next to theatre.
    notes: >-
      Verified 2026-08-17: thelocoklub.co.uk is NXDOMAIN on apex and www — the venue's own domain has lapsed. The venue itself is trading: the Headfirst page describes the Brunel-built railway arches restored by Artspace Lifespace and lists dated events from 22 Aug 2026 to Apoctoberfest on 16–17 Oct 2026. No homepage set because there is no live one; artspace.uk carries only an archived 2016–2017 project page.
    addedAt: "2026-08-16"

  - id: theatre/trinity-centre
