    notes: "The catalogue hint still holds: the homepage is the listings page and /whats-on/ was not followed. But the homepage's \"Coming Soon\" block carries only five shows, so the site's WordPress REST route was tried and it works: https://thewardrobetheatre.com/wp-json/wp/v2/shows?per_page=100 (and &page=2) returns the `shows` post type with ACF fields event_start_date, event_end_date, date_display, show_time, price_display, suitable_for, duration_minutes, an excerpt and an external-booking flag — the whole diary, 418 posts over 5 pages. Pages 1-2 (every show posted since March 2025) were read — four fetches in all for this source — and supply 59 of the 62 rows here, to 8 May 2027; the three recurring shows (WiFi Wars, Closer Each Day, Aftermirth) are older posts and come from the homepage cards. Handover for stage 1: add that route as `role: api` — it is a confirmed, working endpoint, not a guess. The API returns only a media id for the poster, so a fourth fetch of page 1 with `_embed=wp:featuredmedia` supplied featured-image URLs for every post on that page; the two future rows that sit on page 2 (Laura Lexx, Moulin Scrooge) have no `image` rather than a constructed one. Every date_display prints a weekday and all check out. Times are converted to 24h where a single time is printed; multiple or ranged times stay in timesText. Two newsletters were on file (5 Sep, Closer Each Day; 10 Sep, Dauntless) and the Tobacco Factory's 7 Sep mailing also plugged Action Hero: A Song & Dance here — all three are on the site with matching dates and prices, so nothing is mail-only. Moulin Scrooge is a Wardrobe co-production playing at Front Room Theatre in Weston-super-Mare, so it carries a `venue.name`. Mull Historical Society is a Bristol Beacon promotion at the Wardrobe with tickets sold by the Beacon; the Wardrobe page is kept as `url`. HOTDESKING (monthly co-working for theatre-makers) and the two paid workshops are listed by the venue as shows and are recorded, tagged as such."
