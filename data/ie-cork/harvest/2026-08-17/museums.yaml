    notes: "Found a second GET filter the catalogue does not record and it more than halves the waste: `eventDates[]=<day>-august` is a plain checkbox alongside `where[]`, so `where[]=cork` plus 17 through 23 August narrows the catalogued 118 Cork City events to 78 - it drops the 40 that have already happened. Worth adding as a note on the catalogue entry, though the day values will need rewriting each year. Fetched pages 1-4 of that filtered query (twelve cards a page, paginated as /event-listings/p2?<same query>) and stopped there, so **48 of the 78 forward-dated Cork City events were read and 30 were not** - the alphabetical ordering means everything from \"Moving Pictures\" onward is missing. Six of the 48 are the same event as a row already recorded from the venue's or organiser's own site and are not repeated: Butter in the Bog (museums/butter-museum), Caring for an Icon (museums/st-fin-barres-cathedral), Conserving a Lost Cork Institution (museums/shandon-bells-st-annes), Conservation in Action at Crawford (museums/irish-museums-association), Genealogy and Archives Day (museums/cork-city-county-archives) and Douglas & its History (museums/cork-heritage-open-day) - leaving 42 rows here. `venue.sourceId` is used wherever the venue line names a source catalogued in this category, which is what stops the duplication on the remaining rows. The index prints day and month with no year and no weekday, so the prompt's weekday check is not available; the year is taken as 2026 because the page's own title prints it (\"2026 Events | National Heritage Week 15th – 23rd August 2026\") and the festival's dates are fixed, which is stronger evidence than a weekday, so rows are `confidence: high`. No prices appear on the index at all - the feature filter has both `free` and `includes-an-admission-fee` boxes, so price lives on the detail pages, which were not opened - so `price` is omitted throughout rather than assumed free. Two organisers have listed what looks like the same V