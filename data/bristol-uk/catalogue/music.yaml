  - id: music/motion
    name: Motion / The Marble Factory
    category: music
    kind: venue
    status: provisional
    url: https://motion-bristol.com/whats-on/
    homepage: https://motion-bristol.com/
    area: St Philips
    address:
      street: 74-78 Avon Street
      locality: St Philips
      city: Bristol
      postcode: BS2 0PX
    tags: [club, electronic, warehouse, major]
    cadence: weekly
    hints: |
      Large warehouse complex with several rooms, central to Bristol's
      electronic scene. Cross-check against Resident Advisor — RA often has
      lineups the venue site does not. The programme is JavaScript-rendered:
      /whats-on/ returns no dates and no address in its HTML, so nothing is
      extractable without a headless browser. The old motionbristol.com domain
      has lapsed and is now a parking lander — do not follow it.
    notes: |
      Verified 2026-08-17: motionbristol.com is a parked domain, serving a 114-byte JavaScript redirect to /lander with
      the marker ap:"parking" — it is not merely JS-rendered as the harvest reported. Current site is
      motion-bristol.com (title "Motion Bristol", nav for Bingo Lingo and Momentum, both Motion event brands). The
      venue also relocated: it lost the Avon Street lease, closed 20 Jul 2025 and reopened Oct 2025 at Unit 2 Victoria
      Terrace, BS2 0TD — so the address below is stale, but changing it is a curation decision, not a URL fix.
    addedAt: "2026-08-16"

