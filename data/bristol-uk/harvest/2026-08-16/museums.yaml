        raw: "**Conservation Carnival!** — 18 July – 31 August


          Celebrate the incredible conservation success stories helping to protect

          our oceans and wildlife this summer at Bristol Aquarium.


          - **Take on the Conservation Trail** — collect stamps as you journey

          \  through the aquarium, discovering six fascinating species and the

          \  conservation projects helping them thrive.

          - **Daily Save Our Seas Guided Tours – 11am** — a free guided conservation

          \  tour through a different area of the aquarium each day. Tours last

          \  approximately 15–20 minutes and include time for questions.

          - **Treasure or Trash: Sandpit Search – Daily at 4pm** — dig through the

          \  interactive beach combing sandpit for shark teeth, egg cases, fossils,

          \  seashells and coral fragments, alongside examples of plastic pollution.

          - **Visit the Conservation Corner** — beach clean information,

          \  conservation charities you can support, and children's colouring

          \  activities.


          All Conservation Carnival activities are included with standard aquarium

          admission.\n"
        summary: "The aquarium's summer programme, built around a stamp-collecting conservation trail, daily 11am guided tours and a 4pm beachcombing sandpit dig."
