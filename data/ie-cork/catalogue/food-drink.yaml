      lat: 51.899582
      lon: -8.476465
    tags: [ brewery, taproom, independent, beer ]
    cadence: monthly
    hints: |
      Brewpub on Cornmarket Street brewing beer and gin on site.

      The real recurring event is on /brewery-tour/, not /whats-on/: the tour
      runs "Tuesday 6pm", "Thursday 6pm" and "Saturday 12 noon" at "€15 per
      person. Minimum 2 guests and maximum 10", booked by email
      (risingsonscork@gmail.com) or phone. That is one `recurring` event, not a
      weekly series.

      Do not reconcile that €15 with the €28 "Brewery Tour, Pizza and Pint"
      printed on the Cork on a Fork programme — they are different products, the
      festival one bundling pizza and a pint afterwards.

      /whats-on/ is a blog-style archive, not a diary, and is not retired once
      events have passed.
    notes: >-
      Verified 2026-08-17. risingsonsbrewery.com is the brewery's own site (footer "Rising Sons, Cornmarket Street, Cork", phone 021 2414764). /whats-on/ is catalogued as the listings page because it is the only page that lists things, but everything on it is stale: the newest post is Cork Jazz Weekend 2022, and there are items from 2020. /brewery-tour/ is current. If a human wants to mark the listings page dormant, the tour page is the entry worth keeping.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/rebel-city-distillery
    name: Rebel City Distillery
    category: food-drink
    kind: venue
    status: provisional
    url: https://www.rebelcitydistillery.com/plan-your-visit/
    homepage: https://www.rebelcitydistillery.com/
    area: The Marina
    address:
      street: Unit P6, Marina Commercial Park, Centre Park Road
      city: Cork
      postcode: T12 XHP7
      country: Ireland
    tags: [ distillery, gin, independent, tastings, tours ]
    cadence: monthly
    hints: |
      Cork city's first distillery in almost fifty years, in a 1920s Ford
      electrical transformer building in the docklands, next door to Marina
      Market. Gin, absinthe and vodka distilled on site.

      /plan-your-visit/ is the closest thing to a listings page and is the one to
      read: it prints the address, directions, and the tour timings —
      "Thursday : 12pm, 2pm, 4pm, 6pm / Friday : 12pm, 2pm, 4pm, Cocktail Class
      5.45pm / Saturday : 12pm, 2pm , 4pm, 6pm". These are `recurring`, one per
      experience, not one event per slot.

      Each experience has its own page and none of them carry dates:
      /distillery-tour/ (1 hour 15 mins, gin and tonic on arrival, guided
      tasting), /rebel-city-distillery-cocktail-masterclass/,
      /spirit-school-gin-experience-cork/, /gin-and-cheese/, /gin-and-sin-cork-2/
      and /private-events/. There is also a /cork-on-a-fork-festival/ page for
      their festival programme.

      Booking goes through TripAdmit. Do not try to read dates out of it:
      ticketing.tripadmit.com/tour-aggregate returns a 3 KB JavaScript shell
      with no event data in the HTML.
    notes: >-
      Verified 2026-08-17. The site is the distillery's own; the address above is read off /plan-your-visit/. Two pages of the same site contradict each other on walk-ins — /distillery-tour/ says "we don't accept walk-ins, so be sure to book in advance" while /plan-your-visit/ says "Walk-ins welcome, however ... calling ahead is advised". Both are recorded as printed rather than reconciled. No price is printed on either page; the Cork on a Fork programme priced their Gin & Cheese Tasting at €35.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

  - id: food-drink/latitude-51
    name: L'Atitude 51 Wine Bar
    category: food-drink
    kind: venue
    status: provisional
    url:
      - role: listings
        url: https://latitude51.ie/wine-events-cork/
      - role: feed
        url: https://latitude51.ie/feed/
        note: every event is a post; pubDate is the announcement date, not the event date
    homepage: https://latitude51.ie/
    area: City Centre
    address:
      street: 1 Union Quay
      city: Cork
      country: Ireland
      lat: 51.897067
      lon: -8.46662
    tags: [ wine, independent, tastings, cookery ]
    cadence: monthly
    hints: |
      Natural wine bar and shop on Union Quay with a real events programme:
      "Meet the Maker" evenings with visiting winemakers, pop-up natural wine
      dinners with guest chefs, CineCafe film-and-wine nights, Speed Tastings,
      weekly "Guerrilla Tastings" (Wednesdays 5.30–8.00pm) and multi-week Wine
      Fundamentals / Wine Appreciation courses.

      The courses are one `run` event each, not one event per session — the
      Wine Fundamentals Course is printed as "€180 for 4 weeks". Guerrilla
      Tastings are `recurring`.

      Individual events usually print no price. Booking is not through a
      ticketing platform: the BOOK button goes to latitude51.ie/contact/.

      They also run events off-site at other venues, so check whether an entry
      is actually at Union Quay before assuming it.
    notes: >-
      Verified 2026-08-17. Site is the venue's own; address read off the page. The listings page carried one dated future event ("Meet The Makers: Un Saumon dans La Loire", 16 April 2026, 7pm) plus the recurring Wednesday tastings, so the diary is thin rather than absent — the RSS feed is the better forward view. /wp-json/tribe/events/v1/events 404s; no events calendar plugin.
    addedAt: "2026-08-17"
    verifiedAt: "2026-08-17"

