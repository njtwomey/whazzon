    fetch:
      ok: true
      url: "https://www.corkfilmcentre.ie/latest-news/"
      status: 200
    events: []
    notes: "Both catalogued routes read; neither has anything upcoming, so this is a reached-and-empty result rather than a failure. /feed/ is live but effectively dead: lastBuildDate Thu 22 May 2025 and exactly one item, \"Futureproof Immersive\", pubDate 29 Mar 2023. \"Quiet rather than broken\" is right, but it is three years quiet. /latest-news/ carries three items and every one is in the past. An f.Project member's exhibition at the Lavit Gallery, \"From 8 - 30th May\" with a panel discussion \"Saturday 9th May\" and no year printed — 9 May is a Saturday in 2026 as well as 2025, but either reading is months gone. The Cork Young Filmmakers summer workshops, five week-long workshops \"during July\" in Midleton, Mallow, Cobh, Macroom and Bandon: wrong month and, as the catalogue notes, all five towns are outside the 12 km radius. And the standing notice that equipment hire has ceased, with \"our main role now is the provision of youth workshops\". None of this is `undated` — the items have dates and the dates have passed — so no event is recorded and this note is the reason. On today's evidence the entry is doing no work as a cinema source and a curator may well want the status: dormant the catalogue itself floats."
  - sourceId: "cinema/ucc-film-screen-media"
    fetch:
      ok: true
      url: "https://www.ucc.ie/en/fmt/film/news/"
      status: 200
    events: []
    notes: "The hint is exactly right and today it costs the source everything: it is a news stream, not a diary, and every item on page 1 of 32 is retrospective. The footer reads \"Updated 7 July 2026\". Newest items, all past: the Coup 53 screening at Triskel with a Q&A with director Taghi Amirani, written up as \"co-hosted a screening... on Saturday 4th July\"; the Larry Groupé masterclass in the Film and Screen Media Auditorium, Kane Building, Thu 4 June 14:00-15:30; Portuguese language month screenings on 13 and 15 May; a Romanian community screening, Friday March 27th at 6pm in the same auditorium; and a screening and discussion of Where Can I Get Lost? with Prof. Mattijs van de Port, Tues 10 March 2026 15:00-17:00. Not one forward-dated event. I spent a second fetch on /en/fmt/film/research/events/, which sounds like the diary this source needs and is not: it is an archive of conferences and symposia whose newest entry is November 2023. Not worth a future fetch, and worth a hint saying so. Term-time only in practice, as the catalogue says, so a monthly cadence will keep returning nothing until late September. The pattern of items is genuinely useful though — public screenings with director Q&As, several of them co-hosted at Triskel — so the source is worth keeping despite an empty first harvest."
