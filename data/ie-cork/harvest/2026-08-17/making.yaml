    notes: "Took the `api` route, which is the whole record: date, time and venue are inside the product title and the product body is the workshop's own copy, so all seven events carry a `description` without a single extra fetch.

      **Seven products now, not the eleven the catalogue recorded this morning.** The four that have gone were all dated 14–15 August, i.e. already past — Fused Glass Collage (Fri 14 Aug, Greywood), Raw Edge Applique (Sat 15 Aug, St Peter's), Lino Printing (Sat 15 Aug, Fota) and Fused Glass Collage (Sat 15 Aug, St Peter's). The collection appears to drop products as their date passes, which is a useful property: what it returns is always forward-looking. Nothing is truncated here — all seven are recorded.

      Every weekday printed in a title checks out against 2026 (Tues 18th = Tue, Thurs 20th = Thu, Fri 21st = Fri, Sat 22nd = Sat, Fri 28th = Fri, Sat 29th = Sat), so the year inferred from \"the collection is current\" is confirmed and all seven are `confidence: high`.

      `status: sold-out` on the two lino printing workshops comes from Shopify's `variants[].available: false`, which is the platform saying it cannot be bought rather than my inference.

      **One tag is coined in this file: `ceramics`** (11 events, here and under mtu-crawford-college, society-of-cork-potters and eventbrite-cork-crafts). Bristol's vocabulary has `crafts`, `sculpture`, `textiles`, `printmaking` and `woodwork` but nothing for clay, and clay is a large share of what Cork's making programme actually is — four Crawford evening modules, the whole Society of Cork Potters directory and two workshops here. Everything else reuses the shared vocabulary unchanged.

      Five of the seven are outside Cork city — Fota House (Carrigtwohill, ~14 km) and Greywood Arts (Killeagh, ~35 km) — well beyond the config's `radiusKm: 12`. `venue` is set on those per the catalogue hint. Only the candle bouquet workshop is at the source's own Douglas premises, so it has no `venue`. Both Fota House and St Peter's are themselves catalogued (museums/fota-house, museums/st-peters-cork) so those use `venue.sourceId`; Greywood Arts is not catalogued and would be worth adding — it hosted three further Cork Craft Month workshops that reached Eventbrite but never this collection (see making/eventbrite-cork-crafts)."
