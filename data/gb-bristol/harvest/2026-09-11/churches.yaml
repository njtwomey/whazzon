        raw: "**A Night at the Opera** — Sat 3 Oct | 19:30 – 21:30. Doors Open: **6:45 pm**. Concert Begins: **7:30 pm**. Duration: **Approximately 2 hours including a short interval**.


          PROGRAMME: to include a selection of the absolute stand-outs from the world of opera, featuring the sublime 'Soave sia il vento' from Mozart's _Così fan tutte_, Puccini's 'Nessun dorma', and the iconic 'Habanera' from _Carmen_, alongside much-loved favourites such as Rossini's 'Largo al factotum', Verdi's 'La donna è mobile', and Puccini's soaring 'O mio babbino caro'.


          ARTISTS: Rhonda Browne (Soprano), Dominick Felix (Mezzo-soprano), Philip Smith (Tenor), Baritone.


          _A Night at the Opera_ is one of London Concertante's most popular shows. Featuring four soloists, each singing solo arias as well as duets, trios and quartets, accompanied by a live orchestra, this programme takes you on a journey through some of opera's greatest showstoppers.


          _Please note: this event is presented by an external organiser and hosted at Bristol Cathedral._\n"
        summary: "London Concertante's touring opera-highlights night: four soloists and a live orchestra through Nessun dorma, the Habanera, Largo al factotum and O mio babbino caro, with ensemble numbers from Così and Rigoletto. Two hours with an interval.\n"
