  - id: gardens/bristol-allotments
    name: Bristol City Council — allotments & community growing
    category: gardens
    kind: listing
    status: provisional
    url: https://www.bristol.gov.uk/residents/museums-parks-sports-and-culture/allotments-and-gardens
    tags: [allotments, community, civic, growing]
    cadence: quarterly
    notes: >-
      Verified 2026-08-17: the catalogued /allotments path 404s; the section is now /allotments-and-gardens on
      bristol.gov.uk. Identity is right but the premise of the entry is not — the page is "Allotments and gardens" and
      is entirely administrative: apply for a plot, pay your rent, guide to using your allotment, Bristol Allotments
      Forum, a bee disease advisory and a link to Blaise plant nursery. There is no events subsection to follow and
      nothing dated anywhere in it, so the hoped-for route to community growing days and association open days does not
      exist. The Forum subpage meets quarterly at City Hall but invites members by email rather than publishing dates.
      Whether this stays a source at all is a catalogue decision, not a URL fix.
    addedAt: "2026-08-16"

  - id: gardens/bristol-botanical-society
    name: Bristol Naturalists' Society — botany section
    category: gardens
    kind: organiser
    status: provisional
    url: https://bristolnats.org.uk/events/
    homepage: https://bristolnats.org.uk/
    tags: [botany, walks, talks, society, free]
    cadence: monthly
    hints: |
      Field meetings at sites around the city rather than at a society venue, so
      set `venue.name` per event. Listings give a date and a teaser sentence
      only — no start times and no prices — and do not say which section (botany,
      ornithology, geology, invertebrates) a meeting belongs to, so leave
      `subcategory` off rather than guessing from the subject.
    notes: >-
      Verified 2026-08-17: /events/ is the programme; the catalogued homepage carries no listings. Page footer reads
      "©2026 Bristol Naturalists' Society Registered Charity No. 235494" and a botany area of interest is listed, so
      the society is right. Three dated field meetings were showing, 4 September to 11 October 2026. Note the feed is
      society-wide, not the botany section alone — moth trapping and a saltmarsh survey were two of the three — so
      the entry's name and its placement in gardens are both worth a human look.
    addedAt: "2026-08-16"

