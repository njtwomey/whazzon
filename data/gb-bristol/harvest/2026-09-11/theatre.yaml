    notes: "The page renders the whole forward programme below its calendar regardless of month (46 blocks, to 4 Jul 2027), so nothing was truncated; read with curl and a browser user-agent and parsed as HTML. The site prints a year on date ranges but not on single dates and never a weekday, so single-date years were checked against the calendar widget instead: the September 2026 grid on this page names every show per day, and two further fetches of the month views /whats-on/?date=2027-01 and ?date=2027-03 confirmed CSI, Rosie Holt, Finding Joy, Amy Gledhill, Emma Doran and Kemah Bob as 2027 — those rows are `high`. October and November single dates are taken as 2026 unverified (`medium`), and Kendal Mountain Festival (15 Apr) and Kate Dolan (04 Jul) as 2027 at `low`, resolved only by the fact the grid lists them as bookable with the newest event ids. No times or prices are printed; `subcategory` carries the site's genre filter classes and `raw` names the space. The \"Get Involved\" rows are term-length weekly courses and are recorded as runs with the dates printed, as in the previous run. Four newsletters were on file (30 Aug, 3 Sep, 7 Sep autumn round-up, plus The Acts mailing); every show they list is on the page, so no event here is mail-only. They did add access performance times, folded into summaries (Don Giovanni BSL 29 Sep; How Soon Is Now BSL 23 Oct and AD 22-24 Oct; Romeo and Juliet BSL 6 Nov; A Christmas Carol BSL 18-19 Dec, captioned 6 Jan, relaxed 2 Jan; A Message For The Future and Little Snowy Hare relaxed throughout), and one disagreement: the 7 Sep newsletter prints Jorvik as 6-8 October where the page prints 06-07 Oct — the page is taken. The Acts (3-4 Sep) has finished and is not on the page. Paul Foot and Harriet Kemsley print \"(Sold Out)\" in their titles; the decoration is dropped from `title` and recorded as `status: sold-out`."
