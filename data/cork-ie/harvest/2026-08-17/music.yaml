    notes: "/whats-on/ is correct and the hint's caution is the important part: **most of what this bar lists is not music.** 29 dated rows run from 18 Aug to 17 Apr 2027, and 8 of them are gigs. Those 8 are recorded. Rows are `?e=<id>&rand=<random>` links; `?e=<id>` alone resolves, so the stable form is used.

      The 21 rows left out are the venue's stand-up programme and one games night, and they belong to Cork's comedy catalogue rather than here — comedy/coco-comedy-club is the right home, and three of the rows name it explicitly (\"Deirdre O'Kane - Work In Progress At The Coco Comedy Club\", 17–19 Sep). For the record the excluded rows are: Games Night — Board and Cardgames In A Pub (18 Aug); Stand-up Comedy Club Thursday Showcase (20, 27 Aug, 3, 10, 24 Sep, 1 Oct); Stand-up Comedy Club Earlier Show (22, 29 Aug, 4 Sep); Stand-up Comedy Club Primetime Comedy Show (22, 29 Aug, 5, 12, 26 Sep, 3, 10 Oct); Deirdre O'Kane ×3 (17–19 Sep); and Sharon Mannion: I Will, Yeah! (17 Apr 2027). The Thursday Showcase and Saturday Primetime shows are clearly weekly and would collapse to two recurring events if the comedy agent wants them.

      Prices are printed inconsistently — \"11.70\", \"€10\", \"10€\", \"8\" — and are recorded as printed in `price.text` with the number parsed out. The hint's six-week horizon is a slight underestimate: the music rows run to 6 Nov."
