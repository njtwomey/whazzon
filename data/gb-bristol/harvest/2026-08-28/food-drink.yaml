        summary: "A free early-evening brass band set in the Barrel Store's St Werburghs beer garden over the bank holiday weekend — film scores, classical transcriptions and traditional brass repertoire from one of the South West's longest-established bands."
        description: "Join us on the bank holiday weekend for a an early evening of soaring

          melodies and triumphant harmony with the City of Bristol Brass Band,

          live from The Barrel Store beer garden.


          Renowned for their dynamic range and polished musicianship, this

          exceptional ensemble brings the vibrant, century-old heritage of

          British brass band culture straight to the stage.


          Whether sweeping through thrilling film scores, executing intricate

          classical transcriptions, or celebrating timeless traditional brass

          classics, the performance offers something for every music lover.

          Expect a captivating program packed with brilliant soloists, deep

