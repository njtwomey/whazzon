schema: whazzon.catalogue/1
category: festivals
label: Festivals
description: >-
  Annual, mostly venue-less events. The largest things that happen in the city
  live here, and almost none of them appear on any venue's website.
  Announcements cluster in winter and spring for a summer that sells out early.
sources:
  - id: festivals/bristol-harbour-festival
    name: Bristol Harbour Festival
    category: festivals
    kind: festival
    status: provisional
    url: https://www.bristolharbourfestival.co.uk/whats-on/programme-at-a-glance
    homepage: https://www.bristolharbourfestival.co.uk/
    area: Harbourside
    tags: [free, summer, outdoor, major, citywide]
    cadence: quarterly
    hints: |
      Huge free three-day festival across the harbour each July. The programme
      lands late — often only weeks ahead — so increase cadence to weekly from
      May onwards. Programme at a glance is the dated page, split by stage
      (Amphitheatre, Queen Square, Millennium Square, College Green, on the water);
      between editions it empties out and the homepage banner is the only place the
      next dates appear.
    notes: >-
      Verified 2026-08-17: the catalogued non-www host will not connect (curl exits
      35), www does. The programme page carries dated sets for the 17-19 July 2026
      edition — Port of Bristol Shanty Crew, Sat 11:15 at the Amphitheatre, among
      them. That edition has now passed, so expect it to roll to 2027.
    addedAt: "2026-08-16"

