    events: []
    notes: "Hint confirmed on both counts: a plain fetcher gets 403, a browser user-agent gets 200 on the apex domain, and there is no listings path — public events surface only as the homepage \"News\" block. Today that block holds exactly one item, \"Cinema Rediscovered 2026!\", and the only timing it states is \"over the next few days\"; it links out to https://www.watershed.co.uk/cinema-rediscovered-2026. I opened that one linked page (the source's whole programme is a single item) and it states the festival ran Wed 22 - Sun 26 July 2026 — three weeks ago. So the News block is stale promotional copy for a finished festival, not something upcoming, and I have recorded no event rather than either guessing a date from \"the next few days\" or logging a finished one. Worth stage 1 knowing: Watershed's page names 20th Century Flicks as a participating venue (\"Events take place at cinemas including Watershed, 20th Century Flicks, Clevedon's Curzon Cinema & Arts, The Cube Microplex and Bristol Megascreen\"), so next July's edition will be a real event here. The rest of the homepage is the rental catalogue (a \"Featured films\" carousel, currently \"Sam Neill, we love you\", and \"New to rent\") plus the two bookable screening rooms, neither of which is an event — as the hint says. Suggested hint addition: the News block can carry a weeks-old item, so check the linked event's own dates before treating it as upcoming."
  - sourceId: "cinema/everyman-bristol"
    fetch:
      ok: true
      url: "https://www.everymancinema.com/venues-list/x0x3q-everyman-bristol/"
      status: 200
    events: []
    notes: "Catalogue URL is good: /bristol/ 301s to /venues-list/x0x3q-everyman-bristol/ and serves 200; the resolved URL is recorded in fetch.url. The hint is right that no showtimes are in the HTML — the only structured data is the JSON-LD MovieTheater block (Whiteladies Road, BS8 2NH, amenities 35mm, 3D, Captioned, Subtitled, Preview, Live Q&A, Throwback, Beyond, Encore, Family Club, Live Broadcast, Baby Club, Toddler Club, Members, Silver Screen). The date strip renders \"Today 16 / Tomorrow 17\" and every asset sits under cms-assets.webediamovies.pro/prod/everyman/2026-08-16/, so the served HTML is a day-old Gatsby build hydrated from a runtime API that the HTML does not reference — no showtime endpoint to find here. I also spent two fetches testing the event-cinema route the multiplex rule would want: /events/ (\"Event Cinema & Special Events\") and the linked National Theatre Live strand page, /events/19626-national-theatre-live/. Both render only \"Showing at — Select your venue\" with no dates, and NT Live's JSON-LD is a single dateless Event whose `location` is an array of every Everyman in the country, so nothing on it could be attributed to Bristol without inventing it. Zero events is therefore the honest result, not a failure. Suggested hint addition: /events/ and the individual strand pages are as client-side as /film-listing/, so a future run should not spend fetches on them; four were spent here to establish it. If this source is ever to yield events, it needs the showtime API out of the Gatsby bundle (app-*.js) or a different route entirely — a stage 1 decision, since a venue that lists nothing every day is arguably not worth a daily cadence."
