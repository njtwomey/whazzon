    notes: "**Needs a browser user-agent.** The default fetcher gets HTTP 403 on every path here; `curl -A \"Mozilla/5.0 … Chrome/120.0 Safari/537.36\"` gets 200. Worth a hint so the next run does not rediscover it — the catalogue does not currently say so for this source (it does for Sirius). **The catalogue's hint is wrong on venues.** It says \"both shows listed on 2026-08-17 were at Sirius Arts Centre in Cobh, not at Wandesford Quay\", and names \"Oceanic Imaginaries\" and \"In the Space Between\". Neither title appears anywhere on the site today, and both listed shows name \"Cork Printmakers Studio Gallery\" as the venue. Sirius' own exhibitions page lists no Cork Printmakers show either. The hint's own `notes` field contradicts its hint and matches what I read, so the hint looks like it was carried over in error. Two shows listed, both at the Studio Gallery, and only one is recordable: \"In the Fold of the Earth\" (Lisa O'Sullivan & Leslie Allen Spillane, 14 May - 30 July 2026, opening reception 5pm Thursday 14 May 2026 — Thursday confirms 2026) finished three weeks ago and is not recorded. \"BIND\" is recorded as `undated`, because its page prints months with no days. Opened the BIND page (1 fetch) for its dates and text; that is what revealed BIND is a three-part programme, not one show. Two catalogued-adjacent paths are wrong: /events/ 404s (its body is a \"No Results Found\" search page), and /exhibitions/current/ is not a current- exhibitions page at all — it serves the \"Current Members\" artist roster. The site's \"Recent Posts\" list also names three C/P International residency artists (Thomas J. Logan April-May 2026, Barry O'Keefe July- August 2026, Colleen Blackard August-September 2026); residencies rather than public events, so not recorded."
