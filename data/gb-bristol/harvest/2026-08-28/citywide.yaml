    notes: "The catalogued homepage is a marketing shell — a handful of promoted events and a lot of copy about

      Bristol's gig history. The listings proper are behind /whats-on/this-weekend, which is what was

      harvested and what stage 1 may want as the listings route: 91 events across Friday, Saturday and

      Sunday, each with venue, genre tags, an image and its own deep link, all server-rendered.

      /event-listings is not a diary either — it is a \"recently added\" strip of about fifteen scattered

      dates.


      GAP, and it matters this week: /whats-on/this-weekend covers Friday to Sunday only. It carries

      nothing for Monday 31 August, so the highest-value aggregator for grassroots Bristol contributes

      zero bank holiday Monday events. There is no date-addressable route to fall back on:

      /whats-on/2026-08-31, /whats-on/mon-31-aug, /whats-on/31-august-2026 and /event-listings/2026-08-31

      all 404. The site's own copy says \"click on a date in the calendar\", so a date view exists behind

      the JS but is not reachable by URL. Worth a hint for stage 1; a JS-capable fetcher would fix it.


      Coverage is complete for 29 and 30 August (41 and 17 events, nothing truncated) and Friday 28 is

      included in full as well (33), since those are tonight's. Nothing beyond Sunday is on this page.


      No event pages were opened: at 91 events the §3 rule for thin indexes does not apply, and the index

      lines carry venue and genre, which is enough for a card. `raw` is the listing line as printed.


      Bank holiday programming is visible in the titles themselves and is tagged where the listing says so

      rather than where the date merely falls: NBM Sound Bank Holiday Special, BANK HOLIDAY AFTER PARTY at

      The Whitmore Tap, The Greyhound's Bank Holiday BBQ, True Junglist RAVE (slug reads

      \"bank-holiday-weekend\"), Clock Factory: REDACTED (slug reads \"bank-holiday-dnb-rave\") and Fantazia

      at DOCUMENT on the Sunday. The Sunday list is unusually long for a Sunday, which is the long-weekend

      effect the brief predicted.


      One editorial link on the page points at a Dot To Dot Festival page dated sat-29-may; it appears

      inside a quoted blurb rather than as a dated listing, so it is not recorded.


      Venue naming: many Headfirst venues are not in our catalogue (Cosies, The Jam Jar, The Love Inn,

      Mr Wolfs, Cafe Kino, Clock Factory, Green Works, The Plough, To The Moon, The Moon Club, Lost

      Horizon, DOCUMENT, Basement 45, After Dark, Take Five Cafe, The Phoenix, The Red Church, The Red

      Lion BS5, Star and Dove, The Sugar Loaf, The Old Stillage, Mickey Zoggs, The Whitmore Tap, Sawmills,

      The Annexe Inn, The Greyhound Fishponds, The Mothers Ruin, Carouse Wines, L'Étoile Studio, The Ill

      Repute, The Haunted Bookshop, The Departure Lounge, The Greenhouse Bedminster, Easton Community

      Centre, In Bristol Studio, Bristol Palestine Museum, The Roundhouse at Leigh Woods). Those carry

      venue.name; the rest carry venue.sourceId. Several of these look like real candidates for the music

      and food-drink catalogues.


      One event, \"Commuters, 2 years of\", is listed at \"Secret location\" — recorded as printed, not

      guessed at.\n"
