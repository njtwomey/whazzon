schema: whazzon.catalogue/1
category: notices
label: Local Notices & Listings
description: >-
  The local papers, the regional tourism site, the island community pages and the
  national heritage schemes.

  **In a city this would be the safety net. Here it is the main net.** A great
  deal of what this location exists to catch happens in a parish hall, a
  community centre or somebody's studio, and the only published trace is a diary
  column or a scheme's listing. Both of the events that started this — a flax and
  linen day in Clonakilty, a Shetland knitting weekend on Cape Clear — were that
  kind of event.

  Everything here needs filtering hard on the way in. Most of what these sources
  carry is a gig guide, a match report or a festival programme, none of which
  belongs in this location. Take the making strand and leave the rest.
sources:
  - id: notices/southern-star
    name: The Southern Star — Things to See & Do
    category: notices
    kind: aggregator
    status: provisional
    url: https://www.southernstar.ie/things-to-see-and-do
    homepage: https://www.southernstar.ie/
    tags: [newspaper, listings, west-cork]
    cadence: weekly
    hints: |
      West Cork's paper of record since 1889, and the single best source here. Its
      craft and heritage coverage runs ahead of events as often as after them —
      the Clonakilty flax revival has been covered repeatedly.
      Two cautions. Some articles are subscriber-only, so take what the preview
      gives and record `confidence: medium` rather than guessing the rest. And a
      news story is not a listing: only record an event when the piece carries a
      real date, and use `undated` with a note when it does not.
    notes: >-
      Verified 2026-08-20: 200. /whats-on is a 404 — this is the section that
      exists.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/west-cork-people
    name: West Cork People — Don't Miss
    category: notices
    kind: aggregator
    status: provisional
    url:
      - role: listings
        url: https://westcorkpeople.ie/category/dont-miss/
      - role: feed
        url: https://westcorkpeople.ie/category/dont-miss/feed/
    homepage: https://westcorkpeople.ie/
    tags: [newspaper, listings, free-paper, west-cork]
    cadence: weekly
    hints: |
      The free monthly paper, whose "Don't Miss" column is exactly this project's
      remit written by a human. WordPress underneath, so the category feed is the
      cheap route — read the feed first and only open the page when an item looks
      in scope.
      `culture` and `history-folklore` are the other categories worth a look if
      the column runs thin.
    notes: >-
      Verified 2026-08-20: both routes 200, and the feed returns XML. Catalogued
      with routes because the feed is genuinely there, not guessed.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/heritage-week
    name: National Heritage Week — event listings
    category: notices
    kind: listing
    status: provisional
    url: https://www.heritageweek.ie/event-listings
    homepage: https://www.heritageweek.ie/
    tags: [national, heritage, august, free]
    cadence: quarterly
    hints: |
      The scheme's own searchable programme, filterable by county. **This is where
      a one-off craft or heritage day gets written down**, and it is where the
      Clonakilty flax event was listed.
      Wholly seasonal: the programme opens in July and the week itself is mid to
      late August, so quarterly is honest for the rest of the year. Fetch it
      properly in July and August. Filter to Cork and then to West Cork towns by
      hand — the county is large and most of it is out of scope here.
    notes: >-
      Verified 2026-08-20: 200, listing 2026 events. /whats-on redirects to
      /projects, which is a different thing — this is the events route.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/culture-night
    name: Culture Night / Oíche Chultúir
    category: notices
    kind: listing
    status: provisional
    url: https://culturenight.ie/
    tags: [national, september, free, open-studio]
    cadence: quarterly
    hints: |
      One night in September, free, and the night West Cork studios and workshops
      open their doors. The programme goes up a few weeks beforehand and is
      filterable by county.
      Nothing to fetch for most of the year — quarterly, with a proper look in
      late August and September.
    notes: >-
      Verified 2026-08-20: 200 from a browser, 403 to `check-urls`. Bot
      protection; the site is live.
    addedAt: "2026-08-20"
    verifiedAt: "2026-08-20"

  - id: notices/explore-west-cork
    name: Explore West Cork — festivals & events
    category: notices
    kind: aggregator
    status: provisional
    url: https://explorewestcork.ie/festivals-events
    homepage: https://explorewestcork.ie/
    tags: [tourism, festival, regional]
    cadence: monthly
    hints: |
      The regional tourism site's diary. Tourism-shaped, so it leans towards
